:root{--bg:#F4F3EE;--surface:#fff;--surface-2:#F8F7F3;--line:#E4E2DA;--ink:#26302B;--ink-2:#5C675F;--primary:#3F7360;--primary-soft:#E4EFE9;--focus:#2F6B8F;
  --shadow:0 1px 2px rgba(38,48,43,.08),0 4px 14px rgba(38,48,43,.08);--shadow2:0 2px 6px rgba(38,48,43,.10),0 14px 40px rgba(38,48,43,.16);
  --fh:'Outfit','Figtree',system-ui,sans-serif;--fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font:600 17px/1.4 var(--fb);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;background-color:var(--bg);
  background-image:radial-gradient(700px 500px at 5% 0%,rgba(244,224,220,.75),transparent 70%),radial-gradient(640px 520px at 100% 25%,rgba(233,227,246,.8),transparent 70%),radial-gradient(700px 520px at 40% 100%,rgba(251,244,217,.8),transparent 70%)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100dvh * .62));overflow:hidden;background:#EAF3F5;box-shadow:var(--shadow2)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(72,68,56,.36);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:2}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 18px;font-weight:800;font-size:17px;line-height:1.2;color:var(--ink);min-height:56px;transition:transform .1s}
.chip:active{transform:scale(.97)}
.big{display:block;width:100%;font:700 24px/1 var(--fh);background:var(--primary);color:#fff;border-radius:99px;padding:16px 20px;min-height:66px;box-shadow:0 6px 16px rgba(63,115,96,.28);transition:transform .1s,filter .15s}
.big:active{transform:scale(.98);filter:brightness(.95)}
.big.alt{background:var(--surface-2);color:var(--ink-2);border:1.5px solid var(--line);box-shadow:none;font-size:21px;min-height:58px;padding:12px}
.panel{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 28px);max-width:390px;max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:none;
  background:var(--surface);border-radius:26px;box-shadow:var(--shadow2);padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;touch-action:pan-y}
.panel::-webkit-scrollbar{display:none}
.panel>*{flex-shrink:0}
.pop{animation:pop .24s ease-out both}
@keyframes pop{from{opacity:0;transform:translate(-50%,calc(-50% + 14px))}to{opacity:1;transform:translate(-50%,-50%)}}
h1,h2,h3{margin:0;font-family:var(--fh);font-weight:800;letter-spacing:-.01em}
.title{font-size:44px;line-height:1}
.title span{color:var(--primary)}
.title span+span{color:var(--ink);margin-left:.22em}
.h{font-size:32px;line-height:1.1;color:var(--ink)}
.tag{margin:0;font-weight:600;color:var(--ink-2);font-size:18px}
.row{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.colors{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.col{width:clamp(46px,13vw,54px);height:clamp(46px,13vw,54px);border-radius:50%;border:2px solid var(--line);background:var(--c)}
.col[aria-pressed=true]{border:3px solid var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.lbl{font-size:16px;font-weight:800;color:var(--ink-2);margin:0}
.seg{display:flex;width:100%;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.seg button{flex:1;min-height:56px;font-weight:800;font-size:18px;line-height:1.15;border-radius:99px;color:var(--ink-2);padding:4px 6px}
.seg button small{display:block;font-size:16px;font-weight:600;opacity:.9}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
.stats{display:flex;gap:10px;width:100%}
.stats div{flex:1;border-radius:16px;padding:8px 6px;background:var(--surface-2);border:1px solid var(--line)}
.stats small{display:block;font-size:15px;font-weight:800;color:var(--ink-2)}
.stats b{font:800 28px/1.15 var(--fh)}
.foot{font-size:15px;font-weight:600;color:var(--ink-2);margin:0}
.howlist{margin:0;padding:0;list-style:none;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:18px}
.howlist li{display:flex;gap:10px;align-items:flex-start}
.howlist li span:first-child{font-size:24px;line-height:1.15;flex:none;width:34px;text-align:center}
/* HUD band (white Kalendaryo header across the top) */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;display:flex;align-items:center;gap:8px;pointer-events:none}
.page{flex:none;width:clamp(76px,21%,100px);border:1.5px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;text-align:center;box-shadow:var(--shadow)}
.page i{display:block;background:var(--primary);font:800 14px/22px var(--fh);font-style:normal;color:#fff;letter-spacing:.08em}
.page b{display:block;font:800 clamp(28px,8vw,36px)/1.15 var(--fh);padding:0 0 2px}
.page.bump{animation:bump .2s ease}
@keyframes bump{50%{transform:scale(1.08)}}
.hchips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px}
.hchips .chip{min-height:0;gap:4px;padding:4px 8px;font-size:16px;background:var(--surface-2)}
#pauseBtn{flex:none;pointer-events:auto;width:56px;height:56px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;gap:7px}
#pauseBtn i{width:7px;height:22px;border-radius:4px;background:var(--primary)}
#banner{position:absolute;left:50%;top:19%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:#fff;border-radius:22px;box-shadow:var(--shadow2);padding:10px 22px;text-align:center;font:800 28px/1.15 var(--fh);color:var(--primary);pointer-events:none}
#banner small{display:block;font:600 17px/1.3 var(--fb);color:var(--ink-2);margin-top:2px}
#banner.show{animation:ban 2.2s ease both}
@keyframes ban{0%{opacity:0;transform:translate(-50%,10px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
#ready{position:absolute;left:0;right:0;bottom:20%;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;text-align:center;padding:0 16px}
#ready h2{font-size:44px;color:var(--ink);text-shadow:0 0 4px #fff,0 0 16px #fff,0 0 28px #fff}
#ready.count h2{font-size:120px;line-height:1;color:var(--primary)}
#ready p{margin:0;background:#fff;border-radius:99px;padding:12px 22px;font-weight:800;font-size:20px;box-shadow:var(--shadow2);animation:nudge .9s ease-in-out infinite alternate}
@keyframes nudge{to{transform:scale(1.04)}}
.sticker{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:46px;background:var(--c)}

@media(max-height:780px){.panel{gap:9px;padding:16px 14px}.title{font-size:38px}.big{min-height:60px;padding:12px;font-size:22px}.seg button{min-height:52px}.stats b{font-size:25px}.chip{min-height:52px;padding:6px 14px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="scrim" class="scrim"></div>
    <div id="menu" class="panel pop">
      <h1 class="title" aria-label="Paper Week"><span>Paper</span><span>Week</span></h1>
      <p class="tag" data-t="tag"></p>
      <div class="seg" id="langSeg" role="group" aria-label="Language"><button type="button" data-l="en">English</button><button type="button" data-l="tl">Tagalog</button></div>
      <p class="lbl" data-t="pick"></p>
      <div class="colors" id="colors"></div>
      <div class="seg" id="modeSeg" role="group"><button type="button" data-m="easy"><span data-t="easy"></span><small data-t="easysub"></small></button><button type="button" data-m="normal"><span data-t="normal"></span><small data-t="normalsub"></small></button></div>
      <button class="big" type="button" id="playBtn" data-t="fly"></button>
      <div class="stats"><div><small data-t="best"></small><b id="mBest">0</b></div><div><small data-t="suns"></small><b id="mSuns">0</b></div></div>
      <div class="row"><button class="chip" type="button" id="sndBtn"></button><button class="chip" type="button" id="howBtn" data-t="how"></button></div>
      <p class="foot" data-t="foot"></p>
    </div>

    <div id="how" class="panel pop" hidden>
      <h2 class="h" data-t="how"></h2>
      <ul class="howlist" id="howList"></ul>
      <button class="big" type="button" id="howOk" data-t="ok"></button>
    </div>

    <div id="hud" hidden>
      <div class="page" id="page"><i id="dayName"></i><b id="score">0</b></div>
      <div class="hchips"><span class="chip">🏆 <span id="hBest">0</span></span><span class="chip" id="hSun" hidden>☀️ <span id="hSunN">0</span></span><span class="chip" id="hUmb" hidden>☂️</span><span class="chip" id="hLazy" hidden>🌙 <span id="hLazyN">0</span></span></div>
      <button id="pauseBtn" type="button" aria-label="Pause" hidden><i></i><i></i></button>
    </div>
    <div id="banner" hidden></div>
    <div id="ready" hidden><h2 id="readyH"></h2><p id="readyP"></p></div>

    <div id="paused" class="panel pop" hidden>
      <h2 class="h" data-t="paused"></h2>
      <button class="big" type="button" id="resumeBtn" data-t="keep"></button>
      <button class="big alt" type="button" id="pHome" data-t="menu"></button>
    </div>

    <div id="over" class="panel pop" hidden>
      <h2 class="h" id="oTitle"></h2>
      <div class="sticker" id="oSticker">📅</div>
      <p class="tag" id="oSub"></p>
      <div id="oNew" class="newbest" hidden data-t="newbest"></div>
      <div class="stats"><div><small data-t="days"></small><b id="oScore">0</b></div><div><small data-t="best"></small><b id="oBest">0</b></div><div><small data-t="suns"></small><b id="oSuns">0</b></div></div>
      <button class="big" type="button" id="againBtn" data-t="again"></button>
      <button class="big alt" type="button" id="oHome" data-t="menu"></button>
    </div>
  </div>
</div>

<script>
{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rand=(a,b)=>a+Math.random()*(b-a);
const store={get(k,d){try{const v=localStorage.getItem('dayglider:'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('dayglider:'+k,JSON.stringify(v));}catch(e){}}};

/* ---------- words ---------- */
const TXT={
  tag:['Fold a page. Glide through the week!','Tiklupin ang pahina. Lumipad buong linggo!'],
  pick:['Pick your plane','Piliin ang eroplano mo'],
  easy:['Easy','Madali'],easysub:['Slow and wide','Mas mabagal'],normal:['Normal','Normal'],normalsub:['A bit faster','Mas mabilis'],
  fly:['Fly!','Lipad!'],best:['Best','Pinakamataas'],suns:['Suns ☀️','Kayamanan ☀️'],days:['Days','Mga Araw'],
  how:['How to play','Paano laruin'],ok:['Got it!','Sige!'],
  foot:['A Kalendaryo game. Scores stay on this device.','Laro ng Kalendaryo. Naka-save lang sa device na ito.'],
  snd_on:['🔊 Sound on','🔊 May tunog'],snd_off:['🔈 Sound off','🔈 Walang tunog'],
  ready:['Get set!','Handa na!'],tap:['👆 Tap to fly','👆 Pindutin para lumipad'],
  count:['Back in…','Babalik sa…'],
  paused:['Paused','Nakahinto'],keep:['Keep flying','Ituloy'],menu:['Menu','Menu'],again:['Fly again','Lipad ulit'],
  newbest:['New best! 🎉','Bagong record! 🎉'],
  great:['Great flight!','Galing!'],nice:['Nice flight!','Ayos!'],
  flew1:['You flew 1 day.','Lumipad ka ng 1 araw.'],flewN:['You flew {n} days.','Lumipad ka ng {n} araw.'],
  umb:['Umbrella! ☂️','Payong! ☂️'],umbS:['Pass one stack safely','Ligtas sa isang tumpok'],
  lazy:['Sleepy Moon 🌙','Antok na Buwan 🌙'],lazyS:['Everything slows down','Babagal ang lahat'],
  saved:['Phew! ☂️','Hay salamat! ☂️'],week:['Week {n}!','Linggo {n}!'],
  how1:['Tap to give your plane a puff of wind. Let go and it glides down.','Pindutin para mabigyan ng hangin ang eroplano. Bitawan at dahan-dahan itong bababa.'],
  how2:['Fly through the openings between the page stacks. Each stack you pass is one day.','Lumipad sa pagitan ng mga tumpok ng pahina. Bawat tumpok na malampasan ay isang araw.'],
  how3:['Collect suns. They are your treasure.','Kolektahin ang mga ☀️. Ito ang kayamanan mo.'],
  how4:['Umbrella: fly through one stack safely.','Payong: ligtas kang makakalusot sa isang tumpok.'],
  how5:['Sleepy moon: everything slows down for a moment.','Antok na buwan: babagal ang lahat sandali.'],
  how6:['Fly 7 days to finish a week! Keyboard: Space bar.','Lumipad ng 7 araw para matapos ang isang linggo! Keyboard: Space bar.'],
  s0:['Every flight counts!','Bawat lipad ay mahalaga!'],s1:['A week or more!','Isang linggo o higit pa!'],s2:['Two weeks or more!','Dalawang linggo o higit pa!'],
  s3:['A whole month!','Isang buong buwan!'],s4:['Calendar champion!','Kampeon ng kalendaryo!'],
  start:['GO','TARA']
};
const DAYS=[['MON','TUE','WED','THU','FRI','SAT','SUN'],['LUN','MAR','MIY','HUW','BIY','SAB','LIN']];
let lang=store.get('lang','en');
const L=()=>lang==='tl'?1:0,t=(k,n)=>TXT[k][L()].replace('{n}',n);
const dayLabel=d=>DAYS[L()][((d-1)%7+7)%7];

/* ---------- design numbers ---------- */
const H=720,TOP=96,DESK=82,FLOOR=H-DESK;
const MODES={
  easy:{fall:430,drag:1.25,push:2300,pushTime:.16,speed:120,every:2.0,gap:236,minGap:204},
  normal:{fall:560,drag:1.05,push:2700,pushTime:.15,speed:150,every:1.65,gap:200,minGap:160}};
const SKIES=[['#BFDDF0','#EEF5F4'],['#C3E2D2','#F0F6EC'],['#F4E3A0','#FBF5DE'],['#F6CDB1','#FBEDE0'],['#F1C5C7','#FAEAE6'],['#D3C8EE','#F0EBF8'],['#A9B0DC','#DDD8F0']];
const PLANES=[['#FFFFFF','#B9D4E8'],['#FBF1CC','#E7B96F'],['#E4EFE9','#7FB79E'],['#F7E1DD','#DB93A0'],['#ECE6F8','#9B8AD4']];

let W=420,cv=$('#cv'),g=cv.getContext('2d'),dpr=1,sw=1;
let state='menu',mode=store.get('mode','easy'),plane=store.get('plane',0),sound=store.get('sound',true);
let best=store.get('best',{normal:0,easy:0});if(typeof best!=='object'||!best)best={normal:+best||0,easy:+best||0};best.normal=best.normal|0;best.easy=best.easy|0;
let bank=store.get('suns',0);
let countStart=0,pl,stacks,suns,items,puffs,score,sunRun,umbrella,ghost,lazy,shake,flash,clock=0,dist=0,made=0,nextIn=0,clouds=[],count=0,countT=0,overAt=0;
const M=()=>MODES[mode];
const week=()=>Math.floor(score/7);

function reset(){
  pl={x:planeX(),y:(TOP+FLOOR)/2,vy:0,push:0,tilt:0};
  stacks=[];suns=[];items=[];puffs=[];score=0;sunRun=0;umbrella=false;ghost=0;lazy=0;shake=0;flash=0;made=0;nextIn=0;count=0;
}
const planeX=()=>clamp(W*0.28,96,160);
const pace=()=>Math.min(M().speed*(1+0.05*week()),M().speed*1.4)*(lazy>0?0.5:1);

function makeStack(){
  made++;
  const easyStart=made<=3?34:0,gap=Math.max(M().gap-week()*7,M().minGap)+easyStart;
  const prev=stacks.length?stacks[stacks.length-1].mid:(TOP+FLOOR)/2;
  const lo=TOP+58+gap/2,hi=FLOOR-58-gap/2;
  const swing=mode==='easy'?110:130,mid=clamp(prev+rand(-swing,swing),lo,hi);
  const s={x:W+20,mid,gap,w:84,day:made,done:false};
  stacks.push(s);
  if(Math.random()<0.45)suns.push({x:s.x+s.w+rand(70,120),y:clamp(mid+rand(-50,50),TOP+40,FLOOR-40),spin:rand(0,6)});
  if(made>3&&!items.length&&Math.random()<0.14)items.push({x:s.x+s.w/2,y:mid,kind:Math.random()<0.5?'umbrella':'moon',wob:0});
}

/* ---------- sound (our own little tunes) ---------- */
let ac=null;
function note(f,d,type,vol,delay,to){
  if(!sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),v=ac.createGain(),t0=ac.currentTime+(delay||0);
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
    v.gain.setValueAtTime(0.0001,t0);v.gain.exponentialRampToValueAtTime(vol||.08,t0+.015);v.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(v);v.connect(ac.destination);o.start(t0);o.stop(t0+d+.03);}catch(e){}
}
const SFX={
  whoosh:()=>note(280,.16,'sine',.06,0,460),
  day:()=>{note(698,.1,'sine',.07);note(880,.14,'sine',.06,.06);},
  sun:()=>{note(1046,.09,'triangle',.06);note(1396,.16,'triangle',.06,.07);},
  helper:()=>[440,554,659,880].forEach((f,i)=>note(f,.14,'sine',.07,i*.06)),
  phew:()=>note(740,.3,'triangle',.07,0,330),
  bonk:()=>{note(196,.32,'triangle',.1,0,98);note(147,.4,'sine',.08,.06,73);},
  week:()=>[523,587,698,880,1046].forEach((f,i)=>note(f,.16,'sine',.07,i*.07)),
  tick:()=>note(560,.07,'sine',.07),
  click:()=>note(640,.05,'triangle',.05)
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

/* ---------- drawing ---------- */
const INK='#26302B',INK2='#5C675F',LN='#93A097',PAPER='#FFFEFB';
const soft=a=>'rgba(38,48,43,'+a+')';
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
const skyIdx=()=>state==='menu'||score===0?0:(score-1)%7;
function drawSky(){
  const s=SKIES[skyIdx()],gr=g.createLinearGradient(0,TOP,0,FLOOR);gr.addColorStop(0,s[0]);gr.addColorStop(1,s[1]);g.fillStyle=gr;g.fillRect(0,0,W,FLOOR);
  const night=skyIdx()===6,cx=W*0.8,cy=TOP+74;
  const halo=g.createRadialGradient(cx,cy,10,cx,cy,90);halo.addColorStop(0,'rgba(255,255,255,.75)');halo.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=halo;g.fillRect(cx-90,cy-90,180,180);
  g.globalAlpha=.6;g.fillStyle=night?'#FFF8DC':'#FBE7A1';g.beginPath();g.arc(cx,cy,30,0,7);g.fill();g.globalAlpha=1;
  if(night){g.fillStyle=s[0];g.beginPath();g.arc(cx+13,cy-9,26,0,7);g.fill();}
  
}
function drawCloud(c){
  const x=c.x,y=c.y,s=c.s;
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();
  g.ellipse(x,y,44*s,15*s,0,0,7);g.ellipse(x-12*s,y-11*s,20*s,15*s,0,0,7);g.ellipse(x+14*s,y-7*s,16*s,12*s,0,0,7);g.fill();
}
const ROOFS=['#E8A99C','#A9C8E4','#C3B8E6','#EBCF85'];
function drawTown(){
  const far=dist*0.15;g.fillStyle='rgba(196,221,207,.75)';
  g.beginPath();g.moveTo(-10,FLOOR);
  for(let x=-(far%340)-340;x<W+340;x+=340){g.bezierCurveTo(x+80,FLOOR-150,x+170,FLOOR-150,x+210,FLOOR-70);g.bezierCurveTo(x+250,FLOOR-20,x+290,FLOOR-110,x+340,FLOOR-90);}
  g.lineTo(W+10,FLOOR);g.closePath();g.fill();
  const mid=dist*0.28;g.fillStyle='#B4D3C2';
  g.beginPath();g.moveTo(-10,FLOOR);
  for(let x=-(mid%260)-260;x<W+260;x+=260){g.bezierCurveTo(x+60,FLOOR-70,x+120,FLOOR-80,x+160,FLOOR-36);g.bezierCurveTo(x+200,FLOOR-6,x+230,FLOOR-52,x+260,FLOOR-44);}
  g.lineTo(W+10,FLOOR);g.closePath();g.fill();
  const near=dist*0.45;
  for(let x=-(near%230)-230,i=Math.floor(near/230);x<W+230;x+=230,i++){
    const hx=x+60,hy=FLOOR-40,c=ROOFS[((i%4)+4)%4];
    g.fillStyle=soft(.06);g.fillRect(hx+4,hy+2,48,38);
    g.fillStyle=PAPER;g.fillRect(hx,hy,48,40);
    g.fillStyle=c;g.beginPath();g.moveTo(hx-7,hy+1);g.lineTo(hx+24,hy-22);g.lineTo(hx+55,hy+1);g.closePath();g.fill();
    g.fillStyle='#F6E7A8';rr(hx+8,hy+10,12,12,2);g.fill();
    g.fillStyle='#8FB3A2';rr(hx+28,hy+16,12,24,[6,6,0,0]);g.fill();
    // little tree
    g.fillStyle='#8FB3A2';g.beginPath();g.arc(hx+78,hy+10,14,0,7);g.fill();g.fillStyle='#A78B6D';g.fillRect(hx+76,hy+22,4,18);
  }
}
const DOTS=['#E08A7B','#6FA8D6','#5FA98A','#E2B84A','#9B8AD4','#E391B0','#8E9AD0'];
function drawDesk(){
  // floor = a Kalendaryo week strip: white day cards sliding by
  g.fillStyle='#EBE8DE';g.fillRect(0,FLOOR,W,DESK);
  g.fillStyle=soft(.07);g.fillRect(0,FLOOR,W,5);
  g.fillStyle='#CFD8CF';g.fillRect(0,FLOOR,W,1.5);
  const cw=58,off=dist%cw,base=Math.floor(dist/cw);
  g.textAlign='left';g.textBaseline='middle';
  for(let x=-off,i=base;x<W+cw;x+=cw,i++){
    const k=((i%7)+7)%7;
    g.fillStyle=soft(.05);rr(x+5,FLOOR+17,cw-8,DESK-28,10);g.fill();
    g.fillStyle='#fff';rr(x+4,FLOOR+14,cw-8,DESK-28,10);g.fill();
    g.fillStyle=DOTS[k];g.beginPath();g.arc(x+15,FLOOR+28,4,0,7);g.fill();
    g.fillStyle='#E9E6DD';rr(x+12,FLOOR+40,cw-24,5,2.5);g.fill();rr(x+12,FLOOR+51,cw-32,5,2.5);g.fill();
  }
}
function stackPath(x,y1,y2,w,top){g.beginPath();g.roundRect(x,y1,w,y2-y1,top?[0,0,10,10]:[10,10,0,0]);}
function drawStackBody(x,y1,y2,w,top){
  if(y2-y1<2)return;
  g.fillStyle=soft(.17);g.beginPath();g.roundRect(x+6,y1+(top?0:4),w,y2-y1,top?[0,0,10,10]:[10,10,0,0]);g.fill();
  stackPath(x,y1,y2,w,top);g.fillStyle=PAPER;g.fill();
  // faint calendar cells, like a month page
  g.save();stackPath(x,y1,y2,w,top);g.clip();
  g.fillStyle='#EEECE4';g.beginPath();
  const m=9,cs=(w-m*2-12)/3,start=top?y2-22-cs:y1+40;
  for(let cy=start;top?cy>y1-cs:cy<y2;cy+=top?-(cs+6):(cs+6))for(let k=0;k<3;k++)g.roundRect(x+m+k*(cs+6),cy,cs,cs,5);
  g.fill();
  const sh=g.createLinearGradient(x+w-14,0,x+w,0);sh.addColorStop(0,soft(0));sh.addColorStop(1,soft(.07));g.fillStyle=sh;g.fillRect(x+w-14,y1,14,y2-y1);
  g.restore();
}
function drawStacks(){
  for(const s of stacks){
    const top=s.mid-s.gap/2,bot=s.mid+s.gap/2,col=DOTS[(s.day-1)%7],x=s.x,w=s.w;
    drawStackBody(x,TOP-8,top,w,true);
    g.fillStyle=col;g.beginPath();g.roundRect(x,top-22,w,22,[0,0,10,10]);g.fill();
    g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x+3,top-22,w-6,5);
    stackPath(x,TOP-8,top,w,true);g.strokeStyle=LN;g.lineWidth=1.2;g.stroke();
    drawStackBody(x,bot,FLOOR,w,false);
    g.fillStyle=col;g.beginPath();g.roundRect(x,bot,w,30,[10,10,0,0]);g.fill();
    g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.roundRect(x+3,bot+3,w-6,8,[7,7,3,3]);g.fill();
    stackPath(x,bot,FLOOR,w,false);g.strokeStyle=LN;g.lineWidth=1.2;g.stroke();
    g.font='800 16px Outfit,Figtree,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle=INK;
    g.fillText(dayLabel(s.day),x+w/2,bot+16.5);
    g.fillStyle='#AEB8B0';for(const rx of [x+16,x+w-16]){rr(rx-2.5,bot-6,5,12,2.5);g.fill();}
  }
}
function drawSun(s){
  const y=s.y+Math.sin(s.spin*1.3)*4,p=1+Math.sin(s.spin*2.2)*0.08;
  g.save();g.translate(s.x,y);
  const h=g.createRadialGradient(0,0,6,0,0,34*p);h.addColorStop(0,'rgba(251,226,140,.85)');h.addColorStop(1,'rgba(251,226,140,0)');
  g.fillStyle=h;g.beginPath();g.arc(0,0,34*p,0,7);g.fill();
  g.save();g.rotate(s.spin*.4);g.strokeStyle='#EFC050';g.lineWidth=3;g.lineCap='round';
  for(let i=0;i<8;i++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(0,-16.5);g.lineTo(0,-21);g.stroke();}g.restore();
  g.fillStyle='#F7D56B';g.beginPath();g.arc(0,0,12.5,0,7);g.fill();g.strokeStyle='#D9A93A';g.lineWidth=1;g.stroke();
  g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.arc(-4,-5,4.5,0,7);g.fill();
  g.fillStyle=INK;g.beginPath();g.arc(-4,-1,1.4,0,7);g.arc(4,-1,1.4,0,7);g.fill();
  g.strokeStyle=INK;g.lineWidth=1.2;g.lineCap='round';g.beginPath();g.arc(0,2,4,.35,Math.PI-.35);g.stroke();
  g.restore();g.lineCap='butt';
}
function drawItem(it){
  const y=it.y+Math.sin(it.wob)*6,c=it.kind==='umbrella'?'#E08A7B':'#9B8AD4';
  g.save();g.translate(it.x,y);
  g.globalAlpha=.35+Math.sin(it.wob*2)*.2;g.strokeStyle=c;g.lineWidth=2;g.beginPath();g.arc(0,0,31+Math.sin(it.wob*2)*2,0,7);g.stroke();g.globalAlpha=1;
  g.fillStyle=soft(.10);g.beginPath();g.arc(0,3,25,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(0,0,25,0,7);g.fill();
  g.lineCap='round';g.lineJoin='round';
  if(it.kind==='umbrella'){
    g.fillStyle=c;g.beginPath();g.moveTo(-16,1);g.bezierCurveTo(-15,-19,15,-19,16,1);g.quadraticCurveTo(12,-3,8,1);g.quadraticCurveTo(4,-3,0,1);g.quadraticCurveTo(-4,-3,-8,1);g.quadraticCurveTo(-12,-3,-16,1);g.fill();
    g.strokeStyle=INK2;g.lineWidth=1.8;g.beginPath();g.moveTo(0,0);g.lineTo(0,12);g.arc(-3.5,12,3.5,0,Math.PI);g.stroke();
  }else{
    g.fillStyle='#F2CF63';g.beginPath();g.arc(-2,1,13,Math.PI*0.3,Math.PI*1.7);g.bezierCurveTo(-5,-7,-5,9,5.6,11.5);g.closePath();g.fill();
    g.font='800 12px Outfit,sans-serif';g.fillStyle=c;g.textAlign='center';g.textBaseline='middle';g.fillText('z',10,-9);g.font='800 9px Outfit,sans-serif';g.fillText('z',17,-16);
  }
  g.restore();g.lineCap='butt';
}
function drawPlane(x,y,tilt,c,scale,alpha){
  g.save();g.translate(x,y);g.rotate(tilt);g.scale(scale,scale);if(alpha!==undefined)g.globalAlpha=alpha;
  g.lineJoin='round';
  const tri=(a,b,c2,d,e,f,fill)=>{g.beginPath();g.moveTo(a,b);g.lineTo(c2,d);g.lineTo(e,f);g.closePath();g.fillStyle=fill;g.fill();};
  tri(30,2,-18,6,-10,16,c[1]);tri(30,2,-18,6,-10,16,soft(.14));      // keel, in shade
  tri(30,2,-24,-6,-20,2,c[1]);                                        // far wing
  tri(30,2,-26,-20,-14,4,c[0]);                                       // near wing
  const sh=g.createLinearGradient(-20,-16,6,6);sh.addColorStop(0,'rgba(255,255,255,.35)');sh.addColorStop(1,soft(.06));tri(30,2,-26,-20,-14,4,sh);
  g.strokeStyle='#6F7B73';g.lineWidth=1.1/scale*1.2;
  g.beginPath();g.moveTo(30,2);g.lineTo(-26,-20);g.lineTo(-14,4);g.lineTo(-18,6);g.lineTo(-10,16);g.closePath();g.stroke();
  g.beginPath();g.moveTo(30,2);g.lineTo(-14,4);g.moveTo(30,2);g.lineTo(-24,-6);g.strokeStyle='rgba(111,123,115,.55)';g.stroke();
  g.restore();g.globalAlpha=1;
}
function drawPuffs(){for(const p of puffs){g.globalAlpha=clamp(p.life/p.max,0,1);
  if(p.kind==='confetti'){g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s*.42,0,7);g.fill();}
  else{g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=2;g.lineCap='round';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.s*3,p.y);g.stroke();g.lineCap='butt';}
  g.globalAlpha=1;}}
function drawHeader(){
  // white header band where the score lives; flight space starts under it
  const sh=g.createLinearGradient(0,TOP-6,0,TOP+12);sh.addColorStop(0,soft(.12));sh.addColorStop(1,soft(0));g.fillStyle=sh;g.fillRect(0,TOP-6,W,18);
  g.fillStyle='#fff';g.fillRect(0,0,W,TOP-6);
  g.fillStyle='#E4E2DA';g.fillRect(0,TOP-7,W,1.2);
}
function draw(){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
  const jig=shake>0?Math.sin(shake*70)*4*shake:0;
  g.setTransform(sw*dpr,0,0,sw*dpr,jig*sw*dpr,0);
  drawSky();clouds.forEach(drawCloud);drawTown();
  if(state!=='menu'){drawStacks();suns.forEach(drawSun);items.forEach(drawItem);}
  drawDesk();drawPuffs();
  if(state==='menu')drawPlane(W*0.5,FLOOR-120+Math.sin(clock*1.8)*10,Math.sin(clock*1.8)*0.07-0.05,PLANES[plane],2.3);
  else{
    const hgt=clamp((FLOOR-pl.y)/(FLOOR-TOP),0,1);
    g.fillStyle=soft(.16-.1*hgt);g.beginPath();g.ellipse(pl.x,FLOOR+3,22-8*hgt,4-1.5*hgt,0,0,7);g.fill();
    if(umbrella){g.save();g.translate(pl.x-4,pl.y-30);g.fillStyle='#E08A7B';g.beginPath();g.moveTo(-13,0);g.bezierCurveTo(-12,-15,12,-15,13,0);g.closePath();g.fill();g.strokeStyle=INK2;g.lineWidth=1.6;g.lineCap='round';g.beginPath();g.moveTo(0,0);g.lineTo(0,14);g.stroke();g.restore();g.lineCap='butt';}
    drawPlane(pl.x,pl.y,pl.tilt,PLANES[plane],1.2,ghost>0&&Math.floor(ghost*12)%2===0?0.45:1);
  }
  drawHeader();
  if(flash>0){g.setTransform(1,0,0,1,0,0);g.fillStyle='rgba(255,255,255,'+flash.toFixed(2)+')';g.fillRect(0,0,cv.width,cv.height);}
}

/* ---------- play ---------- */
function confetti(x,y,n){const cs=['#E2B84A','#E08A7B','#6FA8D6','#5FA98A','#E391B0','#9B8AD4'];
  for(let i=0;i<n;i++){const a=rand(0,6.28),sp=rand(50,170);puffs.push({kind:'confetti',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:rand(.5,.9),max:.9,s:rand(6,10),c:cs[i%6],r:rand(0,6)});}
  if(puffs.length>150)puffs.splice(0,puffs.length-150);}
function puff(){
  if(state==='ready'){state='play';ui();}
  if(state!=='play')return;
  pl.push=M().pushTime;pl.vy=Math.min(pl.vy,60);SFX.whoosh();
  for(let i=0;i<3;i++)puffs.push({kind:'line',x:pl.x-24,y:pl.y+rand(-6,10),vx:-rand(80,140),vy:0,life:.35,max:.35,s:rand(4,7),r:0});
}
// plane shape for bumping: nose and tail points plus a middle point
function hits(s){
  const cos=Math.cos(pl.tilt),sin=Math.sin(pl.tilt);
  const pts=[[26,2],[0,0],[-20,-6]].map(([a,b])=>[pl.x+(a*cos-b*sin)*1.2,pl.y+(a*sin+b*cos)*1.2]);
  const top=s.mid-s.gap/2,bot=s.mid+s.gap/2;
  return pts.some(([x,y])=>x>s.x+2&&x<s.x+s.w-2&&(y<top-2||y>bot+2));
}
function step(dt){
  clock+=dt;
  for(const c of clouds){c.x-=(state==='play'?pace():50)*c.v*dt;if(c.x<-80)c.x=W+60;}
  for(const p of puffs){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='confetti')p.vy+=240*dt;p.r+=dt*5;}
  puffs=puffs.filter(p=>p.life>0);
  shake=Math.max(0,shake-dt*2.2);flash=Math.max(0,flash-dt*2.5);
  if(state==='menu'){dist+=40*dt;return;}
  if(state==='ready'){dist+=40*dt;pl.y=(TOP+FLOOR)/2+Math.sin(clock*2.5)*10;pl.tilt=Math.sin(clock*2.5)*0.05;return;}
  if(state==='over'){if(pl.y<FLOOR-10){pl.vy+=900*dt;pl.y=Math.min(FLOOR-10,pl.y+pl.vy*dt);pl.tilt=Math.min(pl.tilt+dt*3,1.2);}return;}
  if(state!=='play')return;
  const sp=pace();dist+=sp*dt;
  lazy=Math.max(0,lazy-dt);ghost=Math.max(0,ghost-dt);
  // glide: steady pull down, air slows the plane, taps add a short push of wind
  let acc=M().fall*(lazy>0?0.7:1);
  if(pl.push>0){acc-=M().push;pl.push-=dt;}
  pl.vy+=acc*dt;pl.vy-=pl.vy*M().drag*dt;
  pl.y+=pl.vy*dt;
  if(pl.y<TOP+16){pl.y=TOP+16;if(pl.vy<0)pl.vy=0;}
  pl.tilt+=(clamp(pl.vy/600,-0.5,0.7)-pl.tilt)*Math.min(1,dt*8);
  nextIn-=dt*(lazy>0?0.5:1);
  if(nextIn<=0){makeStack();nextIn=M().every;}
  for(const s of stacks){s.x-=sp*dt;if(!s.done&&s.x+s.w<pl.x-20){s.done=true;passDay();}}
  stacks=stacks.filter(s=>s.x>-s.w-10);
  for(const s of suns){s.x-=sp*dt;s.spin+=dt*2;if(Math.hypot(s.x-pl.x,s.y-pl.y)<34){s.got=true;sunRun++;bank++;store.set('suns',bank);SFX.sun();buzz(12);confetti(s.x,s.y,8);ui();}}
  suns=suns.filter(s=>!s.got&&s.x>-30);
  for(const it of items){it.x-=sp*dt;it.wob+=dt*3;if(Math.hypot(it.x-pl.x,it.y-pl.y)<38){it.got=true;SFX.helper();buzz(20);confetti(it.x,it.y,12);
    if(it.kind==='umbrella'){umbrella=true;banner(t('umb'),t('umbS'));}else{lazy=4;banner(t('lazy'),t('lazyS'));}ui();}}
  items=items.filter(i=>!i.got&&i.x>-40);
  if(pl.y>FLOOR-14){pl.y=FLOOR-14;if(pl.vy>0)pl.vy=0;}
  if(ghost>0)return;
  const ground=pl.y+14>=FLOOR,bumped=ground||stacks.some(hits);
  if(bumped){
    if(umbrella){umbrella=false;ghost=1.3;SFX.phew();buzz(30);flash=.4;banner(t('saved'));if(ground){pl.y=FLOOR-60;pl.vy=-120;}ui();}
    else crash();
  }
}
function passDay(){
  const wk=week();score++;SFX.day();
  const p=$('#page');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');
  if(week()>wk){SFX.week();banner(t('week',week()+1));confetti(pl.x,pl.y,18);}
  ui();
}
let banT=0;
function banner(big,small){const b=$('#banner');b.textContent=big;if(small){const s=document.createElement('small');s.textContent=small;b.append(s);}
  b.hidden=false;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');clearTimeout(banT);banT=setTimeout(()=>{b.hidden=true;},2200);}
function crash(){
  state='over';shake=1;flash=.6;SFX.bonk();buzz(50);confetti(pl.x,pl.y,14);
  const isNew=score>best[mode];if(isNew){best[mode]=score;store.set('best',best);}
  setTimeout(()=>{if(state==='over')showOver(isNew);},800);
}
const STICK=[[0,'🛫','#E4EFE9','s0'],[7,'⭐','#FBF4D9','s1'],[14,'🌈','#F4E0DC','s2'],[30,'🏆','#E4EFE9','s3'],[60,'👑','#E9E3F6','s4']];
function showOver(isNew){
  const st=[...STICK].reverse().find(s=>score>=s[0]);
  $('#oSticker').textContent=st[1];$('#oSticker').style.setProperty('--c',st[2]);
  $('#oTitle').textContent=score>=7?t('great'):t('nice');
  $('#oSub').textContent=(score===1?t('flew1'):t('flewN',score))+' '+t(st[3]);
  $('#oScore').textContent=score;$('#oBest').textContent=best[mode];$('#oSuns').textContent=sunRun;$('#oNew').hidden=!isNew||score===0;
  overAt=performance.now();state='overpanel';ui();
}

/* ---------- screens ---------- */
function ui(){
  const s=state,panel=s==='menu'||s==='paused'||s==='overpanel'||s==='how';
  $('#scrim').hidden=!panel;
  $('#menu').hidden=s!=='menu';$('#how').hidden=s!=='how';
  $('#hud').hidden=!(s==='ready'||s==='play'||s==='paused'||s==='count'||s==='over');
  $('#pauseBtn').hidden=s!=='play';
  $('#ready').hidden=!(s==='ready'||s==='count');
  $('#paused').hidden=s!=='paused';$('#over').hidden=s!=='overpanel';
  $('#ready').classList.toggle('count',s==='count');
  $('#readyH').textContent=s==='count'?String(count):t('ready');
  $('#readyP').textContent=s==='count'?t('count'):t('tap');
  $('#score').textContent=score;$('#dayName').textContent=score?dayLabel(score):t('start');
  $('#hBest').textContent=Math.max(best[mode],score);
  $('#hSun').hidden=!sunRun;$('#hSunN').textContent=sunRun;
  $('#hUmb').hidden=!umbrella;$('#hLazy').hidden=!(lazy>0);$('#hLazyN').textContent=Math.ceil(lazy)+'s';
}
function paintText(){
  document.documentElement.lang=lang==='tl'?'tl':'en';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#howList').innerHTML=[['👆','how1'],['📄','how2'],['☀️','how3'],['☂️','how4'],['🌙','how5'],['🗓️','how6']].map(([i,k])=>'<li><span>'+i+'</span><span>'+t(k)+'</span></li>').join('');
  paintMenu();ui();
}
function paintMenu(){
  $('#mBest').textContent=best[mode];$('#mSuns').textContent=bank;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
  document.querySelectorAll('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
  $('#sndBtn').textContent=sound?t('snd_on'):t('snd_off');
  $('#colors').innerHTML=PLANES.map((c,i)=>'<button class="col" type="button" data-i="'+i+'" aria-label="Plane '+(i+1)+'" aria-pressed="'+(i===plane)+'" style="--c:linear-gradient(135deg,'+c[0]+' 50%,'+c[1]+' 50%)"></button>').join('');
}
function startRun(){reset();state='ready';ui();}
function toMenu(){state='menu';reset();paintMenu();ui();}
function pause(){if(state!=='play')return;state='paused';SFX.click();$('#banner').hidden=true;ui();}
function resume(){
  if(state!=='paused')return;
  state='count';count=3;countStart=performance.now();pl.vy=0;pl.push=0;SFX.tick();ui();
  clearInterval(countT);countT=setInterval(()=>{count--;if(count<=0){clearInterval(countT);if(state==='count'){state='play';ui();}}else{SFX.tick();ui();}},700);
}
const overGuard=()=>performance.now()-overAt>700;

$('#colors').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;plane=+b.dataset.i;store.set('plane',plane);SFX.click();paintMenu();});
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;store.set('mode',mode);SFX.click();paintMenu();});
$('#langSeg').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;lang=b.dataset.l;store.set('lang',lang);SFX.click();paintText();});
$('#playBtn').addEventListener('click',()=>{SFX.click();startRun();});
$('#sndBtn').addEventListener('click',()=>{sound=!sound;store.set('sound',sound);SFX.click();paintMenu();});
$('#howBtn').addEventListener('click',()=>{SFX.click();state='how';ui();});
$('#howOk').addEventListener('click',()=>{SFX.click();state='menu';ui();});
$('#pauseBtn').addEventListener('click',pause);
$('#resumeBtn').addEventListener('click',()=>{SFX.click();resume();});
$('#pHome').addEventListener('click',()=>{SFX.click();toMenu();});
$('#againBtn').addEventListener('click',()=>{if(!overGuard())return;SFX.click();startRun();});
$('#oHome').addEventListener('click',()=>{if(!overGuard())return;SFX.click();toMenu();});
// tap anywhere on the page (also outside the play column) to fly
document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.panel'))return;
  if(state==='count'){if(performance.now()-countStart<1000)return;clearInterval(countT);state='play';ui();}
  if(state==='ready'||state==='play'){e.preventDefault();puff();}},{passive:false});
addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='ArrowUp'){
    if(state==='ready'||state==='play'){e.preventDefault();if(!e.repeat)puff();}
    else if(state==='overpanel'||state==='over'){e.preventDefault();if(state==='overpanel'&&!e.repeat&&overGuard()){SFX.click();startRun();}}
  }else if(!e.repeat&&(k==='Escape'||k==='p'||k==='P')){if(state==='play')pause();else if(state==='paused')resume();else if(state==='count'){clearInterval(countT);state='paused';ui();}else if(state==='how'&&k==='Escape'){state='menu';ui();}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(state==='count'){clearInterval(countT);state='paused';ui();}}});

/* ---------- loop ---------- */
function resize(){
  const r=$('#stage').getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2.5);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);sw=r.height/H;W=Math.max(320,r.width/sw);
  if(pl&&(state==='menu'||state==='ready'))pl.x=planeX();
}
new ResizeObserver(resize).observe($('#stage'));resize();
clouds=Array.from({length:4},(_,i)=>({x:i*W/3+rand(0,50),y:rand(TOP+40,TOP+260),s:rand(.75,1.15),v:rand(.15,.25)}));
try{document.fonts.load('800 16px Outfit');}catch(e){}
reset();paintText();
let last=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(last?(ts-last)/1000:0,1/30);last=ts;
  step(dt/2);step(dt/2);
  if(state==='play'){const lz=Math.ceil(lazy);if(lz!==frame.lz){frame.lz=lz;ui();}}
  draw();}
requestAnimationFrame(frame);
}
</script>
</body>
