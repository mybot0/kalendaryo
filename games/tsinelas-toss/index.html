:root{--bg:#F4F3EE;--surface:#fff;--surface-2:#F8F7F3;--line:#E4E2DA;--ink:#26302B;--ink-2:#5C675F;--primary:#3F7360;--primary-soft:#E4EFE9;--focus:#2F6B8F;--coral:#E08A7B;
  --shadow:0 1px 2px rgba(38,48,43,.08),0 4px 14px rgba(38,48,43,.08);--shadow2:0 2px 6px rgba(38,48,43,.10),0 14px 40px rgba(38,48,43,.16);
  --fh:'Outfit','Figtree',system-ui,sans-serif;--fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font:600 17px/1.4 var(--fb);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;background-color:var(--bg);
  background-image:radial-gradient(700px 500px at 5% 0%,rgba(244,224,220,.75),transparent 70%),radial-gradient(640px 520px at 100% 25%,rgba(233,227,246,.8),transparent 70%),radial-gradient(700px 520px at 40% 100%,rgba(251,244,217,.8),transparent 70%)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100dvh * .8));overflow:hidden;background:#EAF3F5;box-shadow:var(--shadow2)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(72,68,56,.30);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:2}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 18px;font-weight:800;font-size:17px;line-height:1.2;color:var(--ink);min-height:56px;transition:transform .1s}
.chip:active{transform:scale(.97)}
.big{display:block;width:100%;font:700 24px/1 var(--fh);background:var(--primary);color:#fff;border-radius:99px;padding:16px 20px;min-height:66px;box-shadow:0 6px 16px rgba(63,115,96,.28);transition:transform .1s,filter .15s}
.big:active{transform:scale(.98);filter:brightness(.95)}
.big.alt{background:var(--surface-2);color:var(--ink-2);border:1.5px solid var(--line);box-shadow:none;font-size:21px;min-height:58px;padding:12px}
.panel{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 28px);max-width:400px;max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#B9C7BF transparent;
  background:var(--surface);border-radius:26px;box-shadow:var(--shadow2);padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;touch-action:pan-y}
.panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-thumb{background:#B9C7BF;border-radius:3px}
.panel>*{flex-shrink:0}
.pop{animation:pop .24s ease-out both}
@keyframes pop{from{opacity:0;transform:translate(-50%,calc(-50% + 14px))}to{opacity:1;transform:translate(-50%,-50%)}}
h1,h2,h3{margin:0;font-family:var(--fh);font-weight:800;letter-spacing:-.01em}
.title{font-size:44px;line-height:1}
.title span{color:var(--primary)}
.title span+span{color:var(--ink);margin-left:.22em}
.h{font-size:32px;line-height:1.1;color:var(--ink)}
.tag{margin:0;font-weight:600;color:var(--ink-2);font-size:18px}
.row{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.seg{display:flex;width:100%;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.seg button{flex:1;min-height:56px;font-weight:800;font-size:18px;line-height:1.15;border-radius:99px;color:var(--ink-2);padding:4px 6px}
.seg button small{display:block;font-size:16px;font-weight:600;opacity:.9}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
.stats{display:flex;gap:10px;width:100%}
.stats div{flex:1;border-radius:16px;padding:8px 6px;background:var(--surface-2);border:1px solid var(--line)}
.stats small{display:block;font-size:15px;font-weight:800;color:var(--ink-2)}
.stats b{font:800 28px/1.15 var(--fh)}
.foot{font-size:15px;font-weight:600;color:var(--ink-2);margin:0}
.howlist{margin:0;padding:0;list-style:none;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:18px}
.howlist li{display:flex;gap:10px;align-items:flex-start}
.howlist li span:first-child{font-size:24px;line-height:1.15;flex:none;width:34px;text-align:center}
.slip{width:84px;height:84px;margin:-4px auto 0}
/* HUD band */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;display:flex;align-items:center;gap:8px;pointer-events:none}
.page{flex:none;width:clamp(76px,21%,100px);border:1.5px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;text-align:center;box-shadow:var(--shadow)}
.page i{display:block;background:var(--primary);font:800 14px/22px var(--fh);font-style:normal;color:#fff;letter-spacing:.06em}
.page b{display:block;font:800 clamp(28px,8vw,36px)/1.15 var(--fh);padding:0 0 2px}
.hchips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px}
.hchips .chip{min-height:0;gap:4px;padding:5px 10px;font-size:17px;background:rgba(255,255,255,.92)}
#pauseBtn{flex:none;pointer-events:auto;width:56px;height:56px;border-radius:50%;background:#fff;border:1.5px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:7px}
#pauseBtn i{width:7px;height:22px;border-radius:4px;background:var(--primary)}
#banner{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:#fff;border-radius:22px;box-shadow:var(--shadow2);padding:10px 22px;text-align:center;font:800 28px/1.15 var(--fh);color:var(--primary);pointer-events:none;animation:ban 1.5s ease both}
#banner.bad{color:#B5523F}#banner.meh{color:var(--ink-2)}#banner.lv{color:var(--ink)}
@keyframes ban{0%{opacity:0;transform:translate(-50%,10px) scale(.96)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
/* bottom: hint bubble + big RUN button */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
#hint{background:rgba(255,255,255,.94);border:1.5px solid var(--line);border-radius:99px;padding:10px 20px;font-weight:800;font-size:19px;line-height:1.25;text-align:center;box-shadow:var(--shadow);max-width:100%}
#runBtn{pointer-events:auto;width:min(100%,360px);min-height:76px;border-radius:99px;background:#B5523F;color:#fff;font:800 32px/1 var(--fh);letter-spacing:.02em;box-shadow:0 0 0 0 rgba(224,138,123,.6),0 8px 20px rgba(181,82,63,.3);border:3px solid #fff}
#runBtn.urgent{animation:glow 1s ease-in-out infinite}
#runBtn.urgent.calm{animation:none;background:#9E5A4A}
#runBtn.back{background:#fff;color:var(--ink);border-color:var(--line);font-size:28px;box-shadow:var(--shadow2)}
#runBtn:active{transform:scale(.97)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(224,138,123,.55),0 8px 20px rgba(181,82,63,.3)}50%{box-shadow:0 0 0 12px rgba(224,138,123,0),0 8px 20px rgba(181,82,63,.3);transform:scale(1.03)}}
#finger{position:absolute;left:50%;bottom:22%;width:64px;height:64px;margin-left:-32px;pointer-events:none;animation:swipe 1.6s ease-in-out infinite}
#finger svg{width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(38,48,43,.25))}
@keyframes swipe{0%{transform:translateY(40px);opacity:0}15%{opacity:1}70%{transform:translateY(-110px);opacity:1}100%{transform:translateY(-120px);opacity:0}}
.sticker{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:46px;background:#FBF4D9}
.newbest{background:#FBF4D9;color:var(--ink);border-radius:99px;padding:6px 16px;font:800 19px/1.2 var(--fh)}
@media(max-height:780px){.panel{gap:9px;padding:16px 14px}.title{font-size:38px}.big{min-height:60px;padding:12px;font-size:22px}.seg button{min-height:56px}.stats b{font-size:25px}.chip{min-height:56px;padding:6px 14px}.slip{width:64px;height:64px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}#banner{animation:none!important;opacity:1}#finger{animation:none!important;transform:translateY(-40px)}}
</style>
</head>

    <div id="banner" hidden></div>

    <div id="bottom"><div id="hint" hidden></div><button id="runBtn" type="button" hidden></button></div>
    <div id="scrim" class="scrim"></div>
    <div id="menu" class="panel pop" hidden>

      <h1 class="title" aria-label="Tsinelas Toss"><span>Tsinelas</span><span>Toss</span></h1>
      <p class="tag" data-t="tag"></p>
      <div class="seg" id="langSeg" role="group" aria-label="Language"><button type="button" data-l="en">English</button><button type="button" data-l="tl">Tagalog</button></div>
      <div class="seg" id="modeSeg" role="group"><button type="button" data-m="easy"><span data-t="easy"></span><small data-t="easysub"></small></button><button type="button" data-m="normal"><span data-t="normal"></span><small data-t="normalsub"></small></button></div>
      <button class="big" type="button" id="playBtn" data-t="play"></button>

      <div class="row"><button class="chip" type="button" id="sndBtn"></button><button class="chip" type="button" id="howBtn" data-t="how"></button></div>

      <h2 class="h" data-t="how"></h2>

      <button class="big" type="button" id="howOk" data-t="ok"></button>
    </div>
    <div id="paused" class="panel pop" hidden>
      <h2 class="h" data-t="paused"></h2>
      <button class="big" type="button" id="resumeBtn" data-t="keep"></button>
      <button class="big alt" type="button" id="pHome" data-t="menu"></button>
    </div>
    <div id="over" class="panel pop" hidden>
      <h2 class="h" id="oTitle"></h2>
      <div class="sticker" id="oSticker">🍚</div>
      <p class="tag" id="oSub"></p>
      <div id="oNew" class="newbest" hidden data-t="newbest"></div>
      <div class="stats"><div><small data-t="score"></small><b id="oScore">0</b></div><div><small data-t="cans"></small><b id="oCans">0</b></div><div><small data-t="best"></small><b id="oBest">0</b></div></div>
      <button class="big" type="button" id="againBtn" data-t="again"></button>
      <button class="big alt" type="button" id="oHome" data-t="menu"></button>
    </div>
  </div>
</div>
