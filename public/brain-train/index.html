<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* VOICE: silly, warm, calm enough for seniors.
   IDEA: a toy train set; each right answer moves the train to the next station.
   PICTURE: Choo-Choo Noodle (a pink brain in a conductor hat) and a 2D track.
   COLOUR and TYPE: Keybop family look - ink outlines, hard shadows, bright fields; Lilita One + Nunito.
   LAYOUT: one centered column, huge tap targets, stacked answers. */
:root{
  --ink:#1b1a3a;--ink-soft:#4a4870;--bg:#d6eaff;--card:#fff;
  --tomato:#ff5b4d;--sun:#ffc531;--leaf:#26bf72;--sky:#3d8bff;--grape:#8b5cf6;--pink:#ff7eb6;
  --fog:#c9ccd8;--good:#c9f5dc;--bad:#ffd6d2;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  --fs:20px;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{font-size:var(--fs)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:1rem;line-height:1.45;overflow-x:clip}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 110px;display:flex;flex-direction:column;gap:28px}
.chip{border:3px solid var(--ink);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:800;font-size:.8rem;line-height:1.2;box-shadow:0 4px 0 var(--ink);min-height:48px}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:99px;overflow:hidden;box-shadow:0 4px 0 var(--ink);background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:800;font-size:.8rem;min-height:44px}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--sun)}
.topbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.big{font:400 1.2rem/1 var(--f-display);background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:16px 26px;box-shadow:0 6px 0 var(--ink);min-height:64px}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.big.alt{background:var(--card)}
.big:disabled{opacity:.5;transform:none;box-shadow:0 6px 0 var(--ink)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.noodle{width:min(30vw,130px);height:auto;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:0}
.word .w{display:flex;gap:4px}
.word .l{display:grid;place-items:center;width:clamp(38px,10vw,58px);height:clamp(44px,11vw,64px);font:400 clamp(26px,7vw,42px)/1 var(--f-display);background:var(--c);border:3px solid var(--ink);border-radius:10px;box-shadow:0 6px 0 var(--ink);position:relative}
.word .l::after{content:'';position:absolute;bottom:-14px;left:18%;width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:calc(clamp(38px,10vw,58px)*.64 - 12px) 0 0 var(--ink)}
.tag{margin:8px 0 0;font:400 1.25rem/1.15 var(--f-display)}
.sub{margin:0;max-width:34ch;color:var(--ink-soft);font-weight:700}

/* players */
.h2{font:400 1.5rem/1.1 var(--f-display);margin:0 0 14px;text-align:center}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:18px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px 14px;box-shadow:6px 6px 0 var(--ink)}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:var(--c);border:3px solid var(--ink)}
.pname{font:400 1.4rem/1.1 var(--f-display);margin:0;overflow-wrap:anywhere}
.pstat{margin:0;color:var(--ink-soft);font-size:.8rem;font-weight:800}
.pcard .big{width:100%}
.linkbtn{border:0;background:none;text-decoration:underline;font-weight:800;font-size:.8rem;color:var(--ink-soft);min-height:44px;padding:4px 8px}
.nameedit{display:flex;flex-direction:column;gap:8px;width:100%}
.nameedit input{font:inherit;font-size:1rem;border:3px solid var(--ink);border-radius:12px;padding:10px;width:100%;text-align:center}
.mystats{text-align:center;font:400 1.1rem/1.2 var(--f-display);margin:-10px 0 0}
.pickhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.pickhead .h2{margin:0;text-align:left}
.steph{display:flex;align-items:center;gap:12px;margin:0;font:400 1.35rem/1.15 var(--f-display)}
.stepnum{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:#fff;border:3px solid var(--ink);font:400 1.5rem/1 var(--f-display);box-shadow:0 4px 0 var(--ink)}
.allbtn{align-self:flex-start}
.aboard{width:100%;font-size:1.5rem;min-height:84px}
.aboard.ready{background:var(--leaf);color:#fff;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{background:var(--leaf);box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(38,191,114,.7)}50%{background:#7dedb0;color:var(--ink);box-shadow:0 6px 0 var(--ink),0 0 0 12px rgba(38,191,114,.25)}}
.aboard.wait{background:#e7e7ef;color:var(--ink-soft)}
@keyframes glow{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(38,191,114,.55)}50%{box-shadow:0 6px 0 var(--ink),0 0 0 14px rgba(38,191,114,0)}}
.more summary{font:400 1.05rem/1.2 var(--f-display);cursor:pointer;min-height:44px;display:flex;align-items:center}
.more summary::before{content:'⚙️';margin-right:8px}
.scrollhint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;font:400 1.1rem/1 var(--f-display);max-width:calc(100vw - 24px);background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:14px 26px;box-shadow:0 6px 0 var(--ink);min-height:56px;white-space:nowrap;line-height:1;font-size:min(1rem,4.3vw);padding:12px 16px}
@keyframes bounce{50%{transform:translate(-50%,-10px)}}
.swipeguide{position:fixed;right:max(4px,env(safe-area-inset-right,0px));top:26vh;z-index:29;width:44px;height:42vh;padding:0;border:0;background:none;transition:opacity .5s}
.swipeguide.fade{opacity:0;pointer-events:none}
.sgtrack{position:relative;display:block;height:100%}
.sgtrack::before{content:'';position:absolute;left:50%;top:6px;bottom:6px;width:6px;margin-left:-3px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--ink) 0 8px,transparent 8px 16px);opacity:.35}
.sgdot{position:absolute;left:50%;top:0;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:20px;font-weight:800;animation:slide 1.8s ease-in-out infinite}
@keyframes slideup{0%{top:calc(100% - 40px);opacity:0}12%{opacity:1}80%{top:0;opacity:1}100%{top:0;opacity:0}}
.swipeguide.up .sgdot{animation-name:slideup;background:#fff;font-size:22px}
@keyframes slide{0%{top:0;opacity:0}12%{opacity:1}80%{top:calc(100% - 40px);opacity:1}100%{top:calc(100% - 40px);opacity:0}}
@media(min-width:900px){.swipeguide{right:calc(50% - 390px - 80px)}}
.cat.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 5px 0 var(--ink),0 0 0 8px rgba(255,197,49,.9)}}
.cat .tapme{position:absolute;right:62px;top:-16px;background:var(--ink);color:#fff;font-size:.7rem;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap;animation:bounce2 1.1s ease-in-out infinite}
@keyframes bounce2{50%{transform:translateY(-5px)}}
.foot{text-align:center;color:var(--ink-soft);font-size:.75rem;font-weight:800;margin:0}

/* setup */
.panelbox{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:14px}
.panelbox h3{font:400 1.25rem/1.1 var(--f-display);margin:0}
.hint{margin:0;color:var(--ink-soft);font-size:.8rem;font-weight:700}
.cats{display:grid;grid-template-columns:1fr;gap:16px;margin-top:6px}
.cat{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--ink);background:var(--card);border-radius:18px;padding:10px 12px;font-weight:800;font-size:min(1.1rem,6vw);line-height:1.2;min-height:80px;box-shadow:0 5px 0 var(--ink);color:var(--ink)}
.cat .ci{font-size:1.6rem;width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--c);border:2px solid var(--ink)}
.cat .cn{flex:1;overflow-wrap:break-word;word-break:normal}
.cat .ck{margin-left:auto;width:42px;height:42px;flex:none;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:#fff}
.cat[aria-pressed=true]{background:#fff3c4;border-width:4px}
.cat[aria-pressed=true] .ck{background:var(--leaf);color:#fff}
.cat .cs{display:block;margin-top:2px;font-size:.72em;font-weight:800;color:var(--ink-soft)}
.cat[aria-pressed=true] .cs{color:#127a45}
.cat[aria-pressed=false] .ck{box-shadow:0 0 0 4px rgba(255,197,49,.55)}
.cats.none .cat .ck{animation:boxglow 1.3s ease-in-out infinite}
@keyframes boxglow{0%,100%{box-shadow:0 0 0 3px rgba(255,197,49,.5)}50%{box-shadow:0 0 0 9px rgba(255,197,49,.95);background:#fff6d6}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.opt{text-align:left;border:3px solid var(--ink);background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--ink);min-height:64px}
.opt b{display:block;font-size:.95rem}
.opt span{font-size:.75rem;color:var(--ink-soft);font-weight:700}
.opt[aria-pressed=true]{background:var(--sun)}
.toggle{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;background:var(--card);box-shadow:0 4px 0 var(--ink);text-align:left;font-weight:800;font-size:.85rem;min-height:60px}
.toggle .sw{width:56px;height:32px;flex:none;border:3px solid var(--ink);border-radius:99px;position:relative;background:#e7e7ef}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .2s}
.toggle[aria-pressed=true] .sw{background:var(--leaf)}
.toggle[aria-pressed=true] .sw::after{left:26px;background:#fff}
.err{color:#b3261e;font-weight:800;margin:0}

/* ride */
.rbar{display:flex;align-items:center;gap:10px}
.rbar h2{flex:1;margin:0;text-align:center;font:400 1.15rem/1.1 var(--f-display)}
.back{border:3px solid var(--ink);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:800;font-size:.85rem;box-shadow:0 4px 0 var(--ink);min-height:48px}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.starbox{font:400 1.15rem/1 var(--f-display);white-space:nowrap}
.track{position:relative;height:150px;background:linear-gradient(#aee0ff,#e9f7ff 70%);border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.track::before{content:'';position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--leaf);border-top:3px solid var(--ink)}
.rail{position:absolute;left:0;right:0;bottom:26px;height:12px;background:repeating-linear-gradient(90deg,#8a5a2b 0 8px,transparent 8px 22px);border-top:4px solid var(--ink-soft)}
.stn{position:absolute;bottom:40px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.stn .flag{font:400 .7rem/1 var(--f-display);background:var(--card);border:3px solid var(--ink);border-radius:8px;padding:4px 7px;white-space:nowrap}
.stn .pole{width:4px;height:22px;background:var(--ink)}
.stn.on .flag{background:var(--sun)}
.trainwrap{position:absolute;bottom:22px;left:calc((100% - var(--tw,84px) - 12px) * var(--p,0) + 6px);display:flex;align-items:flex-end;transition:left .9s cubic-bezier(.4,1.3,.5,1)}
.trainwrap svg{display:block}
.puffs{position:absolute;bottom:96px;pointer-events:none}
.fogcloud{position:absolute;inset:0;display:grid;place-items:center;background:rgba(201,204,216,.55);pointer-events:none}
.fogcloud svg{width:min(60%,260px);height:auto}
.fogcloud.go{animation:fogin 1.6s ease forwards}
@keyframes fogin{0%{opacity:0;transform:translateX(-30%)}25%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateX(20%)}}
.status{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.steam{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.8rem}
.puff{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.puff.off{background:var(--fog);opacity:.5}
.lvl{font-weight:800;font-size:.8rem;background:var(--ink);color:#fff;border-radius:99px;padding:5px 12px}
.helpers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.help{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid var(--ink);background:var(--card);border-radius:16px;padding:8px 4px;box-shadow:0 4px 0 var(--ink);min-height:72px;text-align:center}
.help .hi{font-size:1.3rem;line-height:1}
.help b{font-size:.72rem;line-height:1.15}
.help small{font-size:.62rem;color:var(--ink-soft);font-weight:700;line-height:1.15}
.help:disabled{opacity:.45;box-shadow:0 1px 0 var(--ink);transform:translateY(3px)}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qcat{font-weight:800;font-size:.75rem;border:2px solid var(--ink);border-radius:99px;padding:4px 10px;background:var(--c)}
.qtext{font:400 1.45rem/1.2 var(--f-display);margin:0;text-wrap:balance}
.qpic{font-size:2rem;line-height:1.25;letter-spacing:4px;text-align:center;overflow-wrap:anywhere}
.tipbox{background:#fff6d6;border:3px dashed var(--ink);border-radius:14px;padding:10px 12px;font-weight:800;font-size:.9rem;margin:0}
.answers{display:flex;flex-direction:column;gap:12px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--ink);background:var(--card);border-radius:18px;padding:12px 14px;font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 var(--ink);min-height:68px;transition:transform .08s}
.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ans .key{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:400 1.1rem/1 var(--f-display);background:var(--c,var(--sky));color:#fff;border:3px solid var(--ink)}
.ans.gone{visibility:hidden}
.ans.pending{background:#fff6d6;outline:4px solid var(--sun)}
.ans.good{background:var(--good)}
.ans.good .key{background:var(--leaf)}
.ans.bad{background:var(--bad)}
.ans.bad .key{background:var(--tomato)}
.ans.dim{opacity:.55}
.ans:disabled{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .ans{justify-content:center;font:400 1.4rem/1 var(--f-display);min-height:90px}
.ordtag{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font:400 1.1rem/1 var(--f-display);background:var(--sun)}
.ordtag:empty{background:none;border-style:dashed}
.small{align-self:flex-start;border:3px solid var(--ink);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:800;font-size:.8rem;box-shadow:0 3px 0 var(--ink);min-height:44px}
.pendbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pendbar .bar{flex:1;min-width:120px;height:14px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.pendbar .bar i{display:block;height:100%;background:var(--sun);animation:fill 2s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.feedback{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:5px 5px 0 var(--ink)}
.feedback.good{background:var(--good)}
.feedback.bad{background:#eceef4}
.feedback h3{margin:0;font:400 1.5rem/1.1 var(--f-display)}
.feedback p{margin:0;font-weight:700}
.feedback .big{align-self:stretch}

/* end panel + fx */
.endpanel{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(214,234,255,.9);padding:16px}
.endcard{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);padding:24px;max-width:420px;width:100%}
.endcard h3{font:400 1.8rem/1.05 var(--f-display);margin:0}
.endcard p{margin:0;color:var(--ink-soft);font-weight:700}
.endcard .big{width:100%}
.endcard svg{width:140px;height:auto}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
#fx .bit{position:absolute;top:0;left:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:18px;max-width:calc(100vw - 32px);text-align:center;font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:480px){.panelbox{padding:14px 12px}.wrap{padding-inline:12px}.qtext{font-size:1.25rem}.help small{display:none}.track{height:136px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.help .ht{display:contents}
/* WIDE RIDE LAYOUT (iPad landscape and bigger; v1.6). Two equal columns that fill the frame, no scrolling.
   Only the ride screen changes; phones, portrait and the home screen are untouched.
   States come from classes the script sets (no :has): #ride.is-feedback / .tip-shown / .is-pending, body.ride-on / .framed.
   --m outer margin; --sh room for the hard shadows on the right/bottom; --z scale of the track scene (explicit sizes, no zoom). */
@media (min-width:900px) and (min-height:560px) and (orientation:landscape){
  /* inside the Games layer the Kalendaryo background shows through; opened directly the game keeps its own blue */
  body.framed.ride-on{background:transparent}
  body.framed.ride-on .endpanel{background:rgba(244,243,238,.92)}
  #ride{--m:14px;--sh:6px;--cg:calc(var(--m) + 5px);--rg:calc(var(--m) + 4px);--z:1.2;--th:180px;--rb:62px;--hc:84px;--hg:12px;
    position:relative;max-width:1180px;
    height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    padding:var(--m) calc(var(--m) + var(--sh)) calc(var(--m) + var(--sh)) var(--m);
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:var(--rb) var(--th) minmax(min-content,1fr);column-gap:var(--cg);row-gap:var(--rg);align-items:stretch}
  #ride>.rbar,#ride>.track,#ride>.status,#ride>.helpers,#ride>#fbArea{grid-column:1}
  #ride>.rbar{grid-row:1}
  #ride .rbar h2{font-size:1.35rem}
  #ride .back{font-size:1rem;align-self:stretch;margin-bottom:4px}
  #ride .starbox{font-size:1.35rem}
  /* track: fixed height; ground, rail, flags and train are sized up together by --z */
  #ride>.track{grid-row:2;height:var(--th)}
  #ride .track::before{height:calc(34px*var(--z));border-top-width:calc(3px*var(--z))}
  #ride .rail{bottom:calc(26px*var(--z));height:calc(12px*var(--z));border-top-width:calc(4px*var(--z));background:repeating-linear-gradient(90deg,#8a5a2b 0 calc(8px*var(--z)),transparent calc(8px*var(--z)) calc(22px*var(--z)))}
  #ride .stn{bottom:calc(40px*var(--z))}

/* ---------- math questions (made fresh each time) ---------- */
const COUNT_ITEMS=[['🍎','apples','mansanas'],['⭐','stars','bituin'],['🐟','fish','isda'],['🎈','balloons','lobo'],['🐥','chicks','sisiw'],['🥭','mangoes','mangga']];
function nearNums(ans,spread){
  const s=new Set([ans]);let guard=0;
  while(s.size<4&&guard++<60){const v=ans+ri(-spread,spread);if(v>=0&&v!==ans)s.add(v);}
  let k=1;while(s.size<4)s.add(ans+spread+k++);
  return [...s].map(String);
}
function mathQ(d){
  const r=Math.random();
  if(d===1&&r<.5){
    const it=pick(COUNT_ITEMS),n=ri(3,9);
    return {c:'math',d,t:'mc',q:['How many '+it[1]+'?','Ilan ang '+it[2]+'?'],pic:it[0].repeat(n),a:nearNums(n,2).map(two),tip:['Touch each one as you count.','Hawakan ang bawat isa habang nagbibilang.']};
  }
  if(d===1){const a=ri(1,6),b=ri(1,10-a);return {c:'math',d,t:'mc',q:['What is '+a+' + '+b+'?','Ano ang '+a+' + '+b+'?'],a:nearNums(a+b,2).map(two),tip:['Start with '+Math.max(a,b)+' and count up.','Magsimula sa '+Math.max(a,b)+' at magbilang pataas.']};}
  if(d===2&&r<.35){const nums=new Set();while(nums.size<4)nums.add(ri(10,99));const arr=[...nums].sort((x,y)=>y-x).map(String);return {c:'math',d,t:'mc',q:['Which is the biggest number?','Alin ang pinakamalaking numero?'],a:arr.map(two),tip:['Look at the first digit (the tens) first.','Tingnan muna ang unang digit (ang sampuan).']};}
  if(d===2&&r<.7){const a=ri(8,20),b=ri(2,a-1);return {c:'math',d,t:'mc',q:['What is '+a+' − '+b+'?','Ano ang '+a+' − '+b+'?'],a:nearNums(a-b,3).map(two),tip:['Count down from '+a+'.','Magbilang pababa mula '+a+'.']};}
  if(d===2){const a=ri(5,12),b=ri(3,9);return {c:'math',d,t:'mc',q:['What is '+a+' + '+b+'?','Ano ang '+a+' + '+b+'?'],a:nearNums(a+b,3).map(two),tip:['Make a 10 first, then add the rest.','Bumuo muna ng 10, saka idagdag ang natira.']};}
  if(r<.5){const a=ri(3,10),b=ri(3,10);return {c:'math',d,t:'mc',q:['What is '+a+' × '+b+'?','Ano ang '+a+' × '+b+'?'],a:nearNums(a*b,6).map(two),tip:[a+' × '+b+' means '+a+' groups of '+b+'.','Ang '+a+' × '+b+' ay '+a+' grupo ng '+b+'.']};}
  const a=ri(15,60),b=ri(12,39);
  return {c:'math',d,t:'mc',q:['What is '+a+' + '+b+'?','Ano ang '+a+' + '+b+'?'],a:nearNums(a+b,10).map(two),tip:['Add the tens first, then the ones.','Pagsamahin muna ang sampuan, saka ang isahan.']};
}

let sound=store.get('sound',true),ac=null;
function beep(f,dur,type,vol,delay){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+(delay||0);
    o.type=type||'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+.02);
  }catch(e){}
}
const choo=()=>{beep(587,.18,'square',.06);beep(740,.32,'square',.06,.2);beep(880,.4,'triangle',.08,.45);};
const fogSnd=()=>{beep(220,.35,'sine',.12);beep(165,.5,'sine',.12,.3);};
const tap=()=>beep(660,.06,'triangle',.06);
let warnedVoice=false;
function speak(text){
  if(!sound)return;
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=.85;u.pitch=1.05;
    if(lang==='tl'){
      u.lang='fil-PH';
      const v=speechSynthesis.getVoices().find(v=>/^(fil|tl)/i.test(v.lang));
      if(v)u.voice=v;else if(!warnedVoice){warnedVoice=true;toast(t('novoice'));}
    }else u.lang='en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}
try{if('speechSynthesis' in window)speechSynthesis.getVoices();}catch(e){}
const hush=()=>{try{speechSynthesis.cancel();}catch(e){}};

/* ---------- ride ---------- */
let R=null,pendT=0;
function startRide(){
  R={station:0,step:0,stars:0,used:new Set(),help:{express:true,tip:true,swap:true},cur:null,phase:'ask',fogs:0};
  go('ride');choo();nextQ();
}
const diffFor=()=>{const st=Math.min(2,R.station);return me.ride==='gentle'?[1,1,2][st]:st+1;};
function drawQ(d){
  const cats=me.cats,hasMath=cats.includes('math'),content=cats.filter(c=>c!=='math');
  if(hasMath&&(!content.length||Math.random()<1/cats.length))return mathQ(d);
  let pool=QS.filter(q=>content.includes(q.c)&&!R.used.has(q));
  let same=pool.filter(q=>q.d===d);
  if(!same.length)same=pool.filter(q=>Math.abs(q.d-d)===1);
  if(!same.length)same=pool;
  if(!same.length){
    if(hasMath)return mathQ(d);
    R.used.clear();same=QS.filter(q=>content.includes(q.c)&&q.d===d);
    if(!same.length)same=QS.filter(q=>content.includes(q.c));
  }
  const q=pick(same);R.used.add(q);return q;
}
function prepare(q){
  const s={q,picked:null,done:false,hidden:new Set(),order:[],tipShown:false};
  if(q.t==='mc')s.opts=shuffle(q.a.map((a,i)=>({label:a,ok:i===0})));
  else if(q.t==='tf')s.opts=[{label:S.tf_true,ok:q.ans===true},{label:S.tf_false,ok:q.ans===false}];
  else s.opts=shuffle(q.a.map((a,i)=>({label:a,rank:i})));
  return s;
}
function nextQ(){clearTimeout(pendT);hush();R.cur=prepare(drawQ(diffFor()));R.phase='ask';$('#fbArea').innerHTML='';renderRide();}

function renderTrack(){
  const pos=R.station*4+R.step;
  const posL=i=>i===0?'8px;transform:none':i===3?'calc(100% - 24px)':'calc(6px + var(--tw) + (100% - var(--tw) - 12px) * '+(i/3).toFixed(4)+')';
  $('#stations').innerHTML=[0,1,2,3].map(i=>'<div class="stn'+(R.station>=i&&i>0?' on':'')+'" style="left:'+posL(i)+'"><span class="flag">'+(i===0?esc(t('start')):i)+'</span><span class="pole"></span></div>').join('');
  const cars=R.station;
  const tr=$('#train');
  tr.innerHTML=Array.from({length:cars},(_,i)=>carSvg(T(['--sun','--leaf','--grape'][i]))).join('')+ENGINE;
  const tw=84+cars*40;
  $('#track').style.setProperty('--tw',tw+'px');
  tr.style.setProperty('--p',(pos/12).toFixed(3));
}
function renderRide(){
  const lv=S.lv[diffFor()-1][L()];
  $('#rideTitle').textContent=t('station',{n:Math.min(3,R.station+1)});
  $('#starbox').textContent='⭐ '+R.stars;
  $('#lvl').textContent=lv;
  $('#steam').textContent=R.fogs?'☁️ × '+R.fogs:'';
  renderTrack();
  const s=R.cur,q=s.q,asking=R.phase==='ask';
  const canExpress=q.t==='mc'&&s.opts.length>=4&&s.hidden.size===0;
  const H=[['express','🚄',canExpress],['tip','🧢',!s.tipShown],['swap','🔀',true]];
  $('#helpers').innerHTML=H.map(([k,ic,ok])=>{
    const avail=R.help[k]&&ok&&asking&&s.picked===null;
    return '<button class="help" type="button" data-help="'+k+'"'+(avail?'':' disabled')+'><span class="hi" aria-hidden="true">'+ic+'</span><span class="ht"><b>'+esc(t('h_'+k))+'</b><small>'+esc(R.help[k]?t('h_'+k+'_d'):t('used'))+'</small></span></button>';
  }).join('');
  const cat=CAT[q.c];
  let h='<div class="qmeta"><span class="qcat" style="--c:var('+cat.c+')">'+cat.ico+' '+esc(cat.n[L()])+'</span><button class="small" type="button" id="readBtn">'+esc(t('read'))+'</button></div>';
  h+='<p class="qtext">'+esc(tx(q.q))+'</p>';
  if(q.pic)h+='<div class="qpic" aria-label="'+esc(String([...q.pic].length))+'">'+q.pic+'</div>';
  if(s.tipShown)h+='<p class="tipbox">🧢 '+esc(tx(q.tip))+'</p>';
  if(q.t==='order')h+='<p class="hint">'+esc(t('order_hint'))+'</p>';
  const keys=['A','B','C','D'];
  const btns=s.opts.map((o,i)=>{
    let cls='ans';
    if(s.hidden.has(i))cls+=' gone';
    if(q.t!=='order'){
      if(s.picked===i&&!s.done)cls+=' pending';
      if(s.done){if(o.ok)cls+=' good';else if(s.picked===i)cls+=' bad';else cls+=' dim';}
    }else if(s.done){cls+=s.orderOk?' good':' bad';}
    const lock=s.done||s.picked!==null||s.hidden.has(i)||(q.t==='order'&&s.order.includes(i));
    const key=q.t==='mc'?'<span class="key" style="--c:var('+COLS[[3,0,2,4][i]]+')">'+keys[i]+'</span>':'';
    const ord=q.t==='order'?'<span class="ordtag">'+(s.order.includes(i)?s.order.indexOf(i)+1:'')+'</span>':'';
    return '<button class="'+cls+'" type="button" data-a="'+i+'"'+(lock?' disabled':'')+'>'+key+'<span>'+esc(tx(o.label))+'</span>'+ord+'</button>';
  }).join('');
  h+=q.t==='tf'?'<div class="tfrow">'+btns+'</div>':'<div class="answers">'+btns+'</div>';
  if(q.t==='order'&&s.order.length&&s.picked===null&&!s.done)h+='<button class="small" type="button" id="ordReset">↺ '+esc(t('order_reset'))+'</button>';
  if(s.picked!==null&&!s.done)h+='<div class="pendbar"><span>'+esc(t('checking'))+'</span><span class="bar"><i></i></span><button class="small" type="button" id="changeBtn">'+esc(t('change'))+'</button></div>';
  $('#qcard').innerHTML=h;
  const rc=screens.ride.classList;
  rc.toggle('is-feedback',!asking);rc.toggle('tip-shown',asking&&!!s.tipShown);rc.toggle('is-pending',asking&&(s.picked!==null||(q.t==='order'&&s.order.length>0)));
}
function readAloud(){
  const s=R.cur,q=s.q;
  let txt=tx(q.q);
  if(q.pic)txt+=' ';
  if(q.t==='mc')txt+=' '+s.opts.map((o,i)=>s.hidden.has(i)?'':['A','B','C','D'][i]+': '+tx(o.label)+'.').join(' ');
  else txt+=' '+s.opts.map(o=>tx(o.label)+'.').join(' ');
  speak(txt);
}
$('#qcard').addEventListener('click',e=>{
  if(!R||R.phase!=='ask')return;
  const s=R.cur;
  if(e.target.closest('#readBtn')){readAloud();return;}
  if(e.target.closest('#changeBtn')){clearTimeout(pendT);s.picked=null;if(s.q.t==='order')s.order=[];renderRide();return;}
  if(e.target.closest('#ordReset')){s.order=[];renderRide();return;}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const i=+b.dataset.a;tap();
  if(s.q.t==='order'){
    s.order.push(i);
    if(s.order.length<s.opts.length){renderRide();return;}
    s.picked='order';
  }else s.picked=i;
  if(me.undo){renderRide();pendT=setTimeout(resolve,2000);}else resolve();
});
$('#helpers').addEventListener('click',e=>{
  const b=e.target.closest('[data-help]');if(!b||b.disabled)return;
  const k=b.dataset.help,s=R.cur;R.help[k]=false;tap();
  if(k==='express'){const wrong=shuffle(s.opts.map((o,i)=>o.ok?-1:i).filter(i=>i>=0)).slice(0,2);wrong.forEach(i=>s.hidden.add(i));}
  if(k==='tip')s.tipShown=true;
  if(k==='swap'){nextQ();return;}
  renderRide();
});
function resolve(){
  const s=R.cur,q=s.q;
  let ok;
  if(q.t==='order'){ok=s.order.every((oi,pos)=>s.opts[oi].rank===pos);s.orderOk=ok;}
  else ok=!!s.opts[s.picked].ok;
  s.done=true;R.phase='feedback';hush();
  let reachedNow=0,finished=false,stopped=false;
  if(ok){
    R.stars++;R.step++;
    if(R.step>=4){R.station++;R.step=0;reachedNow=R.station;if(R.station>=3)finished=true;}
    choo();confetti(reachedNow?50:14);
  }else{
    R.fogs++;R.step=0;fogSnd();
    const f=$('#fog');f.hidden=false;f.classList.remove('go');void f.offsetWidth;f.classList.add('go');setTimeout(()=>{f.hidden=true;},1650);
  }
  renderRide();
  const right=q.t==='order'?s.opts.slice().sort((a,b)=>a.rank-b.rank).map(o=>tx(o.label)).join(' → '):tx(s.opts.find(o=>o.ok).label);
  let fb='<div class="feedback '+(ok?'good':'bad')+'" role="status"><h3>'+(ok?'🚂 '+esc(t('right')):'☁️ '+esc(t('wrong')))+'</h3>';
  if(!ok)fb+='<p>'+esc(t('answer_is',{a:right}))+'</p>';
  if(reachedNow&&!finished)fb+='<p><b>'+esc(t('reached',{n:reachedNow}))+'</b></p>';
  fb+='<p>'+esc(t('didyou',{t:tx(q.tip)}))+'</p>';
  if(!ok&&!stopped&&R.station<3)fb+='<p>'+esc(t('goback'))+'</p>';
  fb+='<button class="big" type="button" id="nextBtn">'+esc(t('next'))+'</button></div>';
  $('#fbArea').innerHTML=fb;
  const nb=$('#nextBtn');
  nb.addEventListener('click',()=>{if(finished||stopped)endRide(finished);else nextQ();});
  try{nb.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});}catch(e){}
  if(sound)speak(ok?(lang==='tl'?'Tama!':'Correct!'):t('answer_is',{a:right}));
}
function endRide(won){
  hush();
  const prevBest=me.best;
  me.stars+=R.stars;if(R.stars>me.best)me.best=R.stars;savePlayers();
  const nb=R.stars>prevBest&&R.stars>0;
  let h=won?(R.fogs?t('win_h2'):t('win_h')):t('lose_h'),p;
  if(won)p=t('win_p',{s:R.stars});else if(R.station>0)p=t('lose_p',{st:R.station,s:R.stars});else p=t('lose_p0',{s:R.stars});
  if(won)confetti(90);
  $('#endArea').innerHTML='<div class="endpanel"><div class="endcard" role="dialog" aria-modal="true" aria-labelledby="endH"><svg viewBox="0 0 200 190" aria-hidden="true"><use href="#noodleBody"/></svg><h3 id="endH">'+esc(h)+'</h3><p>'+esc(p)+'</p>'+(nb?'<p><b>'+esc(t('newbest'))+'</b></p>':'')+'<button class="big" type="button" id="againBtn">'+esc(t('again'))+'</button><button class="big alt" type="button" id="homeBtn">'+esc(t('home'))+'</button></div></div>';
  $('#againBtn').focus();
  $('#againBtn').onclick=()=>{$('#endArea').innerHTML='';startRide();};
  $('#homeBtn').onclick=()=>{$('#endArea').innerHTML='';R=null;go('home');paintHome();};
}
$('#rideBack').addEventListener('click',()=>{
  if(!R)return go('home');
  $('#endArea').innerHTML='<div class="endpanel"><div class="endcard" role="dialog" aria-modal="true" aria-labelledby="lvH"><h3 id="lvH">'+esc(t('leave'))+'</h3><button class="big" type="button" id="stayBtn">'+esc(t('leave_no'))+'</button><button class="big alt" type="button" id="leaveBtn">'+esc(t('leave_yes'))+'</button></div></div>';
  $('#stayBtn').focus();
  $('#stayBtn').onclick=()=>{$('#endArea').innerHTML='';};
  $('#leaveBtn').onclick=()=>{$('#endArea').innerHTML='';clearTimeout(pendT);hush();if(R&&R.stars){me.stars+=R.stars;if(R.stars>me.best)me.best=R.stars;savePlayers();}R=null;go('home');paintHome();};
});

/* ---------- top controls ---------- */
$('#snd').addEventListener('click',()=>{sound=!sound;store.set('sound',sound);if(!sound)hush();else tap();paintStatic();});
$('#langSeg').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;store.set('lang',lang);tap();paintStatic();paintHome();});
$('#sizeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-size]');if(!b)return;size=+b.dataset.size;store.set('size',size);tap();paintSize();});
addEventListener('keydown',e=>{
  if(!R||screens.ride.hidden||$('#endArea').innerHTML)return;
  if(R.phase==='feedback'&&(e.key==='Enter'||e.key===' ')){const nb=$('#nextBtn');if(nb&&document.activeElement!==nb){e.preventDefault();nb.click();}return;}
  if(R.phase==='ask'&&R.cur.q.t!=='order'){
    const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
    if(m!==undefined){const b=document.querySelector('[data-a="'+m+'"]');if(b&&!b.disabled)b.click();}
  }
});

paintSize();paintStatic();paintHome();updHint();
}
})();
</script>
</body>
</html>
