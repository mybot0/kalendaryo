<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F3EE">
<title>Kalendaryo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap">
<style>
/* theme.css — colors, fonts, sizes. Light only (by choice). Change the look here. */
:root {
  color-scheme: light;
  --bg: #F4F3EE;
  --surface: #FFFFFF;
  --surface-2: #F8F7F3;
  --line: #E4E2DA;
  --ink: #26302B;
  --ink-2: #5C675F;
  --ink-3: #8A948C;
  --primary: #3F7360;
  --primary-ink: #FFFFFF;
  --primary-soft: #E4EFE9;
  --danger: #B3402F;
  --danger-soft: #FBE9E5;
  --focus: #2F6B8F;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(38,48,43,.06), 0 4px 14px rgba(38,48,43,.06);
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Outfit', 'Figtree', system-ui, sans-serif;
  --text-scale: 1;
  --tap: 48px;
}

/* base.css — reset and everyday text/layout helpers. */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: calc(100% * var(--text-scale)); -webkit-text-size-adjust: 100%; }
html.has-sheet body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.45 var(--font); min-height: 100vh; }

body {
  background-color: var(--bg);
  background-image:
    radial-gradient(700px 500px at 5% 0%, rgba(244,224,220,.75), transparent 70%),
    radial-gradient(640px 520px at 100% 25%, rgba(233,227,246,.8), transparent 70%),

e%20cx%3D%227%22%20cy%3D%2210%22%20r%3D%221.6%22/%3E%3Ccircle%20cx%3D%2210.5%22%20cy%3D%226.5%22%20r%3D%221.6%22/%3E%3Ccircle%20cx%3D%2214.5%22%20cy%3D%226.5%22%20r%3D%221.6%22/%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%2210%22%20r%3D%221.6%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28554%20205%29%20rotate%28-2%2024%2024%29%20scale%282.81%29%22%3E%3Cpath%20d%3D%22M12%204l2.4%205%205.4.6-4%203.7%201.1%205.4L12%2016l-4.9%202.7%201.1-5.4-4-3.7%205.4-.6z%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2834%20414%29%20rotate%28-9%2024%2024%29%20scale%282.89%29%22%3E%3Cpath%20d%3D%22M5%209h10v7a4%204%200%200%201-4%204H9a4%204%200%200%201-4-4z%22/%3E%3Cpath%20d%3D%22M15%2011h2a2%202%200%200%201%200%204h-2%22/%3E%3Cpath%20d%3D%22M8%203c0%201.5%201%201.5%201%203M12%203c0%201.5%201%201.5%201%203%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28226%20392%29%20rotate%288%2024%2024%29%20scale%283.01%29%22%3E%3Cpath%20d%3D%22M4%2011l8-7%208%207v9H4z%22/%3E%3Cpath%20d%3D%22M10%2020v-5h4v5%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28373%20428%29%20rotate%28-3%2024%2024%29%20scale%282.48%29%22%3E%3Cpath%20d%3D%22M8%204L4%207l2%203%202-1v11h8V9l2%201%202-3-4-3c-1%201.5-2.5%202-4%202S9%205.5%208%204z%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28581%20362%29%20rotate%28-17%2024%2024%29%20scale%282.74%29%22%3E%3Cpath%20d%3D%22M5%206h14v13H5zM5%2010h14M9%204v4M15%204v4%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2863%20581%29%20rotate%2814%2024%2024%29%20scale%282.80%29%22%3E%3Cpath%20d%3D%22M7%2014h10l-1.5%207h-7z%22/%3E%3Cpath%20d%3D%22M12%2014V9%22/%3E%3Cpath%20d%3D%22M12%209c-3%200-5-2-5-5%203%200%205%202%205%205zM12%2010c3%200%205-2%205-5-3%200-5%202-5%205z%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28205%20576%29%20rotate%283%2024%2024%29%20scale%282.82%29%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%224%22/%3E%3Cpath%20d%3D%22M12%202v3M12%2019v3M2%2012h3M19%2012h3M4.9%204.9l2.1%202.1M17%2017l2.1%202.1M4.9%2019.1L7%2017M17%207l2.1-2.1%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28386%20587%29%20rotate%28-1%2024%2024%29%20scale%283.06%29%22%3E%3Cpath%20d%3D%22M5%2010l1-6%204%203h4l4-3%201%206v3a7%207%200%200%201-14%200z%22/%3E%3Ccircle%20cx%3D%229.5%22%20cy%3D%2212%22%20r%3D%22.6%22/%3E%3Ccircle%20cx%3D%2214.5%22%20cy%3D%2212%22%20r%3D%22.6%22/%3E%3Cpath%20d%3D%22M11%2015l1%201%201-1%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28573%20525%29%20rotate%285%2024%2024%29%20scale%282.89%29%22%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2212%22%20r%3D%226%22/%3E%3Cpath%20d%3D%22M16%2012h6%22/%3E%3Cpath%20d%3D%22M8%2011c1-1%202-1%203%200%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  background-size: auto, auto, auto, 680px 680px;
  background-repeat: no-repeat, no-repeat, no-repeat, repeat;
  background-attachment: fixed;
}

[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; line-height: 1.2; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition: none !important; animation: none !important; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card-list { display: flex; flex-direction: column; gap: 8px; }
.sub { color: var(--ink-2); font-size: .9rem; }
.spacer { flex: 1; }
.pre { white-space: pre-wrap; }
.mini-h { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 8px 0 4px; font-family: var(--font); font-weight: 700; }
.link-btn { background: none; border: 0; color: var(--primary); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; min-height: 36px; padding: 0 6px; border-radius: 8px; }
.link-btn:hover { background: var(--primary-soft); }
.link-btn .ic { width: 18px; height: 18px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.plain-list { margin: 0; padding-left: 1.2em; color: var(--ink-2); }
.form-error { color: var(--danger); font-weight: 600; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* components.css — buttons, forms, avatars, sheets, toast, event cards. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; font-weight: 700; background: var(--primary-soft); color: var(--primary); transition: filter .15s, transform .1s; }
.btn:hover { filter: brightness(.96); } .btn:active { transform: scale(.98); }
.btn.big { min-height: var(--tap); padding: 0 22px; font-size: 1.02rem; }
.btn.block { width: 100%; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: rgba(0,0,0,.05); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--primary-soft); }

.avatar { width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); display: inline-grid; place-items: center; font-weight: 800; font-size: calc(var(--s) * .42); flex: none; color: rgba(38,48,43,.8); }
.avatar.emoji { font-size: calc(var(--s) * .55); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field-label { font-weight: 700; font-size: .9rem; }
.hint { color: var(--ink-3); font-size: .85rem; }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
  width: 100%; min-height: var(--tap); padding: 8px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.num { width: 5.5rem !important; }

.segmented { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; width: fit-content; max-width: 100%; }
.seg-btn { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; font-weight: 700; color: var(--ink-2); }
.seg-btn.on { background: var(--primary); color: #fff; }

.switch { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.switch-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 50px; height: 30px; border-radius: 999px; background: #CFCFC6; position: relative; transition: background .2s; flex: none; }
.thumb { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch-input:checked + .track { background: var(--primary); }
.switch-input:checked + .track .thumb { transform: translateX(20px); }
.switch-input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
.switch-label { font-weight: 600; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; background: var(--c); border: 3px solid transparent; }
.swatch.auto { width: auto; padding: 0 14px; border-radius: 999px; background: var(--surface-2); border: 1.5px solid var(--line); font-weight: 700; font-size: .85rem; color: var(--ink-2); }
.swatch.on { border-color: var(--ink); box-shadow: inset 0 0 0 2px #fff; }
.swatch.auto.on { background: var(--ink); color: #fff; }

.empty-state { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-2); }
.empty-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.empty-icon .ic { width: 28px; height: 28px; }
.empty-state h3 { color: var(--ink); }
.empty-state p { max-width: 34ch; }
.empty-state .btn { margin-top: 8px; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 85; background: rgba(38,48,43,.38); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.18); animation: rise .22s ease-out; outline: none; }
.sheet.wide { max-width: 720px; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 8px; }
.sheet-close { box-shadow: none; background: var(--surface-2); }
.sheet-body { padding: 8px 20px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet-text { color: var(--ink-2); margin-bottom: 8px; }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; } }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-height: var(--tap); }
.choice:hover { border-color: var(--primary); background: var(--primary-soft); }
.choice span { color: var(--ink-2); font-size: .9rem; }
.choice.danger strong { color: var(--danger); }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 95; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

/* event card */
.ev-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: var(--radius-sm); padding: 12px 14px 12px 16px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); min-height: var(--tap); }
.ev-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
.ev-card:hover { background: var(--surface-2); }
.ev-time { font-weight: 700; font-size: .85rem; color: var(--ink-2); min-width: 5.2em; }
.ev-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.ev-title { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.ev-title .ic { width: 18px; height: 18px; }
.ev-loc { color: var(--ink-2); font-size: .85rem; display: inline-flex; align-items: center; gap: 4px; }
.ev-loc .ic { width: 14px; height: 14px; }
.ev-people { display: inline-flex; margin-left: auto; }
.ev-people .avatar { margin-left: -6px; box-shadow: 0 0 0 2px #fff; }
.ev-rep { color: var(--ink-3); display: inline-flex; }
.ev-rep .ic { width: 16px; height: 16px; }
.ev-card.compact { flex-wrap: wrap; padding: 8px 10px 8px 14px; gap: 2px 8px; min-height: 0; }
.ev-card.compact .ev-time { min-width: 0; font-size: .78rem; }
.ev-card.compact .ev-main { flex-basis: 100%; }
.ev-card.compact .ev-people { display: none; }

/* detail sheet */
.detail { position: relative; display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.detail-band { height: 8px; border-radius: 999px; background: var(--c); }
.detail-row { display: flex; gap: 12px; align-items: flex-start; }
.detail-ic { color: var(--ink-3); padding-top: 2px; }
.detail-people { display: flex; flex-wrap: wrap; gap: 8px; }
.person-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; background: var(--surface-2); border-radius: 999px; font-weight: 600; }

/* event form */
.event-form { display: flex; flex-direction: column; gap: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.person-pick { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 14px 4px 6px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; }
.person-pick[aria-pressed=true] { border-color: var(--primary); background: var(--primary-soft); }
.repeat-block, .repeat-custom, .repeat-ends { display: flex; flex-direction: column; gap: 12px; }
.repeat-block { padding: 14px; background: var(--surface-2); border-radius: var(--radius-sm); }
.inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline select { width: auto; }
.wd-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.wd-pick button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
.wd-pick button[aria-pressed=true] { background: var(--primary); border-color: var(--primary); color: #fff; }
.avatar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.avatar-opt { height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 1.5rem; }
.avatar-opt.on { border-color: var(--primary); background: var(--primary-soft); }

/* shell.css — page frame: side rail on wide screens, bottom bar on phones. */
.app { display: flex; min-height: 100vh; }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main { flex: 1; padding: 24px max(16px, env(safe-area-inset-right)) 120px max(16px, env(safe-area-inset-left)); width: 100%; max-width: 1280px; margin: 0 auto; outline: none; }
.status-banner { background: #FFF3D6; color: #6B4E00; padding: 10px 16px; text-align: center; font-weight: 600; }
.rail { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.brand { display: none; }
.nav { display: flex; justify-content: space-around; padding: 4px 4px; }
.nav-btn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 8px 2px; min-height: 56px; border-radius: 14px; color: var(--ink-2); font-weight: 700; font-size: .7rem; }
.nav-btn.on { color: var(--primary); background: var(--primary-soft); }

/* screens.css — Home, Calendar, Family, Settings. */
/* Home */
.home { display: flex; flex-direction: column; gap: 20px; }

}

}
.week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wk-day { border: 0; background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 4px; min-height: 130px; align-items: stretch; }

.wk-items { display: flex; flex-direction: column; gap: 3px; }

@media (max-width: 640px) { .week-strip { grid-template-columns: 1fr; } .wk-day { flex-direction: row; min-height: 0; align-items: center; text-align: left; gap: 10px; } .wk-num { min-width: 1.6em; } .wk-items { flex: 1; min-width: 0; } }
.upcoming { display: flex; flex-direction: column; gap: 6px; }
.up-row { display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 8px 6px; border-radius: 12px; min-height: var(--tap); border-left: 5px solid var(--c); padding-left: 12px; }
.up-row:hover { background: var(--surface-2); }

.up-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.up-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.member-tile { border: 0; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--c) 28%, #fff); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; text-align: center; }

/* Calendar */

.mv-ev { border: 0; background: var(--c); border-radius: 6px; padding: 2px 6px; font-size: .75rem; font-weight: 600; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 22px; }
.mv-more { border: 0; background: none; color: var(--ink-2); font-size: .72rem; font-weight: 700; text-align: left; padding: 0 4px; min-height: 22px; }
@media (max-width: 640px) { .mv-grid { grid-template-rows: repeat(var(--rows), minmax(64px, 1fr)); } .mv-ev { font-size: 0; padding: 0; height: 8px; min-height: 8px; width: 8px; border-radius: 50%; display: inline-block; } .mv-items { flex-direction: row; flex-wrap: wrap; gap: 3px; padding: 0 3px; } .mv-more { font-size: .65rem; } .mv-num { min-width: 28px; min-height: 28px; font-size: .85rem; } }
.week-view { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wv-day { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 280px; }

@media (max-width: 900px) { .week-view { grid-template-columns: 1fr; } .wv-day { min-height: 0; flex-direction: row; flex-wrap: wrap; align-items: flex-start; } .wv-head { flex-direction: row; gap: 8px; min-width: 100%; justify-content: flex-start; } .wv-list { min-width: 60%; } }

.family-card { border: 0; background: color-mix(in srgb, var(--c) 28%, #fff); border-radius: var(--radius); padding: 22px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }

.member-head { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--c) 28%, #fff); }

/* Settings */
.settings-cols { display: flex; gap: 16px; align-items: flex-start; }
.settings-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

/* Even mode: columns share one height, cards grow a little so every bottom edge lines up. */

.settings-card { display: flex; flex-direction: column; gap: 14px; }
.toggle-list { display: flex; flex-direction: column; gap: 4px; }
.toggle-row { display: flex; align-items: center; gap: 10px; }
.ws-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(6.5rem, 8rem) 44px 44px; gap: 8px; align-items: center; }

@container (max-width: 460px) {
  .ws-row { grid-template-columns: minmax(0, 1fr) 44px 44px; grid-template-areas: "tog up down" "size . ."; row-gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .ws-row > :nth-child(1) { grid-area: tog; } .ws-row > :nth-child(2) { grid-area: size; margin-left: 62px; width: calc(100% - 62px); }
  .ws-row > :nth-child(3) { grid-area: up; } .ws-row > :nth-child(4) { grid-area: down; }
  .ws-row:last-child { border-bottom: 0; }
}


/* chores.css — the Chores screen and its Home widget. */
.chores-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }

.shop-box { display: flex; flex-direction: column; gap: 16px; max-width: 640px; }
.shop-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.ing-pick { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--surface-2); }
.ing-pick input[type=checkbox] { width: 24px; height: 24px; flex: none; }
.ing-pick input[type=text] { flex: 1; min-width: 0; min-height: 40px; border: 0; background: transparent; padding: 4px 6px; font-weight: 600; }
.ing-pick input[type=text]:focus { background: var(--surface); box-shadow: none; }

/* wall mode */
.wall { position: fixed; inset: 0; z-index: 70; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; overflow: hidden; }
.wall-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s; }
.wall-bg.on { opacity: 1; }
.wall-veil { position: absolute; inset: 0; display: none; background: rgba(244,243,238,.55); }
.wall.bgphoto .wall-veil { display: block; }
.wall.board:not(.bgphoto) .wall-bg { display: none; }
.wall.photos .wall-veil { display: none; }
.wall-bar { position: absolute; top: 12px; right: 12px; z-index: 3; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; transition: opacity .4s; }
.wall.idle .wall-bar { opacity: 0; pointer-events: none; }
.wall-top { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: clamp(12px, 2.4vh, 32px) clamp(16px, 2.6vw, 40px) clamp(6px, 1.2vh, 14px); }
.wall-clock { display: flex; flex-direction: column; gap: 2px; }
.wall-time { font: 800 clamp(2.4rem, min(8.5vw, 12vh), 7.5rem)/1 var(--font-head); letter-spacing: -.03em; }
.wall-date { font-size: clamp(1rem, min(2.4vw, 3.2vh), 2rem); color: var(--ink-2); font-weight: 600; }
.wall-greet { font-size: clamp(.95rem, min(1.8vw, 2.6vh), 1.6rem); color: var(--ink-2); font-weight: 700; text-align: right; }
.wall-main { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; gap: clamp(8px, 1.4vh, 18px); padding: 4px clamp(16px, 2.6vw, 40px) clamp(12px, 2.4vh, 32px); }
.wall-agenda { flex: 0 0 34%; max-width: 620px; }
.wall.port .wall-agenda { flex-basis: 42%; }
.wall-grid { position: relative; flex: 1; min-width: 0; min-height: 0; display: grid; gap: clamp(8px, 1.4vh, 18px);
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); grid-auto-flow: dense; }
.wall-panel { background: rgba(255,255,255,.93); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(10px, 1.6vh, 18px) clamp(12px, 1.4vw, 20px); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.wall-panel > h2 { font-size: clamp(.95rem, min(1.5vw, 2.2vh), 1.35rem); color: var(--ink-2); margin-bottom: 8px; flex: none; }
.wall-panel-body { flex: 1; min-height: 0; overflow: hidden; }
.wall-panel-body.clip { -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
.wall-panel .empty-state { padding: 6px; gap: 4px; }
.wall-panel .empty-state .btn, .wall-panel .empty-icon { display: none; }
.wall-panel .week-strip { height: 100%; }
.wall-panel .wk-day { min-height: 0; }
.wall-items { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
.wall-photo { position: relative; padding: 0; background: var(--surface-2); }
.wall-photo-img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s; }
.wall-photo-img.on { opacity: 1; }
.wall-photo-empty { margin: auto; padding: 16px; text-align: center; display: none; }
.wall-photo.empty .wall-photo-empty { display: block; }
/* photos only */
.wall.photos .wall-main { display: none; }
.wall.photos .wall-top { position: absolute; left: clamp(16px, 2.6vw, 40px); bottom: clamp(16px, 3vh, 36px); padding: 10px 18px; background: rgba(255,255,255,.85); border-radius: var(--radius); }
.wall.photos .wall-time { font-size: clamp(2rem, 4vw, 3rem); }
.wall.photos .wall-date { font-size: 1rem; }
.wall.photos .wall-greet { display: none; }
.wall.photos.nophotos::after { content: 'Add photos in the Photos tab to see a slideshow here.'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-weight: 600; padding: 24px; text-align: center; }
.wall-toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 2px 12px; }
@media (max-width: 640px) { .wall-bar .btn span { display: none; } .wall-bar .btn { padding: 0 12px; } }
.wall-quiet { color: var(--ink-2); font-weight: 600; }
.wall-panel .ev-card.compact .ev-title { font-size: 1.05rem; }
.wall.board.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.wall.board.scroll .wall-main { flex: none; flex-direction: column; }
.wall.board.scroll .wall-agenda { flex: none; max-width: none; }
.wall.board.scroll .wall-grid { flex: none; grid-template-rows: none; grid-auto-rows: minmax(170px, auto); }
.wall.board.scroll .wall-panel-body { overflow: visible; }
.wall.board.scroll .wall-panel-body.clip { -webkit-mask-image: none; mask-image: none; }

/* wall: Today and coming up (left box) */
.ag { display: flex; flex-direction: column; gap: 10px; }
.ag-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ag-head h2 { font-size: clamp(1.15rem, min(2vw, 3vh), 1.7rem); }
.ag-count { font-weight: 700; color: var(--primary); }
.ag-today { display: flex; flex-direction: column; gap: 8px; }
.ag-ev { display: flex; gap: 12px; align-items: stretch; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.ag-bar { width: 7px; border-radius: 4px; background: var(--c); flex: none; }
.ag-row .ag-bar { align-self: stretch; width: 6px; }
.ag-main { display: flex; flex-direction: column; min-width: 0; }
.ag-meta { font-size: .9rem; font-weight: 700; color: var(--ink-2); }
.ag-ev .ag-title { font-size: clamp(1.05rem, min(1.6vw, 2.4vh), 1.4rem); font-weight: 700; overflow-wrap: anywhere; }
.ag-sep { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.ag-sep h3 { font: 800 .85rem var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); flex: none; }
.ag-line { height: 2px; flex: 1; background: var(--line); border-radius: 2px; }
.ag-later { display: flex; flex-direction: column; gap: 2px; }
.ag-row { display: flex; align-items: center; gap: 12px; padding: 6px 2px; }
.ag-row .ag-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-date { width: 2.8em; display: flex; flex-direction: column; align-items: center; font-size: .72rem; font-weight: 800; text-transform: uppercase; color: var(--ink-2); flex: none; line-height: 1.1; }
.ag-date b { font: 800 1.25rem var(--font-head); color: var(--ink); }

/* wall: chores you can tap */
.wall-chores { container-type: inline-size; }
.wch { display: flex; flex-direction: column; gap: 10px; }
.wch-hint { font-weight: 700; color: var(--primary); margin-top: -4px; }
.wch-kid { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; border: 0; border-radius: 20px; background: var(--t); text-align: left; min-height: 96px; }
.wch-kid:hover { filter: brightness(.98); }
.wch-kid:active { transform: scale(.99); }
.wch-kid > .ic { width: 28px; height: 28px; color: var(--ink-2); flex: none; }
.wch-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.wch-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wch-name { font: 800 clamp(1.25rem, min(2vw, 3vh), 1.8rem) var(--font-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wch-kid .cg-bar { margin: 0; height: 10px; background: #fff; }
.wch-kid .cg-bar > i { background: color-mix(in srgb, var(--c) 75%, #26302B 25%); }
.wch-count { font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.wch-count.all { color: var(--primary); }
.wch-star { font-size: 1rem; flex: none; }
.wch-small { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
.wch-row { display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 10px 6px; border-radius: 10px; font-weight: 700; text-align: left; min-height: 44px; }
.wch-row:hover { background: var(--surface-2); }
@container (max-width: 330px) {
  .wch-kid { flex-wrap: wrap; gap: 10px; padding: 12px; }
  .wch-kid .avatar { --s: 48px !important; }
  .wch-kid > .ic { display: none; }
  .wch-mid { flex-basis: 100%; order: 2; }
  .wch-row { flex-direction: column; gap: 0; }
}

/* wall: the kid screen */
.wall-kid { position: absolute; inset: 0; z-index: 5; background: var(--t); display: flex; flex-direction: column; gap: clamp(10px, 2vh, 20px); padding: clamp(16px, 3vh, 32px) clamp(16px, 3vw, 40px); overflow: auto; }
.kid-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.kid-titles { flex: 1; min-width: 220px; }
.kid-titles h1 { font-size: clamp(1.6rem, min(3.6vw, 5vh), 2.8rem); }
.kid-titles p { font-size: 1.15rem; font-weight: 600; color: var(--ink-2); }
.kid-stars { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 999px; background: #FBF1C9; color: #6B4E00; font: 800 1.8rem var(--font-head); }
.kid-stars .ic { width: 28px; height: 28px; fill: #E9C84E; stroke: #6B4E00; stroke-width: 1.4; }
.kid-back { background: #fff; color: var(--ink); }
.kid-progress { display: flex; flex-direction: column; gap: 6px; }
.kid-progress .cg-bar { height: 16px; margin: 0; background: #fff; }
.kid-progress .cg-bar > i { background: color-mix(in srgb, var(--c) 75%, #26302B 25%); }
.kid-count { font-size: 1.2rem; font-weight: 800; color: var(--ink); }
.kid-cols { flex: 1; min-height: 0; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-content: start; }
.kid-cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kid-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.kid-card { background: #fff; border-radius: 24px; padding: clamp(14px, 2vh, 22px); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kid-card h2 { font-size: 1.5rem; }
.kid-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.kid-bonus { font-weight: 800; color: #6B4E00; }
.kid-row { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 6px 12px; border-radius: 18px; background: var(--surface-2); }
.kid-text { flex: 1; min-width: 0; font-size: clamp(1.15rem, 1.6vw, 1.5rem); font-weight: 700; overflow-wrap: anywhere; }
.kid-row.done .kid-text { color: var(--ink-2); text-decoration: line-through; }
.kid-check { width: 56px; height: 56px; border-radius: 50%; border: 4px solid #D5D2C8; background: #fff; display: grid; place-items: center; flex: none; color: transparent; padding: 0; transition: background .15s, border-color .15s, transform .1s; }
.kid-check.big { width: 64px; height: 64px; }
.kid-check .ic { width: 34px; height: 34px; stroke-width: 3; }
.kid-check:active { transform: scale(.9); }
.kid-check[aria-pressed=true] { background: var(--c); border-color: color-mix(in srgb, var(--c) 70%, #26302B 30%); color: var(--ink); }
.kid-row .star-chip { font-size: 1rem; }
.kid-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.kid-foot p { font-weight: 600; color: var(--ink-2); }
.kid-done { min-height: 60px; font-size: 1.2rem; padding: 0 30px; }
.cheer { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.cheer h1 { font-size: clamp(2.4rem, min(7vw, 9vh), 4.6rem); }
.cheer-sub { font-size: 1.5rem; font-weight: 700; color: var(--ink-2); }
.cheer-star { width: clamp(120px, 20vh, 180px); height: clamp(120px, 20vh, 180px); border-radius: 50%; background: #FBF1C9; display: grid; place-items: center; animation: pop .5s ease-out; }
.cheer-star .ic { width: 64%; height: 64%; fill: #E9C84E; stroke: #6B4E00; stroke-width: 1; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
.cheer-tiles { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.cheer-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 26px; border-radius: 22px; background: #fff; min-width: 200px; font-weight: 700; color: var(--ink-2); }
.cheer-tile b { font: 800 1.7rem var(--font-head); color: var(--ink); }
.cheer-note { font-weight: 600; color: var(--ink-2); }
.cheer-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.cheer-confetti i { position: absolute; top: -20px; left: calc(var(--i) * 7% + 2%); width: 12px; height: 12px; border-radius: 3px; background: var(--c, #F1DC8B); animation: fall 2.6s ease-in forwards; animation-delay: calc(var(--i) * 60ms); }
.cheer-confetti i:nth-child(3n) { background: #A8CDEA; } .cheer-confetti i:nth-child(3n+1) { background: #F4A59A; } .cheer-confetti i:nth-child(4n) { background: #B4D9AA; border-radius: 50%; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
.reduce-motion .cheer-confetti { display: none; }
@media (max-width: 700px) { .kid-cols.two { grid-template-columns: minmax(0, 1fr); } }

/* wall: Arrange (your own layout) */
.wall-free { position: relative; flex: 1; min-width: 0; min-height: 0; display: grid; gap: clamp(8px, 1.4vh, 18px);
  grid-template-columns: repeat(var(--gc, 12), minmax(0, 1fr)); grid-template-rows: repeat(var(--gr, 8), minmax(0, 1fr)); }
.wall-free .wall-agenda { max-width: none; }
.arr-cells { grid-column: 1 / -1; grid-row: 1 / -1; display: grid; gap: inherit; grid-template-columns: inherit; grid-template-rows: inherit; pointer-events: none; }
.arr-cells i { border-radius: 10px; background: rgba(63,115,96,.06); outline: 1px dashed rgba(63,115,96,.28); outline-offset: -1px; }
.arr-item { position: relative; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; outline: 3px dashed rgba(63,115,96,.55); outline-offset: -3px; }
.arr-item:focus-visible { outline: 3px solid var(--focus); }
.arr-item.dragging { cursor: grabbing; z-index: 4; opacity: .9; box-shadow: 0 18px 40px rgba(38,48,43,.25); }
.arr-item.resizing { z-index: 4; }
.arr-ghost { border-radius: var(--radius); border: 3px dashed var(--primary); background: rgba(63,115,96,.12); pointer-events: none; z-index: 3; }
.arr-ghost.bad { border-color: var(--danger); background: rgba(179,64,47,.1); }
.arr-bar { left: 12px; align-items: center; }
.arr-hint { margin-right: auto; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,.92); font-weight: 700; color: var(--ink-2); }
.wall.arranging .wall-bar { opacity: 1; pointer-events: auto; }
.wall.arranging .wall-top { visibility: hidden; height: clamp(56px, 8vh, 72px); padding-top: 0; padding-bottom: 0; }
.wall-top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.wall-room { background: #FFF3D6; color: #6B4E00; }
.arr-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 760px) { .arr-hint { display: none; } }
/* in narrow wall cards, wrap whole words instead of single letters */
.wall-panel .cd-title, .wall-panel .ag-title, .wall-panel .ev-title, .wall-panel .mt-name { overflow-wrap: break-word; word-break: normal; }
.wall-panel .cd-row { flex-wrap: wrap; row-gap: 2px; }
.wall-panel .cd-row .cd-title { flex: 1 1 8em; min-width: 0; }

/* Arrange v2: edges you can grab, live reflow */
.arr-ghost { transition: none; }
.arr-edge { position: absolute; background: rgba(63,115,96,.35); border-radius: 4px; pointer-events: none; z-index: 2; transition: background .15s, transform .15s; }
.arr-edge-l, .arr-edge-r { top: 50%; width: 6px; height: 44px; margin-top: -22px; }
.arr-edge-l { left: 4px; } .arr-edge-r { right: 4px; }
.arr-edge-t, .arr-edge-b { left: 50%; height: 6px; width: 44px; margin-left: -22px; }
.arr-edge-t { top: 4px; } .arr-edge-b { bottom: 4px; }
.arr-item.edge-l .arr-edge-l, .arr-item.edge-r .arr-edge-r, .arr-item.edge-t .arr-edge-t, .arr-item.edge-b .arr-edge-b { background: var(--primary); transform: scale(1.6); }
.arr-item.edge-l { box-shadow: inset 5px 0 0 var(--primary); } .arr-item.edge-r { box-shadow: inset -5px 0 0 var(--primary); }
.arr-item.edge-t { box-shadow: inset 0 5px 0 var(--primary); } .arr-item.edge-b { box-shadow: inset 0 -5px 0 var(--primary); }
.arr-item.resizing { outline: 3px solid var(--primary); }
.arr-item.limit { outline: 3px solid var(--danger) !important; }
.arr-size { position: absolute; right: 12px; bottom: 14px; z-index: 3; padding: 5px 12px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: .9rem; pointer-events: none; }
.arr-size:empty { display: none; }
.arr-item.dragging { outline: 3px solid var(--primary); transform-origin: center; }

/* Arrange v3: the card takes the spot */
.arr-item.covered { outline: 3px solid #B07A00 !important; background: #FFF3D6 !important; }
.arr-item.covered::after { content: 'Will move'; position: absolute; left: 14px; top: 46px; z-index: 3; padding: 4px 12px; border-radius: 999px; background: #8A5F00; color: #fff; font-weight: 800; font-size: .85rem; }
.arr-dest { z-index: 2; border-radius: var(--radius); border: 3px dashed #B07A00; background: rgba(176,122,0,.08); display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-weight: 800; color: #6B4E00; pointer-events: none; }
.arr-dest[hidden] { display: none; }
.arr-chip { position: absolute; right: 12px; top: 12px; z-index: 3; padding: 4px 12px; border-radius: 999px; background: var(--primary-soft); color: #2E5748; font-weight: 800; font-size: .85rem; pointer-events: none; animation: chip 2.6s ease forwards; }
.arr-chip.warn { background: #FFF3D6; color: #6B4E00; }
@keyframes chip { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
.arr-bar .btn:disabled { opacity: .45; }

/* web.css — web version only: start page, join page, people with access. */
.land { max-width: 640px; margin: 0 auto; padding: 40px 16px 60px; display: flex; flex-direction: column; gap: 18px; }
.land-head { display: flex; flex-direction: column; gap: 10px; }
.land-logo { display: inline-flex; align-items: center; gap: 16px; color: var(--primary); font: 800 clamp(2.6rem, 10vw, 3.4rem) var(--font-head); letter-spacing: -0.01em; margin-bottom: 6px; }
.land-logo-mark { flex: none; width: 1.55em; height: 1.55em; border-radius: 0.42em; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.land-logo-mark svg { width: 58%; height: 58%; }
.land h1 { font-size: clamp(1.5rem, 4.6vw, 2rem); line-height: 1.2; }
.land-lead { color: var(--ink-2); font-size: 1.1rem; max-width: 46ch; }
.land-card { display: flex; flex-direction: column; gap: 14px; }
.land-note { background: #FFF3D6; color: #6B4E00; padding: 12px 16px; border-radius: var(--radius-sm); font-weight: 600; }
.land-recent { display: flex; align-items: center; gap: 8px; }
.land-open { flex: 1; justify-content: flex-start; text-decoration: none; min-width: 0; }
.land-open span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.land-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.land-step { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 14px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.btn.soft { text-decoration: none; }
.access-card { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.access-card .page-head { margin-bottom: 0; flex-wrap: wrap; }
.access-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--surface-2); border-radius: var(--radius-sm); min-height: 60px; }
.access-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.access-name strong { overflow-wrap: anywhere; }
.access-danger { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.link-input { font-family: ui-monospace, Menlo, monospace; font-size: .85rem !important; }

/* Start page background: soft pastel glow plus faded household doodles (original line drawings). */
body.land-body {
  background-color: var(--bg, #F4F3EE);
  background-image:
    radial-gradient(600px 420px at 8% 6%, rgba(244,224,220,.85), transparent 70%),
    radial-gradient(560px 460px at 96% 30%, rgba(233,227,246,.9), transparent 70%),

/* ---------- TOUCH POINT B: home / trip choice (only shown when Triply is on) ---------- */
.land-ask { margin: 8px 0 0; font-size: 1.25rem; }
.land-picks { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: stretch; }
@media (min-width: 760px) { .land-picks { grid-template-columns: 1fr 1fr; } }
.land-pick { --pick: var(--primary); --pick-soft: var(--primary-soft, #E4EFE9); display: flex; flex-direction: column; gap: 12px; border-top: 6px solid var(--pick); }
.land-pick-trip { --pick: #B8583A; --pick-soft: #F8E7E0; }
.land-pick-head { display: flex; align-items: center; gap: 12px; }
.land-pick-ic { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--pick-soft); color: var(--pick); display: inline-flex; align-items: center; justify-content: center; }
.land-pick-ic svg { width: 26px; height: 26px; }
.land-kicker { display: block; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pick); }
.land-pick h2 { margin: 2px 0 0; }
.land-pick-sub { margin: 0; color: var(--ink-2); min-height: 2.9em; }
.land-pick input { height: 48px; text-overflow: ellipsis; }
.land-pick .btn.primary { margin-top: auto; background: var(--pick); border-color: var(--pick); }
.land-pick .btn.primary:hover { filter: brightness(.95); }
.land-pick-link { color: var(--pick); font-weight: 700; white-space: nowrap; }
.land-dates { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.land-dates input { min-width: 0; height: 48px; }
.land.land-wide { max-width: 920px; }
.land-banner { flex-direction: row; display: flex; align-items: center; gap: 18px; padding: 22px 26px; }
.land-banner .land-logo-mark { font-size: clamp(2.4rem, 9vw, 3.1rem); }
.land-banner-name { color: var(--primary); font: 800 clamp(2.3rem, 8.5vw, 3rem)/1 var(--font-head); letter-spacing: -0.01em; }
.land-banner-tag { margin: 6px 0 0; color: var(--ink-2); font-weight: 600; font-size: clamp(1.02rem, 3.6vw, 1.25rem); }
.land-lists { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
@media (min-width: 760px) { .land-lists { grid-template-columns: 1fr 1fr; } }
.land-open-trip { background: #F8E7E0; color: #8E3F27; }
.land-chip-ic { display: inline-flex; } .land-chip-ic svg { width: 20px; height: 20px; }
.land-pick .hint { margin: 0; }
.land-pick .segmented { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 48px; box-sizing: border-box; }
@media (max-width: 559px) { .land-wide .land-steps { grid-template-columns: 1fr; } }

/* Owner view: banner when the site owner opens someone's home (read-only). */
.status-banner.owner-viewing { background: #26302B; color: #fff; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-weight: 700; }
.owner-viewing .owner-back { margin-left: auto; background: #fff; color: #26302B; padding: 6px 14px; border-radius: 999px; text-decoration: none; }

/* ---------- guide.js: first-visit guide (web version only) ---------- */
.g-layer { position: fixed; inset: 0; z-index: 120; font-family: var(--font); }
.g-shade { position: fixed; inset: 0; }
.g-spot { position: fixed; border-radius: 26px; pointer-events: none; z-index: 1;
  box-shadow: 0 0 0 9999px rgba(30, 38, 34, .62), 0 0 0 4px #fff, 0 0 0 12px rgba(255, 210, 90, .85), 0 0 46px 18px rgba(255, 210, 90, .55);
  transition: left .38s cubic-bezier(.3, 1.2, .5, 1), top .38s cubic-bezier(.3, 1.2, .5, 1), width .38s cubic-bezier(.3, 1.2, .5, 1), height .38s cubic-bezier(.3, 1.2, .5, 1), opacity .2s;
  animation: g-breathe 1.8s ease-in-out infinite; }
.g-spot.g-gone { box-shadow: 0 0 0 9999px rgba(30, 38, 34, .5); width: 0 !important; height: 0 !important; left: 50% !important; top: 50% !important; animation: none; }
.g-layer:has(.g-center) .g-shade { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
@keyframes g-breathe {
  0%, 100% { box-shadow: 0 0 0 9999px rgba(30, 38, 34, .62), 0 0 0 4px #fff, 0 0 0 12px rgba(255, 210, 90, .85), 0 0 46px 18px rgba(255, 210, 90, .55); }
  50% { box-shadow: 0 0 0 9999px rgba(30, 38, 34, .62), 0 0 0 4px #fff, 0 0 0 15px rgba(255, 210, 90, .95), 0 0 64px 26px rgba(255, 210, 90, .7); }
}

.g-box { position: fixed; z-index: 2; width: min(410px, calc(100vw - 24px)); background: #fff; color: var(--ink); border-radius: 26px;
  border: 3px solid #FFD666; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .35); outline: none; }
.g-box.trip { border-color: #F2B49C; }
.g-box.g-center { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); padding: 26px 28px 20px; border-color: #fff; }
.g-pop { animation: g-pop .42s cubic-bezier(.3, 1.5, .5, 1); }
.g-center.g-pop { animation: g-pop-c .42s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes g-pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
@keyframes g-pop-c { from { opacity: 0; transform: translate(-50%, -50%) scale(.86); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.g-leave { animation: g-out .22s ease forwards; }
@keyframes g-out { to { opacity: 0; } }

/* the little arrow that points at the highlighted part */
.g-box::before { content: ""; position: absolute; width: 22px; height: 22px; background: #fff; border: 3px solid #FFD666; border-radius: 4px; display: none; }
.g-box.trip::before { border-color: #F2B49C; }
.g-arrow-l::before { display: block; left: -14px; top: 34px; transform: rotate(45deg); border-top-color: transparent; border-right-color: transparent; }
.g-arrow-r::before { display: block; right: -14px; top: 34px; transform: rotate(45deg); border-bottom-color: transparent; border-left-color: transparent; }
.g-arrow-t::before { display: block; top: -14px; left: var(--ax, 36px); transform: rotate(45deg); border-bottom-color: transparent; border-right-color: transparent; }
.g-arrow-b::before { display: block; bottom: -14px; left: var(--ax, 36px); transform: rotate(45deg); border-top-color: transparent; border-left-color: transparent; }

.g-top { display: flex; }
.g-badge { font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: #FFF3C4; color: #7A5A00; }
.g-badge.trip { background: #FBE3D9; color: #8E3F27; }
.g-head { display: flex; align-items: center; gap: 12px; }
.g-head h2 { margin: 0; font: 800 1.5rem/1.15 var(--font-head); }
.g-center .g-head { flex-direction: column; align-items: flex-start; }
.g-center .g-head h2 { font-size: 1.9rem; }
.g-sub { margin: 4px 0 0; color: var(--ink-2); font-weight: 700; }
.g-icon { flex: none; width: 48px; height: 48px; border-radius: 15px; display: inline-flex; align-items: center; justify-content: center; }
.g-center .g-icon { width: 68px; height: 68px; border-radius: 21px; }
.g-icon svg, .g-icon .g-svg svg { width: 26px; height: 26px; }
.g-center .g-icon svg, .g-center .g-icon .g-svg svg { width: 36px; height: 36px; }
.g-svg { display: inline-flex; }
.g-home { background: var(--primary-soft); color: var(--primary); }
.g-trip { background: #F8E7E0; color: #B8583A; }
.g-sun { background: #FBF4D9; color: #8A6A12; }
.g-box p { margin: 0; font-size: 1.04rem; line-height: 1.5; color: #3A4540; }
.g-box .g-small { font-size: .92rem; color: var(--ink-2); }
.g-rule { padding: 8px 12px; border-radius: 12px; background: #F7F6F2; }
.g-green { color: var(--primary); } .g-terra { color: #B8583A; }
.g-chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.g-chip { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; padding: 7px 10px; border-radius: 12px; background: #F7F6F2; }
.g-chip svg { width: 18px; height: 18px; flex: none; }
.g-chips.trip .g-chip { background: #FBF1EC; color: #8E3F27; }
.g-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.g-fill { flex: 1; }
.g-dots { display: flex; gap: 6px; }
.g-dots i { width: 8px; height: 8px; border-radius: 99px; background: #D9D6CE; transition: width .25s; }
.g-dots i.done { background: #9DBDAE; }
.g-dots i.on { background: var(--primary); width: 22px; }
.g-skip, .g-back { background: none; border: 0; font: 700 1rem var(--font); color: var(--ink-2); min-height: 44px; padding: 0 10px; border-radius: 999px; cursor: pointer; }
.g-back { width: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.g-back svg { width: 20px; height: 20px; }
.g-next { background: var(--primary); color: #fff; border: 0; border-radius: 999px; font: 700 1.05rem var(--font); min-height: 48px; padding: 0 22px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.g-next.trip { background: #B8583A; }
.g-next svg { width: 18px; height: 18px; }
.g-skip:focus-visible, .g-back:focus-visible, .g-next:focus-visible { outline: 3px solid #FFD666; outline-offset: 2px; }
.g-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* phones: the bubble becomes a bottom sheet, the spotlight stays on the page */
.g-box.g-sheet { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; border-radius: 26px 26px 0 0; border-width: 3px 0 0;
  padding-bottom: max(16px, env(safe-area-inset-bottom)); }
@media (max-width: 639px) { .g-box.g-center { top: auto; bottom: 0; left: 0; transform: none; width: 100%; border-radius: 26px 26px 0 0; } .g-center.g-pop { animation: g-pop .42s cubic-bezier(.3, 1.5, .5, 1); } }

/* after the guide: "Your name" glows until the person starts */
.g-glow input { box-shadow: 0 0 0 4px rgba(255, 200, 60, .95), 0 0 26px 8px rgba(255, 200, 60, .5); animation: g-blink 1.3s ease-in-out infinite; }
@keyframes g-blink { 50% { box-shadow: 0 0 0 4px rgba(255, 200, 60, .35), 0 0 8px 2px rgba(255, 200, 60, .2); } }
.g-here-wrap { position: relative; }
.g-here { position: absolute; right: 0; top: -6px; background: var(--ink); color: #fff; font-weight: 700; font-size: .85rem; padding: 5px 12px; border-radius: 999px;
  animation: g-bob 1.3s ease-in-out infinite; }
@keyframes g-bob { 50% { transform: translateY(-4px); } }

.g-still .g-spot, .g-still .g-pop, .g-still.g-leave { animation: none; transition: none; }
@media (prefers-reduced-motion: reduce) { .g-glow input, .g-here { animation: none; } }

/* read-along: one piece of text lights up at a time; the rest waits, faded */
.g-seg { border-radius: 8px; transition: opacity .3s, background-color .3s, box-shadow .3s; }
.g-seg.g-later { opacity: .35; }
.g-seg.g-now { opacity: 1; background-color: #FFEFAE; box-shadow: 0 0 0 5px #FFEFAE; }
.g-chip.g-seg.g-now { box-shadow: 0 0 0 3px #FFD666; }
/* when reading is done: Next blinks to show where to click */
.g-next.g-ready { animation: g-ready 1.1s ease-in-out infinite; }
@keyframes g-ready {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 200, 60, .9); transform: scale(1); }
  50% { box-shadow: 0 0 0 9px rgba(255, 200, 60, .35); transform: scale(1.06); }
}
@media (prefers-reduced-motion: reduce) { .g-next.g-ready { animation: none; box-shadow: 0 0 0 4px rgba(255, 200, 60, .9); } }
.g-here.trip { background: #8E3F27; }

<body>
<div id="porchlight-root"></div>
<script>
/*
 * shim.js — web version only. Loads first.
 * Gives the app the same "window.claude" helpers it uses inside Claude (db, user, sample, assets,
 * downloads), but backed by the Kalendaryo server. The rest of the app does not need to change.
 *   /c/<token>      a person's own link into their family
 *   /join/<code>    an invite link
 *   /               the start page
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const path = location.pathname;
  const mc = path.match(/^\/c\/([A-Za-z0-9_-]{10,100})\/?$/);
  const mj = path.match(/^\/join\/([A-Za-z0-9_-]{10,100})\/?$/);
  const listeners = {};
  const KAL = (window.KAL = {
    token: mc ? mc[1] : null, joinCode: mj ? mj[1] : null, me: null, family: null, ai: { enabled: false, left: 0 }, people: [], invalid: null,
    on(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); },
    emit(ev, x) { (listeners[ev] || []).forEach((fn) => { try { fn(x); } catch (e) { console.error(e); } }); }
  });

  // Each family keeps its own saved copy on this device.
  const short = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); };
  if (KAL.token) window.PL_STORAGE_PREFIX = 'pl.' + short(KAL.token) + '.';

  /* families opened on this device, for the start page */
  KAL.recent = {
    all() { try { return JSON.parse(localStorage.getItem('kal.families') || '[]'); } catch (e) { return []; } },
    save(list) { try { localStorage.setItem('kal.families', JSON.stringify(list.slice(0, 12))); } catch (e) { /* private mode */ } },
    remember(t, name, who) { const l = this.all().filter((x) => x.t !== t); l.unshift({ t, name, who }); this.save(l); },
    forget(t) { this.save(this.all().filter((x) => x.t !== t)); }
  };

  /* ---------- talking to the server ---------- */
  async function api(method, url, body, raw) {
    const headers = {};
    if (KAL.token) headers.Authorization = 'Bearer ' + KAL.token;
    let payload;
    if (raw) { payload = raw; headers['Content-Type'] = raw.type || 'application/octet-stream'; }
    else if (body !== undefined) { payload = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
    let r;
    try { r = await fetch(url, { method, headers, body: payload, cache: 'no-store' }); }
    catch (e) { throw { code: 'offline', userMessage: 'Could not reach Kalendaryo. Check your internet and try again.' }; }
    let j = {};
    try { j = await r.json(); } catch (e) { /* empty */ }
    if (!r.ok) {
      const err = { code: j.error || 'error', status: r.status, userMessage: j.message || 'Something went wrong. Please try again.' };
      if (r.status === 401 && KAL.token) KAL.emit('removed');
      throw err;
    }
    return j;
  }
  KAL.api = api;

  /* ---------- live family data, shaped like the database the app expects ---------- */
  const cache = {}; const colSubs = {}; const docSubs = {};
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const snapCol = (c) => ({ metadata: { hasPendingWrites: false }, docs: [...(cache[c] || new Map())].map(([id, data]) => ({ id, data: () => clone(data) })) });
  const snapDoc = (c, id) => { const v = cache[c] && cache[c].get(id); return { exists: !!v, id, metadata: { hasPendingWrites: false }, data: () => clone(v || {}) }; };
  let queued = new Set(), flushing = false;
  function notify(c, id) {
    queued.add(c + '\u0000' + id);
    if (flushing) return;
    flushing = true;
    setTimeout(() => {
      const items = [...queued]; queued = new Set(); flushing = false;
      const cols = new Set();
      items.forEach((k) => { const [cc, ii] = k.split('\u0000'); cols.add(cc); (docSubs[cc + '/' + ii] || []).forEach((cb) => cb(snapDoc(cc, ii))); });
      cols.forEach((cc) => (colSubs[cc] || []).forEach((cb) => cb(snapCol(cc))));
    }, 0);
  }
  function apply(c, id, data) {
    cache[c] = cache[c] || new Map();
    if (data === null) cache[c].delete(id); else cache[c].set(id, data);
    notify(c, id);
  }
  function replaceAll(docs) {
    const cols = new Set([...Object.keys(cache), ...Object.keys(docs)]);
    cols.forEach((c) => { cache[c] = new Map((docs[c] || []).map((d) => [d.id, d.data])); });
    Object.keys(colSubs).forEach((c) => (colSubs[c] || []).forEach((cb) => cb(snapCol(c))));
    Object.keys(docSubs).forEach((p) => { const [c, id] = p.split('/'); docSubs[p].forEach((cb) => cb(snapDoc(c, id))); });
  }
  let loaded = null;
  function load() {
    if (!loaded) loaded = api('GET', '/api/state').then((r) => { replaceAll(r.docs || {}); connect(); });
    return loaded;
  }
  let es = null, opened = false;
  function connect() {
    if (es || !window.EventSource) return;
    es = new EventSource('/api/stream?t=' + encodeURIComponent(KAL.token));
    es.addEventListener('hello', () => {
      if (opened) api('GET', '/api/state').then((r) => replaceAll(r.docs || {})).catch(() => {}); // catch up after a reconnect
      opened = true;
    });
    es.addEventListener('doc', (e) => { try { const m = JSON.parse(e.data); apply(m.col, m.id, m.data); } catch (x) { /* ignore */ } });
    es.addEventListener('people', () => KAL.emit('people'));
    es.addEventListener('me', () => refreshMe());
    es.addEventListener('removed', () => KAL.emit('removed'));
  }
  const db = {
    collection: (c) => ({
      add: async (o) => { const r = await api('POST', '/api/docs/' + c, { data: o }); apply(c, r.id, clone(o)); return { id: r.id }; },
      onSnapshot: (cb, err) => { (colSubs[c] = colSubs[c] || []).push(cb); load().then(() => cb(snapCol(c)), (e) => err && err(e)); return () => { colSubs[c] = colSubs[c].filter((x) => x !== cb); }; }
    }),
    doc: (p) => {
      const i = p.indexOf('/'); const c = p.slice(0, i), id = p.slice(i + 1);
      return {
        set: async (o) => { await api('PUT', '/api/docs/' + c + '/' + encodeURIComponent(id), { data: o }); apply(c, id, clone(o)); },
        delete: async () => { await api('DELETE', '/api/docs/' + c + '/' + encodeURIComponent(id)); apply(c, id, null); },
        onSnapshot: (cb, err) => { (docSubs[p] = docSubs[p] || []).push(cb); load().then(() => cb(snapDoc(c, id)), (e) => err && err(e)); return () => { docSubs[p] = docSubs[p].filter((x) => x !== cb); }; }
      };
    }
  };

  /* ---------- the other helpers ---------- */
  function parseJson(text) {
    const t = String(text || '').trim();
    try { return JSON.parse(t); } catch (e) { /* look for the JSON inside */ }
    const m = t.match(/[[{][\s\S]*[\]}]/);
    if (m) { try { return JSON.parse(m[0]); } catch (e) { /* fall through */ } }
    throw { code: 'bad_json', userMessage: 'The ideas came back in a strange shape. Please try again.' };
  }
  async function askAi(input) {
    const prompt = Array.isArray(input) ? input.map((m) => m.content).join('\n\n') : String(input);
    try {
      const r = await api('POST', '/api/ai', { prompt });
      KAL.ai.left = r.left;
      return r.text;
    } catch (e) {
      if (e.code === 'daily_limit' || e.code === 'rate_limited') e.code = 'rate_limited';
      throw e;
    }
  }
  const sample = async (input) => ({ text: await askAi(input), truncated: false });
  sample.json = async (input) => parseJson(await askAi(input));
  sample.limits = async () => ({ images: false });

  const assets = {
    upload: async (blob) => api('POST', '/api/blobs', undefined, blob),
    delete: async (id) => api('DELETE', '/api/blobs/' + encodeURIComponent(id)),
    list: async () => ({ assets: [], usage: {} })
  };
  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([typeof data === 'string' ? data : JSON.stringify(data)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename || 'kalendaryo.json';
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return { saved: true };
    }
  };

  async function refreshMe() {
    const r = await api('GET', '/api/me');
    KAL.me = r.me; KAL.family = r.family; KAL.ai = r.ai || { enabled: false, left: 0 };
    if (!r.me.viewing) KAL.recent.remember(KAL.token, r.family.name, r.me.name); // the owner viewing leaves no trace on this device's list
    KAL.emit('me', r.me);
    return r;
  }
  KAL.refreshMe = refreshMe;
  KAL.ready = KAL.token ? refreshMe().catch((e) => { KAL.invalid = e; if (e.status === 401) KAL.recent.forget(KAL.token); }) : Promise.resolve();

  window.claude = {
    use: async (name) => {
      await KAL.ready;
      if (!KAL.me) return null;
      const canEdit = KAL.me.role !== 'viewer';
      if (name === 'db') return db;
      if (name === 'user') return { id: async () => KAL.me.id, isOwner: () => KAL.me.role === 'owner', canEdit: () => canEdit };
      if (name === 'sample') return KAL.ai.enabled && canEdit ? sample : null;
      if (name === 'assets') return canEdit ? assets : null;
      if (name === 'downloads') return downloads;
      return null;
    }
  };

  PL.blobUrl = (id) => '/api/blobs/' + encodeURIComponent(id) + '?t=' + encodeURIComponent(KAL.token || '');
  PL.beforeBoot = () => {
    if (KAL.token) return true;
    PL.landing.mount();
    return false;
  };
})();

  const PL = (window.PL = window.PL || {});

  /* ---------- DOM builder ---------- */
  // h('div', {class:'x', onclick:fn}, child, [children]) -> element
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    for (const c of kids.flat(3)) {
      if (c == null || c === false) continue;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));

  D.key = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  D.today = () => D.key(new Date());

    return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: hour12 !== false });
  };

  D.weekdayLong = (i) => new Date(2023, 0, 1 + i).toLocaleDateString(undefined, { weekday: 'long' });
  D.ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  D.nowTime = () => { const n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); };
  // A moment in time from a date key and "HH:MM".
  D.at = (k, t) => { const d = D.parse(k); const [h, m] = (t || '00:00').split(':').map(Number); d.setHours(h, m, 0, 0); return d; };

  const SP = window.PL_STORAGE_PREFIX || 'pl.';
  PL.storage = {
    get(key, fallback) {
      try { const v = localStorage.getItem(SP + key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(SP + key, JSON.stringify(value)); return true; } catch (e) { return false; }
    }
  };
})();
