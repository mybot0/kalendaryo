<script>
/*
 * event-ui.js — everything about one event on screen:
 *   PL.eventUi.card(instance)        the tappable event card used in every view
 *   PL.eventUi.openDetail(instance)  view / edit / duplicate / move / delete
 *   PL.eventUi.openForm({...})       add or edit form (with repeat options)
 *   PL.eventUi.deleteInstance(inst)  asks what to delete for repeating events
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;

  /* ---------- card ---------- */
  function card(inst, opts) {
    const o = opts || {};
    const people = PL.cal.people(inst);
    const repeating = inst.ev && inst.ev.repeat;
    const time = o.compact && !inst.allDay ? D.fmtTime(inst.start, PL.state.settings.hour12) : PL.cal.rangeLabel(inst);
    const names = people.length ? ', ' + people.map((p) => p.name).join(' and ') : '';
    return h('button', {
      type: 'button', class: 'ev-card' + (o.compact ? ' compact' : '') + (inst.kind === 'birthday' ? ' birthday' : ''),
      style: '--c:' + PL.cal.color(inst), onclick: () => openDetail(inst),
      'aria-label': inst.title + ', ' + PL.cal.rangeLabel(inst) + names
    },
      h('span', { class: 'ev-time' }, time),
      h('span', { class: 'ev-main' },
        h('span', { class: 'ev-title' }, inst.kind === 'birthday' ? icon('cake') : null, inst.title),
        !o.compact && inst.location ? h('span', { class: 'ev-loc' }, icon('pin'), inst.location) : null),
      people.length ? h('span', { class: 'ev-people' }, people.slice(0, 4).map((p) => ui.avatar(p, o.compact ? 24 : 30))) : null,
      repeating ? h('span', { class: 'ev-rep', title: 'Repeats' }, icon('repeat')) : null);
  }

  /* ---------- detail ---------- */
  function row(iconName, content) {
    return h('div', { class: 'detail-row' }, h('span', { class: 'detail-ic' }, icon(iconName)), h('div', {}, content));
  }
  function openDetail(inst) {
    const people = PL.cal.people(inst);
    const ev = inst.ev;
    const when = D.fmt(inst.date, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    const body = h('div', { class: 'detail', style: '--c:' + PL.cal.color(inst) },
      h('div', { class: 'detail-band' }),
      row('clock', [h('strong', {}, when), h('div', { class: 'sub' }, PL.cal.rangeLabel(inst))]),
      ev && ev.repeat ? row('repeat', PL.recur.describe(ev)) : null,
      people.length
        ? row('users', h('div', { class: 'detail-people' }, people.map((p) => h('span', { class: 'person-chip' }, ui.avatar(p, 26), p.name))))
        : (inst.kind === 'birthday' ? null : row('users', 'Whole family')),
      inst.location ? row('pin', inst.location) : null,
      inst.notes ? row('note', h('span', { class: 'pre' }, inst.notes)) : null,
      ev && ev.reminder != null ? row('bell', (PL.config.reminderOptions.find((r) => r.value === ev.reminder) || {}).label || '') : null,
      inst.kind === 'birthday' ? row('cake', 'Birthday from the family profile') : null);

    let s;
    if (inst.virtual) {
      s = ui.sheet({ title: inst.title, body, footer: [ui.button('Open profile', { variant: 'primary', big: true, icon: 'users', onClick: () => { s.close(); PL.nav.go('family', { edit: inst.ownerId }); } })] });
      return;
    }
    s = ui.sheet({
      title: inst.title, body,
      footer: [
        ui.button('Edit', { variant: 'primary', icon: 'edit', onClick: () => { s.close(); openForm({ mode: 'edit', inst }); } }),
        ui.button('Duplicate', { icon: 'copy', onClick: () => { s.close(); openForm({ mode: 'create', prefill: ev, date: inst.date }); } }),
        ui.button('Move', { icon: 'move', onClick: () => { s.close(); openForm({ mode: 'move', inst }); } }),
        ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: async () => { if (await deleteInstance(inst)) s.close(); } })
      ]
    });
  }

  // Asks what to delete (for repeating events) and does it. Resolves true when deleted.
  async function deleteInstance(inst) {
    const ev = inst.ev;
    let scope = 'all';
    if (ev.repeat) {
      scope = await ui.choose({
        title: 'Delete repeating event',
        message: '“' + ev.title + '” repeats. What should be deleted?',
        options: [
          { value: 'one', label: 'Only ' + D.fmt(inst.date, { weekday: 'short', month: 'short', day: 'numeric' }), description: 'The rest of the series stays.' },
          ...(inst.date > ev.date ? [{ value: 'future', label: 'This and following events', description: 'Earlier days stay on the calendar.' }] : []),
          { value: 'all', label: 'All events in the series', description: 'Removes every day, past and future.', danger: true }
        ]
      });
      if (!scope) return false;
    } else if (!(await ui.confirm({ title: 'Delete this event?', message: '“' + ev.title + '” will be removed for everyone.', confirmLabel: 'Delete', danger: true }))) {
      return false;
    }
    const ok = await PL.actions.remove(inst, scope);
    if (ok) ui.toast('Event deleted.');
    return ok;
  }

  /* ---------- form ---------- */
  const UNITS = [{ value: 'day', label: 'days' }, { value: 'week', label: 'weeks' }, { value: 'month', label: 'months' }, { value: 'year', label: 'years' }];
  const FREQ_OF = { day: 'daily', week: 'weekly', month: 'monthly', year: 'yearly' };
  const UNIT_OF = { daily: 'day', weekly: 'week', monthly: 'month', yearly: 'year' };

  function kindOf(r, date) {
    if (!r) return 'none';
    if ((r.interval || 1) > 1) return 'custom';
    if (r.freq === 'daily') return 'daily';
    if (r.freq === 'monthly') return 'monthly';
    if (r.freq === 'yearly') return 'yearly';
    const wd = r.weekdays && r.weekdays.length ? r.weekdays : [D.dow(date)];
    if (wd.length === 5 && [1, 2, 3, 4, 5].every((x) => wd.includes(x))) return 'weekdays';
    if (wd.length === 1 && wd[0] === D.dow(date)) return 'weekly';
    return 'custom';
  }
  function repeatLabels(date) {
    return [
      { value: 'none', label: 'Does not repeat' },
      { value: 'daily', label: 'Every day' },
      { value: 'weekdays', label: 'Every weekday (Mon–Fri)' },
      { value: 'weekly', label: 'Every week on ' + D.weekdayLong(D.dow(date)) },
      { value: 'monthly', label: 'Every month on the ' + D.ordinal(D.parse(date).getDate()) },
      { value: 'yearly', label: 'Every year on ' + D.fmt(date, { month: 'long', day: 'numeric' }) },
      { value: 'custom', label: 'Custom…' }
    ];
  }
  function defaultTimes(date) {
    let startMin = 9 * 60;
    if (date === D.today()) {
      const n = new Date();
      startMin = Math.min(22 * 60, (Math.floor((n.getHours() * 60 + n.getMinutes()) / 30) + 1) * 30);
    }
    const t = (m) => D.pad(Math.floor(m / 60)) + ':' + D.pad(m % 60);
    return { start: t(startMin), end: t(Math.min(23 * 60 + 59, startMin + 60)) };
  }

  // opts: { mode: 'create'|'edit'|'move', inst?, date?, prefill? }
  function openForm(opts) {
    const mode = opts.mode;
    const src = opts.inst ? opts.inst.ev : opts.prefill || null;
    const date0 = opts.inst ? opts.inst.date : (opts.date || D.today());
    const times = defaultTimes(date0);
    const members = PL.state.members;
    const full = mode !== 'move';

    /* inputs */
    const title = h('input', { type: 'text', id: 'ef-title', maxlength: '80', placeholder: 'For example: Piano lesson', autocomplete: 'off', autofocus: true });
    title.value = src ? src.title : '';
    const date = h('input', { type: 'date', id: 'ef-date', required: true }); date.value = date0;
    const start = h('input', { type: 'time', id: 'ef-start' }); start.value = src && src.start ? src.start : times.start;
    const end = h('input', { type: 'time', id: 'ef-end' }); end.value = src && src.end ? src.end : (src && src.start ? '' : times.end);
    const allDay = ui.toggle('All day', src ? !!src.allDay : false, () => syncVisibility());
    const location = h('input', { type: 'text', id: 'ef-loc', maxlength: '120', placeholder: 'Add a place', autocomplete: 'off' }); location.value = src ? src.location || '' : '';
    const notes = h('textarea', { id: 'ef-notes', maxlength: '1000', rows: '3', placeholder: 'Anything to remember' }); notes.value = src ? src.notes || '' : '';
    const color = ui.colorPicker(src ? src.color : '', true);
    const reminder = ui.select(PL.config.reminderOptions, src && src.reminder != null ? src.reminder : 'null');
    reminder.querySelectorAll('option').forEach((o) => { if (o.value === 'null') o.value = 'null'; });

    /* people */
    const picked = new Set(src ? (src.memberIds || []).filter((id) => PL.store.member(id)) : []);
    const peopleBox = h('div', { class: 'chip-row', role: 'group', 'aria-label': 'People' }, members.map((m) => {
      const b = h('button', { type: 'button', class: 'person-pick', 'aria-pressed': picked.has(m.id) ? 'true' : 'false',
        onclick: () => { picked.has(m.id) ? picked.delete(m.id) : picked.add(m.id); b.setAttribute('aria-pressed', picked.has(m.id) ? 'true' : 'false'); } },
        ui.avatar(m, 28), m.name);
      return b;
    }));

    /* repeat */
    const r0 = src ? src.repeat : null;
    const kind0 = kindOf(r0, src ? src.date : date0);
    const repSel = ui.select(repeatLabels(date0), kind0, () => syncVisibility());
    repSel.id = 'ef-repeat';
    const cInterval = h('input', { type: 'number', id: 'ef-interval', min: '1', max: '99', class: 'num', 'aria-label': 'Repeat every' });
    cInterval.value = r0 ? r0.interval || 1 : 1;
    const cUnit = ui.select(UNITS, r0 ? UNIT_OF[r0.freq] : 'week', () => syncVisibility());
    cUnit.setAttribute('aria-label', 'Repeat unit');
    const wdPicked = new Set(r0 && r0.weekdays && r0.weekdays.length ? r0.weekdays : [D.dow(date0)]);
    const wdBox = h('div', { class: 'chip-row', role: 'group', 'aria-label': 'Repeat on' }, [0, 1, 2, 3, 4, 5, 6].map((i) => {
      const b = h('button', { type: 'button', class: 'wd-pick', 'aria-pressed': wdPicked.has(i) ? 'true' : 'false', 'aria-label': D.weekdayLong(i),
        onclick: () => { wdPicked.has(i) ? wdPicked.delete(i) : wdPicked.add(i); b.setAttribute('aria-pressed', wdPicked.has(i) ? 'true' : 'false'); } }, D.weekdayShort(i).slice(0, 2));
      return b;
    }));
    const customBox = h('div', { class: 'repeat-custom' },
      h('div', { class: 'inline' }, h('span', {}, 'Every'), cInterval, cUnit),
      wdBox);
    const endType = ui.segmented([{ value: 'never', label: 'Never' }, { value: 'on', label: 'On a date' }, { value: 'after', label: 'After' }],
      r0 && r0.end ? r0.end.type : 'never', () => syncVisibility(), 'Repeat ends');
    const endDate = h('input', { type: 'date', id: 'ef-enddate', 'aria-label': 'Last day' });
    endDate.value = r0 && r0.end && r0.end.type === 'on' ? r0.end.date : '';
    const endCount = h('input', { type: 'number', id: 'ef-endcount', min: '1', max: '999', class: 'num', 'aria-label': 'Number of times' });
    endCount.value = r0 && r0.end && r0.end.type === 'after' ? r0.end.count : 10;
    const endBox = h('div', { class: 'repeat-ends' }, h('span', { class: 'field-label' }, 'Ends'), endType.el,
      h('div', { class: 'inline end-extra', dataset: { for: 'on' } }, endDate),
      h('div', { class: 'inline end-extra', dataset: { for: 'after' } }, endCount, h('span', {}, 'times')));

    date.addEventListener('change', () => {
      if (!date.value) return;
      const keep = repSel.value;
      repSel.replaceChildren(...repeatLabels(date.value).map((o) => h('option', { value: o.value }, o.label)));
      repSel.value = keep;
    });

    const timesRow = h('div', { class: 'row2' }, ui.field('Starts', start), ui.field('Ends', end));
    const repeatBlock = h('div', { class: 'repeat-block' }, ui.field('Repeat', repSel), customBox, endBox);

    function syncVisibility() {
      timesRow.hidden = allDay.get();
      const k = repSel.value;
      customBox.hidden = k !== 'custom';
      wdBox.hidden = !(k === 'custom' && cUnit.value === 'week');
      endBox.hidden = k === 'none';
      endBox.querySelectorAll('.end-extra').forEach((x) => { x.hidden = x.dataset.for !== endType.get(); });
    }

    function readRepeat() {
      const k = repSel.value, dow = D.dow(date.value);
      let r = null;
      if (k === 'daily') r = { freq: 'daily', interval: 1 };
      else if (k === 'weekdays') r = { freq: 'weekly', interval: 1, weekdays: [1, 2, 3, 4, 5] };
      else if (k === 'weekly') r = { freq: 'weekly', interval: 1, weekdays: [dow] };
      else if (k === 'monthly') r = { freq: 'monthly', interval: 1 };
      else if (k === 'yearly') r = { freq: 'yearly', interval: 1 };
      else if (k === 'custom') {
        r = { freq: FREQ_OF[cUnit.value], interval: parseInt(cInterval.value, 10) || 1 };
        if (r.freq === 'weekly') r.weekdays = wdPicked.size ? [...wdPicked] : [dow];
      }
      if (r) {
        const t = endType.get();
        r.end = t === 'on' ? { type: 'on', date: endDate.value } : t === 'after' ? { type: 'after', count: parseInt(endCount.value, 10) || 1 } : { type: 'never' };
      }
      return r;
    }

    async function save() {
      const t = title.value.trim();
      if (full && !t) { ui.toast('Please type a title first.'); title.focus(); return; }
      if (!date.value) { ui.toast('Please pick a day.'); date.focus(); return; }
      if (!allDay.get() && start.value && end.value && end.value <= start.value) { ui.toast('The end time must be after the start time.'); end.focus(); return; }
      const rep = full ? readRepeat() : undefined;
      if (rep && rep.end.type === 'on' && (!rep.end.date || rep.end.date < date.value)) { ui.toast('Pick a last day that is on or after the first day.'); endDate.focus(); return; }

      const data = { date: date.value, allDay: allDay.get(), start: allDay.get() ? '' : start.value, end: allDay.get() ? '' : end.value };
      if (full) {
        Object.assign(data, {
          title: t, location: location.value, notes: notes.value, memberIds: [...picked], color: color.get(), repeat: rep,
          reminder: reminder.value === 'null' ? null : Number(reminder.value)
        });
      }
      saveBtn.disabled = true;
      let ok;
      if (mode === 'create') {
        ok = !!(await PL.actions.create(data));
      } else {
        let scope = 'all';
        if (opts.inst.ev.repeat) {
          scope = await ui.choose({
            title: 'Change a repeating event',
            message: 'This event repeats. Apply the change to:',
            options: [
              { value: 'one', label: 'Only ' + D.fmt(opts.inst.date, { weekday: 'short', month: 'short', day: 'numeric' }), description: 'The other days stay the same.' },
              ...(opts.inst.date > opts.inst.ev.date ? [{ value: 'future', label: 'This and following events', description: 'Earlier days stay the same.' }] : []),
              { value: 'all', label: 'All events in the series' }
            ]
          });
          if (!scope) { saveBtn.disabled = false; return; }
        }
        ok = await PL.actions.saveEdit(opts.inst, data, scope);
      }
      saveBtn.disabled = false;
      if (ok) { s.close(); ui.toast(mode === 'create' ? 'Event added.' : mode === 'move' ? 'Event moved.' : 'Event saved.'); }
    }

    const saveBtn = ui.button(mode === 'create' ? 'Add event' : mode === 'move' ? 'Move event' : 'Save changes', { variant: 'primary', big: true, onClick: save });
    const body = h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
      full ? ui.field('Title', title) : h('p', { class: 'sheet-text' }, '“' + (src ? src.title : '') + '”'),
      full ? h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Who is it for?'),
        members.length ? peopleBox : h('p', { class: 'hint' }, 'Add people in the People section to color-code events.'),
        h('p', { class: 'hint' }, members.length ? 'Leave empty for the whole family.' : '')) : null,
      allDay.el, ui.field('Day', date), timesRow,
      full ? repeatBlock : null,
      full ? ui.field('Reminder', reminder) : null,
      full ? ui.field('Location', location) : null,
      full ? ui.field('Notes', notes) : null,
      full ? h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Color'), color.el, h('p', { class: 'hint' }, 'Auto uses the first person’s color.')) : null);

    const footer = [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() })];
    if (mode === 'edit') footer.unshift(ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: async () => { if (await deleteInstance(opts.inst)) s.close(); } }));
    footer.push(saveBtn);
    const s = ui.sheet({ title: mode === 'create' ? 'New event' : mode === 'move' ? 'Move event' : 'Edit event', body, footer, wide: true });
    syncVisibility();
  }

  PL.eventUi = { card, openDetail, openForm, deleteInstance };
})();

<script>
/*
 * landing.js — web version only. The start page (create a family) and the join page (invite links).
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon, ui = PL.ui;
  const ROLE_TEXT = { viewer: 'a Viewer (can look)', editor: 'an Editor (can add and change things)', owner: 'an Owner (can also invite people)' };

  function field(label, input) { return ui.field(label, input); }
  function errorBox() { return h('p', { class: 'form-error', role: 'alert', hidden: true }); }
  const showErr = (el, msg) => { el.textContent = msg; el.hidden = !msg; };

  function createCard(pick) {
    const you = h('input', { type: 'text', maxlength: '30', placeholder: 'For example: Ryan', autocomplete: 'given-name' });
    const fam = h('input', { type: 'text', maxlength: '40', placeholder: pick ? 'For example: The Rubi family, Barkada' : 'For example: The Rubi family, Us two, Maple St. roommates, Barkada', autocomplete: 'off' });
    const err = errorBox();
    const btn = ui.button('Create your home', { variant: 'primary', big: true, icon: 'plus', type: 'submit', block: true });
    let weekStart = 0;
    const week = pick ? ui.segmented([{ value: 0, label: 'Sunday' }, { value: 1, label: 'Monday' }], 0, (v) => { weekStart = Number(v); }, 'Week starts on') : null;
    async function go(e) {
      e.preventDefault();
      if (!you.value.trim()) { showErr(err, 'Please type your name.'); you.focus(); return; }
      btn.disabled = true; showErr(err, '');
      try {
        const r = await KAL.api('POST', '/api/families', { yourName: you.value.trim(), familyName: fam.value.trim() });
        if (pick && weekStart) {
          // Save the chosen week start in the new home's settings (same document the Settings screen writes).
          await fetch('/api/docs/settings/main', { method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + r.token },
            body: JSON.stringify({ data: { householdName: fam.value.trim() || 'Our home', weekStart } }) }).catch(() => {});
        }
        try { localStorage.setItem('kal.newlink', '1'); } catch (x) { /* fine */ }
        location.href = '/c/' + r.token;
      } catch (x) { showErr(err, x.userMessage); btn.disabled = false; }
    }
    if (pick) return pickForm(go, 'home', h('span', { class: 'land-pick-ic' }, icon('calendar')), 'Kalendaryo', 'Organize a home', 'Calendar, chores, meals, lists and photos for everyone you live with.', you, 'Home name', fam, err, btn, null, [field('Week starts on', week.el)]);
    return h('form', { class: 'card land-card', onsubmit: go },
      h('h2', {}, 'Start your home’s space'), field('Your name', you), field('Home name', fam), err, btn,
      h('p', { class: 'hint' }, 'You get your own private link. Keep it safe: it is your key. No account or password needed.'));
  }

  /* ---------- TOUCH POINT B: the home / trip choice (only when the server says Triply is on) ---------- */
  const TRIPLY_BASE = '/triply';
  const PLANE = '<svg viewBox="0 0 64 64" width="26" height="26" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 33l40-17-13 33-9-13z"/></svg>';
  function pickForm(go, kind, ic, kicker, title, sub, you, label2, input2, err, btn, extra, more) {
    return h('form', { class: 'card land-pick land-pick-' + kind, onsubmit: go },
      h('div', { class: 'land-pick-head' }, ic, h('div', {}, h('span', { class: 'land-kicker' }, kicker), h('h2', {}, title))),
      h('p', { class: 'land-pick-sub' }, sub),
      field('Your name', you), field(label2, input2), ...(more || []), err, btn,
      h('p', { class: 'hint' }, 'You get your own private link. No account needed.', extra || ''));
  }
  function tripCard() {
    const you = h('input', { type: 'text', maxlength: '30', placeholder: 'For example: Ryan', autocomplete: 'given-name' });
    const trip = h('input', { type: 'text', maxlength: '60', placeholder: 'For example: Japan 2027, Boracay trip', autocomplete: 'off' });
    const from = h('input', { type: 'date', 'aria-label': 'First day' });
    const to = h('input', { type: 'date', 'aria-label': 'Last day' });
    from.addEventListener('change', () => { if (from.value && (!to.value || to.value < from.value)) to.value = from.value; to.min = from.value; });
    const dates = h('div', { class: 'land-dates' }, from, h('span', { 'aria-hidden': 'true' }, '–'), to);
    const err = errorBox();
    const btn = ui.button('Create your trip', { variant: 'primary', big: true, icon: 'plus', type: 'submit', block: true });
    async function go(e) {
      e.preventDefault();
      if (!you.value.trim()) { showErr(err, 'Please type your name.'); you.focus(); return; }
      if (!from.value) { showErr(err, 'Please pick the first day of the trip.'); from.focus(); return; }
      btn.disabled = true; showErr(err, '');
      try {
        const r = await fetch(TRIPLY_BASE + '/api/trips', { method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
          body: JSON.stringify({ name: trip.value.trim() || 'Our trip', start_date: from.value, end_date: to.value || from.value, owner: { name: you.value.trim() } }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.link) throw new Error((j.error && j.error.message) || 'Could not start your trip. Please try again.');
        location.href = j.link;
      } catch (x) { showErr(err, x.message === 'Failed to fetch' ? 'Could not reach Triply. Check your internet and try again.' : x.message); btn.disabled = false; }
    }
    const ic = h('span', { class: 'land-pick-ic' }); ic.innerHTML = PLANE;
    return pickForm(go, 'trip', ic, 'Triply by Kalendaryo', 'Plan a trip', 'One itinerary, every booking and a group chat for everyone going.', you, 'Trip name', trip, err, btn,
      null, [field('Dates', dates)]);
  }
  async function tripsCard() {
    let saved = [];
    try { saved = (JSON.parse(localStorage.getItem('tr.trips') || '[]') || []).filter((x) => x && x.token && x.tripId); } catch (e) { saved = []; }
    if (!saved.length) return null;
    let trips = [];
    try {
      const r = await fetch(TRIPLY_BASE + '/api/my-trips', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tokens: saved.map((x) => x.token) }) });
      if (r.ok) trips = ((await r.json()).trips || []).map((t) => Object.assign({ saved: saved[t.i] }, t));
    } catch (e) { /* offline: show nothing */ }
    if (!trips.length) return null;
    const forget = (tripId) => {
      try { localStorage.setItem('tr.trips', JSON.stringify(saved.filter((x) => x.tripId !== tripId))); } catch (e) { /* fine */ }
      render();
    };
    return h('section', { class: 'card land-card land-trips' }, h('h2', {}, 'Your trips on this device'),
      h('div', { class: 'stack' }, trips.map((t) => {
        const ic = h('span', { class: 'land-chip-ic' }); ic.innerHTML = PLANE;
        return h('div', { class: 'land-recent' },
          h('a', { class: 'btn soft big land-open land-open-trip', href: TRIPLY_BASE + '/#/trip/' + encodeURIComponent(t.id) + '/overview' }, ic, h('span', {}, t.name + (t.owner_name ? ' · ' + t.owner_name : ''))),
          ui.iconButton('x', 'Forget ' + t.name + ' on this device', () => forget(t.id)));
      })));
  }
  async function lists() {
    const items = [recentCard(), await tripsCard()].filter(Boolean);
    return items.length ? h('div', { class: 'land-lists' + (items.length === 1 ? ' one' : '') }, ...items) : null;
  }
  function choice() {
    return [h('div', { class: 'land-picks' }, createCard(true), tripCard())];
  }

  function recentCard() {
    const list = KAL.recent.all();
    if (!list.length) return null;
    return h('section', { class: 'card land-card' }, h('h2', {}, 'Your homes on this device'),
      h('div', { class: 'stack' }, list.map((f) => h('div', { class: 'land-recent' },
        h('a', { class: 'btn soft big land-open', href: '/c/' + f.t }, icon('calendar'), h('span', {}, f.name + (f.who ? ' · ' + f.who : ''))),
        ui.iconButton('x', 'Forget ' + f.name + ' on this device', () => { KAL.recent.forget(f.t); render(); })))));
  }

  function steps() {
    const s = window.KAL_TRIPLY
      ? [['plus', 'Create', 'Start a home or a trip in one step. No account or password.'], ['users', 'Invite', 'Send invite links. Pick who can look, who can edit, and who is an owner.'], ['calendar', 'Share the day', 'Calendars, chores, meals, itineraries and group chat, live for everyone.']]
      : [['plus', 'Create', 'Make your home’s space in one step.'], ['users', 'Invite', 'Send invite links. Pick who can look, who can edit, and who is an owner.'], ['calendar', 'Share the day', 'Calendar, chores, meals, lists and photos, live for everyone.']];
    return h('div', { class: 'land-steps' }, s.map(([i, t, d]) => h('div', { class: 'land-step' }, h('span', { class: 'empty-icon' }, icon(i)), h('strong', {}, t), h('span', { class: 'sub' }, d))));
  }

  async function joinCard() {
    const box = h('section', { class: 'card land-card' }, h('p', { class: 'sub' }, 'Checking your invite…'));
    let peek;
    try { peek = await KAL.api('GET', '/api/invites/peek/' + encodeURIComponent(KAL.joinCode)); }
    catch (e) { peek = { valid: false, reason: e.userMessage }; }
    if (!peek.valid) {
      box.replaceChildren(h('h2', {}, 'This invite cannot be used'), h('p', {}, peek.reason), h('a', { class: 'btn soft big', href: '/' }, 'Go to the start page'));
      return box;
    }
    const name = h('input', { type: 'text', maxlength: '30', placeholder: 'Your name', autocomplete: 'given-name' });
    const err = errorBox();
    const btn = ui.button('Join ' + peek.familyName, { variant: 'primary', big: true, icon: 'users', type: 'submit', block: true });
    async function go(e) {
      e.preventDefault();
      if (!name.value.trim()) { showErr(err, 'Please type your name.'); name.focus(); return; }
      btn.disabled = true; showErr(err, '');
      try {
        const r = await KAL.api('POST', '/api/join', { code: KAL.joinCode, name: name.value.trim() });
        try { localStorage.setItem('kal.newlink', '1'); } catch (x) { /* fine */ }
        location.replace('/c/' + r.token);
      } catch (x) { showErr(err, x.userMessage); btn.disabled = false; }
    }
    box.replaceChildren(h('form', { class: 'stack', onsubmit: go },
      h('h2', {}, 'You are invited to ' + peek.familyName), h('p', {}, 'You will join as ' + ROLE_TEXT[peek.role] + '.'),
      field('Your name', name), err, btn, h('p', { class: 'hint' }, 'You will get your own private link to this home. Keep it safe.')));
    return box;
  }

  let root;
  async function render(note) {
    const tri = window.KAL_TRIPLY && !KAL.joinCode;
    const head = tri
      ? h('header', { class: 'card land-banner' }, h('span', { class: 'land-logo-mark' }, icon('calendar')),
          h('div', {}, h('div', { class: 'brand-name land-banner-name' }, PL.config.appName), h('p', { class: 'land-banner-tag' }, 'Where home and trips get organized')))
      : null;
    const main = h('main', { class: tri ? 'land land-wide' : 'land' }, head ||
      h('header', { class: 'land-head' }, h('div', { class: 'brand-name land-logo' }, h('span', { class: 'land-logo-mark' }, icon('calendar')), PL.config.appName),
        h('h1', {}, 'Where home gets organized'), h('p', { class: 'land-lead' }, 'One shared place for your calendar, chores, meals and groceries, lists and photos. Everyone sees the same plan, updated live. Simple, calm, and private to your home.')),
      note ? h('p', { class: 'land-note', role: 'alert' }, note) : null);
    root.replaceChildren(main);
    if (KAL.joinCode) main.append(await joinCard());
    else if (window.KAL_TRIPLY) main.append(...[...choice(), await lists(), steps()].filter(Boolean));
    else main.append(...[createCard(), recentCard(), steps()].filter(Boolean));
    if (!KAL.joinCode && PL.guide) PL.guide.maybeStart(); // first visit: the friendly guide (guide.js)
  }

  PL.landing = {
    mount(opts) {
      root = document.getElementById('porchlight-root');
      document.body.classList.add('land-body');
      document.title = PL.config.appName + (window.KAL_TRIPLY ? ' · Where home and trips get organized' : ' · Where home gets organized');
      render(opts && opts.note);
    }
  };
})();

</script>
<script>
/*
 * access.js — web version only. "People with access" in the Family section:
 * your own link, invite links with a role, changing roles, removing people.
 * Also: the viewer notice, the "save your link" tip, and what happens when access is removed.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon, ui = PL.ui;
  const ROLES = [{ value: 'viewer', label: 'Viewer' }, { value: 'editor', label: 'Editor' }, { value: 'owner', label: 'Owner' }];
  const ROLE_HELP = { viewer: 'Can look at everything. Cannot change anything.', editor: 'Can add and change events, chores, meals, lists and photos.', owner: 'Can do everything, including inviting people and changing roles.' };
  const roleLabel = (r) => (ROLES.find((x) => x.value === r) || {}).label || r;
  const myLink = () => location.origin + '/c/' + KAL.token;
  const isOwner = () => KAL.me && KAL.me.role === 'owner';

  async function copy(text, what) {
    try { await navigator.clipboard.writeText(text); ui.toast(what + ' copied.'); return true; }
    catch (e) { ui.toast('Could not copy. Press and hold the link to copy it.'); return false; }
  }
  function linkBox(url) {
    const input = h('input', { type: 'text', readonly: true, value: url, class: 'link-input', 'aria-label': 'Link', onfocus: (e) => e.target.select() });
    return input;
  }

  /* ---------- data ---------- */
  let invites = [];
  async function loadPeople() {
    try { KAL.people = (await KAL.api('GET', '/api/people')).people; } catch (e) { /* shown as empty */ }
    if (isOwner()) { try { invites = (await KAL.api('GET', '/api/invites')).invites; } catch (e) { invites = []; } } else invites = [];
    paint();
  }

  /* ---------- invite sheet ---------- */
  function openInvite() {
    let role = 'editor';
    const label = h('input', { type: 'text', maxlength: '40', placeholder: 'Optional. For example: Grandma', autocomplete: 'off' });
    const help = h('p', { class: 'hint' }, ROLE_HELP[role]);
    const seg = ui.segmented(ROLES, role, (v) => { role = v; help.textContent = ROLE_HELP[v]; }, 'Role');
    const body = h('div', { class: 'event-form' }, ui.field('Who is it for?', label), ui.field('What can they do?', seg.el), help);
    const make = ui.button('Create invite link', { variant: 'primary', big: true, icon: 'plus', onClick: async () => {
      make.disabled = true;
      try {
        const r = await KAL.api('POST', '/api/invites', { role, label: label.value.trim() });
        const url = location.origin + '/join/' + r.code;
        const share = navigator.share ? ui.button('Share', { icon: 'upload', onClick: () => navigator.share({ title: 'Join ' + KAL.family.name + ' on Kalendaryo', url }).catch(() => {}) }) : null;
        body.replaceChildren(
          h('p', {}, 'Send this link to ' + (label.value.trim() || 'the person') + '. They will join as ' + roleLabel(role) + '.'),
          linkBox(url),
          h('div', { class: 'btn-row' }, ui.button('Copy link', { variant: 'primary', icon: 'copy', onClick: () => copy(url, 'Invite link') }), share),
          h('p', { class: 'hint' }, 'It works one time and expires in ' + r.days + ' days. You can cancel it in the People section.'));
        make.remove();
        loadPeople();
      } catch (e) { ui.toast(e.userMessage); make.disabled = false; }
    } });
    const s = ui.sheet({ title: 'Invite someone', body, footer: [ui.button('Close', { variant: 'ghost', big: true, onClick: () => s.close() }), make] });
  }

  function openRole(p) {
    let role = p.role;
    const help = h('p', { class: 'hint' }, ROLE_HELP[role]);
    const seg = ui.segmented(ROLES, role, (v) => { role = v; help.textContent = ROLE_HELP[v]; }, 'Role');
    const save = ui.button('Save', { variant: 'primary', big: true, onClick: async () => {
      if (role === p.role) { s.close(); return; }
      if (p.isMe && role !== 'owner' && !(await ui.confirm({ title: 'Change your own role?', message: 'You will not be able to manage people anymore.', confirmLabel: 'Change it' }))) return;
      try { await KAL.api('PATCH', '/api/people/' + p.id, { role }); s.close(); ui.toast(p.name + ' is now ' + roleLabel(role) + '.'); loadPeople(); }
      catch (e) { ui.toast(e.userMessage); }
    } });
    const remove = ui.button(p.isMe ? 'Leave family' : 'Remove', { variant: 'danger', icon: 'trash', onClick: () => { s.close(); removePerson(p); } });
    const s = ui.sheet({ title: p.name, body: h('div', { class: 'event-form' }, ui.field('Role', seg.el), help),
      footer: [remove, ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), save] });
  }

  async function removePerson(p) {
    const ok = await ui.confirm(p.isMe
      ? { title: 'Leave this family?', message: 'Your link will stop working. You will need a new invite to come back.', confirmLabel: 'Leave', danger: true }
      : { title: 'Remove ' + p.name + '?', message: 'Their link stops working right away. You can invite them again later.', confirmLabel: 'Remove', danger: true });
    if (!ok) return;
    try {
      await KAL.api('DELETE', '/api/people/' + p.id);
      if (p.isMe) { KAL.recent.forget(KAL.token); location.href = '/'; return; }
      ui.toast(p.name + ' was removed.'); loadPeople();
    } catch (e) { ui.toast(e.userMessage); }
  }

  async function deleteFamily() {
    const input = h('input', { type: 'text', autocomplete: 'off', placeholder: 'DELETE', 'aria-label': 'Type DELETE' });
    const go = ui.button('Delete forever', { variant: 'danger-solid', big: true, onClick: async () => {
      if (input.value.trim() !== 'DELETE') { ui.toast('Type DELETE in capital letters.'); input.focus(); return; }
      try { await KAL.api('DELETE', '/api/family', { confirm: 'DELETE' }); KAL.recent.forget(KAL.token); location.href = '/'; }
      catch (e) { ui.toast(e.userMessage); }
    } });
    const s = ui.sheet({ title: 'Delete ' + KAL.family.name + '?', body: h('div', { class: 'event-form' },
      h('p', {}, 'Everything is deleted for everyone: calendar, chores, meals, lists and photos. All links stop working. This cannot be undone.'),
      ui.field('Type DELETE to confirm', input)), footer: [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), go] });
  }

  /* ---------- the card in the Family section ---------- */
  const card = h('section', { class: 'card access-card', 'aria-label': 'People with access' });
  function paint() {
    if (!KAL.me) { card.replaceChildren(); return; }
    const people = KAL.people || [];
    const fmt = (d) => new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    card.replaceChildren(...[
      h('div', { class: 'page-head' }, h('h2', {}, 'People with access'), isOwner() ? ui.button('Invite someone', { variant: 'primary', icon: 'plus', onClick: openInvite }) : null),
      h('p', { class: 'sub' }, 'Each person has their own link. To add someone, send an invite. Do not share your own link.'),
      h('div', { class: 'stack' }, people.map((p) => h('div', { class: 'access-row' },
        h('span', { class: 'access-name' }, h('strong', {}, p.name + (p.isMe ? ' (you)' : '')), h('span', { class: 'sub' }, roleLabel(p.role))),
        isOwner() ? ui.button('Change', { icon: 'edit', onClick: () => openRole(p) }) : (p.isMe ? ui.button('Leave', { variant: 'ghost', onClick: () => removePerson(p) }) : null)))),
      isOwner() && invites.length ? h('h3', { class: 'mini-h' }, 'Open invites') : null,
      isOwner() && invites.length ? h('div', { class: 'stack' }, invites.map((i) => h('div', { class: 'access-row' },
        h('span', { class: 'access-name' }, h('strong', {}, i.label || 'Invite'), h('span', { class: 'sub' }, roleLabel(i.role) + ' · expires ' + fmt(i.expires_at))),
        ui.button('Cancel', { variant: 'ghost', onClick: async () => { try { await KAL.api('DELETE', '/api/invites/' + i.id); loadPeople(); } catch (e) { ui.toast(e.userMessage); } } })))) : null,
      h('h3', { class: 'mini-h' }, 'Your link'),
      h('p', { class: 'hint' }, 'Bookmark it, or save it somewhere safe. Anyone with this link gets in as you.'),
      h('div', { class: 'btn-row' }, ui.button('Copy my link', { icon: 'copy', onClick: () => copy(myLink(), 'Your link') })),
      isOwner() ? h('div', { class: 'btn-row access-danger' }, ui.button('Delete this family', { variant: 'danger', icon: 'trash', onClick: deleteFamily })) : null
    ].filter(Boolean));
  }
  PL.familyExtras = () => { paint(); return card; };

  /* ---------- notices ---------- */
  let banner = null;
  function showRole() {
    const viewer = KAL.me && KAL.me.role === 'viewer';
    const content = document.querySelector('.content');
    if (!content) return;
    if (!banner) { banner = h('div', { class: 'status-banner role-banner', role: 'status' }); content.prepend(banner); }
    if (KAL.me && KAL.me.viewing) {
      // The site owner looking at someone's home (owner view): read-only, not counted as their visit.
      banner.className = 'status-banner role-banner owner-viewing';
      banner.replaceChildren('👁 Viewing “' + ((KAL.family && KAL.family.name) || 'this home') + '” as the site owner · read-only · your visit doesn’t count as theirs',
        h('a', { class: 'owner-back', href: '/owner' }, 'Back to owner view'));
    } else {
      banner.textContent = viewer ? 'You can view this family. Ask an owner to make you an Editor to change things.' : '';
    }
    banner.hidden = !viewer;
  }
  function removedScreen(msg) {
    const root = document.getElementById('porchlight-root');
    if (root.dataset.removed) return;
    root.dataset.removed = '1';
    KAL.recent.forget(KAL.token);
    PL.landing.mount({ note: msg || 'This link does not work anymore. You may have been removed from the family, or the family was deleted. Ask an owner for a new invite.' });
  }
  function firstVisitTip() {
    let fresh = false;
    try { fresh = localStorage.getItem('kal.newlink') === '1'; localStorage.removeItem('kal.newlink'); } catch (e) { /* fine */ }
    if (!fresh || !KAL.me) return;
    const s = ui.sheet({ title: 'Welcome, ' + KAL.me.name + '!', body: h('div', { class: 'event-form' },
      h('p', {}, 'This page is your own link to ' + KAL.family.name + '. Bookmark it or save it, so you can come back.'),
      linkBox(myLink()), h('p', { class: 'hint' }, 'Do not share this link: anyone with it gets in as you. To add people, use Invite someone in the People section.')),
      footer: [ui.button('Copy my link', { icon: 'copy', onClick: () => copy(myLink(), 'Your link') }), ui.button('Got it', { variant: 'primary', big: true, onClick: () => s.close() })] });
  }

  KAL.on('people', loadPeople);
  KAL.on('me', () => { showRole(); loadPeople(); });
  KAL.on('removed', () => removedScreen());

  function start() {
    if (!KAL.token) return;
    KAL.ready.then(() => {
      if (KAL.invalid) { if (KAL.invalid.status === 401) removedScreen(); return; }
      showRole(); loadPeople(); firstVisitTip();
      document.title = KAL.family.name + ' · ' + PL.config.appName;
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(start, 0)); else setTimeout(start, 0);
})();

<script>
/*
 * guide.js — web version only. A friendly first-visit guide on the start page.
 *
 * A small reusable engine: each step says what to say and which part of the page to light up.
 * The page goes dark except the highlighted part, which glows; a bubble with an arrow points at it.
 * After the guide, the "Your name" boxes glow softly until the person starts typing.
 *
 * Shows once per device (kal.guideSeen), never to people who already have a home or trip saved here.
 * Keyboard: Enter or → next, ← back, Esc skip. Respects "reduce motion".
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon;
  const SEEN = 'kal.guideSeen';
  const PLANE = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 33l40-17-13 33-9-13z"/></svg>';
  const WAVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v5M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4.3 13a1.5 1.5 0 0 1 2.4-1.8L8 13"/></svg>';

  const svg = (s) => { const t = h('span', { class: 'g-svg' }); t.innerHTML = s; return t; };
  const chips = (list, trip) => h('div', { class: 'g-chips' + (trip ? ' trip' : '') }, list.map(([i, t]) => h('span', { class: 'g-chip' }, i ? icon(i) : null, t)));
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } };
  const hasSaved = () => {
    try { return JSON.parse(get('kal.families') || '[]').length > 0 || JSON.parse(get('tr.trips') || '[]').length > 0; } catch (e) { return false; }
  };

  /* ---------- the steps (start page) ---------- */
  function startSteps(tri) {
    const steps = [
      { id: 'welcome', center: true, icon: svg(WAVE), tone: 'sun', title: 'Welcome to Kalendaryo!', sub: 'Let’s show you around.',
        body: tri ? [h('p', {}, 'Kalendaryo keeps two parts of life organized: ', h('b', {}, 'life at home'), ' and ', h('b', {}, 'your trips together'), '. It only takes a minute.')]
          : [h('p', {}, 'Kalendaryo keeps ', h('b', {}, 'life at home'), ' organized, for everyone you live with. It only takes a minute.')],
        next: 'Let’s go' },
      { id: 'home', target: tri ? '.land-pick-home' : '.land-card', side: 'right', icon: icon('home'), title: 'This is Kalendaryo',
        body: [h('p', {}, 'For ', h('b', {}, 'everyday life'), ' with everyone you live with.'),
          chips([['calendar', 'Calendar'], ['check', 'Chores'], ['meal', 'Meals'], ['list', 'Lists'], ['image', 'Photos'], ['users', 'People']])] }
    ];
    if (tri) {
      steps.push(
        { id: 'trip', target: '.land-pick-trip', side: 'left', trip: true, icon: svg(PLANE), title: 'This is Triply',
          body: [h('p', {}, 'For ', h('b', {}, 'trips together'), ': one itinerary, every booking and a group chat for everyone going.'),
            chips([[null, 'Flights'], [null, 'Hotels'], [null, 'Activities'], [null, 'Packing'], [null, 'Costs'], [null, 'Group chat']], true)] },
        { id: 'which', center: true, icon: icon('sparkle'), tone: 'sun', title: 'Which one do I use?',
          body: [h('p', { class: 'g-rule' }, h('b', { class: 'g-green' }, 'Kalendaryo'), ' for everyday life.'),
            h('p', { class: 'g-rule' }, h('b', { class: 'g-terra' }, 'Triply'), ' when you’re going somewhere together.'),
            h('p', { class: 'g-small' }, 'You can make both, any time.')] }
      );
    }
    steps.push(tri
      ? { id: 'start', target: '.land-pick input[autocomplete=given-name]', side: 'below', pad: 8, icon: icon('edit'), title: 'Start here',
          body: [h('p', { class: 'g-rule' }, h('b', { class: 'g-green' }, 'Organizing your home?'), ' Type your name in the ', h('b', {}, 'green card'), ', then tap ', h('b', {}, 'Create your home'), '.'),
            h('p', { class: 'g-rule' }, h('b', { class: 'g-terra' }, 'Planning a trip?'), ' Use the ', h('b', {}, 'orange card'), ', then tap ', h('b', {}, 'Create your trip'), '.')],
          next: 'Got it' }
      : { id: 'start', target: '.land-card input[autocomplete=given-name]', side: 'below', pad: 8, icon: icon('edit'), title: 'Start here',
          body: [h('p', {}, 'Type ', h('b', {}, 'your name'), ', then the home name, and tap ', h('b', {}, 'Create your home'), '.')], next: 'Got it' });
    return steps;
  }

  /* ---------- the engine ---------- */
  function run(steps, opts) {
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let i = 0, target = null, raf = 0, readTimers = [];
    const lastFocus = document.activeElement;
    const shade = h('div', { class: 'g-shade' });
    const spot = h('div', { class: 'g-spot', 'aria-hidden': 'true' });
    const live = h('div', { class: 'g-live', 'aria-live': 'polite' });
    const box = h('div', { class: 'g-box', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'g-title', tabindex: '-1' });
    const layer = h('div', { class: 'g-layer' + (reduce ? ' g-still' : '') }, shade, spot, box, live);
    document.body.append(layer);
    document.documentElement.classList.add('g-open');

    function place() {
      const s = steps[i];
      if (s.center || !target) { spot.classList.add('g-gone'); box.classList.remove('g-arrow-l', 'g-arrow-r', 'g-arrow-t', 'g-arrow-b'); box.style.left = box.style.top = ''; box.classList.add('g-center'); return; }
      box.classList.remove('g-center');
      const rs = (innerWidth < 640 ? target.slice(0, 1) : target).map((el) => el.getBoundingClientRect()); // phones: cards are stacked, light the first
      const r = { left: Math.min(...rs.map((x) => x.left)), top: Math.min(...rs.map((x) => x.top)), right: Math.max(...rs.map((x) => x.right)), bottom: Math.max(...rs.map((x) => x.bottom)) };
      r.width = r.right - r.left; r.height = r.bottom - r.top;
      const pad = s.pad || 12;
      spot.classList.remove('g-gone');
      Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
      const W = innerWidth, H = innerHeight, bw = box.offsetWidth, bh = box.offsetHeight, gap = 26;
      box.classList.remove('g-arrow-l', 'g-arrow-r', 'g-arrow-t', 'g-arrow-b', 'g-sheet');
      if (W < 640) { box.classList.add('g-sheet'); box.style.left = box.style.top = ''; return; } // phones: bottom sheet
      let side = s.side;
      if (side === 'right' && r.right + pad + gap + bw > W - 12) side = r.left - pad - gap - bw > 12 ? 'left' : 'below';
      if (side === 'left' && r.left - pad - gap - bw < 12) side = r.right + pad + gap + bw < W - 12 ? 'right' : 'below';
      if (side === 'below' && r.bottom + pad + gap + bh > H - 12 && r.top - pad - gap - bh > 12) side = 'above';
      let x, y;
      if (side === 'right') { x = r.right + pad + gap; y = Math.min(Math.max(12, r.top + 20), H - bh - 12); box.classList.add('g-arrow-l'); }
      else if (side === 'left') { x = r.left - pad - gap - bw; y = Math.min(Math.max(12, r.top + 20), H - bh - 12); box.classList.add('g-arrow-r'); }
      else if (side === 'above') { x = Math.min(Math.max(12, r.left), W - bw - 12); y = r.top - pad - gap - bh; box.classList.add('g-arrow-b'); }
      else { x = Math.min(Math.max(12, r.left), W - bw - 12); y = Math.min(r.bottom + pad + gap, H - bh - 12); box.classList.add('g-arrow-t'); }
      box.style.left = x + 'px'; box.style.top = y + 'px';
      box.style.setProperty('--ax', Math.min(Math.max(28, r.left + Math.min(r.width / 2, 60) - x), bw - 40) + 'px');
    }
    const follow = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(place); };

    function show(n) {
      i = Math.max(0, Math.min(steps.length - 1, n));
      const s = steps[i];
      target = s.target ? [...document.querySelectorAll(s.target)] : null;
      if (target && !target.length) target = null;
      if (s.target && !target) return show(i + 1 < steps.length ? i + 1 : i);
      const dots = h('div', { class: 'g-dots', 'aria-hidden': 'true' }, steps.map((_, k) => h('i', { class: k === i ? 'on' : k < i ? 'done' : '' })));
      const last = i === steps.length - 1;
      const nextBtn = h('button', { type: 'button', class: 'g-next' + (s.trip ? ' trip' : '') }, s.next || (last ? 'Got it' : 'Next'), last ? null : icon('right'));
      nextBtn.addEventListener('click', () => (last ? finish() : show(i + 1)));
      const backBtn = i > 0 ? h('button', { type: 'button', class: 'g-back', 'aria-label': 'Back' }, icon('left')) : null;
      if (backBtn) backBtn.addEventListener('click', () => show(i - 1));
      const skipBtn = last ? null : h('button', { type: 'button', class: 'g-skip' }, 'Skip');
      if (skipBtn) skipBtn.addEventListener('click', finish);
      box.className = 'g-box' + (s.trip ? ' trip' : '');
      box.replaceChildren(...[
        h('div', { class: 'g-top' }, h('span', { class: 'g-badge' + (s.trip ? ' trip' : '') }, 'Step ' + (i + 1) + ' of ' + steps.length)),
        h('div', { class: 'g-head' }, h('span', { class: 'g-icon ' + (s.tone ? 'g-' + s.tone : s.trip ? 'g-trip' : 'g-home') }, s.icon), h('div', {}, h('h2', { id: 'g-title' }, s.title), s.sub ? h('p', { class: 'g-sub' }, s.sub) : null)),
        ...s.body,
        h('div', { class: 'g-foot' }, dots, h('span', { class: 'g-fill' }), skipBtn, backBtn, nextBtn)
      ].filter(Boolean));
      live.textContent = 'Step ' + (i + 1) + ' of ' + steps.length + ': ' + s.title;
      box.classList.remove('g-pop'); void box.offsetWidth; box.classList.add('g-pop');
      if (target) target[0].scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
      place(); setTimeout(place, reduce ? 0 : 380); // after the smooth scroll
      setTimeout(() => box.focus({ preventScroll: true }), 30); // the bubble takes focus, so Next has no ring until it blinks
      readAlong(nextBtn);
    }

    function key(e) {
      if (e.key === 'Escape') { e.preventDefault(); finish(); }
      else if (e.key === 'Enter' && document.activeElement === box) { e.preventDefault(); const b = box.querySelector('.g-next'); if (b) b.click(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); i < steps.length - 1 ? show(i + 1) : finish(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); show(i - 1); }
      else if (e.key === 'Tab') { // keep focus inside the guide
        const f = [...box.querySelectorAll('button')]; if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    }
    // Read-along: light up one piece of text at a time (title, then each line), at an easy reading pace.
    // What is not read yet is faded, so the eye knows exactly where to look. When done, Next starts to blink.
    function readAlong(nextBtn) {
      readTimers.forEach(clearTimeout); readTimers = [];
      const parts = [...box.querySelectorAll('.g-head h2, .g-sub, p, .g-chip')];
      if (reduce) { nextBtn.classList.add('g-ready'); return; }
      parts.forEach((el) => el.classList.add('g-seg', 'g-later'));
      let t = 250;
      parts.forEach((el) => {
        const words = (el.textContent || '').trim().split(/\s+/).length;
        const ms = el.classList.contains('g-chip') ? 420 : Math.max(800, words * 330); // about 3 words a second
        readTimers.push(setTimeout(() => { el.classList.remove('g-later'); el.classList.add('g-now'); }, t));
        readTimers.push(setTimeout(() => el.classList.remove('g-now'), t + ms));
        t += ms;
      });
      readTimers.push(setTimeout(() => nextBtn.classList.add('g-ready'), t));
    }

    function finish() {
      readTimers.forEach(clearTimeout);
      document.removeEventListener('keydown', key, true);
      removeEventListener('scroll', follow, true); removeEventListener('resize', follow);
      layer.classList.add('g-leave');
      setTimeout(() => { layer.remove(); document.documentElement.classList.remove('g-open'); }, reduce ? 0 : 220);
      set(SEEN, '1');
      if (opts && opts.onDone) opts.onDone();
      else if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    }
    document.addEventListener('keydown', key, true);
    addEventListener('scroll', follow, true); addEventListener('resize', follow);
    shade.addEventListener('click', () => box.classList.remove('g-pop') || (void box.offsetWidth, box.classList.add('g-pop'))); // a click outside nudges the bubble
    show(0);
  }

  /* ---------- after the guide: the "Your name" boxes glow until used ---------- */
  function glowStart() {
    const inputs = [...document.querySelectorAll('.land-pick input[autocomplete=given-name], .land-card input[autocomplete=given-name]')];
    if (!inputs.length) return;
    const tags = inputs.map((el) => {
      const wrap = el.closest('.field') || el.parentElement;
      const trip = !!el.closest('.land-pick-trip');
      const tag = h('span', { class: 'g-here' + (trip ? ' trip' : ''), 'aria-hidden': 'true' }, inputs.length > 1 ? (trip ? 'Start here for a trip 👇' : 'Start here for your home 👇') : 'Start here 👇');
      wrap.classList.add('g-glow', 'g-here-wrap'); wrap.prepend(tag);
      return tag;
    });
    const stop = () => {
      document.querySelectorAll('.g-glow').forEach((el) => el.classList.remove('g-glow'));
      tags.forEach((t) => t.remove()); document.querySelectorAll('.g-here-wrap').forEach((el) => el.classList.remove('g-here-wrap'));
      document.removeEventListener('focusin', onFocus, true); document.removeEventListener('pointerdown', onFocus, true);
    };
    const onFocus = (e) => { if (e.target.closest && e.target.closest('.land-pick, .land-card, .land-lists')) stop(); };
    document.addEventListener('focusin', onFocus, true); document.addEventListener('pointerdown', onFocus, true);
  }

  PL.guide = {
    // Called by the start page after it draws. Shows the guide on a first visit only.
    maybeStart() { if (!get(SEEN) && !hasSaved() && !document.querySelector('.g-layer')) setTimeout(() => { if (!document.querySelector('.g-layer')) this.start(); }, 450); },
    start() { run(startSteps(!!window.KAL_TRIPLY), { onDone: glowStart }); },
    reset() { try { localStorage.removeItem(SEEN); } catch (e) { /* fine */ } }
  };
})();

</script>
<script>
/*
 * weather.js — a small weather card for Home, from the free Open-Meteo service.
 * It needs the page to be allowed to reach the internet. If that is blocked, the card
 * says so and shows the last saved weather instead. Nothing here is required by other screens.
 *   settings.weatherPlace = { name, lat, lon }     settings.tempUnit = 'c' | 'f'
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, ui = PL.ui, D = PL.D;
  const CODES = [
    [[0], '☀️', 'Clear'], [[1, 2], '🌤️', 'Mostly sunny'], [[3], '☁️', 'Cloudy'], [[45, 48], '🌫️', 'Foggy'],
    [[51, 53, 55, 56, 57], '🌦️', 'Drizzle'], [[61, 63, 65, 66, 67, 80, 81, 82], '🌧️', 'Rain'], [[71, 73, 75, 77, 85, 86], '❄️', 'Snow'], [[95, 96, 99], '⛈️', 'Thunderstorms']
  ];
  const look = (code) => { const r = CODES.find((c) => c[0].includes(code)); return r ? { emoji: r[1], text: r[2] } : { emoji: '🌡️', text: '' }; };
  const unit = () => (PL.state.settings.tempUnit === 'f' ? 'f' : 'c');
  const deg = (n) => Math.round(n) + '°';

  async function getJson(url) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error('bad status');
      return await r.json();
    } finally { clearTimeout(t); }
  }

  async function search(name) {
    const j = await getJson('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=' + encodeURIComponent(name));
    return (j.results || []).map((r) => ({ name: [r.name, r.admin1, r.country].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude }));
  }

  async function load(place, u) {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + place.lat + '&longitude=' + place.lon +
      '&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=3&timezone=auto&temperature_unit=' + (u === 'f' ? 'fahrenheit' : 'celsius');
    const j = await getJson(url);
    const data = { at: Date.now(), now: { t: j.current.temperature_2m, code: j.current.weather_code },
      days: j.daily.time.map((d, i) => ({ date: d, code: j.daily.weather_code[i], hi: j.daily.temperature_2m_max[i], lo: j.daily.temperature_2m_min[i] })) };
    PL.storage.set('wx', { key: place.lat + ',' + place.lon + ',' + u, data });
    return data;
  }

  function paint(box, data, note) {
    const l = look(data.now.code);
    box.replaceChildren(h('div', { class: 'wx' },
      h('div', { class: 'wx-now' }, h('span', { class: 'wx-emoji', 'aria-hidden': 'true' }, l.emoji), h('div', {}, h('div', { class: 'wx-temp' }, deg(data.now.t)), h('div', { class: 'sub' }, l.text + (PL.state.settings.weatherPlace ? ' · ' + PL.state.settings.weatherPlace.name.split(',')[0] : '')))),
      h('div', { class: 'wx-days' }, data.days.map((d, i) => h('div', { class: 'wx-day' }, h('span', {}, i === 0 ? 'Today' : D.fmt(d.date, { weekday: 'short' })), h('span', { 'aria-hidden': 'true' }, look(d.code).emoji), h('b', {}, deg(d.hi)), h('span', { class: 'sub' }, deg(d.lo))))),
      note ? h('p', { class: 'hint' }, note) : null));
  }

  function widget() {
    const place = PL.state.settings.weatherPlace, u = unit();
    if (!place) return ui.emptyState({ icon: 'sun', title: 'Add your town', text: 'Choose a place to see today’s weather on Home.', action: ui.button('Choose a place', { icon: 'pin', onClick: () => openPlace() }) });
    const box = h('div', {});
    const key = place.lat + ',' + place.lon + ',' + u;
    const saved = PL.storage.get('wx', null);
    const cached = saved && saved.key === key ? saved.data : null;
    if (cached) paint(box, cached, Date.now() - cached.at > 3 * 3600000 ? 'Showing older weather.' : '');
    else box.append(h('p', { class: 'sub' }, 'Loading the weather…'));
    if (!cached || Date.now() - cached.at > 30 * 60000) {
      load(place, u).then((d) => { if (box.isConnected || true) paint(box, d); })
        .catch(() => { if (cached) paint(box, cached, 'Could not update. Showing the last saved weather.'); else box.replaceChildren(h('p', { class: 'sub' }, 'The weather could not be loaded. This page may not be allowed to reach the internet.')); });
    }
    return box;
  }

  function openPlace() {
    const q = h('input', { type: 'text', maxlength: '60', placeholder: 'Type a town or city', autocomplete: 'off', autofocus: true, 'aria-label': 'Town or city' });
    const out = h('div', { class: 'choices' });
    async function go() {
      const name = q.value.trim();
      if (!name) { q.focus(); return; }
      out.replaceChildren(h('p', { class: 'sub' }, 'Searching…'));
      try {
        const res = await search(name);
        if (!res.length) { out.replaceChildren(h('p', { class: 'sub' }, 'No place found. Try another spelling.')); return; }
        out.replaceChildren(...res.map((r) => h('button', { type: 'button', class: 'choice', onclick: async () => { if (await PL.store.saveSettings({ weatherPlace: r })) { s.close(); ui.toast('Weather place saved.'); } } }, h('strong', {}, r.name))));
      } catch (e) { out.replaceChildren(h('p', { class: 'form-error' }, 'The search could not be reached. This page may not be allowed to use the internet.')); }
    }
    const s = ui.sheet({ title: 'Weather place', body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); go(); } }, ui.field('Town or city', q), out),
      footer: [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), ui.button('Search', { variant: 'primary', big: true, onClick: go })] });
  }

  PL.weather = { widget, openPlace, unit };
})();

</script>
<script>
/*
 * photos.js — family photos, the slideshow and wall mode.
 *   photos/{id}  { assetId, at }     the picture itself is stored with the page's file storage.
 * Wall mode is a full-screen, hands-off display: a big clock, today's plans and tonight's dinner,
 * over a slow photo show. Slideshow shows only the photos. Tap the screen to bring the buttons back.
 * Photos are not part of backups (only their list is), because the pictures live in file storage.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;
  const urlOf = (p) => (PL.blobUrl ? PL.blobUrl(p.assetId) : '/_blob/' + p.assetId);
  const sortedPhotos = () => PL.state.photos.slice().sort((a, b) => a.at - b.at);

  // Shrink a picture before saving, so the page stays quick and storage lasts.
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
      return blob || file;
    } catch (e) { return file; }
  }

  async function add(files) {
    const assets = window.claude && (await window.claude.use('assets'));
    if (!assets) { ui.toast('Adding photos needs edit access to this page.'); return 0; }
    let n = 0, at = Date.now();
    for (const f of files) {
      if (!/^image\//.test(f.type)) continue;
      try {
        const blob = await shrink(f);
        const a = await assets.upload(blob);
        if (await PL.store.add('photos', { assetId: a.id, at: at++ })) n++;
      } catch (e) { ui.toast('One photo could not be saved.'); }
    }
    if (n) ui.toast(n + (n === 1 ? ' photo added.' : ' photos added.'));
    return n;
  }

  async function remove(p) {
    if (!(await ui.confirm({ title: 'Remove this photo?', message: 'It will be removed for everyone.', confirmLabel: 'Remove', danger: true }))) return;
    if (await PL.store.del('photos', p.id)) {
      try { const assets = await window.claude.use('assets'); if (assets) await assets.delete(p.assetId); } catch (e) { /* the picture file may stay in storage; harmless */ }
    }
  }

  /* ---------- the picture viewer ---------- */
  function openViewer(start) {
    let i = Math.min(Math.max(0, start), Math.max(0, sortedPhotos().length - 1));
    const img = h('img', { class: 'viewer-img', alt: 'Family photo' });
    const count = h('span', { class: 'viewer-count' });
    const prev = ui.iconButton('left', 'Previous photo', () => go(-1)), next = ui.iconButton('right', 'Next photo', () => go(1));
    const del = ui.button('Remove', { variant: 'danger', icon: 'trash', onClick: async () => {
      const p = sortedPhotos()[i]; if (!p) return;
      const n = sortedPhotos().length;
      await remove(p);
      if (sortedPhotos().length < n) { if (!sortedPhotos().length) close(); else { i = Math.min(i, sortedPhotos().length - 1); paint(); } }
    } });
    const closeBtn = ui.button('Close', { icon: 'x', onClick: () => close() });
    const root = h('div', { class: 'viewer', role: 'dialog', 'aria-label': 'Photo viewer', tabindex: '-1' },
      h('div', { class: 'viewer-top' }, count, h('span', { class: 'spacer' }), del, closeBtn), h('div', { class: 'viewer-stage' }, prev, img, next));
    function go(d) { const n = sortedPhotos().length; if (!n) return; i = (i + d + n) % n; paint(); }
    function paint() {
      const ps = sortedPhotos();
      if (!ps.length) { close(); return; }
      i = Math.min(i, ps.length - 1);
      img.src = urlOf(ps[i]); count.textContent = (i + 1) + ' of ' + ps.length;
      prev.hidden = next.hidden = ps.length < 2;
    }
    function onKey(e) { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1); }
    let x0 = null;
    root.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
    root.addEventListener('pointerup', (e) => { if (x0 != null && Math.abs(e.clientX - x0) > 60) go(e.clientX < x0 ? 1 : -1); x0 = null; });
    function close() { document.removeEventListener('keydown', onKey); unsub(); root.remove(); }
    const unsub = PL.store.subscribe(() => { if (root.isConnected) paint(); });
    document.addEventListener('keydown', onKey);
    document.body.append(root);
    paint(); closeBtn.focus();
  }

  // Wall mode and the slideshow now live in wall.js.
  const openWall = (mode) => PL.wall.open(mode);

  PL.photos = { add, remove, openWall, openViewer, list: sortedPhotos, url: urlOf };
})();
