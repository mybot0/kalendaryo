    const steps = h('textarea', { rows: '6', placeholder: 'One step on each line' });
    steps.value = r ? r.steps : '';
    const grid = h('div', { class: 'avatar-grid', role: 'radiogroup', 'aria-label': 'Picture' });
    const paint = () => grid.replaceChildren(...EMOJI.map((e) => h('button', { type: 'button', role: 'radio', class: 'avatar-opt' + (e === emoji ? ' on' : ''), 'aria-checked': e === emoji ? 'true' : 'false', 'aria-label': e, onclick: () => { emoji = e; paint(); } }, e)));
    paint();
    async function save() {
      const t = title.value.trim();
      if (!t) { ui.toast('Please type a name first.'); title.focus(); return; }
      const data = { title: t, emoji, servings: servings.value, ingredients: ing.value, steps: steps.value };
      saveBtn.disabled = true;
      let ok, id = r ? r.id : null;
      if (r) ok = await PL.store.set('recipes', r.id, data); else { id = await PL.store.add('recipes', data); ok = !!id; }
      saveBtn.disabled = false;
      if (ok) { s.close(); ui.toast(r ? 'Recipe saved.' : 'Recipe added.'); onSaved && onSaved(id); }
    }
    async function del() {
      if (!(await ui.confirm({ title: 'Delete this recipe?', message: '“' + r.title + '” will be removed for everyone. Meals in the plan keep their names.', confirmLabel: 'Delete', danger: true }))) return;
      if (await PL.store.del('recipes', r.id)) { s.close(); ui.toast('Recipe deleted.'); }
    }
    const saveBtn = ui.button(r ? 'Save changes' : 'Add recipe', { variant: 'primary', big: true, onClick: save });
    const footer = [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), saveBtn];
    if (r) footer.unshift(ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: del }));
    const s = ui.sheet({
      title: r ? 'Edit recipe' : 'New recipe', wide: true, footer,
      body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
        ui.field('Name', title), h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Picture'), grid),
        ui.field('Servings', servings), ui.field('Ingredients', ing), ui.field('Steps', steps))
    });
  }

  /* ---------- one meal slot ---------- */
  function openSlot(date, slot) {
    const m = mealAt(date, slot);
    let recipeId = m ? m.recipeId : '';
    const title = h('input', { type: 'text', maxlength: '80', placeholder: 'For example: Tacos', autocomplete: 'off', autofocus: true });
    title.value = m ? m.title : '';
    title.addEventListener('input', () => { const r = recipeOf(recipeId); if (r && r.title !== title.value) recipeId = ''; paint(); });
    const chips = h('div', { class: 'chip-row' });
    function paint() {
      const recipes = PL.state.recipes.slice().sort((a, b) => a.title.localeCompare(b.title));
      chips.replaceChildren(...recipes.map((r) => h('button', { type: 'button', class: 'person-pick', 'aria-pressed': r.id === recipeId ? 'true' : 'false',
        onclick: () => { recipeId = r.id; title.value = r.title; paint(); } }, (r.emoji ? r.emoji + ' ' : '') + r.title)));
    }
    paint();
    async function save() {
      const t = title.value.trim();
      if (!t) { ui.toast('Please type what is for ' + SLOT_LABEL[slot].toLowerCase() + '.'); title.focus(); return; }
      if (await PL.store.set('meals', mealId(date, slot), { date, slot, title: t, recipeId })) { s.close(); ui.toast('Saved.'); }
    }
    const footer = [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), ui.button('Save', { variant: 'primary', big: true, onClick: save })];
    if (m) footer.unshift(ui.button('Clear', { variant: 'danger', icon: 'trash', onClick: async () => { if (await PL.store.del('meals', m.id)) { s.close(); ui.toast('Cleared.'); } } }));
    const rec = recipeOf(m && m.recipeId);
    if (rec) footer.splice(footer.length - 1, 0, ui.button('View recipe', { icon: 'book', onClick: () => { s.close(); openRecipe(rec); } }));
    const s = ui.sheet({
      title: SLOT_LABEL[slot] + ' · ' + D.fmt(date, { weekday: 'long', month: 'short', day: 'numeric' }), footer,
      body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
        ui.field('What is for ' + SLOT_LABEL[slot].toLowerCase() + '?', title),
        PL.state.recipes.length ? h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Or pick a recipe'), chips) : h('p', { class: 'hint' }, 'Add recipes in the Recipes tab to pick them here.'))
    });
  }

  /* ---------- AI dinner ideas (asks Claude through the page's "sample" ability) ---------- */
  async function openSuggest(weekStart) {
    const dates = Array.from({ length: 7 }, (_, i) => D.addDays(weekStart, i)).filter((d) => d >= D.today() && !mealAt(d, 'dinner'));
    if (!dates.length) { ui.toast('Every dinner from today on is already planned this week.'); return; }
    const sample = window.claude && (await window.claude.use('sample'));
    if (!sample) { ui.toast('Dinner ideas are not available on this page.'); return; }
    const notes = h('textarea', { rows: '3', placeholder: 'Optional. For example: no pork, quick meals on school nights, one vegetarian night.' });
    const out = h('div', { class: 'stack' });
    let picks = [];
    async function ask() {
      go.disabled = true;
      out.replaceChildren(h('p', { class: 'sub', role: 'status' }, 'Thinking of dinners… this can take a little while.'));
      const rs = PL.state.recipes;
      const prompt = 'You plan simple, affordable family dinners. Suggest one dinner for each of these dates: ' + dates.join(', ') + '.\n' +
        (rs.length ? 'The family already has these recipes (prefer them, and use their exact id): ' + JSON.stringify(rs.map((r) => ({ id: r.id, title: r.title }))) + '.\n' : '') +
        'Do not repeat a dinner. Mix meat, fish and vegetarian meals.\n' + (notes.value.trim() ? 'Family notes (follow them): ' + notes.value.trim().slice(0, 400) + '\n' : '') +
        'Reply with ONLY a JSON array like [{"date":"YYYY-MM-DD","title":"Dinner name","recipeId":"id from the list or empty string"}].';
      try {
        const res = await sample.json(prompt, { modelTier: 'quick', cache: false });
        const ids = new Set(rs.map((r) => r.id));
        picks = (Array.isArray(res) ? res : []).filter((x) => x && dates.includes(x.date) && typeof x.title === 'string' && x.title.trim())
          .map((x) => ({ date: x.date, title: x.title.trim().slice(0, 80), recipeId: ids.has(x.recipeId) ? x.recipeId : '', on: true }))
          .filter((x, i, a) => a.findIndex((y) => y.date === x.date) === i);
        if (!picks.length) { out.replaceChildren(h('p', { class: 'form-error' }, 'No ideas came back. Please try again.')); go.disabled = false; return; }
        out.replaceChildren(h('p', { class: 'ai-note' }, 'Untick any you do not want. Nothing is saved until you press Add to plan.'),
          ...picks.map((p) => { const cb = h('input', { type: 'checkbox', checked: true, 'aria-label': p.title }); cb.addEventListener('change', () => { p.on = cb.checked; });
            return h('label', { class: 'ai-pick' }, cb, h('span', { class: 'meal-slot' }, D.fmt(p.date, { weekday: 'short' })), h('span', { class: 'meal-title' }, p.title)); }));
        addBtn.hidden = false;
      } catch (e) {
        const code = e && e.code;
        out.replaceChildren(h('p', { class: 'form-error' }, (e && e.userMessage) || (code === 'not_granted' ? 'Claude was not allowed to help. You can try again and allow it.' : code === 'rate_limited' ? 'Too many tries. Please wait a moment.' : 'Could not get ideas right now. Please try again.')));
      }
      go.disabled = false;
    }
    async function addAll() {
      let n = 0;
      for (const p of picks.filter((x) => x.on)) { if (mealAt(p.date, 'dinner')) continue; if (await PL.store.set('meals', mealId(p.date, 'dinner'), { date: p.date, slot: 'dinner', title: p.title, recipeId: p.recipeId })) n++; }
      s.close(); ui.toast(n + (n === 1 ? ' dinner added.' : ' dinners added.'));
    }
    const go = ui.button('Suggest dinners', { icon: 'sparkle', onClick: ask });
    const addBtn = ui.button('Add to plan', { variant: 'primary', big: true, onClick: addAll });
    addBtn.hidden = true;
    const s = ui.sheet({ title: 'Dinner ideas', wide: true, footer: [ui.button('Close', { variant: 'ghost', big: true, onClick: () => s.close() }), addBtn],
      body: h('div', { class: 'event-form' }, h('p', { class: 'sub' }, 'Claude suggests dinners for the days that are still empty. It uses your own Claude account and sees only your recipe names and the notes you type.'), ui.field('Anything to keep in mind?', notes), go, out) });
  }

  /* ---------- screen ---------- */
  /* ---------- Shop: type a meal, get the ingredients, send them to a list ---------- */
  async function askIngredients(name, servings) {
    const found = PL.state.recipes.find((r) => r.title.trim().toLowerCase() === name.trim().toLowerCase());
    if (found && found.ingredients.length) return { title: found.title, ingredients: found.ingredients.slice(), steps: found.steps, fromRecipe: found };
    const sample = window.claude && (await window.claude.use('sample'));
    if (!sample) throw { code: 'unavailable' };
    const res = await sample.json('A family wants to cook "' + name.trim().slice(0, 80) + '" for ' + servings + ' people. List what to buy to make it. ' +
      'Give each ingredient with a simple amount, like "500 g ground beef" or "2 onions". Leave out water. Include the usual staples (oil, salt, spices) only if they matter to the dish. ' +
      'Also give 4 to 8 short cooking steps. Reply with ONLY JSON like {"title":"Nice name of the dish","ingredients":["..."],"steps":["..."]}.', { modelTier: 'quick', cache: false });
    const ing = (res && Array.isArray(res.ingredients) ? res.ingredients : []).map((x) => String(x).trim().slice(0, 100)).filter(Boolean).slice(0, 40);
    if (!ing.length) throw { code: 'empty' };
    const steps = (Array.isArray(res.steps) ? res.steps : []).map((x) => String(x).trim()).filter(Boolean).join('\n').slice(0, 3000);
    return { title: String(res.title || name).trim().slice(0, 80) || name, ingredients: ing, steps, fromRecipe: null };
  }

  PL.mealsUi = { askIngredients, dayRows, openRecipe, openRecipeForm, sendToList };

  PL.screens.meals = {
    mount(root, params) {
      let tab = (params && params.tab) || PL.storage.get('mealTab', 'plan');
      let cursor = D.startOfWeek((params && params.date) || D.today(), PL.state.settings.weekStart);
      let showAll = PL.storage.get('mealAll', false);
      const el = h('div', { class: 'screen-page meals' });
      root.append(el);

      function planPanel() {
        const today = D.today();
        const slots = showAll ? SLOTS : SLOTS.filter((s) => s.id === 'dinner');
        const end = D.addDays(cursor, 6);
        const label = D.fmt(cursor, { month: 'short', day: 'numeric' }) + ' – ' + D.fmt(end, { month: 'short', day: 'numeric' });
        const bar = h('div', { class: 'chores-bar' },
          ui.iconButton('left', 'Previous week', () => { cursor = D.addDays(cursor, -7); render(); }),
          ui.button('This week', { onClick: () => { cursor = D.startOfWeek(today, PL.state.settings.weekStart); render(); } }),
          ui.iconButton('right', 'Next week', () => { cursor = D.addDays(cursor, 7); render(); }),
          h('h2', { class: 'chores-day' }, label));
        const opts = h('div', { class: 'meal-opts' },
          ui.toggle('Show breakfast and lunch', showAll, (v) => { showAll = v; PL.storage.set('mealAll', v); render(); }).el,
          ui.button('Suggest dinners', { icon: 'sparkle', onClick: () => openSuggest(cursor) }),
          ui.button('Add week to a list', { icon: 'cart', onClick: async () => {
            const ids = new Set();
            for (let i = 0; i < 7; i++) SLOTS.forEach((s) => { const m = mealAt(D.addDays(cursor, i), s.id); if (m && m.recipeId) ids.add(m.recipeId); });
            const ings = [...ids].map(recipeOf).filter(Boolean).flatMap((r) => r.ingredients);
            if (!ings.length) { ui.toast('No recipes are planned this week. Pick a recipe for a meal first.'); return; }
            await sendToList(ings, 'Ingredients for the week');
          } }));
        const days = Array.from({ length: 7 }, (_, i) => {
          const date = D.addDays(cursor, i);
          return h('section', { class: 'chore-group meal-day' + (date === today ? ' today' : ''), 'aria-label': D.fmt(date, { weekday: 'long', month: 'long', day: 'numeric' }) },
            h('div', { class: 'cg-head' }, h('h3', { class: 'cg-name' }, D.fmt(date, { weekday: 'long' })), h('span', { class: 'cg-count' }, D.fmt(date, { month: 'short', day: 'numeric' }))),
            slots.map((s) => {
              const m = mealAt(date, s.id);
              const r = m && recipeOf(m.recipeId);
              return h('button', { type: 'button', class: 'meal-row', onclick: () => openSlot(date, s.id), 'aria-label': SLOT_LABEL[s.id] + ', ' + (m ? m.title : 'nothing planned. Tap to add') },
                h('span', { class: 'meal-slot' }, SLOT_LABEL[s.id]),
                h('span', { class: 'meal-title' + (m ? '' : ' empty') }, m ? m.title : 'Add'),
                r ? icon('book') : (m ? null : icon('plus')));
            }));
        });
        return [bar, opts, h('div', { class: 'meal-week' }, days)];
      }

      function recipesPanel() {
        const rs = PL.state.recipes.slice().sort((a, b) => a.title.localeCompare(b.title));
        return [
          h('div', { class: 'chores-bar' }, ui.button('New recipe', { variant: 'primary', big: true, icon: 'plus', onClick: () => openRecipeForm(null) })),
          rs.length
            ? h('div', { class: 'family-grid' }, rs.map((r) => h('button', { type: 'button', class: 'list-card recipe-card', onclick: () => openRecipe(r) },
                h('span', { class: 'recipe-emoji' }, r.emoji || '🍽️'), h('strong', {}, r.title), h('span', { class: 'sub' }, r.ingredients.length + (r.ingredients.length === 1 ? ' ingredient' : ' ingredients')))))
            : ui.emptyState({ icon: 'book', title: 'No recipes yet', text: 'Keep the family favorites here. You can send a recipe’s ingredients to a shopping list.', action: ui.button('Add the first recipe', { icon: 'plus', onClick: () => openRecipeForm(null) }) })
        ];
      }

      let shop = { name: '', servings: 4, result: null, busy: false, err: '', saveRecipe: true, planDate: '' };
      function shopPanel() {
        const name = h('input', { type: 'text', maxlength: '80', placeholder: 'For example: Chicken adobo', autocomplete: 'off', 'aria-label': 'Meal name' });
        name.value = shop.name;
        name.addEventListener('input', () => { shop.name = name.value; });
        const sv = h('input', { type: 'number', min: '1', max: '30', class: 'num', 'aria-label': 'How many people' });
        sv.value = shop.servings;
        sv.addEventListener('input', () => { shop.servings = Math.min(30, Math.max(1, parseInt(sv.value, 10) || 4)); });
        async function find(e) {
          e && e.preventDefault();
          const n = name.value.trim();
          if (!n) { ui.toast('Please type a meal first.'); name.focus(); return; }
          shop.name = n; shop.busy = true; shop.err = ''; shop.result = null; render();
          try {
            const r = await askIngredients(n, shop.servings);
            shop.result = { title: r.title, steps: r.steps, fromRecipe: r.fromRecipe, items: r.ingredients.map((t) => ({ text: t, on: true })) };
          } catch (err) {
            const c = err && err.code;
            shop.err = (err && err.userMessage) || (c === 'not_granted' ? 'Claude was not allowed to help. You can try again and allow it.' : c === 'rate_limited' ? 'Too many tries. Please wait a moment.' : c === 'unavailable' ? 'Ingredient ideas are not available on this page. You can still add the meal as a recipe.' : 'Could not get the ingredients. Please try again, or write the recipe yourself.');
          }
          shop.busy = false; render();
        }
        const parts = [h('form', { class: 'shop-box', onsubmit: find },
          h('p', { class: 'sub' }, 'Type something you feel like eating. You get the shopping list for it, ready to add to your groceries.'),
          h('div', { class: 'shop-row' }, ui.field('What do you want to eat?', name), ui.field('People', sv)),
          ui.button(shop.busy ? 'Looking…' : 'Find ingredients', { variant: 'primary', big: true, icon: 'sparkle', type: 'submit', disabled: shop.busy }))];
        if (shop.busy) parts.push(h('p', { class: 'sub', role: 'status' }, 'Thinking of what you need… this can take a little while.'));
        if (shop.err) parts.push(h('p', { class: 'form-error', role: 'alert' }, shop.err));
        const r = shop.result;
        if (r) {
          const rows = r.items.map((it) => {
            const cb = h('input', { type: 'checkbox', 'aria-label': 'Buy ' + it.text }); cb.checked = it.on; cb.addEventListener('change', () => { it.on = cb.checked; sync(); });
            const t = h('input', { type: 'text', maxlength: '100', 'aria-label': 'Ingredient' }); t.value = it.text; t.addEventListener('input', () => { it.text = t.value; });
            return h('div', { class: 'ing-pick' }, cb, t);
          });
          const days = Array.from({ length: 7 }, (_, i) => D.addDays(D.today(), i));
          const planSel = ui.select([{ value: '', label: 'Not on the plan' }].concat(days.map((d) => ({ value: d, label: 'Dinner on ' + D.fmt(d, { weekday: 'long', month: 'short', day: 'numeric' }) }))), shop.planDate, (v) => { shop.planDate = v; });
          const saveTog = r.fromRecipe ? null : ui.toggle('Also save it as a recipe', shop.saveRecipe, (v) => { shop.saveRecipe = v; });
          const addBtn = ui.button('Add', { variant: 'primary', big: true, icon: 'cart', onClick: async () => {
            const chosen = r.items.filter((x) => x.on && x.text.trim()).map((x) => x.text.trim());
            if (!chosen.length) { ui.toast('Tick at least one ingredient.'); return; }
            const ok = await sendToList(chosen, r.title);
            if (!ok) return;
            let recipeId = r.fromRecipe ? r.fromRecipe.id : '';
            if (!r.fromRecipe && shop.saveRecipe) recipeId = (await PL.store.add('recipes', { title: r.title, emoji: '🍽️', servings: shop.servings, ingredients: r.items.filter((x) => x.text.trim()).map((x) => x.text.trim()), steps: r.steps })) || '';
            if (shop.planDate) await PL.store.set('meals', mealId(shop.planDate, 'dinner'), { date: shop.planDate, slot: 'dinner', title: r.title, recipeId });
            shop = { name: '', servings: shop.servings, result: null, busy: false, err: '', saveRecipe: true, planDate: '' };
            render();
          } });
          const sync = () => { const n = r.items.filter((x) => x.on).length; addBtn.querySelector('span').textContent = 'Add ' + n + (n === 1 ? ' item' : ' items') + ' to a list'; addBtn.disabled = !n; };
          sync();
          parts.push(h('section', { class: 'card shop-box' },
            h('h2', {}, r.title), h('p', { class: 'sub' }, (r.fromRecipe ? 'From your recipe box. ' : 'Amounts are a guess. ') + 'Untick what you already have, or fix a line.'),
            h('div', { class: 'stack' }, rows), saveTog ? saveTog.el : null, ui.field('Put it on the plan?', planSel), addBtn));
        }
        return parts;
      }

      function render() {
        const tabs = ui.segmented([{ value: 'plan', label: 'Plan' }, { value: 'recipes', label: 'Recipes' }, { value: 'shop', label: 'Shop' }], tab, (v) => { tab = v; PL.storage.set('mealTab', v); render(); }, 'Meals');
        tabs.el.classList.add('task-tabs');
        el.replaceChildren(h('header', { class: 'page-head' }, h('h1', {}, 'Meals')), tabs.el, ...(tab === 'recipes' ? recipesPanel() : tab === 'shop' ? shopPanel() : planPanel()));
      }
      render();
      return { update: () => { const a = document.activeElement; if (tab === 'shop' && a && el.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return; render(); }, destroy() {} };
    }
  };
})();

</script>
<script>
/*
 * screens/countdowns.js — days until the things the family is looking forward to.
 *   countdowns/{id}  { title, date, emoji, yearly }
 * A yearly countdown (a birthday, a holiday) always points at the next one.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, D = PL.D, ui = PL.ui;
  const EMOJI = ['🎉', '🎂', '🎄', '✈️', '🏖️', '🏫', '🎃', '❤️', '⭐', '🏠', '⚽', '🎁'];

  // The date a countdown points at: itself, or the next time it comes round.
  function target(c, today) {
    if (!c.yearly) return c.date;
    const [, m, d] = c.date.split('-').map(Number);
    const year = Number(today.slice(0, 4));
    const make = (y) => y + '-' + D.pad(m) + '-' + D.pad(Math.min(d, D.daysInMonth(y, m - 1)));
    const t = make(year);
    return t >= today ? t : make(year + 1);
  }
  function daysLeft(c, today) { return D.diff(today || D.today(), target(c, today || D.today())); }
  function label(n) { return n === 0 ? 'Today!' : n === 1 ? 'Tomorrow' : n > 0 ? n + ' days' : Math.abs(n) === 1 ? 'Yesterday' : Math.abs(n) + ' days ago'; }

  function sorted() {
    const today = D.today();
    return PL.state.countdowns.map((c) => ({ c, n: daysLeft(c, today) })).sort((a, b) => (a.n < 0) - (b.n < 0) || (a.n >= 0 ? a.n - b.n : b.n - a.n));
  }

  function openForm(c) {
    let emoji = c ? c.emoji : EMOJI[0], yearly = c ? c.yearly : false;
    const title = h('input', { type: 'text', maxlength: '60', placeholder: 'For example: Beach trip', autocomplete: 'off', autofocus: true });
    title.value = c ? c.title : '';
    const date = h('input', { type: 'date' });
    date.value = c ? c.date : D.addDays(D.today(), 30);
    const grid = h('div', { class: 'avatar-grid', role: 'radiogroup', 'aria-label': 'Picture' });
    const paint = () => grid.replaceChildren(...EMOJI.map((e) => h('button', { type: 'button', role: 'radio', class: 'avatar-opt' + (e === emoji ? ' on' : ''), 'aria-checked': e === emoji ? 'true' : 'false', 'aria-label': e, onclick: () => { emoji = e; paint(); } }, e)));
    paint();
    const tog = ui.toggle('Every year', yearly, (v) => { yearly = v; });
    async function save() {
      const t = title.value.trim();
      if (!t) { ui.toast('Please type a name first.'); title.focus(); return; }
      if (!date.value) { ui.toast('Please pick a date.'); date.focus(); return; }
      const data = { title: t, date: date.value, emoji, yearly };
      const ok = c ? await PL.store.set('countdowns', c.id, data) : !!(await PL.store.add('countdowns', data));
      if (ok) { s.close(); ui.toast('Saved.'); }
    }
    const footer = [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), ui.button(c ? 'Save' : 'Add countdown', { variant: 'primary', big: true, onClick: save })];
    if (c) footer.unshift(ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: async () => { if (await ui.confirm({ title: 'Delete this countdown?', message: '“' + c.title + '” will be removed for everyone.', confirmLabel: 'Delete', danger: true }) && await PL.store.del('countdowns', c.id)) { s.close(); ui.toast('Deleted.'); } } }));
    const s = ui.sheet({ title: c ? 'Edit countdown' : 'New countdown', footer,
      body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
        ui.field('Name', title), ui.field('Date', date), h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Picture'), grid), tog.el) });
  }

  function widget() {
    const rows = sorted().filter((x) => x.n >= 0).slice(0, 4);
    if (!rows.length) return ui.emptyState({ icon: 'cake', title: 'Nothing to count down to', text: 'Add a trip, a birthday or a holiday.', action: ui.button('Add countdown', { icon: 'plus', onClick: () => openForm(null) }) });
    return h('div', { class: 'stack' }, rows.map(({ c, n }) => h('button', { type: 'button', class: 'cd-row', onclick: () => openForm(c) },
      h('span', { class: 'cd-emoji' }, c.emoji || '🎉'), h('span', { class: 'cd-title' }, c.title), h('span', { class: 'cd-count' }, label(n)))));
  }

  PL.countdownsUi = { widget, daysLeft, openForm };

  PL.screens.countdowns = {
    mount(root) {
      const el = h('div', { class: 'screen-page countdowns' });
      root.append(el);
      function render() {
        const all = sorted();
        el.replaceChildren(
          h('header', { class: 'page-head' }, h('h1', {}, 'Countdowns'), ui.button('New countdown', { variant: 'primary', big: true, icon: 'plus', onClick: () => openForm(null) })),
          all.length
            ? h('div', { class: 'cd-grid' }, all.map(({ c, n }) => h('button', { type: 'button', class: 'cd-card', onclick: () => openForm(c), 'aria-label': c.title + ', ' + label(n) },
                h('span', { class: 'cd-emoji' }, c.emoji || '🎉'), h('span', { class: 'cd-num' }, n === 0 ? 'Today!' : Math.abs(n)), h('span', { class: 'sub' }, n === 0 ? '' : n > 0 ? (n === 1 ? 'day to go' : 'days to go') : (Math.abs(n) === 1 ? 'day ago' : 'days ago')),
                h('span', { class: 'cd-title' }, c.title), h('span', { class: 'sub' }, D.fmt(target(c, D.today()), { month: 'short', day: 'numeric', year: 'numeric' })))))
            : ui.emptyState({ icon: 'cake', title: 'Nothing to count down to', text: 'Count the days to a trip, a birthday, the last day of school or a holiday.', action: ui.button('Add the first one', { icon: 'plus', onClick: () => openForm(null) }) }));
      }
      render();
      return { update: render, destroy() {} };
    }
  };
})();

</script>
<script>
/*
 * screens/dashboard.js — the Home screen: clock, reminders and widgets.
 *
 * Widgets are listed in the registry below. To add a widget later (tasks, meals,
 * weather…), add an entry here; the Settings screen and the layout code pick it up
 * automatically. Each device saves its own widget order, size and visibility.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;

  const timeText = (d) => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: PL.state.settings.hour12 !== false });
  const open = (screen, params) => () => PL.nav.go(screen, params);
  const newEvent = (date) => () => PL.eventUi.openForm({ mode: 'create', date: date || D.today() });

  /* ---------- widgets ---------- */
  function todayWidget() {
    const today = D.today();
    const items = PL.cal.instances(today, today);
    const shown = items.slice(0, 6);
    return h('div', { class: 'stack' },
      items.length
        ? [h('div', { class: 'card-list' }, shown.map((i) => PL.eventUi.card(i))),
           items.length > shown.length ? h('button', { class: 'link-btn', type: 'button', onclick: open('calendar', { view: 'day', date: today }) }, '+' + (items.length - shown.length) + ' more today') : null]
        : ui.emptyState({ icon: 'sparkle', title: 'Nothing planned today', text: 'A free day. Add something if you like.', action: ui.button('Add an event', { icon: 'plus', onClick: newEvent(today) }) }));
  }

  function weekWidget() {
    const ws = PL.state.settings.weekStart;
    const start = D.startOfWeek(D.today(), ws);
    const end = D.addDays(start, 6);
    const all = PL.cal.instances(start, end);
    const today = D.today();
    return h('div', { class: 'week-strip' }, Array.from({ length: 7 }, (_, i) => {
      const key = D.addDays(start, i);
      const items = all.filter((x) => x.date === key);
      return h('button', { type: 'button', class: 'wk-day' + (key === today ? ' today' : ''), onclick: open('calendar', { view: 'day', date: key }),
        'aria-label': D.fmt(key, { weekday: 'long', month: 'long', day: 'numeric' }) + ', ' + items.length + (items.length === 1 ? ' event' : ' events') },
        h('span', { class: 'wk-name' }, D.fmt(key, { weekday: 'short' })),
        h('span', { class: 'wk-num' }, D.parse(key).getDate()),
        h('span', { class: 'wk-items' },
          items.slice(0, 3).map((x) => h('span', { class: 'wk-item', style: '--c:' + PL.cal.color(x) }, x.title)),
          items.length > 3 ? h('span', { class: 'wk-more' }, '+' + (items.length - 3) + ' more') : (items.length ? null : h('span', { class: 'wk-free' }, 'Free'))));
    }));
  }

  function upcomingWidget() {
    const today = D.today();
    const items = PL.cal.instances(D.addDays(today, 1), D.addDays(today, 60)).slice(0, 6);
    if (!items.length) return ui.emptyState({ icon: 'calendar', title: 'Nothing coming up', text: 'New events will show here.' });
    return h('div', { class: 'upcoming' }, items.map((i) => {
      const people = PL.cal.people(i);
      return h('button', { type: 'button', class: 'up-row', style: '--c:' + PL.cal.color(i), onclick: () => PL.eventUi.openDetail(i) },
        h('span', { class: 'up-date' }, h('b', {}, D.parse(i.date).getDate()), D.fmt(i.date, { weekday: 'short' })),
        h('span', { class: 'up-main' }, h('span', { class: 'up-title' }, i.title), h('span', { class: 'sub' }, PL.cal.rangeLabel(i))),
        people.length ? h('span', { class: 'ev-people' }, people.slice(0, 3).map((p) => ui.avatar(p, 24))) : null);
    }));
  }

  function familyWidget() {
    const members = PL.state.members;
    if (!members.length) {
      return ui.emptyState({ icon: 'users', title: 'No one here yet', text: 'Add the people you live with to color-code the calendar.', action: ui.button('Add people', { icon: 'plus', onClick: open('family', { add: true }) }) });
    }
    const today = D.today();
    const all = PL.cal.instances(today, today, { all: true });
    return h('div', { class: 'member-tiles' }, members.map((m) => {
      const mine = all.filter((i) => (i.memberIds || []).includes(m.id) && i.kind !== 'birthday');
      return h('button', { type: 'button', class: 'member-tile', style: '--c:' + m.color, onclick: () => PL.familyUi.openMember(m.id) },
        ui.avatar(m, 52),
        h('span', { class: 'mt-name' }, m.name),
        h('span', { class: 'sub' }, mine.length ? mine.length + (mine.length === 1 ? ' thing today' : ' things today') : 'Free today'));
    }));
  }

  function mealsWidget() {
    const today = D.today(), tmr = D.addDays(today, 1);
    const rows = PL.mealsUi.dayRows([today, tmr]);
    if (!rows.length) return ui.emptyState({ icon: 'meal', title: 'No meals planned', text: 'Plan dinner for the week.', action: ui.button('Plan meals', { icon: 'plus', onClick: open('meals') }) });
    return h('div', { class: 'upcoming' }, rows.map((r) => h('button', { type: 'button', class: 'up-row', style: '--c:' + PL.config.palette[1].hex, onclick: open('meals', { date: r.date }) },
      h('span', { class: 'up-date' }, D.fmt(r.date, { weekday: 'short' })),
      h('span', { class: 'up-main' }, h('span', { class: 'up-title' }, r.title), h('span', { class: 'sub' }, r.slotLabel)))));
  }

  // id -> { title, action (opens the full screen), render }
  PL.widgetRegistry = {
    today:    { title: 'Today',      screen: 'calendar', params: () => ({ view: 'day', date: D.today() }), render: todayWidget },
    chores:   { title: 'Chores',     screen: 'tasks',    render: () => PL.choresUi.widget() },
    family:   { title: 'People',     screen: 'family',   render: familyWidget },
    week:     { title: 'This week',  screen: 'calendar', params: () => ({ view: 'week', date: D.today() }), render: weekWidget },
    meals:    { title: 'Meals',      screen: 'meals',    render: mealsWidget },
    photos:   { title: 'Photos',     screen: 'photos',   render: () => PL.photosUi.widget() },
    weather:  { title: 'Weather',    render: () => PL.weather.widget() },
    countdowns: { title: 'Countdowns', screen: 'countdowns', render: () => PL.countdownsUi.widget() },
    upcoming: { title: 'Coming up',  screen: 'calendar', params: () => ({ view: 'agenda', date: D.today() }), render: upcomingWidget }
  };

  /* ---------- reminders ---------- */
  function reminderBanner(inst, now) {
    let text;
    if (inst.allDay) text = inst.date === D.key(now) ? 'Today' : 'Tomorrow';
    else {
      const mins = Math.round((D.at(inst.date, inst.start).getTime() - now.getTime()) / 60000);
      text = mins > 59 ? 'In ' + Math.round(mins / 60) + ' h' : mins > 0 ? 'In ' + mins + ' min' : 'Now';
    }
    return h('button', { type: 'button', class: 'reminder', style: '--c:' + PL.cal.color(inst), onclick: () => PL.eventUi.openDetail(inst) },
      icon('bell'), h('span', { class: 'reminder-text' }, h('strong', {}, inst.title), h('span', {}, text + (inst.allDay ? '' : ' · ' + PL.cal.rangeLabel(inst)))));
  }

  /* ---------- screen ---------- */
  PL.screens.home = {
    mount(root) {
      const el = h('div', { class: 'home' });
      root.append(el);
      let renderedDay = D.today(), timeEl = null, dateEl = null, timer = null;

      function tickClock() {
        const now = new Date();
        if (timeEl) timeEl.textContent = timeText(now);
        if (D.key(now) !== renderedDay) render();
      }

      function render() {
        const now = new Date();
        renderedDay = D.key(now);
        const state = PL.state;
        const hour = now.getHours();
        const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
        timeEl = h('div', { class: 'clock-time' }, timeText(now));
        dateEl = h('div', { class: 'clock-date' }, D.fmt(renderedDay, { weekday: 'long', month: 'long', day: 'numeric' }));

        const top = h('header', { class: 'home-top' },
          h('div', { class: 'clock' }, h('div', { class: 'greeting' }, greeting), timeEl, dateEl),
          h('div', { class: 'quick btn-row' }, ui.button('Wall mode', { big: true, icon: 'expand', onClick: () => PL.photos.openWall('wall') }), ui.button('Add event', { variant: 'primary', big: true, icon: 'plus', onClick: newEvent() })));

        const reminders = PL.cal.dueReminders(now);
        const remBox = reminders.length ? h('div', { class: 'reminders', role: 'status' }, reminders.map((r) => reminderBanner(r, now))) : null;

        const fresh = !state.members.length && !state.events.length;
        const welcome = fresh && state.ready ? h('section', { class: 'welcome card' },
          h('h2', {}, 'Welcome to ' + PL.config.appName),
          h('p', {}, 'Start by adding the people you live with. Everyone gets a color, so you can see at a glance who needs to be where.'),
          h('div', { class: 'btn-row' },
            ui.button('Add people', { variant: 'primary', big: true, icon: 'users', onClick: open('family', { add: true }) }),
            ui.button('Try a sample family', { big: true, icon: 'sparkle', onClick: async () => { if (await PL.data.loadSample()) ui.toast('Sample family added. You can remove it in Settings.'); } }))) : null;

        const grid = h('div', { class: 'widget-grid' }, state.device.widgets.filter((w) => w.visible && PL.widgetRegistry[w.id]).map((w) => {
          const def = PL.widgetRegistry[w.id];
          return h('section', { class: 'widget size-' + w.size, 'aria-label': def.title },
            h('div', { class: 'widget-head' }, h('h2', {}, def.title),
              def.screen ? h('button', { type: 'button', class: 'link-btn', onclick: open(def.screen, def.params ? def.params() : undefined) }, 'Open', icon('right')) : null),
            def.render());
        }));

        el.replaceChildren(...[top, remBox, welcome, grid].filter(Boolean));
      }

      render();
      timer = setInterval(tickClock, 15000);
      return { update: render, destroy() { clearInterval(timer); } };
    }
  };
})();


</script>
<script>
/*
 * screens/calendar.js — Day, Week, Month and Agenda views.
 * Tap an event to open it. Tap a day number to open that day. In Month view,
 * press-and-hold (touch) or double-click (mouse) an empty spot to add an event.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;

  const addOn = (date) => PL.eventUi.openForm({ mode: 'create', date });

  PL.screens.calendar = {
    mount(root, params) {
      const p = params || {};
      let view = PL.config.calendarViews.some((v) => v.value === p.view) ? p.view : PL.state.device.defaultView;
      let cursor = p.date || D.today();
      const el = h('div', { class: 'screen-page calendar' });
      root.append(el);

      /* ----- navigation ----- */
      function step(dir) {
        if (view === 'day') cursor = D.addDays(cursor, dir);
        else if (view === 'week') cursor = D.addDays(cursor, 7 * dir);
        else if (view === 'month') cursor = D.addMonths(cursor, dir);
        else cursor = D.addDays(cursor, 14 * dir);
        render();
      }
      function title() {
        const ws = PL.state.settings.weekStart;
        if (view === 'day') return D.fmt(cursor, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        if (view === 'month') return D.fmt(cursor, { month: 'long', year: 'numeric' });
        const a = view === 'week' ? D.startOfWeek(cursor, ws) : cursor;
        const b = D.addDays(a, view === 'week' ? 6 : 13);
        const sameMonth = D.parse(a).getMonth() === D.parse(b).getMonth();
        return D.fmt(a, { month: 'short', day: 'numeric' }) + ' – ' + D.fmt(b, sameMonth ? { day: 'numeric' } : { month: 'short', day: 'numeric' });
      }

      /* ----- views ----- */
      function dayView() {
        const items = PL.cal.instances(cursor, cursor);
        return h('div', { class: 'day-view' },
          items.length ? h('div', { class: 'card-list' }, items.map((i) => PL.eventUi.card(i)))
            : ui.emptyState({ icon: 'sparkle', title: 'Nothing planned', text: cursor === D.today() ? 'A free day.' : 'No events on this day.', action: ui.button('Add an event', { variant: 'primary', icon: 'plus', onClick: () => addOn(cursor) }) }));
      }

      function weekView() {
        const ws = PL.state.settings.weekStart;
        const start = D.startOfWeek(cursor, ws);
        const all = PL.cal.instances(start, D.addDays(start, 6));
        const today = D.today();
        return h('div', { class: 'week-view' }, Array.from({ length: 7 }, (_, n) => {
          const key = D.addDays(start, n);
          const items = all.filter((x) => x.date === key);
          const col = h('section', { class: 'wv-day' + (key === today ? ' today' : ''), 'aria-label': D.fmt(key, { weekday: 'long', month: 'long', day: 'numeric' }) },
            h('button', { type: 'button', class: 'wv-head', onclick: () => { view = 'day'; cursor = key; render(); } },
              h('span', { class: 'wv-name' }, D.fmt(key, { weekday: 'short' })), h('span', { class: 'wv-num' }, D.parse(key).getDate())),
            h('div', { class: 'wv-list' }, items.length ? items.map((i) => PL.eventUi.card(i, { compact: true })) : h('span', { class: 'wk-free' }, 'Free')),
            h('button', { type: 'button', class: 'wv-add', 'aria-label': 'Add event on ' + D.fmt(key, { weekday: 'long', month: 'long', day: 'numeric' }), onclick: () => addOn(key) }, icon('plus')));
          return col;
        }));
      }

      function monthView() {
        const ws = PL.state.settings.weekStart;
        const first = D.monthStart(cursor);
        const gridStart = D.startOfWeek(first, ws);
        const cd = D.parse(cursor);
        const rows = Math.ceil(((D.dow(first) - ws + 7) % 7 + D.daysInMonth(cd.getFullYear(), cd.getMonth())) / 7);
        const gridEnd = D.addDays(gridStart, rows * 7 - 1);
        const all = PL.cal.instances(gridStart, gridEnd);
        const today = D.today();
        const month = D.parse(cursor).getMonth();
        const head = h('div', { class: 'mv-weekdays', 'aria-hidden': 'true' }, Array.from({ length: 7 }, (_, i) => h('span', {}, D.weekdayShort((ws + i) % 7))));
        const cells = [];
        for (let n = 0; n < rows * 7; n++) {
          const key = D.addDays(gridStart, n);
          const items = all.filter((x) => x.date === key);
          const out = D.parse(key).getMonth() !== month;
          const cell = h('div', { class: 'mv-cell' + (key === today ? ' today' : '') + (out ? ' out' : ''), role: 'group',
            'aria-label': D.fmt(key, { weekday: 'long', month: 'long', day: 'numeric' }) + ', ' + items.length + (items.length === 1 ? ' event' : ' events') },
            h('button', { type: 'button', class: 'mv-num', onclick: () => { view = 'day'; cursor = key; render(); } }, D.parse(key).getDate()),
            h('div', { class: 'mv-items' },
              items.slice(0, 3).map((i) => h('button', { type: 'button', class: 'mv-ev', style: '--c:' + PL.cal.color(i), onclick: () => PL.eventUi.openDetail(i), title: i.title }, i.title)),
              items.length > 3 ? h('button', { type: 'button', class: 'mv-more', onclick: () => { view = 'day'; cursor = key; render(); } }, '+' + (items.length - 3) + ' more') : null));
          ui.onHold(cell, () => addOn(key));
          cells.push(cell);
        }
        return h('div', { class: 'month-view' }, head, h('div', { class: 'mv-grid', style: '--rows:' + rows }, cells));
      }

      function agendaView() {
        const from = cursor, to = D.addDays(cursor, 13);
        const all = PL.cal.instances(from, to);
        if (!all.length) return ui.emptyState({ icon: 'calendar', title: 'Nothing in these two weeks', action: ui.button('Add an event', { variant: 'primary', icon: 'plus', onClick: () => addOn(cursor) }) });
        const days = [];
        for (const i of all) { const last = days[days.length - 1]; if (last && last.key === i.date) last.items.push(i); else days.push({ key: i.date, items: [i] }); }
        return h('div', { class: 'agenda' }, days.map((d) => h('section', { class: 'ag-day' },
          h('h3', { class: 'ag-head' + (d.key === D.today() ? ' today' : '') }, d.key === D.today() ? 'Today' : D.fmt(d.key, { weekday: 'long', month: 'long', day: 'numeric' })),
          h('div', { class: 'card-list' }, d.items.map((i) => PL.eventUi.card(i))))));
      }

      /* ----- frame ----- */
      function render() {
        const views = { day: dayView, week: weekView, month: monthView, agenda: agendaView };
        const seg = ui.segmented(PL.config.calendarViews, view, (v) => { view = v; render(); }, 'Calendar view');
        const body = h('div', { class: 'cal-body' }, views[view]());
        ui.onSwipe(body, () => step(1), () => step(-1));
        el.replaceChildren(
          h('header', { class: 'cal-bar' },
            h('div', { class: 'cal-nav' },
              ui.iconButton('left', 'Previous', () => step(-1)),
              ui.button('Today', { onClick: () => { cursor = D.today(); render(); } }),
              ui.iconButton('right', 'Next', () => step(1))),
            h('h1', { class: 'cal-title', 'aria-live': 'polite' }, title()),
            seg.el,
            ui.button('Add', { variant: 'primary', icon: 'plus', onClick: () => addOn(view === 'day' ? cursor : D.today()) })),
          body);
      }

      render();
      return { update: render, destroy() {} };
    }
  };
})();


</script>
<script>
/*
 * screens/settings.js — household settings (shared), this-device settings, data tools, about.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, ui = PL.ui, C = PL.config;

  const section = (title, intro, ...kids) => h('section', { class: 'card settings-card' }, h('h2', {}, title), intro ? h('p', { class: 'sub' }, intro) : null, ...kids);

  // Spread cards over 1, 2 or 3 columns (by width), each card going under the shortest column so far.
  // Cards keep their order reading left to right, top to bottom, and the columns end at nearly the same height.
  function bestSplit(heights, n) {
    const N = heights.length, gap = 16;
    if (n === 1) return heights.map(() => 0);
    let best = null, bestScore = Infinity;
    const a = Array(N).fill(0);
    const count = n ** N;
    for (let code = 0; code < count; code++) {
      let x = code;
      for (let i = 0; i < N; i++) { a[i] = x % n; x = Math.floor(x / n); }
      if (a[0] !== 0) continue;                     // Household always starts top left
      const tall = Array(n).fill(-gap), used = Array(n).fill(0);
      let order = 0;
      for (let i = 0; i < N; i++) { tall[a[i]] += heights[i] + gap; used[a[i]]++; order += a[i] * (N - i); }
      if (used.some((u) => u === 0)) continue;      // no empty columns
      const score = (Math.max(...tall) - Math.min(...tall)) + order * 0.5;
      if (score < bestScore) { bestScore = score; best = a.slice(); }
    }
    return best || heights.map((_, i) => i % n);
  }

  function balancedColumns() {
    const wrap = h('div', { class: 'settings-cols' });
    let cards = [], lastW = 0, ro = null, timer = null;
    function lay() {
      const w = wrap.clientWidth;
      if (!w || !cards.length) return;
      lastW = w;
      const n = w >= 1120 ? 3 : w >= 700 ? 2 : 1;
      const cols = Array.from({ length: n }, () => h('div', { class: 'settings-col' }));
      // Measure each card at column width first, then place it under the shortest column.
      const probe = h('div', { class: 'settings-col settings-probe', style: 'width:' + ((w - (n - 1) * 16) / n) + 'px' });
      wrap.replaceChildren(probe);
      const heights = cards.map((c) => { probe.append(c); return c.offsetHeight; });
      // Try every way to split the cards into columns (keeping their order inside each
      // column) and keep the split whose columns end closest to the same height.
      // Then each column stretches its cards a little so all bottoms line up.
      const pick = bestSplit(heights, n);
      cards.forEach((c, i) => cols[pick[i]].append(c));
      wrap.classList.toggle('even', n > 1);
      wrap.replaceChildren(...cols);
    }
    if (window.ResizeObserver) {
      ro = new ResizeObserver(() => { if (Math.abs(wrap.clientWidth - lastW) > 2) { clearTimeout(timer); timer = setTimeout(lay, 60); } });
      ro.observe(wrap);
    }
    return {
      wrap,
      set(list) { cards = list; requestAnimationFrame(lay); lay(); }
    };
  }

  PL.screens.settings = {
    mount(root) {
      const el = h('div', { class: 'screen-page settings' });
      root.append(el);
      const masonry = balancedColumns();

      function render() {
        const S = PL.state.settings, dev = PL.state.device;

        /* household (shared by everyone) */
        const nameIn = h('input', { type: 'text', maxlength: 40, value: S.householdName || '' });
        nameIn.addEventListener('change', () => PL.store.saveSettings({ householdName: nameIn.value.trim() || C.householdDefaults.householdName }));
        const weekStart = ui.segmented([{ value: 0, label: 'Sunday' }, { value: 1, label: 'Monday' }], S.weekStart, (v) => PL.store.saveSettings({ weekStart: Number(v) }), 'Week starts on');
        const clock = ui.segmented([{ value: 'true', label: '12-hour' }, { value: 'false', label: '24-hour' }], String(S.hour12 !== false), (v) => PL.store.saveSettings({ hour12: v === 'true' }), 'Clock');
        const starsToggle = ui.toggle('Stars and rewards', S.starsOn !== false, async (on) => {
          if (await PL.pin.require('Enter the PIN to change this.')) PL.store.saveSettings({ starsOn: on }); else render();
        });
        const household = section('Home', 'Shared by everyone using this calendar.',
          ui.field('Home name', nameIn), ui.field('Week starts on', weekStart.el), ui.field('Clock', clock.el), starsToggle.el);

        /* parent PIN */
        const pinOn = PL.pin.isSet();
        const pinCard = section('Parent PIN', 'Keeps little fingers out of chore, routine and reward settings, and asks before stars are spent. It is a convenience, not real security: anyone who can open this page can get around it.',
          h('p', {}, pinOn ? 'A PIN is set.' : 'No PIN is set.'),
          h('div', { class: 'btn-row' },
            ui.button(pinOn ? 'Change PIN' : 'Set a PIN', { icon: 'edit', onClick: async () => { if (await PL.pin.change()) ui.toast('PIN saved.'); } }),
            pinOn ? ui.button('Lock now', { icon: 'eyeoff', onClick: () => { PL.pin.lockNow(); ui.toast('Locked.'); } }) : null,
            pinOn ? ui.button('Turn off PIN', { variant: 'danger', icon: 'trash', onClick: async () => { if (await PL.pin.remove()) ui.toast('PIN turned off.'); } }) : null));

        /* weather */
        const wxUnit = ui.segmented([{ value: 'c', label: '°C' }, { value: 'f', label: '°F' }], S.tempUnit === 'f' ? 'f' : 'c', (v) => PL.store.saveSettings({ tempUnit: v }), 'Temperature');
        const wxCard = section('Weather', 'Shown on Home. Uses the free Open-Meteo service and needs the internet.',
          h('p', {}, S.weatherPlace ? 'Place: ' + S.weatherPlace.name : 'No place chosen.'),
          h('div', { class: 'btn-row' }, ui.button(S.weatherPlace ? 'Change place' : 'Choose a place', { icon: 'pin', onClick: () => PL.weather.openPlace() }),
            S.weatherPlace ? ui.button('Remove place', { variant: 'danger', icon: 'trash', onClick: () => PL.store.saveSettings({ weatherPlace: null }) }) : null),
          ui.field('Temperature', wxUnit.el));

        /* this device */
        const text = ui.segmented(C.textScales, dev.textScale, (v) => PL.store.setDevice({ textScale: Number(v) }), 'Text size');
        const view = ui.segmented(C.calendarViews, dev.defaultView, (v) => PL.store.setDevice({ defaultView: v }), 'Starting calendar view');
        const motion = ui.toggle('Reduce motion', dev.reduceMotion, (v) => PL.store.setDevice({ reduceMotion: v }));
        const notify = ui.toggle('Event reminders on this device', !!dev.notify, async (v) => { if (v) await PL.notify.enable(); PL.store.setDevice({ notify: v }); if (v) ui.toast(PL.notify.canPopup() ? 'Reminders are on.' : 'Reminders are on, shown inside the page. Allow notifications in your browser to also get pop-ups.'); });
        const hide = PL.state.members.length ? h('div', { class: 'toggle-list' }, PL.state.members.map((m) => {
          const hidden = (dev.hiddenMembers || []).includes(m.id);
          const t = ui.toggle(m.name, !hidden, (on) => {
            const set = new Set(PL.state.device.hiddenMembers || []);
            on ? set.delete(m.id) : set.add(m.id);
            PL.store.setDevice({ hiddenMembers: [...set] });
          });
          return h('div', { class: 'toggle-row' }, ui.avatar(m, 28), t.el);
        })) : h('p', { class: 'sub' }, 'Add family members to choose who is shown.');
        const device = section('This device', 'These only change this screen, not other devices.',
          ui.field('Text size', text.el), ui.field('Starting calendar view', view.el), motion.el, notify.el,
          h('p', { class: 'hint' }, 'Reminders only appear while Kalendaryo is open.'),
          h('h3', { class: 'mini-h' }, 'Show on the calendar'), hide);

        /* home layout */
        const widgets = h('div', { class: 'widget-settings' }, dev.widgets.map((w, i) => {
          const def = PL.widgetRegistry[w.id]; if (!def) return null;
          const move = (d) => { const list = dev.widgets.slice(); const j = i + d; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; PL.store.setDevice({ widgets: list }); };
          const patch = (p) => PL.store.setDevice({ widgets: dev.widgets.map((x, k) => (k === i ? Object.assign({}, x, p) : x)) });
          return h('div', { class: 'ws-row' },
            ui.toggle(def.title, w.visible, (v) => patch({ visible: v })).el,
            ui.select(C.widgetSizes, w.size, (v) => patch({ size: v })),
            ui.iconButton('up', 'Move ' + def.title + ' up', () => move(-1)),
            ui.iconButton('down', 'Move ' + def.title + ' down', () => move(1)));
        }));
        const layout = section('Home screen', 'Choose what shows on Home on this device, and in what order.', widgets);

        /* data */
        const fileIn = h('input', { type: 'file', accept: 'application/json,.json', hidden: true });
        fileIn.addEventListener('change', async () => {
          const f = fileIn.files && fileIn.files[0]; fileIn.value = '';
          if (!f) return;
          const r = await PL.data.readBackup(f);
          if (!r.ok) { ui.toast(r.error); return; }
          const yes = await ui.confirm({ title: 'Restore this backup?', message: 'It has ' + r.counts.members + ' people, ' + r.counts.events + ' events and ' + r.counts.chores + ' chores. Items with the same name are replaced. Nothing else is deleted.', confirmLabel: 'Restore' });
          if (yes && (await PL.data.applyBackup(r.data))) ui.toast('Backup restored.');
        });
        const sampleBtn = PL.data.hasSample()
          ? ui.button('Remove sample data', { variant: 'danger', icon: 'trash', onClick: async () => { if (await ui.confirm({ title: 'Remove the sample family?', message: 'Only the sample people and events are removed. Anything you added stays.', confirmLabel: 'Remove', danger: true })) { await PL.data.removeSample(); ui.toast('Sample data removed.'); } } })
          : ui.button('Add sample family', { icon: 'sparkle', onClick: async () => { if (await PL.data.loadSample()) ui.toast('Sample family added.'); } });
        const icsIn = h('input', { type: 'file', accept: '.ics,text/calendar', hidden: true });
        icsIn.addEventListener('change', async () => {
          const f = icsIn.files && icsIn.files[0]; icsIn.value = '';
          if (f) PL.icsUi.run(f);
        });
        const data = section('Your data', 'Save a copy of everything, bring one back, or add events from a calendar file (.ics).',
          h('div', { class: 'btn-row' }, ui.button('Save a backup', { icon: 'download', onClick: () => PL.data.saveBackup() }), ui.button('Restore a backup', { icon: 'upload', onClick: () => fileIn.click() }), ui.button('Import calendar file', { icon: 'calendar', onClick: () => icsIn.click() }), sampleBtn), fileIn, icsIn);

        /* about */
        const st = PL.state;
        const about = section(PL.config.appName, 'Version ' + C.version,
          h('p', {}, st.live ? 'Shared and up to date.' : st.fromCache ? 'Showing the last saved copy. Waiting to reconnect.' : 'Not connected to the shared database.'),
          h('p', { class: 'sub' }, 'Not possible on this page: syncing with outside calendars, offline install, and turning the screen on or off. Those need a native app.'));

        // Cards in a sensible order: the family, then screens, then data. They are spread over
        // balanced columns (each card goes under the shortest column), so there are no big gaps.
        const cards = [household, pinCard, wxCard, device, layout, PL.wall.card(), data, about];
        el.replaceChildren(h('header', { class: 'page-head' }, h('h1', {}, 'Settings')), masonry.wrap);
        masonry.set(cards);
      }
      render();
      return { update: () => { const a = document.activeElement; if (!(a && el.contains(a) && a.type === 'text')) render(); }, destroy() {} };
    }
  };
})();


</script>
<script>
/*
 * shell.js — page frame, navigation (side rail on wide screens, bottom bar on phones),
 * status notice, and PL.nav.go(screen, params).
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon;
  let main, nav, banner, current = null, currentId = null, navButtons = {};

  function go(id, params) {
    if (!PL.screens[id]) id = 'home';
    if (current && current.destroy) current.destroy();
    main.replaceChildren();
    currentId = id;
    current = PL.screens[id].mount(main, params || {});
    Object.keys(navButtons).forEach((k) => {
      const on = k === id;
      navButtons[k].classList.toggle('on', on);
      if (on) navButtons[k].setAttribute('aria-current', 'page'); else navButtons[k].removeAttribute('aria-current');
    });
    main.scrollTop = 0; window.scrollTo(0, 0);
    if (PL.config.screens.find((s) => s.id === id && s.ready)) PL.storage.set('lastScreen', id);
    document.title = (id === 'home' ? '' : PL.config.screens.find((s) => s.id === id).label + ' · ') + PL.config.appName;
  }

  function status() {
    const s = PL.state;
    let msg = '';
    if (!s.available && s.ready) msg = 'Not connected to the shared database. Changes cannot be saved from this view.';
    else if (!s.online) msg = 'You are offline. Showing the last saved copy.';
    else if (s.fromCache && s.ready) msg = 'Loading the latest from your family…';
    banner.textContent = msg;
    banner.hidden = !msg;
  }

  function build(root) {
    banner = h('div', { class: 'status-banner', role: 'status', hidden: true });
    main = h('main', { class: 'main', id: 'main', tabindex: '-1' });
    nav = h('nav', { class: 'nav', 'aria-label': 'Main' }, PL.config.screens.filter((s) => !s.hidden).map((s) => {
      const b = h('button', { type: 'button', class: 'nav-btn' + (s.ready ? '' : ' soon'), onclick: () => go(s.id) },
        icon(s.icon), h('span', { class: 'nav-label' }, s.label));
      navButtons[s.id] = b;
      return b;
    }));
    const brand = h('div', { class: 'brand', 'aria-hidden': 'true' }, icon('calendar'), h('span', { class: 'brand-text' }, h('span', { class: 'brand-name' }, PL.config.appName), h('span', { class: 'brand-tag' }, PL.config.tagline)));
    root.replaceChildren(h('div', { class: 'app' }, h('aside', { class: 'rail' }, brand, nav), h('div', { class: 'content' }, banner, main)));
    PL.store.subscribe(() => { status(); if (current && current.update) current.update(); });
  }

  PL.nav = { go, current: () => currentId };
  PL.shell = { build, status };
})();


</script>
<script>
/* main.js — start the app. */
(function () {
  const PL = window.PL;
  function boot() {
    if (PL.beforeBoot && PL.beforeBoot() === false) return; // the web version shows its start page instead
    const root = document.getElementById('porchlight-root');
    const started = PL.store.init(); // loads device settings and the saved copy right away
    PL.shell.build(root);
    const saved = PL.storage.get('lastScreen', 'home');
    PL.nav.go(PL.screens[saved] ? saved : 'home');
    PL.shell.status();
    PL.notify.start();
    started.then(() => PL.shell.status());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();


</script>
