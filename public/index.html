<script>
/*
 * wall.js — Wall mode: a full-screen family board for a tablet, TV or old screen on the wall.
 *
 *   ┌ big clock ─────────────────────────────── greeting ┐
 *   │ Today            │  the panels you choose            │
 *   │ ── Coming up ──  │  (Chores, Meals, Weather …)       │
 *   └──────────────────┴───────────────────────────────────┘
 *
 * "Today and coming up" is one box, always on the left: it is the first thing you read.
 * The other panels share the space to its right and are always sized to fit one screen
 * (a phone is too small for that, so there the board is one column that scrolls).
 *
 * Kids can tick their own chores on the wall: they tap their name in the Chores panel,
 * get a big, simple screen of today's chores and routine steps, and a small celebration
 * when everything is done. Ticking never needs the parent PIN; changing chores still does.
 *
 *   PL.wall.open('wall' | 'photos')   PL.wall.card() for Settings   PL.wall.openOptions()
 * Choices are saved on this device, so each screen in the house can show different panels.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;

  // The panels. `on` = shown by default. "agenda" is the left box.
  const PANELS = [
    { id: 'agenda', label: 'Today and coming up', on: true },
    { id: 'chores', label: 'Chores', on: true, tall: true },
    { id: 'weather', label: 'Weather', on: true },
    { id: 'meals', label: 'Meals', on: true },
    { id: 'countdowns', label: 'Countdowns', on: true },
    { id: 'photos', label: 'Photos', on: true, tall: true },
    { id: 'week', label: 'This week', on: false, wide: true },
    { id: 'shopping', label: 'Shopping list', on: false },
    { id: 'family', label: 'People', on: false }
  ];
  const PHOTO_MODES = [{ value: 'tile', label: 'In a panel' }, { value: 'background', label: 'Background' }, { value: 'off', label: 'Off' }];
  const KID_IDLE_MS = 20000, CHEER_MS = 6000;

  function settings() {
    const saved = (PL.state.device && PL.state.device.wall) || {};
    const sp = saved.panels || {};
    const panels = {};
    PANELS.forEach((p) => { panels[p.id] = typeof sp[p.id] === 'boolean' ? sp[p.id] : p.on; });
    // Older choices had "Today" and "Coming up" as two panels.
    if (typeof sp.agenda !== 'boolean' && sp.today === false && sp.upcoming === false) panels.agenda = false;
    return { panels, photo: PHOTO_MODES.some((m) => m.value === saved.photo) ? saved.photo : 'tile', layout: cleanLayout(saved.layout) };
  }
  function save(patch) {
    const cur = settings();
    PL.store.setDevice({ wall: { panels: Object.assign({}, cur.panels, patch.panels || {}), photo: patch.photo || cur.photo, layout: patch.layout !== undefined ? patch.layout : cur.layout } });
  }

  /* ---------- your own layout (Arrange) ----------
   * The board is a grid of cells: 12 x 8 on a wide screen, 8 x 12 on a tall one. Each card has a
   * box { x, y, w, h } in cells. When you drop a card, it takes exactly that spot; the cards it
   * covers move into the space it left (or other free space) and resize to fit. Nothing overlaps
   * and the board always fits the screen. A screen remembers one layout per shape:
   *   layout[shape] = { boxes: { id: { x, y, w, h } } }
   */
  const GRIDS = { land: { c: 12, r: 8 }, port: { c: 8, r: 12 } };
  const MIN = 2; // the smallest a card can be: 2 x 2 cells
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const inside = (b, g) => b.x >= 0 && b.y >= 0 && b.w >= 1 && b.h >= 1 && b.x + b.w <= g.c && b.y + b.h <= g.r;
  const sameBox = (a, b) => !!a && !!b && a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h;
  function occupancy(boxes, g) {
    const occ = Array.from({ length: g.r }, () => Array(g.c).fill(null));
    Object.keys(boxes).forEach((id) => { const b = boxes[id]; for (let i = 0; i < b.h; i++) for (let j = 0; j < b.w; j++) if (occ[b.y + i] && b.x + j < g.c) occ[b.y + i][b.x + j] = id; });
    return occ;
  }
  const freeIn = (occ, b) => { for (let i = 0; i < b.h; i++) for (let j = 0; j < b.w; j++) if (occ[b.y + i][b.x + j]) return false; return true; };
  const mark = (occ, b, id) => { for (let i = 0; i < b.h; i++) for (let j = 0; j < b.w; j++) occ[b.y + i][b.x + j] = id; };

  // Older layouts kept an order and sizes: pack them in order to get boxes.
  function packOrder(order, size, g) {
    const occ = Array.from({ length: g.r }, () => Array(g.c).fill(null));
    const pos = {};
    order.forEach((id) => {
      const z = size[id]; if (!z) return;
      for (let y = 0; y + z.h <= g.r; y++) for (let x = 0; x + z.w <= g.c; x++) {
        const b = { x, y, w: z.w, h: z.h };
        if (freeIn(occ, b)) { mark(occ, b, id); pos[id] = b; return; }
      }
    });
    return pos;
  }
  function cleanLayout(l) {
    const out = {};
    if (!l || typeof l !== 'object') return out;
    const known = new Set(PANELS.map((p) => p.id));
    Object.keys(GRIDS).forEach((o) => {
      const g = GRIDS[o], src = l[o];
      if (!src || typeof src !== 'object') return;
      let raw = {};
      if (src.boxes && typeof src.boxes === 'object') raw = src.boxes;
      else if (Array.isArray(src.order)) {
        const size = {};
        src.order.forEach((id) => { const z = src.size && src.size[id]; if (z) size[id] = { w: z.w | 0, h: z.h | 0 }; });
        raw = packOrder(src.order.filter((id) => known.has(id)), size, g);
      } else raw = src; // the first version: one box per card
      const boxes = {};
      Object.keys(raw).forEach((id) => {
        const b = raw[id];
        if (!known.has(id) || !b || typeof b !== 'object') return;
        const box = { x: b.x | 0, y: b.y | 0, w: b.w | 0, h: b.h | 0 };
        if (inside(box, g) && Object.keys(boxes).every((k) => !overlaps(box, boxes[k]))) boxes[id] = box;
      });
      out[o] = { boxes };
    });
    return out;
  }
  // The biggest free spot for a card that was just turned on.
  function findSpot(occ, g) {
    for (const [w, hh] of [[4, 3], [3, 3], [4, 2], [3, 2], [2, 3], [2, 2]]) {
      for (let y = 0; y + hh <= g.r; y++) for (let x = 0; x + w <= g.c; x++) { const b = { x, y, w, h: hh }; if (freeIn(occ, b)) return b; }
    }
    return null;
  }
  // The best free spot for a card that has to move: as big as it was if possible, else as big as fits.
  // Among spots of that size, prefer ones inside the space the moved card left, then snug against
  // edges and other cards (so the next card still has room), then close to where it was.
  function bestSpot(occ, g, want, near) {
    const sizes = [];
    for (let w = Math.min(want.w, g.c); w >= MIN; w--) for (let hh = Math.min(want.h, g.r); hh >= MIN; hh--) sizes.push({ w, h: hh });
    sizes.sort((a, b) => (b.w * b.h - a.w * a.h) || (Math.abs(a.w / a.h - want.w / want.h) - Math.abs(b.w / b.h - want.w / want.h)));
    const cx = want.x + want.w / 2, cy = want.y + want.h / 2;
    const solid = (x, y) => x < 0 || y < 0 || x >= g.c || y >= g.r || !!occ[y][x];
    let best = null;
    for (const z of sizes) {
      if (best && z.w * z.h < best.area) break;
      for (let y = 0; y + z.h <= g.r; y++) for (let x = 0; x + z.w <= g.c; x++) {
        const b = { x, y, w: z.w, h: z.h };
        if (!freeIn(occ, b)) continue;
        let inNear = 0;
        for (let i = 0; i < z.h; i++) for (let j = 0; j < z.w; j++) if (x + j >= near.x && x + j < near.x + near.w && y + i >= near.y && y + i < near.y + near.h) inNear++;
        let contact = 0;
        for (let j = 0; j < z.w; j++) { if (solid(x + j, y - 1)) contact++; if (solid(x + j, y + z.h)) contact++; }
        for (let i = 0; i < z.h; i++) { if (solid(x - 1, y + i)) contact++; if (solid(x + z.w, y + i)) contact++; }
        const d = Math.abs(x + z.w / 2 - cx) + Math.abs(y + z.h / 2 - cy);
        const score = inNear * 3 + contact * 2 - d * 0.25;
        if (!best || z.w * z.h > best.area || score > best.score) best = { box: b, area: z.w * z.h, score };
      }
    }
    return best && best.box;
  }
  // Put card `id` at `target`. Cards it covers move into free space (first where it came from) and
  // shrink if they must. Returns { ok, boxes, covered, failed }.
  function takeSpot(boxes, id, target, g) {
    const from = boxes[id];
    const base = {};
    Object.keys(boxes).forEach((k) => { if (k !== id) base[k] = Object.assign({}, boxes[k]); });
    const covered = Object.keys(base).filter((k) => overlaps(base[k], target));
    covered.forEach((k) => delete base[k]);
    base[id] = Object.assign({}, target);
    // Try the covered cards in every order (there are only a few) and keep the plan that
    // keeps them biggest; ties go to the plan that keeps them closest to where they were.
    const perms = (a) => (a.length <= 1 ? [a] : a.flatMap((x, i) => perms(a.slice(0, i).concat(a.slice(i + 1))).map((r) => [x].concat(r))));
    const orders = covered.length <= 5 ? perms(covered) : [covered.slice().sort((a, b) => boxes[b].w * boxes[b].h - boxes[a].w * boxes[a].h)];
    let best = null;
    for (const order of orders) {
      const next = Object.assign({}, base);
      const occ = occupancy(next, g);
      const failed = [];
      let area = 0, dist = 0;
      order.forEach((k) => {
        const spot = bestSpot(occ, g, boxes[k], from || target);
        if (!spot) { failed.push(k); return; }
        next[k] = spot; mark(occ, spot, k);
        area += spot.w * spot.h;
        dist += Math.abs(spot.x - boxes[k].x) + Math.abs(spot.y - boxes[k].y);
      });
      const score = { ok: !failed.length, area, dist };
      if (!best || (score.ok && !best.ok) || (score.ok === best.ok && (area > best.area || (area === best.area && dist < best.dist)))) best = Object.assign(score, { boxes: next, failed });
      if (best.ok && best.area === covered.reduce((a, k) => a + boxes[k].w * boxes[k].h, 0)) break; // nobody had to shrink
    }
    return { ok: best ? best.ok : true, boxes: best ? best.boxes : base, covered, failed: best ? best.failed : [] };
  }
  // After a drop, close the gaps the move made: cards next to a newly empty space grow into it.
  // Space that was already empty before the move is left alone.
  function fillGaps(before, after, g, skip) {
    const was = occupancy(before, g), now = occupancy(after, g);
    const fresh = (x, y) => !!was[y][x] && !now[y][x];
    const boxes = {};
    Object.keys(after).forEach((k) => { boxes[k] = Object.assign({}, after[k]); });
    for (let pass = 0; pass < 40; pass++) {
      let grew = false;
      for (const k of Object.keys(boxes).sort((a, b) => (a === skip) - (b === skip))) {
        const b = boxes[k];
        const tries = [
          { dx: 0, dy: 0, dw: 0, dh: 1, strip: () => Array.from({ length: b.w }, (_, j) => [b.x + j, b.y + b.h]) },
          { dx: 0, dy: -1, dw: 0, dh: 1, strip: () => Array.from({ length: b.w }, (_, j) => [b.x + j, b.y - 1]) },
          { dx: 0, dy: 0, dw: 1, dh: 0, strip: () => Array.from({ length: b.h }, (_, i) => [b.x + b.w, b.y + i]) },
          { dx: -1, dy: 0, dw: 1, dh: 0, strip: () => Array.from({ length: b.h }, (_, i) => [b.x - 1, b.y + i]) }
        ];
        for (const t of tries) {
          const cells = t.strip();
          if (!cells.every(([x, y]) => x >= 0 && y >= 0 && x < g.c && y < g.r && fresh(x, y) && !now[y][x])) continue;
          cells.forEach(([x, y]) => { now[y][x] = k; });
          b.x += t.dx; b.y += t.dy; b.w += t.dw; b.h += t.dh;
          grew = true; break;
        }
      }
      if (!grew) break;
    }
    return boxes;
  }

  /* ---------- the choices (used in Settings and inside wall mode) ---------- */
  function optionsBody() {
    const s = settings();
    const toggles = h('div', { class: 'wall-toggles' }, PANELS.map((p) => ui.toggle(p.label, s.panels[p.id], (v) => save({ panels: { [p.id]: v } })).el));
    const photo = ui.segmented(PHOTO_MODES, s.photo, (v) => save({ photo: v }), 'Photos on the wall');
    return h('div', { class: 'stack' },
      h('h3', { class: 'mini-h' }, 'Show on the wall'), toggles,
      ui.field('Photos', photo.el),
      h('p', { class: 'hint' }, 'Today and coming up always sits on the left. Everything is sized to fit one screen: the more you turn on, the smaller each part gets. These choices are saved on this device only.'));
  }
  function openOptions() {
    const s = ui.sheet({ title: 'Choose what shows', body: optionsBody(), footer: [ui.button('Done', { variant: 'primary', big: true, onClick: () => s.close() })] });
  }

  /* ---------- people, chores and stars for today ---------- */
  const starsOn = () => PL.stars && PL.stars.starsOn();
  const val = (x) => (x.stars == null ? 1 : x.stars);
  function todayFor(memberId) {
    const today = D.today();
    const chores = PL.chores.instances(today, today).filter((i) => (i.memberId || null) === memberId);
    const routines = PL.routines.forDay(today).filter((r) => (r.memberId || null) === memberId);
    return { chores, routines };
  }
  function tally(t) {
    const total = t.chores.length + t.routines.reduce((a, r) => a + r.total, 0);
    const done = t.chores.filter((c) => c.done).length + t.routines.reduce((a, r) => a + r.done, 0);
    return { done, total };
  }
  function starsToday(t) {
    return t.chores.filter((c) => c.done).reduce((a, c) => a + val(c.chore), 0) + t.routines.filter((r) => r.complete).reduce((a, r) => a + val(r.routine), 0);
  }
  // Everyone with something to do today: children first (big buttons), then the rest, then "anyone".
  function peopleToday() {
    const out = [];
    PL.state.members.forEach((m) => { const t = todayFor(m.id); if (t.chores.length || t.routines.length) out.push({ member: m, t }); });
    const anyone = todayFor(null);
    const kids = out.filter((x) => x.member.role === 'child');
    const big = kids.length ? kids : out;
    const small = out.filter((x) => !big.includes(x));
    if (anyone.chores.length || anyone.routines.length) small.push({ member: null, t: anyone });
    return { big, small };
  }
  const nameOf = (m) => (m ? m.name : 'Anyone');
  const tint = (m) => 'color-mix(in srgb, ' + (m ? m.color : PL.config.neutralColor) + ' 30%, #fff)';
  const countText = (p) => (p.total && p.done === p.total ? 'All done' : p.done + ' of ' + p.total + ' done');

  /* ---------- panels ---------- */
  function agendaPanel() {
    const today = D.today();
    const items = PL.cal.instances(today, today);
    const later = PL.cal.instances(D.addDays(today, 1), D.addDays(today, 30)).slice(0, 14);
    const who = (i) => { const ps = PL.cal.people(i); return ps.length ? ps.map((p) => p.name).join(', ') : ''; };
    const when = (i) => (i.allDay ? 'All day' : D.fmtTime(i.start, PL.state.settings.hour12 !== false));
    return h('div', { class: 'ag' },
      h('div', { class: 'ag-head' }, h('h2', {}, 'Today'), items.length ? h('span', { class: 'ag-count' }, items.length + (items.length === 1 ? ' thing' : ' things')) : ''),
      items.length
        ? h('div', { class: 'ag-today' }, items.map((i) => h('div', { class: 'ag-ev', style: '--c:' + PL.cal.color(i) },
            h('span', { class: 'ag-bar', 'aria-hidden': 'true' }),
            h('span', { class: 'ag-main' }, h('span', { class: 'ag-meta' }, when(i) + (who(i) ? ' · ' + who(i) : '')), h('span', { class: 'ag-title' }, i.title)))))
        : h('p', { class: 'wall-quiet' }, 'Nothing planned today.'),
      h('div', { class: 'ag-sep', role: 'separator' }, h('h3', {}, 'Coming up'), h('span', { class: 'ag-line', 'aria-hidden': 'true' })),
      later.length
        ? h('div', { class: 'ag-later' }, later.map((i) => h('div', { class: 'ag-row', style: '--c:' + PL.cal.color(i) },
            h('span', { class: 'ag-date' }, h('b', {}, String(D.parse(i.date).getDate())), D.fmt(i.date, { weekday: 'short' })),
            h('span', { class: 'ag-bar', 'aria-hidden': 'true' }),
            h('span', { class: 'ag-main' }, h('span', { class: 'ag-title' }, i.title), h('span', { class: 'ag-meta' }, when(i))))))
        : h('p', { class: 'wall-quiet' }, 'Nothing else on the calendar yet.'));
  }

  function choresPanel(openKid) {
    const { big, small } = peopleToday();
    if (!big.length && !small.length) return h('p', { class: 'wall-quiet' }, 'No chores today.');
    const star = (m) => (starsOn() && m ? h('span', { class: 'star-chip wch-star' }, icon('star'), String(Math.max(0, PL.stars.balance(m.id)))) : null);
    return h('div', { class: 'wch' },
      big.length ? h('p', { class: 'wch-hint' }, 'Tap your name') : '',
      big.map(({ member, t }) => {
        const p = tally(t);
        return h('button', { type: 'button', class: 'wch-kid', style: '--c:' + member.color + ';--t:' + tint(member), onclick: () => openKid(member ? member.id : null),
          'aria-label': member.name + ', ' + countText(p) + (starsOn() ? ', ' + Math.max(0, PL.stars.balance(member.id)) + ' stars' : '') + '. Open ' + member.name + '’s chores' },
          ui.avatar(member, 64),
          h('span', { class: 'wch-mid' },
            h('span', { class: 'wch-top' }, h('span', { class: 'wch-name' }, member.name), star(member)),
            h('span', { class: 'cg-bar', 'aria-hidden': 'true' }, h('i', { style: '--p:' + (p.total ? Math.round((p.done / p.total) * 100) : 0) + '%' })),
            h('span', { class: 'wch-count' + (p.done === p.total ? ' all' : '') }, countText(p))),
          icon('right'));
      }),
      small.length ? h('div', { class: 'wch-small' }, small.map(({ member, t }) => {
        const p = tally(t);
        return h('button', { type: 'button', class: 'wch-row', onclick: () => openKid(member ? member.id : null), 'aria-label': nameOf(member) + ', ' + countText(p) },
          h('span', {}, nameOf(member)), h('span', { class: 'wch-count' + (p.done === p.total ? ' all' : '') }, countText(p)));
      })) : '');
  }

  function shoppingPanel() {

      const gx = parseFloat(st.columnGap) || 0, gy = parseFloat(st.rowGap) || 0;

    const rectsNow = () => new Map([...freeEl.querySelectorAll('.arr-item')].map((el) => [el.dataset.pid, el.getBoundingClientRect()]));
    // Slide cards from where they were to where they are now.
    function slideFrom(before, skip) {
      if (calm()) return;
      freeEl.querySelectorAll('.arr-item').forEach((el) => {
        const a = before.get(el.dataset.pid);
        if (!a || el.dataset.pid === skip || !el.animate) return;
        const z = el.getBoundingClientRect();
        const dx = a.left - z.left, dy = a.top - z.top, sx = a.width / Math.max(1, z.width), sy = a.height / Math.max(1, z.height);
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) return;

      draft = { boxes: nextBoxes };
      paintPanels();
      slideFrom(before, null);
      Object.keys(nextBoxes).forEach((k) => {
        if (k === movedId || !prev[k]) return;
        const a = prev[k], b = nextBoxes[k];
        const tag = b.w * b.h < a.w * a.h ? 'Smaller' : b.w * b.h > a.w * a.h ? 'Bigger' : (a.x !== b.x || a.y !== b.y) ? 'Moved' : '';
        const el = freeEl.querySelector('[data-pid="' + k + '"]');

      return { l: e.clientX - r.left < z, r: r.right - e.clientX < z, t: e.clientY - r.top < z, b: r.bottom - e.clientY < z };

    const clearPreview = () => freeEl.querySelectorAll('.covered').forEach((x) => x.classList.remove('covered'));

      });

        const from = Object.assign({}, draft.boxes[p.id]);
        let started = false, frame = 0, last = e, plan = null, target = null;
        const ghost = h('div', { class: 'arr-ghost' });
        const dest = h('div', { class: 'arr-dest', 'aria-hidden': 'true' });

          const pt = pitch(g);

          el.style.transform = 'translate(' + (tx - el.offsetLeft) + 'px,' + (ty - el.offsetTop) + 'px)';
          const t = { x: Math.max(0, Math.min(g.c - from.w, Math.round(tx / pt.x))), y: Math.max(0, Math.min(g.r - from.h, Math.round(ty / pt.y))), w: from.w, h: from.h };

          target = t;
          clearPreview();
          place(ghost, t);
          if (sameBox(t, from)) { plan = null; ghost.classList.remove('bad'); dest.hidden = true; arrHint.textContent = HINT; return; }
          plan = takeSpot(draft.boxes, p.id, t, g);
          ghost.classList.toggle('bad', !plan.ok);
          plan.covered.forEach((k) => { const x = freeEl.querySelector('[data-pid="' + k + '"]'); if (x) x.classList.add('covered'); });
          dest.hidden = !plan.covered.length || !plan.ok;
          if (!dest.hidden) { place(dest, from); dest.textContent = andList(plan.covered) + (plan.covered.length > 1 ? ' move here' : ' moves here'); }
          arrHint.textContent = !plan.ok ? 'No room for ' + andList(plan.failed) + ' there. Try another spot, or make a card smaller.'
            : plan.covered.length ? 'Let go to put ' + p.label + ' here. ' + andList(plan.covered) + (plan.covered.length > 1 ? ' will move.' : ' will move.')

          if (!started) return;

          if (plan && plan.ok) {
            const a = el.getBoundingClientRect();
            const filled = fillGaps(draft.boxes, plan.boxes, g, p.id);
            commit(filled, p.id);
            const nel = freeEl.querySelector('[data-pid="' + p.id + '"]');
            if (nel && nel.animate && !calm()) { const z = nel.getBoundingClientRect(); nel.animate([{ transform: 'translate(' + (a.left - z.left) + 'px,' + (a.top - z.top) + 'px)' }, { transform: 'none' }], { duration: 220, easing: 'ease-out' }); }

      }

      // Resize from any edge or corner. Cards it grows over move out of the way and shrink if they
      // must; when nothing more fits, the edge turns red and stops.
      function startResize(e, k) {
        const start = JSON.parse(JSON.stringify(draft.boxes));
        const orig = start[p.id];
        const sx = e.clientX, sy = e.clientY;
        el.classList.add('resizing');
        let changed = false;
        const show = () => { const z = draft.boxes[p.id]; sizeTag.textContent = z.w + ' wide · ' + z.h + ' tall'; };

          slideFrom(before, p.id);

        };

    }
    function resetArrange() {
      const s = settings();

    }

    function paint() {
      root.className = 'wall ' + (curMode === 'wall' ? 'board' : 'photos') + ['idle', 'bgphoto', 'scroll', 'port', 'arranging'].filter((k) => root.classList.contains(k)).map((k) => ' ' + k).join('');
      modeBtn.replaceChildren(icon(curMode === 'wall' ? 'image' : 'calendar'), h('span', {}, curMode === 'wall' ? 'Photos only' : 'Show the board'));
      modeBtn.setAttribute('aria-label', curMode === 'wall' ? 'Photos only' : 'Show the board');

      arrBtn.hidden = curMode !== 'wall' || root.classList.contains('scroll');

      if (curMode === 'wall') { paintPanels(); kid.paint(); }
      else root.classList.toggle('nophotos', !PL.photos.list().length);
    }

      const s = settings();
      if (curMode === 'photos' || s.photo === 'background') bg.next(); else bg.el.forEach((x) => x.classList.remove('on'));

    }

    root.addEventListener('pointerdown', wake); root.addEventListener('mousemove', wake);

    timers.push(setInterval(tick, 10000), setInterval(() => { if (!kid.isOpen() && !arranging) paint(); }, 60000), setInterval(nextPhoto, 12000));

    return { close, openKid: kid.show, arrange: startArrange };
  }

  /* ---------- Settings card ---------- */
  function card() {
    return h('section', { class: 'card settings-card' }, h('h2', {}, 'Wall mode'),
      h('p', { class: 'sub' }, 'Turn a tablet, TV or old screen into a family board: a big clock, today and what is coming up, and the parts of Home you choose, all on one screen. Kids can tick their own chores on it.'),
      h('div', { class: 'btn-row' }, ui.button('Start wall mode', { variant: 'primary', icon: 'expand', onClick: () => open('wall') })),
      optionsBody());
  }

  PL.wall = { open, card, openOptions, PANELS, layoutTools: { takeSpot, fillGaps, GRIDS } };
})();

<script>
/*
 * notify.js — event reminders on this device. They only appear while Kalendaryo is open
 * (a web page cannot wake itself up). Each reminder shows once.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const D = PL.D;
  const fired = new Set(PL.storage.get('fired', []));
  const keyOf = (i) => i.date + '|' + (i.id || i.eventId || i.title) + '|' + (i.start || '');

  function check() {
    if (!PL.state.device.notify || !PL.state.ready) return;
    const now = new Date();
    PL.cal.dueReminders(now).forEach((i) => {
      const k = keyOf(i);
      if (fired.has(k)) return;
      fired.add(k);
      PL.storage.set('fired', [...fired].slice(-200));
      const when = i.allDay ? 'Today' : PL.cal.rangeLabel(i);
      PL.ui.toast('Reminder: ' + i.title + ' · ' + when);
      try { if (window.Notification && Notification.permission === 'granted') new Notification(i.title, { body: when }); } catch (e) { /* ignore */ }
    });
  }

  async function enable() {
    try { if (window.Notification && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) { /* ignore */ }
    return true;
  }
  const canPopup = () => { try { return !!window.Notification && Notification.permission === 'granted'; } catch (e) { return false; } };

  PL.notify = { check, enable, canPopup, start() { setInterval(check, 30000); setTimeout(check, 4000); } };
})();

<script>
/*
 * screens/family.js — family profiles: list, add, edit, remove, and a per-person view.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, D = PL.D, ui = PL.ui;
  const roleLabel = (r) => (PL.config.roles.find((x) => x.value === r) || { label: 'Family' }).label;

  function nextColor() {
    const used = new Set(PL.state.members.map((m) => m.color));
    const free = PL.config.palette.find((p) => !used.has(p.hex));
    return (free || PL.config.palette[PL.state.members.length % PL.config.palette.length]).hex;
  }

  /* ---------- add / edit form ---------- */
  function openForm(member) {
    const editing = !!member;
    const m = member || { name: '', role: 'parent', avatar: PL.config.avatars[PL.state.members.length % PL.config.avatars.length], color: nextColor(), birthday: '' };
    let avatar = m.avatar || '';
    const name = h('input', { type: 'text', maxlength: 30, value: m.name, placeholder: 'Name', autocomplete: 'off', autofocus: true });
    const role = ui.segmented(PL.config.roles, m.role, null, 'Role');
    const color = ui.colorPicker(m.color, false);
    const bday = h('input', { type: 'date', value: m.birthday || '' });
    const avatarWrap = h('div', { class: 'avatar-grid', role: 'radiogroup', 'aria-label': 'Picture' });
    function paintAvatars() {
      avatarWrap.replaceChildren(...PL.config.avatars.map((a) => h('button', {
        type: 'button', role: 'radio', class: 'avatar-opt' + (a === avatar ? ' on' : ''), 'aria-checked': a === avatar ? 'true' : 'false', 'aria-label': a,
        onclick: () => { avatar = a; paintAvatars(); }
      }, a)));
    }
    paintAvatars();
    const err = h('p', { class: 'form-error', role: 'alert', hidden: true });

    async function save() {
      const nm = name.value.trim();
      if (!nm) { err.textContent = 'Please enter a name.'; err.hidden = false; name.focus(); return; }
      const data = PL.models.member({ name: nm, role: role.get(), avatar, color: color.get(), birthday: bday.value || '', demo: m.demo });
      const ok = editing ? await PL.store.updateMember(m.id, data) : await PL.store.addMember(data);
      if (ok) { s.close(); ui.toast(editing ? 'Saved.' : nm + ' added.'); }
    }
    const footer = [];
    if (editing) footer.push(ui.button('Remove', { variant: 'danger', icon: 'trash', onClick: () => { s.close(); removeMember(m); } }));
    footer.push(h('span', { class: 'spacer' }), ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), ui.button(editing ? 'Save' : 'Add', { variant: 'primary', big: true, onClick: save }));
    const s = ui.sheet({
      title: editing ? 'Edit ' + m.name : 'Add a family member',
      body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
        ui.field('Name', name),
        ui.field('Picture', avatarWrap),
        ui.field('Role', role.el),
        ui.field('Color', color.el, 'Used on the calendar for everything this person is part of.'),
        ui.field('Birthday (optional)', bday, 'Birthdays appear on the calendar every year.'),
        err),
      footer
    });
  }

  async function removeMember(m) {
    const n = PL.state.events.filter((e) => (e.memberIds || []).includes(m.id)).length;
    const ok = await ui.confirm({
      title: 'Remove ' + m.name + '?',
      message: n ? m.name + ' will be removed from ' + n + (n === 1 ? ' event' : ' events') + '. The events themselves stay on the calendar.' : 'This cannot be undone.',
      confirmLabel: 'Remove', danger: true
    });
    if (!ok) return;
    // Take the person out of events first so nothing points at a missing profile.
    for (const e of PL.state.events.filter((x) => (x.memberIds || []).includes(m.id))) {
      await PL.store.setEvent(e.id, Object.assign({}, e, { memberIds: e.memberIds.filter((x) => x !== m.id) }));
    }
    for (const c of PL.state.chores.filter((x) => (x.memberIds || []).includes(m.id))) {
      await PL.store.setChore(c.id, Object.assign({}, c, { memberIds: c.memberIds.filter((x) => x !== m.id) }));
    }
    for (const r of PL.state.routines.filter((x) => (x.memberIds || []).includes(m.id))) {
      await PL.store.set('routines', r.id, Object.assign({}, r, { memberIds: r.memberIds.filter((x) => x !== m.id) }));
    }
    if (await PL.store.removeMember(m.id)) ui.toast(m.name + ' removed.');
  }

  /* ---------- one person's page ---------- */
  function openMember(id) {
    const m = PL.store.member(id);
    if (!m) return;
    const today = D.today();
    const items = PL.cal.instances(today, D.addDays(today, 30), { all: true })
      .filter((i) => (i.memberIds || []).includes(m.id) || (i.kind === 'birthday' && i.ownerId === m.id)).slice(0, 8);
    const s = ui.sheet({
      title: m.name,
      body: h('div', { class: 'stack' },
        h('div', { class: 'member-head', style: '--c:' + m.color }, ui.avatar(m, 64), h('div', {}, h('strong', {}, m.name), h('div', { class: 'sub' }, roleLabel(m.role) + (m.birthday ? ' · Birthday ' + D.fmt(m.birthday, { month: 'long', day: 'numeric' }) : '')))),
        h('h3', { class: 'mini-h' }, 'Next 30 days'),
        items.length ? h('div', { class: 'card-list' }, items.map((i) => PL.eventUi.card(i, { compact: true }))) : h('p', { class: 'sub' }, 'Nothing planned.')),
      footer: [ui.button('Add an event', { icon: 'plus', onClick: () => { s.close(); PL.eventUi.openForm({ mode: 'create', date: today, prefill: { title: '', memberIds: [m.id] } }); } }), h('span', { class: 'spacer' }), ui.button('Edit', { variant: 'primary', icon: 'edit', onClick: () => { s.close(); openForm(m); } })]
    });
  }

  PL.familyUi = { openForm, openMember, removeMember };

  /* ---------- screen ---------- */
  PL.screens.family = {
    mount(root, params) {
      const el = h('div', { class: 'screen-page' });
      root.append(el);
      function render() {
        const members = PL.state.members;
        el.replaceChildren(
          h('header', { class: 'page-head' }, h('h1', {}, 'People'), ui.button('Add person', { variant: 'primary', big: true, icon: 'plus', onClick: () => openForm() })),
          members.length
            ? h('div', { class: 'family-grid' }, members.map((m) => h('button', { type: 'button', class: 'family-card', style: '--c:' + m.color, onclick: () => openMember(m.id) },
                ui.avatar(m, 64), h('strong', {}, m.name), h('span', { class: 'sub' }, roleLabel(m.role)))))
            : ui.emptyState({ icon: 'users', title: 'Who is in your family?', text: 'Add everyone who shares this calendar. Each person gets their own color.', action: ui.button('Add the first person', { variant: 'primary', big: true, icon: 'plus', onClick: () => openForm() }) }),
          PL.familyExtras ? PL.familyExtras() : '');
      }
      render();
      if (params && params.add) setTimeout(() => openForm(), 0);
      if (params && params.edit) setTimeout(() => { const m = PL.store.member(params.edit); if (m) openForm(m); }, 0);
      return { update: render, destroy() {} };
    }
  };
})();


</script>
<script>
/*
 * screens/routines.js — the Routines tab: step-by-step checklists (morning, bedtime…).
 * PL.routinesUi.panel(date) draws the day; PL.routinesUi.openForm() adds or edits one.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;
  const starsOn = () => PL.stars.starsOn();
  const colorOf = (m) => (m ? m.color : PL.config.neutralColor);
  const newStepId = () => 's' + Math.random().toString(36).slice(2, 8);
  const starLabel = (n) => (n === 0 ? 'No stars' : n === 1 ? '1 star' : n + ' stars');

  /* ---------- add / edit form ---------- */
  async function openForm(opts) {
    if (!(await PL.pin.require('Enter the PIN to change routines.'))) return;
    const r = (opts && opts.routine) || null;
    const members = PL.state.members;

    const title = h('input', { type: 'text', maxlength: '60', placeholder: 'For example: Morning routine', autocomplete: 'off', autofocus: true });
    title.value = r ? r.title : '';
    const when = ui.segmented(PL.routines.WHEN, r ? r.when : 'morning', null, 'When');
    const picked = new Set(r ? (r.memberIds || []).filter((id) => PL.store.member(id)) : []);
    const peopleBox = h('div', { class: 'chip-row', role: 'group', 'aria-label': 'Who does it' }, members.map((m) => {
      const b = h('button', { type: 'button', class: 'person-pick', 'aria-pressed': picked.has(m.id) ? 'true' : 'false',
        onclick: () => { picked.has(m.id) ? picked.delete(m.id) : picked.add(m.id); b.setAttribute('aria-pressed', picked.has(m.id) ? 'true' : 'false'); } },
        ui.avatar(m, 28), m.name);
      return b;
    }));
    const days = new Set(r ? r.weekdays : [0, 1, 2, 3, 4, 5, 6]);
    const ws = PL.state.settings.weekStart || 0;
    const dayBox = h('div', { class: 'chip-row', role: 'group', 'aria-label': 'Days' }, Array.from({ length: 7 }, (_, k) => (ws + k) % 7).map((i) => {
      const b = h('button', { type: 'button', class: 'wd-pick', 'aria-pressed': days.has(i) ? 'true' : 'false', 'aria-label': D.weekdayLong(i),
        onclick: () => { days.has(i) ? days.delete(i) : days.add(i); b.setAttribute('aria-pressed', days.has(i) ? 'true' : 'false'); } }, D.weekdayShort(i).slice(0, 2));
      return b;
    }));
    const steps = h('textarea', { rows: '6', maxlength: '1600', placeholder: 'Get dressed\nEat breakfast\nBrush teeth' });
    steps.value = r ? r.steps.map((s) => s.text).join('\n') : '';
    const stars = ui.select([0, 1, 2, 3, 4, 5].map((n) => ({ value: n, label: starLabel(n) })), r ? (r.stars == null ? 1 : r.stars) : 1);

    async function save() {
      const t = title.value.trim();
      const lines = steps.value.split('\n').map((x) => x.trim()).filter(Boolean).slice(0, 20);
      if (!t) { ui.toast('Please type a name first.'); title.focus(); return; }
      if (!lines.length) { ui.toast('Add at least one step, one per line.'); steps.focus(); return; }
      if (!days.size) { ui.toast('Pick at least one day.'); return; }
      // Keep the same step id when the text did not change, so ticks are not lost.
      const old = new Map((r ? r.steps : []).map((s) => [s.text, s.id]));
      const used = new Set();
      const list = lines.map((text) => {
        let id = old.get(text);
        if (!id || used.has(id)) id = newStepId();
        used.add(id);
        return { id, text };
      });
      saveBtn.disabled = true;
      const ok = await PL.routines.save(r ? r.id : null, { title: t, when: when.get(), memberIds: [...picked], weekdays: [...days].sort((a, b) => a - b), steps: list, stars: Number(stars.value) });
      saveBtn.disabled = false;
      if (ok) { s.close(); ui.toast(r ? 'Routine saved.' : 'Routine added.'); }
    }
    async function del() {
      if (!(await ui.confirm({ title: 'Delete this routine?', message: '“' + r.title + '” and its ticks will be removed for everyone.', confirmLabel: 'Delete', danger: true }))) return;
      if (await PL.routines.remove(r)) { s.close(); ui.toast('Routine deleted.'); }
    }

    const saveBtn = ui.button(r ? 'Save changes' : 'Add routine', { variant: 'primary', big: true, onClick: save });
    const footer = [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), saveBtn];
    if (r) footer.unshift(ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: del }));
    const body = h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
      ui.field('Name', title),
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'When'), when.el),
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Who does it?'),
        members.length ? peopleBox : h('p', { class: 'hint' }, 'Add people in the People section to give routines to people.'),
        h('p', { class: 'hint' }, members.length ? 'Leave empty for anyone. Pick several and each person gets their own checklist.' : '')),
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Days'), dayBox),
      ui.field('Steps', steps, 'One step per line, in order.'),
      starsOn() ? ui.field('Stars for finishing', stars, 'Earned when every step is ticked. “Anyone” routines earn no stars.') : null);
    const s = ui.sheet({ title: r ? 'Edit routine' : 'New routine', body, footer, wide: true });
  }

  /* ---------- the day ---------- */
  function card(inst) {
    const r = inst.routine;
    const person = inst.memberId ? PL.store.member(inst.memberId) : null;
    const local = new Set(inst.doneIds); // what this card shows right now, so quick taps stay correct
    const earns = starsOn() && person && (r.stars == null ? 1 : r.stars) > 0;
    const rows = r.steps.map((st) => {
      const rowEl = h('div', { class: 'chore-row' + (local.has(st.id) ? ' done' : '') });
      const paint = () => { const on = local.has(st.id); check.setAttribute('aria-pressed', on ? 'true' : 'false'); rowEl.classList.toggle('done', on); };
      const flip = async () => {
        const before = Object.assign({}, inst, { doneIds: [...local] });
        local.has(st.id) ? local.delete(st.id) : local.add(st.id);
        paint();
        if (!(await PL.routines.toggleStep(before, st.id))) { local.has(st.id) ? local.delete(st.id) : local.add(st.id); paint(); }
      };
      const check = h('button', { type: 'button', class: 'chore-check', dataset: { key: inst.key + ':' + st.id }, 'aria-pressed': local.has(st.id) ? 'true' : 'false', 'aria-label': st.text, onclick: flip }, icon('check'));
      rowEl.append(check, h('span', { class: 'step-text', onclick: flip }, st.text));
      return rowEl;
    });
    return h('section', { class: 'chore-group routine-card' + (inst.complete ? ' complete' : ''), style: '--c:' + colorOf(person), 'aria-label': r.title + (person ? ' for ' + person.name : '') },
      h('div', { class: 'cg-head' }, ui.avatar(person, 40),
        h('div', { class: 'rt-titles' }, h('h2', { class: 'cg-name' }, r.title), h('span', { class: 'sub' }, PL.routines.whenLabel(r.when) + ' · ' + (person ? person.name : 'Anyone'))),
        h('span', { class: 'cg-count' + (inst.complete ? ' all' : '') }, inst.complete ? icon('check') : null, inst.complete ? 'All done' : inst.done + ' of ' + inst.total),
        ui.iconButton('edit', 'Edit ' + r.title, () => openForm({ routine: r }), 'sheet-close')),
      h('div', { class: 'cg-bar', 'aria-hidden': 'true' }, h('i', { style: '--p:' + Math.round((inst.done / inst.total) * 100) + '%' })),
      rows,
      inst.complete && earns ? h('p', { class: 'reward-line' }, icon('star'), '+' + (r.stars == null ? 1 : r.stars) + (r.stars === 1 || r.stars == null ? ' star' : ' stars') + ' earned') : null);
  }

  function panel(date) {
    const items = PL.routines.forDay(date);
    if (!items.length) {
      return ui.emptyState({ icon: 'list', title: PL.state.routines.length ? 'No routines on this day' : 'No routines yet',
        text: PL.state.routines.length ? 'Enjoy the break, or add one.' : 'A routine is a short checklist, like getting ready in the morning. Each person gets their own.',
        action: ui.button('Add a routine', { variant: 'primary', big: true, icon: 'plus', onClick: () => openForm() }) });
    }
    const out = [];
    let last = null;
    items.forEach((i) => {
      if (i.routine.when !== last) { last = i.routine.when; out.push(h('h3', { class: 'mini-h' }, PL.routines.whenLabel(last))); }
      out.push(card(i));
    });
    return h('div', { class: 'chores-list' }, out);
  }

  PL.routinesUi = { panel, openForm };
})();

</script>
<script>
/*
 * screens/rewards.js — the Rewards tab: star balances, a list of rewards to spend them on,
 * and a short history. Spending stars asks for the parent PIN when one is set.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;
  const EMOJI = ['🎬', '🍦', '🎮', '🍕', '🧁', '🛝', '🎨', '📚', '🚲', '🧸', '🎁', '🎢', '🌙', '⚽', '🎵', '🏊'];
  const plural = (n) => n + (n === 1 ? ' star' : ' stars');

  /* ---------- add / edit form ---------- */
  async function openForm(opts) {
    if (!(await PL.pin.require('Enter the PIN to change rewards.'))) return;
    const rw = (opts && opts.reward) || null;
    let emoji = rw ? rw.emoji : EMOJI[0];
    const title = h('input', { type: 'text', maxlength: '60', placeholder: 'For example: Pick the movie', autocomplete: 'off', autofocus: true });
    title.value = rw ? rw.title : '';
    const cost = h('input', { type: 'number', min: '1', max: '999', class: 'num', 'aria-label': 'Cost in stars' });
    cost.value = rw ? rw.cost : 5;
    const grid = h('div', { class: 'avatar-grid', role: 'radiogroup', 'aria-label': 'Picture' });
    const paint = () => grid.replaceChildren(...EMOJI.map((e) => h('button', { type: 'button', role: 'radio', class: 'avatar-opt' + (e === emoji ? ' on' : ''), 'aria-checked': e === emoji ? 'true' : 'false', 'aria-label': e, onclick: () => { emoji = e; paint(); } }, e)));
    paint();

    async function save() {
      const t = title.value.trim();
      const c = parseInt(cost.value, 10);
      if (!t) { ui.toast('Please type a name first.'); title.focus(); return; }
      if (!(c >= 1)) { ui.toast('The cost must be at least 1 star.'); cost.focus(); return; }
      saveBtn.disabled = true;
      const ok = await PL.stars.saveReward(rw ? rw.id : null, { title: t, emoji, cost: c });
      saveBtn.disabled = false;
      if (ok) { s.close(); ui.toast(rw ? 'Reward saved.' : 'Reward added.'); }
    }
    async function del() {
      if (!(await ui.confirm({ title: 'Delete this reward?', message: '“' + rw.title + '” will be removed. Past redemptions stay in the history.', confirmLabel: 'Delete', danger: true }))) return;
      if (await PL.stars.removeReward(rw.id)) { s.close(); ui.toast('Reward deleted.'); }
    }
    const saveBtn = ui.button(rw ? 'Save changes' : 'Add reward', { variant: 'primary', big: true, onClick: save });
    const footer = [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), saveBtn];
    if (rw) footer.unshift(ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: del }));
    const s = ui.sheet({
      title: rw ? 'Edit reward' : 'New reward', footer, wide: true,
      body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
        ui.field('Reward', title), ui.field('Picture', grid), ui.field('Costs (stars)', cost))
    });
  }

  /* ---------- spending ---------- */
  async function redeem(reward) {
    const eligible = PL.state.members.filter((m) => PL.stars.balance(m.id) >= reward.cost);
    if (!eligible.length) { ui.toast('Nobody has ' + plural(reward.cost) + ' yet.'); return; }
    const who = await ui.choose({
      title: 'Who is spending stars?',
      message: reward.title + ' costs ' + plural(reward.cost) + '.',
      options: eligible.map((m) => ({ value: m.id, label: m.name, description: 'Has ' + plural(PL.stars.balance(m.id)) + ', ' + (PL.stars.balance(m.id) - reward.cost) + ' left after' }))
    });
    if (!who) return;
    if (!(await PL.pin.require('Enter the PIN to spend stars.'))) return;
    const m = PL.store.member(who);
    if (await PL.stars.redeem(reward, who)) ui.toast('Enjoy! ' + (m ? m.name : 'Someone') + ' used ' + plural(reward.cost) + '.');
  }
  async function undoRedemption(x) {
    if (!(await PL.pin.require('Enter the PIN to give the stars back.'))) return;
    const m = PL.store.member(x.memberId);
    if (!(await ui.confirm({ title: 'Give the stars back?', message: (m ? m.name : 'They') + ' gets ' + plural(x.cost) + ' back and “' + x.title + '” is removed from the history.', confirmLabel: 'Give back' }))) return;
    if (await PL.stars.undo(x)) ui.toast('Stars given back.');
  }

  /* ---------- panel ---------- */
  function panel() {
    if (!PL.stars.starsOn()) {
      return ui.emptyState({ icon: 'star', title: 'Stars are turned off', text: 'Turn them on to give stars for chores and routines, and let the family spend them on rewards.',
        action: ui.button('Turn on stars', { variant: 'primary', big: true, onClick: async () => { if (await PL.pin.require('Enter the PIN to change this.')) PL.store.saveSettings({ starsOn: true }); } }) });
    }
    const shown = PL.state.members.filter((m) => m.role === 'child' || PL.stars.earned(m.id) > 0 || PL.stars.spent(m.id) > 0);
    const tiles = shown.length
      ? h('div', { class: 'star-tiles' }, shown.map((m) => h('div', { class: 'star-tile', style: '--c:' + m.color },
          ui.avatar(m, 48), h('strong', {}, m.name), h('span', { class: 'star-bal', 'aria-label': plural(Math.max(0, PL.stars.balance(m.id))) }, icon('star'), String(Math.max(0, PL.stars.balance(m.id)))))))
      : h('p', { class: 'sub' }, 'Stars are earned when chores and routines are ticked off. Give a chore to someone and it will show up here.');

    const rewards = PL.state.rewards.slice().sort((a, b) => a.cost - b.cost || a.title.localeCompare(b.title));
    const list = rewards.length
      ? h('div', { class: 'card-list' }, rewards.map((r) => h('div', { class: 'reward-card' },
          h('span', { class: 'reward-emoji', 'aria-hidden': 'true' }, r.emoji || '🎁'),
          h('div', { class: 'reward-main' }, h('strong', {}, r.title), h('span', { class: 'sub' }, plural(r.cost))),
          ui.button('Redeem', { variant: 'primary', onClick: () => redeem(r), aria: 'Redeem ' + r.title }),
          ui.iconButton('edit', 'Edit ' + r.title, () => openForm({ reward: r }), 'sheet-close'))))
      : ui.emptyState({ icon: 'star', title: 'No rewards yet', text: 'Add things worth working for, like picking the movie or an ice cream trip.', action: ui.button('Add a reward', { variant: 'primary', big: true, icon: 'plus', onClick: () => openForm() }) });

    const history = PL.state.redemptions.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
    const hist = history.length ? [h('h3', { class: 'mini-h' }, 'Recently spent'), h('div', { class: 'card-list' }, history.map((x) => {
      const m = PL.store.member(x.memberId);
      return h('div', { class: 'hist-row' }, ui.avatar(m, 32),
        h('span', { class: 'hist-main' }, h('strong', {}, x.title), h('span', { class: 'sub' }, (m ? m.name : 'Someone') + ' · ' + plural(x.cost) + ' · ' + D.fmt(x.date, { month: 'short', day: 'numeric' }))),
        ui.iconButton('trash', 'Give back the stars for ' + x.title, () => undoRedemption(x), 'sheet-close'));
    }))] : [];

    return h('div', { class: 'chores-list' }, tiles, h('h3', { class: 'mini-h' }, 'Rewards'), list, hist);
  }

  PL.rewardsUi = { panel, openForm };
})();

</script>
<script>
/*
 * screens/tasks.js — the "Chores" tab of the app, with three sections:
 *   Chores    one day at a time, grouped by person, big tick buttons
 *   Routines  step-by-step checklists (see routines.js)
 *   Rewards   star balances and things to spend them on (see rewards.js)
 * Also provides PL.choresUi.widget() for the Home screen.
 *
 * Tap the circle to tick a chore. Tap the chore's name to edit it.
 * Changing chores asks for the parent PIN when one is set.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;

  const TABS = [{ value: 'chores', label: 'Chores' }, { value: 'routines', label: 'Routines' }, { value: 'rewards', label: 'Rewards' }];
  const starsOn = () => PL.stars.starsOn();
  const starLabel = (n) => (n === 0 ? 'No stars' : n === 1 ? '1 star' : n + ' stars');

  function dayTitle(key) {
    const t = D.today();
    if (key === t) return 'Today';
    if (key === D.addDays(t, 1)) return 'Tomorrow';
    if (key === D.addDays(t, -1)) return 'Yesterday';
    return D.fmt(key, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  /* ---------- repeat choices (kept simple on purpose) ---------- */
  function kindOf(ch) {
    const r = ch && ch.repeat;
    if (!r) return 'none';
    const plain = (r.interval || 1) === 1;
    if (r.freq === 'daily' && plain) return 'daily';
    if (r.freq === 'weekly' && plain) {
      const wd = r.weekdays && r.weekdays.length ? r.weekdays : [D.dow(ch.date)];
      if (wd.length === 5 && [1, 2, 3, 4, 5].every((x) => wd.includes(x))) return 'weekdays';
      if (wd.length === 1 && wd[0] === D.dow(ch.date)) return 'weekly';
      return 'days';
    }
    return 'keep'; // a rule this form cannot show (for example from a backup): keep it as it is
  }
  function repeatOptions(date, keepLabel) {
    return [
      { value: 'none', label: 'Does not repeat' },
      { value: 'daily', label: 'Every day' },
      { value: 'weekdays', label: 'Every weekday (Mon–Fri)' },
      { value: 'weekly', label: 'Every week on ' + D.weekdayLong(D.dow(date)) },
      { value: 'days', label: 'Choose days…' }
    ].concat(keepLabel ? [{ value: 'keep', label: keepLabel }] : []);
  }

  /* ---------- add / edit form ---------- */
  // opts: { chore?, date? }  date = the day being looked at (used for "only this day")
  async function openForm(opts) {
    if (!(await PL.pin.require('Enter the PIN to change chores.'))) return;
    const o = opts || {};
    const ch = o.chore || null;
    const viewDate = o.date || D.today();
    const date0 = ch ? ch.date : viewDate;
    const members = PL.state.members;

    const title = h('input', { type: 'text', maxlength: '80', placeholder: 'For example: Make your bed', autocomplete: 'off', autofocus: true });
    title.value = ch ? ch.title : '';
    const date = h('input', { type: 'date', required: true }); date.value = date0;

    const picked = new Set(ch ? (ch.memberIds || []).filter((id) => PL.store.member(id)) : []);
    const peopleBox = h('div', { class: 'chip-row', role: 'group', 'aria-label': 'Who does it' }, members.map((m) => {
      const b = h('button', { type: 'button', class: 'person-pick', 'aria-pressed': picked.has(m.id) ? 'true' : 'false',
        onclick: () => { picked.has(m.id) ? picked.delete(m.id) : picked.add(m.id); b.setAttribute('aria-pressed', picked.has(m.id) ? 'true' : 'false'); } },
        ui.avatar(m, 28), m.name);
      return b;
    }));

    const kind0 = kindOf(ch);
    const repSel = ui.select(repeatOptions(date0, kind0 === 'keep' ? PL.recur.describe(ch) : ''), kind0, () => sync());
    repSel.id = 'cf-repeat';
    const wdPicked = new Set(ch && ch.repeat && ch.repeat.weekdays && ch.repeat.weekdays.length ? ch.repeat.weekdays : [D.dow(date0)]);
    const wdBox = h('div', { class: 'chip-row', role: 'group', 'aria-label': 'Repeat on' }, [0, 1, 2, 3, 4, 5, 6].map((i) => {
      const b = h('button', { type: 'button', class: 'wd-pick', 'aria-pressed': wdPicked.has(i) ? 'true' : 'false', 'aria-label': D.weekdayLong(i),
        onclick: () => { wdPicked.has(i) ? wdPicked.delete(i) : wdPicked.add(i); b.setAttribute('aria-pressed', wdPicked.has(i) ? 'true' : 'false'); } }, D.weekdayShort(i).slice(0, 2));
      return b;
    }));
    const stars = ui.select([0, 1, 2, 3, 4, 5].map((n) => ({ value: n, label: starLabel(n) })), ch ? (ch.stars == null ? 1 : ch.stars) : 1);
    const dateField = ui.field('Starts on', date);
    date.addEventListener('change', () => {
      if (!date.value) return;
      const keep = repSel.value;
      repSel.replaceChildren(...repeatOptions(date.value, kind0 === 'keep' ? PL.recur.describe(ch) : '').map((x) => h('option', { value: x.value }, x.label)));
      repSel.value = keep;
    });
    function sync() { wdBox.hidden = repSel.value !== 'days'; }

    function readRepeat() {
      const k = repSel.value, dow = D.dow(date.value), end = { type: 'never' };
      if (k === 'daily') return { freq: 'daily', interval: 1, end };
      if (k === 'weekdays') return { freq: 'weekly', interval: 1, weekdays: [1, 2, 3, 4, 5], end };
      if (k === 'weekly') return { freq: 'weekly', interval: 1, weekdays: [dow], end };
      if (k === 'days') return { freq: 'weekly', interval: 1, weekdays: wdPicked.size ? [...wdPicked].sort((a, b) => a - b) : [dow], end };
      if (k === 'keep') return ch.repeat;
      return null;
    }

    async function save() {
      const t = title.value.trim();
      if (!t) { ui.toast('Please type a name first.'); title.focus(); return; }
      if (!date.value) { ui.toast('Please pick a day.'); date.focus(); return; }
      saveBtn.disabled = true;
      const ok = await PL.chores.save(ch ? ch.id : null, { title: t, memberIds: [...picked], date: date.value, repeat: readRepeat(), stars: starsOn() ? Number(stars.value) : (ch && ch.stars != null ? ch.stars : 1) });
      saveBtn.disabled = false;
      if (ok) { s.close(); ui.toast(ch ? 'Chore saved.' : 'Chore added.'); }
    }

    async function del() {
      let scope = 'all';
      if (ch.repeat) {
        scope = await ui.choose({
          title: 'Delete repeating chore',
          message: '“' + ch.title + '” repeats. What should be deleted?',
          options: [
            { value: 'one', label: 'Only ' + D.fmt(viewDate, { weekday: 'short', month: 'short', day: 'numeric' }), description: 'It still happens on the other days.' },
            { value: 'all', label: 'The whole chore', description: 'Removes every day, past and future.', danger: true }
          ]
        });
        if (!scope) return;
      } else if (!(await ui.confirm({ title: 'Delete this chore?', message: '“' + ch.title + '” will be removed for everyone.', confirmLabel: 'Delete', danger: true }))) return;
      if (await PL.chores.remove(ch, scope, viewDate)) { s.close(); ui.toast('Chore deleted.'); }
    }

    const saveBtn = ui.button(ch ? 'Save changes' : 'Add chore', { variant: 'primary', big: true, onClick: save });
    const footer = [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), saveBtn];
    if (ch) footer.unshift(ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: del }));
    const body = h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
      ui.field('What needs doing?', title),
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Who does it?'),
        members.length ? peopleBox : h('p', { class: 'hint' }, 'Add people in the People section to give chores to people.'),
        h('p', { class: 'hint' }, members.length ? 'Leave empty for anyone. Pick several and each person gets their own tick.' : '')),
      dateField,
      h('div', { class: 'field' }, ui.field('Repeat', repSel), wdBox),
      starsOn() ? ui.field('Stars for doing it', stars, 'Earned by the person it is given to. “Anyone” chores earn no stars.') : null);
    const s = ui.sheet({ title: ch ? 'Edit chore' : 'New chore', body, footer, wide: true });
    sync();
  }

  /* ---------- pieces ---------- */
  const countText = (p) => (p.total && p.done === p.total ? 'All done' : p.done + ' of ' + p.total);
  const colorOf = (member) => (member ? member.color : PL.config.neutralColor);
  const nameOf = (member) => (member ? member.name : 'Anyone');

  function choreRow(inst, member, viewDate) {
    const person = inst.memberId ? member : null;
    const rowEl = h('div', { class: 'chore-row' + (inst.done ? ' done' : ''), style: '--c:' + colorOf(person) });
    const check = h('button', {
      type: 'button', class: 'chore-check', dataset: { key: inst.key }, 'aria-pressed': inst.done ? 'true' : 'false',
      'aria-label': inst.title + (person ? ' for ' + person.name : ''),
      onclick: async () => {
        const next = !inst.done;
        check.setAttribute('aria-pressed', next ? 'true' : 'false'); rowEl.classList.toggle('done', next);
        if (!(await PL.chores.toggle(inst))) { check.setAttribute('aria-pressed', inst.done ? 'true' : 'false'); rowEl.classList.toggle('done', inst.done); }
      }
    }, icon('check'));
    const stars = inst.chore.stars == null ? 1 : inst.chore.stars;
    const name = h('button', { type: 'button', class: 'chore-title', onclick: () => openForm({ chore: inst.chore, date: viewDate }), 'aria-label': 'Edit ' + inst.title },
      h('span', {}, inst.title), inst.chore.repeat ? h('span', { class: 'ev-rep', title: 'Repeats' }, icon('repeat')) : null);
    rowEl.append(...[check, name, starsOn() && person && stars > 0 ? h('span', { class: 'star-chip', title: starLabel(stars) }, icon('star'), String(stars)) : null].filter(Boolean));
    return rowEl;
  }

  function group(g, viewDate) {
    const p = PL.chores.progress(g.items);
    const all = p.total > 0 && p.done === p.total;
    return h('section', { class: 'chore-group', style: '--c:' + colorOf(g.member), 'aria-label': nameOf(g.member) },
      h('div', { class: 'cg-head' }, ui.avatar(g.member, 40), h('h2', { class: 'cg-name' }, nameOf(g.member)),
        h('span', { class: 'cg-count' + (all ? ' all' : '') }, all ? icon('check') : null, countText(p))),
      h('div', { class: 'cg-bar', 'aria-hidden': 'true' }, h('i', { style: '--p:' + Math.round((p.done / p.total) * 100) + '%' })),
      g.items.map((i) => choreRow(i, g.member, viewDate)));
  }

  /* ---------- Home widget ---------- */
  function widget() {
    const today = D.today();
    const groups = PL.chores.byPerson(PL.chores.instances(today, today));
    if (!groups.length) {
      return ui.emptyState({ icon: 'check', title: 'No chores today', text: 'Add a chore to see who has done what.', action: ui.button('Add a chore', { icon: 'plus', onClick: () => openForm({ date: today }) }) });
    }
    return h('div', { class: 'chore-sum' }, groups.map((g) => {
      const p = PL.chores.progress(g.items);
      const all = p.done === p.total;
      const bal = starsOn() && g.member ? Math.max(0, PL.stars.balance(g.member.id)) : null;
      return h('button', { type: 'button', class: 'cs-row', style: '--c:' + colorOf(g.member), onclick: () => PL.nav.go('tasks', { tab: 'chores' }),
        'aria-label': nameOf(g.member) + ', ' + countText(p) + (bal != null ? ', ' + bal + ' stars' : '') },
        ui.avatar(g.member, 40),
        h('span', { class: 'cs-main' }, h('span', { class: 'cs-name' }, nameOf(g.member)),
          h('span', { class: 'cg-bar', 'aria-hidden': 'true' }, h('i', { style: '--p:' + Math.round((p.done / p.total) * 100) + '%' }))),
        h('span', { class: 'cs-count' + (all ? ' all' : '') }, countText(p), bal != null ? h('span', { class: 'star-chip' }, icon('star'), String(bal)) : null));
    }));
  }

  PL.choresUi = { openForm, widget };

  /* ---------- screen ---------- */
  PL.screens.tasks = {
    mount(root, params) {
      const p = params || {};
      let tab = TABS.some((t) => t.value === p.tab) ? p.tab : PL.storage.get('taskTab', 'chores');
      if (!TABS.some((t) => t.value === tab)) tab = 'chores';
      let cursor = p.date || D.today();
      const el = h('div', { class: 'screen-page chores' });
      root.append(el);

      const step = (n) => { cursor = D.addDays(cursor, n); render(); };

      function render() {
        const a = document.activeElement;
        const focusKey = a && el.contains(a) && a.dataset ? a.dataset.key : null;
        const daily = tab !== 'rewards';
        const body = tab === 'chores'
          ? (() => {
              const groups = PL.chores.byPerson(PL.chores.instances(cursor, cursor));
              return h('div', { class: 'chores-list' }, groups.length ? groups.map((g) => group(g, cursor))
                : ui.emptyState({ icon: 'check', title: 'No chores for this day',
                    text: PL.state.chores.length ? 'Enjoy the break, or add something.' : 'Add the first chore. Give it to someone, and choose how often it repeats.',
                    action: ui.button('Add a chore', { variant: 'primary', big: true, icon: 'plus', onClick: () => openForm({ date: cursor }) }) }));
            })()
          : tab === 'routines' ? PL.routinesUi.panel(cursor) : PL.rewardsUi.panel();
        if (daily) ui.onSwipe(body, () => step(1), () => step(-1));

        const seg = ui.segmented(TABS, tab, (v) => { tab = v; PL.storage.set('taskTab', v); render(); }, 'Section');
        const addBtn = tab === 'chores' ? ui.button('Add chore', { variant: 'primary', icon: 'plus', onClick: () => openForm({ date: cursor }) })
          : tab === 'routines' ? ui.button('Add routine', { variant: 'primary', icon: 'plus', onClick: () => PL.routinesUi.openForm() })
          : (starsOn() ? ui.button('Add reward', { variant: 'primary', icon: 'plus', onClick: () => PL.rewardsUi.openForm() }) : null);
        el.replaceChildren(
          h('div', { class: 'task-tabs' }, seg.el),
          h('header', { class: 'chores-bar' },
            daily ? h('div', { class: 'cal-nav' },
              ui.iconButton('left', 'Previous day', () => step(-1)),
              ui.button('Today', { onClick: () => { cursor = D.today(); render(); } }),
              ui.iconButton('right', 'Next day', () => step(1))) : null,
            h('h1', { class: 'chores-day', 'aria-live': 'polite' }, daily ? dayTitle(cursor) : 'Rewards'),
            addBtn),
          body);
        if (focusKey) { const again = [...el.querySelectorAll('[data-key]')].find((b) => b.dataset.key === focusKey); if (again) again.focus({ preventScroll: true }); }
      }

      render();
      if (p.add) setTimeout(() => openForm({ date: cursor }), 0);
      return { update: render, destroy() {} };
    }
  };
})();

</script>
<script>
/*
 * screens/lists.js — shared lists (groceries, packing, to-do…).
 * A list is a title; its items are saved one by one, so two people can add items at the
 * same time without overwriting each other.
 *   lists/{id}        { title }
 *   listitems/{id}    { listId, text, done, at }
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, icon = PL.icon, ui = PL.ui;
  const QUICK = ['Groceries', 'To-do', 'Packing', 'Party', 'Gift ideas'];

  const itemsOf = (listId) => PL.state.listitems.filter((i) => i.listId === listId).sort((a, b) => a.at - b.at);
  const setDone = (item, done) => PL.store.set('listitems', item.id, Object.assign({}, item, { done }));

  function openNewList(onMade) {
    const name = h('input', { type: 'text', maxlength: '40', placeholder: 'For example: Groceries', autocomplete: 'off', autofocus: true });
    async function save() {
      const t = name.value.trim();
      if (!t) { ui.toast('Please type a name first.'); name.focus(); return; }
      const id = await PL.store.add('lists', { title: t });
      if (id) { s.close(); ui.toast('List added.'); onMade && onMade(id); }
    }
    const s = ui.sheet({
      title: 'New list',
      body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } },
        ui.field('Name', name),
        h('div', { class: 'chip-row', 'aria-label': 'Quick picks' }, QUICK.map((q) => h('button', { type: 'button', class: 'person-pick', onclick: () => { name.value = q; name.focus(); } }, q)))),
      footer: [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), ui.button('Add list', { variant: 'primary', big: true, onClick: save })]
    });
  }

  function openListMenu(list, onGone) {
    const name = h('input', { type: 'text', maxlength: '40', autocomplete: 'off', autofocus: true });
    name.value = list.title;
    async function save() {
      const t = name.value.trim();
      if (!t) { ui.toast('Please type a name first.'); name.focus(); return; }
      if (await PL.store.set('lists', list.id, Object.assign({}, list, { title: t }))) { s.close(); ui.toast('Saved.'); }
    }
    async function del() {
      const n = itemsOf(list.id).length;
      if (!(await ui.confirm({ title: 'Delete this list?', message: '“' + list.title + '”' + (n ? ' and its ' + n + (n === 1 ? ' item' : ' items') : '') + ' will be removed for everyone.', confirmLabel: 'Delete', danger: true }))) return;
      for (const i of itemsOf(list.id)) await PL.store.del('listitems', i.id);
      if (await PL.store.del('lists', list.id)) { s.close(); ui.toast('List deleted.'); onGone(); }
    }
    const s = ui.sheet({
      title: 'Edit list',
      body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } }, ui.field('Name', name)),
      footer: [ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: del }), ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), ui.button('Save', { variant: 'primary', big: true, onClick: save })]
    });
  }

  function openItem(item) {
    const text = h('input', { type: 'text', maxlength: '100', autocomplete: 'off', autofocus: true });
    text.value = item.text;
    async function save() {
      const t = text.value.trim();
      if (!t) { ui.toast('Please type something first.'); text.focus(); return; }
      if (await PL.store.set('listitems', item.id, Object.assign({}, item, { text: t }))) s.close();
    }
    const s = ui.sheet({
      title: 'Edit item',
      body: h('form', { class: 'event-form', onsubmit: (e) => { e.preventDefault(); save(); } }, ui.field('Item', text)),
      footer: [ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: async () => { if (await PL.store.del('listitems', item.id)) s.close(); } }), ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), ui.button('Save', { variant: 'primary', big: true, onClick: save })]
    });
  }

  PL.screens.lists = {
    mount(root, params) {
      let openId = (params && params.id) || null;
      let draft = '';
      let madeAt = 0;
      const el = h('div', { class: 'screen-page lists' });
      root.append(el);

      function itemRow(item) {
        const rowEl = h('div', { class: 'chore-row' + (item.done ? ' done' : ''), style: '--c:' + PL.config.palette[3].hex });
        const check = h('button', { type: 'button', class: 'chore-check', dataset: { key: item.id }, 'aria-pressed': item.done ? 'true' : 'false', 'aria-label': item.text,
          onclick: async () => {
            const next = !item.done;
            check.setAttribute('aria-pressed', next ? 'true' : 'false'); rowEl.classList.toggle('done', next);
            if (!(await setDone(item, next))) { check.setAttribute('aria-pressed', item.done ? 'true' : 'false'); rowEl.classList.toggle('done', item.done); }
          } }, icon('check'));
        rowEl.append(check, h('button', { type: 'button', class: 'chore-title', onclick: () => openItem(item), 'aria-label': 'Edit ' + item.text }, h('span', {}, item.text)));
        return rowEl;
      }

      function index() {
        const lists = PL.state.lists.slice().sort((a, b) => a.title.localeCompare(b.title));
        return [
          h('header', { class: 'page-head' }, h('h1', {}, 'Lists'), ui.button('New list', { variant: 'primary', big: true, icon: 'plus', onClick: () => openNewList((id) => { openId = id; madeAt = Date.now(); render(); }) })),
          lists.length
            ? h('div', { class: 'family-grid' }, lists.map((l) => {
                const items = itemsOf(l.id), open = items.filter((i) => !i.done).length;
                return h('button', { type: 'button', class: 'list-card', onclick: () => { openId = l.id; render(); } },
                  icon('list'), h('strong', {}, l.title), h('span', { class: 'sub' }, !items.length ? 'Empty' : open ? open + (open === 1 ? ' item to go' : ' items to go') : 'All done'));
              }))
            : ui.emptyState({ icon: 'list', title: 'No lists yet', text: 'Make a shared list for groceries, packing or anything else. Everyone in the family sees the same list.',
                action: h('div', { class: 'btn-row' }, QUICK.slice(0, 3).map((q) => ui.button(q, { icon: 'plus', onClick: async () => { const id = await PL.store.add('lists', { title: q }); if (id) { openId = id; madeAt = Date.now(); render(); } } }))) })
        ];
      }

      function detail(list) {
        const items = itemsOf(list.id);
        const todo = items.filter((i) => !i.done), done = items.filter((i) => i.done);
        const input = h('input', { type: 'text', id: 'li-add', maxlength: '100', placeholder: 'Add an item', autocomplete: 'off', 'aria-label': 'Add an item' });
        input.value = draft;
        input.addEventListener('input', () => { draft = input.value; });
        async function add(e) {
          e.preventDefault();
          const t = input.value.trim();
          if (!t) return;
          draft = ''; input.value = '';
          await PL.store.add('listitems', { listId: list.id, text: t, done: false, at: Date.now() });
          input.focus();
        }
        return [
          h('header', { class: 'page-head' },
            h('button', { type: 'button', class: 'link-btn', onclick: () => { openId = null; render(); } }, icon('left'), 'All lists'),
            ui.button('Edit list', { icon: 'edit', onClick: () => openListMenu(list, () => { openId = null; render(); }) })),
          h('h1', { class: 'list-title' }, list.title),
          h('div', { class: 'chores-list' },
            h('form', { class: 'add-row', onsubmit: add }, input, ui.button('Add', { variant: 'primary', big: true, type: 'submit', icon: 'plus' })),
            h('section', { class: 'chore-group' },
              todo.length ? todo.map(itemRow) : h('p', { class: 'sub list-note' }, items.length ? 'Everything is done.' : 'Nothing here yet. Type above to add the first item.')),
            done.length ? h('section', { class: 'chore-group' },
              h('div', { class: 'cg-head' }, h('h2', { class: 'cg-name' }, 'Done'), h('span', { class: 'cg-count' }, done.length),
                h('button', { type: 'button', class: 'link-btn', onclick: async () => {
                  if (await ui.confirm({ title: 'Remove done items?', message: 'This removes ' + done.length + (done.length === 1 ? ' item' : ' items') + ' from the list.', confirmLabel: 'Remove', danger: true })) {
                    for (const i of done) await PL.store.del('listitems', i.id);
                  } } }, 'Clear done')),
              done.map(itemRow)) : null)
        ];
      }

      function render() {
        const a = document.activeElement;
        const focusKey = a && el.contains(a) ? (a.id === 'li-add' ? '#add' : a.dataset && a.dataset.key) : null;
        const list = openId && PL.state.lists.find((l) => l.id === openId);
        if (openId && !list && PL.state.ready && PL.state.live && Date.now() - madeAt > 4000) openId = null;
        el.replaceChildren(...(list ? detail(list) : (openId ? [h('p', { class: 'sub' }, 'Opening…')] : index())));
        if (focusKey === '#add') { const i = el.querySelector('#li-add'); if (i) { i.focus({ preventScroll: true }); i.setSelectionRange(i.value.length, i.value.length); } }
        else if (focusKey) { const b = [...el.querySelectorAll('[data-key]')].find((x) => x.dataset.key === focusKey); if (b) b.focus({ preventScroll: true }); }
      }

      render();
      return { update: render, destroy() {} };
    }
  };
})();

</script>
<script>
/*
 * screens/photos.js — the Photos tab: a family gallery, a full-screen viewer, slideshow and wall mode.
 * Photos are stored with PL.photos (see photos.js). Newest photos come first here.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, icon = PL.icon, ui = PL.ui;

  function widget() {
    const ps = PL.photos.list().slice(-4).reverse();
    if (!ps.length) return ui.emptyState({ icon: 'image', title: 'No photos yet', text: 'Add family photos to see them here and on the wall screen.', action: ui.button('Open Photos', { icon: 'image', onClick: () => PL.nav.go('photos') }) });
    return h('div', { class: 'photo-grid wide' }, ps.map((p, i) => h('button', { type: 'button', class: 'photo-thumb', 'aria-label': 'Open photo', onclick: () => PL.photos.openViewer(PL.photos.list().length - 1 - i) },
      h('img', { src: PL.photos.url(p), alt: 'Family photo', loading: 'lazy' }))));
  }
  PL.photosUi = { widget };

  PL.screens.photos = {
    mount(root) {
      const el = h('div', { class: 'screen-page photos' });
      root.append(el);
      const fileIn = h('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true });
      fileIn.addEventListener('change', async () => {
        const fs = [...fileIn.files]; fileIn.value = '';
        if (!fs.length) return;
        busy = true; render();
        await PL.photos.add(fs);
        busy = false; render();
      });
      let busy = false;
      function render() {
        const ps = PL.photos.list(); // oldest first
        const shown = ps.slice().reverse();
        el.replaceChildren(
          h('header', { class: 'page-head' }, h('h1', {}, 'Photos'), ui.button(busy ? 'Adding…' : 'Add photos', { variant: 'primary', big: true, icon: 'plus', onClick: () => fileIn.click() })),
          h('div', { class: 'btn-row photo-actions' },
            ui.button('Slideshow', { icon: 'image', onClick: () => { if (!ps.length) ui.toast('Add some photos first.'); else PL.photos.openWall('photos'); } }),
            ui.button('Wall mode', { icon: 'expand', onClick: () => PL.photos.openWall('wall') })),
          shown.length
            ? h('div', { class: 'photo-grid big' }, shown.map((p, i) => h('button', { type: 'button', class: 'photo-thumb', 'aria-label': 'Open photo ' + (i + 1), onclick: () => PL.photos.openViewer(ps.length - 1 - i) },
                h('img', { src: PL.photos.url(p), alt: 'Family photo', loading: 'lazy' }))))
            : ui.emptyState({ icon: 'image', title: 'No photos yet', text: 'Add the pictures your family loves. They play on the slideshow and on the wall screen. Pictures are shrunk before they are saved.', action: ui.button('Add the first photos', { icon: 'plus', onClick: () => fileIn.click() }) }),
          fileIn);
      }
      render();
      return { update: render, destroy() {} };
    }
  };
})();

</script>
<script>
/*
 * screens/meals.js — the Meals screen: a week plan and a recipe box.
 *   meals/{date~slot}  { date, slot, title, recipeId }     one meal per slot per day
 *   recipes/{id}       { title, emoji, servings, ingredients[], steps }
 * Ingredients can be sent to any shared list, one tap.
 */
(function () {
  const PL = (window.PL = window.PL || {});
  PL.screens = PL.screens || {};
  const h = PL.h, icon = PL.icon, D = PL.D, ui = PL.ui;
  const SLOTS = [{ id: 'breakfast', label: 'Breakfast' }, { id: 'lunch', label: 'Lunch' }, { id: 'dinner', label: 'Dinner' }];
  const SLOT_LABEL = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner' };
  const EMOJI = ['🍝', '🍚', '🥞', '🍕', '🌮', '🍲', '🥗', '🍗', '🐟', '🥪', '🍜', '🍔', '🥘', '🧁', '🍳', '🥦'];

  const mealId = (date, slot) => date + '~' + slot;
  const mealAt = (date, slot) => PL.state.meals.find((m) => m.id === mealId(date, slot)) || null;
  const recipeOf = (id) => (id ? PL.state.recipes.find((r) => r.id === id) || null : null);

  // Rows for the Home widget: every planned meal on these dates.
  function dayRows(dates) {
    const out = [];
    dates.forEach((date) => SLOTS.forEach((s) => {
      const m = mealAt(date, s.id);
      if (m) out.push({ date, title: m.title, slotLabel: SLOT_LABEL[s.id] });
    }));
    return out;
  }

  /* ---------- sending ingredients to a shared list ---------- */
  async function sendToList(ingredients, what) {
    const wanted = [];
    const seen = new Set();
    ingredients.forEach((i) => { const k = i.trim().toLowerCase(); if (k && !seen.has(k)) { seen.add(k); wanted.push(i.trim()); } });
    if (!wanted.length) { ui.toast('There is nothing to add.'); return false; }
    const lists = PL.state.lists.slice().sort((a, b) => a.title.localeCompare(b.title));
    let listId;
    if (!lists.length) listId = await PL.store.add('lists', { title: 'Groceries' });
    else {
      const grocery = lists.find((l) => /grocer|shopping/i.test(l.title));
      const options = lists.map((l) => ({ value: l.id, label: l.title, description: grocery && grocery.id === l.id ? 'Suggested' : '' }));
      options.push({ value: '__new', label: 'A new list called Groceries' });
      const pick = await ui.choose({ title: 'Add to which list?', message: what + ': ' + wanted.length + (wanted.length === 1 ? ' item' : ' items') + '.', options });
      if (!pick) return false;
      listId = pick === '__new' ? await PL.store.add('lists', { title: 'Groceries' }) : pick;
    }
    if (!listId) return false;
    const have = new Set(PL.state.listitems.filter((i) => i.listId === listId && !i.done).map((i) => i.text.trim().toLowerCase()));
    let n = 0, skipped = 0, at = Date.now();
    for (const text of wanted) {
      if (have.has(text.toLowerCase())) { skipped++; continue; }
      if (!(await PL.store.add('listitems', { listId, text, done: false, at: at++ }))) return false;
      n++;
    }
    const list = PL.state.lists.find((l) => l.id === listId);
    ui.toast(n + (n === 1 ? ' item' : ' items') + ' added' + (list ? ' to ' + list.title : '') + (skipped ? '. ' + skipped + ' already there.' : '.'));
    return true;
  }

  /* ---------- recipe view and form ---------- */
  function openRecipe(r) {
    const s = ui.sheet({
      title: (r.emoji ? r.emoji + ' ' : '') + r.title, wide: true,
      body: h('div', { class: 'stack' },
        h('p', { class: 'sub' }, 'Serves ' + r.servings),
        r.ingredients.length ? [h('h3', { class: 'mini-h' }, 'Ingredients'), h('ul', { class: 'ing-list' }, r.ingredients.map((i) => h('li', {}, i)))] : h('p', { class: 'sub' }, 'No ingredients written yet.'),
        r.steps ? [h('h3', { class: 'mini-h' }, 'Steps'), h('ol', { class: 'step-list' }, r.steps.split('\n').filter((x) => x.trim()).map((x) => h('li', {}, x.trim())))] : null),
      footer: [
        ui.button('Edit', { icon: 'edit', onClick: () => { s.close(); openRecipeForm(r); } }),
        r.ingredients.length ? ui.button('Add to a list', { variant: 'primary', big: true, icon: 'cart', onClick: async () => { if (await sendToList(r.ingredients, r.title)) s.close(); } }) : null,
        ui.button('Close', { variant: 'ghost', big: true, onClick: () => s.close() })]
    });
  }

  function openRecipeForm(r, onSaved) {
    let emoji = r ? r.emoji : EMOJI[0];
    const title = h('input', { type: 'text', maxlength: '80', placeholder: 'For example: Chicken adobo', autocomplete: 'off', autofocus: true });
    title.value = r ? r.title : '';
    const servings = h('input', { type: 'number', min: '1', max: '99', class: 'num', 'aria-label': 'Servings' });
    servings.value = r ? r.servings : 4;
    const ing = h('textarea', { rows: '6', placeholder: 'One ingredient on each line' });
    ing.value = r ? r.ingredients.join('\n') : '';
