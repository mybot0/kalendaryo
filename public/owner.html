<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root { --bg:#F4F3EE; --ink:#26302B; --ink-2:#5C675F; --muted:#6E776F; --line:#ECEAE3; --primary:#3F7360; --primary-soft:#E4EFE9; --primary-ink:#2E5748; --trip:#B8583A; --trip-soft:#F8E7E0; --trip-ink:#8E3F27; --ok:#2E8A57; }
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.45 'Figtree', system-ui, sans-serif; color: var(--ink); background-color: var(--bg);
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22680%22%20height%3D%22680%22%20viewBox%3D%220%200%20680%20680%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%233F7360%22%20stroke-opacity%3D%220.13%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cg%20transform%3D%22translate%2845%2016%29%20rotate%28-3%2024%2024%29%20scale%282.46%29%22%3E%3Cpath%20d%3D%22M5%2010l1-6%204%203h4l4-3%201%206v3a7%207%200%200%201-14%200z%22/%3E%3Ccircle%20cx%3D%229.5%22%20cy%3D%2212%22%20r%3D%22.6%22/%3E%3Ccircle%20cx%3D%2214.5%22%20cy%3D%2212%22%20r%3D%22.6%22/%3E%3Cpath%20d%3D%22M11%2015l1%201%201-1%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28246%2020%29%20rotate%285%2024%2024%29%20scale%282.56%29%22%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2212%22%20r%3D%226%22/%3E%3Cpath%20d%3D%22M16%2012h6%22/%3E%3Cpath%20d%3D%22M8%2011c1-1%202-1%203%200%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28426%2056%29%20rotate%2817%2024%2024%29%20scale%282.68%29%22%3E%3Cpath%20d%3D%22M6%2016V11a6%206%200%200%201%2012%200v5l2%202H4z%22/%3E%3Cpath%20d%3D%22M10%2020a2%202%200%200%200%204%200%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28524%2079%29%20rotate%28-13%2024%2024%29%20scale%282.60%29%22%3E%3Cpath%20d%3D%22M4%2010h16l-2%209H6z%22/%3E%3Cpath%20d%3D%22M8%2010l3-6M16%2010l-3-6M9%2013v3M12%2013v3M15%2013v3%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2819%20205%29%20rotate%28-11%2024%2024%29%20scale%282.97%29%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%2212%22%20r%3D%224%22/%3E%3Cpath%20d%3D%22M12%2012h9M18%2012v3M21%2012v2%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28227%20231%29%20rotate%282%2024%2024%29%20scale%282.66%29%22%3E%3Cpath%20d%3D%22M12%2020s-7-4.5-7-10a4%204%200%200%201%207-2.5A4%204%200%200%201%2019%2010c0%205.5-7%2010-7%2010z%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28355%20185%29%20rotate%286%2024%2024%29%20scale%282.54%29%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2215%22%20r%3D%223.5%22/%3E%3Ccircle%20cx%3D%227%22%20cy%3D%2210%22%20r%3D%221.6%22/%3E%3Ccircle%20cx%3D%2210.5%22%20cy%3D%226.5%22%20r%3D%221.6%22/%3E%3Ccircle%20cx%3D%2214.5%22%20cy%3D%226.5%22%20r%3D%221.6%22/%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%2210%22%20r%3D%221.6%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28554%20205%29%20rotate%28-2%2024%2024%29%20scale%282.81%29%22%3E%3Cpath%20d%3D%22M12%204l2.4%205%205.4.6-4%203.7%201.1%205.4L12%2016l-4.9%202.7%201.1-5.4-4-3.7%205.4-.6z%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2834%20414%29%20rotate%28-9%2024%2024%29%20scale%282.89%29%22%3E%3Cpath%20d%3D%22M5%209h10v7a4%204%200%200%201-4%204H9a4%204%200%200%201-4-4z%22/%3E%3Cpath%20d%3D%22M15%2011h2a2%202%200%200%201%200%204h-2%22/%3E%3Cpath%20d%3D%22M8%203c0%201.5%201%201.5%201%203M12%203c0%201.5%201%201.5%201%203%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28226%20392%29%20rotate%288%2024%2024%29%20scale%283.01%29%22%3E%3Cpath%20d%3D%22M4%2011l8-7%208%207v9H4z%22/%3E%3Cpath%20d%3D%22M10%2020v-5h4v5%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28373%20428%29%20rotate%28-3%2024%2024%29%20scale%282.48%29%22%3E%3Cpath%20d%3D%22M8%204L4%207l2%203%202-1v11h8V9l2%201%202-3-4-3c-1%201.5-2.5%202-4%202S9%205.5%208%204z%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28581%20362%29%20rotate%28-17%2024%2024%29%20scale%282.74%29%22%3E%3Cpath%20d%3D%22M5%206h14v13H5zM5%2010h14M9%204v4M15%204v4%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2863%20581%29%20rotate%2814%2024%2024%29%20scale%282.80%29%22%3E%3Cpath%20d%3D%22M7%2014h10l-1.5%207h-7z%22/%3E%3Cpath%20d%3D%22M12%2014V9%22/%3E%3Cpath%20d%3D%22M12%209c-3%200-5-2-5-5%203%200%205%202%205%205zM12%2010c3%200%205-2%205-5-3%200-5%202-5%205z%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28205%20576%29%20rotate%283%2024%2024%29%20scale%282.82%29%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%224%22/%3E%3Cpath%20d%3D%22M12%202v3M12%2019v3M2%2012h3M19%2012h3M4.9%204.9l2.1%202.1M17%2017l2.1%202.1M4.9%2019.1L7%2017M17%207l2.1-2.1%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28386%20587%29%20rotate%28-1%2024%2024%29%20scale%283.06%29%22%3E%3Cpath%20d%3D%22M5%2010l1-6%204%203h4l4-3%201%206v3a7%207%200%200%201-14%200z%22/%3E%3Ccircle%20cx%3D%229.5%22%20cy%3D%2212%22%20r%3D%22.6%22/%3E%3Ccircle%20cx%3D%2214.5%22%20cy%3D%2212%22%20r%3D%22.6%22/%3E%3Cpath%20d%3D%22M11%2015l1%201%201-1%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28573%20525%29%20rotate%285%2024%2024%29%20scale%282.89%29%22%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2212%22%20r%3D%226%22/%3E%3Cpath%20d%3D%22M16%2012h6%22/%3E%3Cpath%20d%3D%22M8%2011c1-1%202-1%203%200%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); background-size: 680px 680px; background-attachment: fixed; min-height: 100vh; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mark { width: 52px; height: 52px; border-radius: 15px; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.top h1 { margin: 0; font: 800 30px 'Outfit', sans-serif; color: var(--primary); }
.badge { background: var(--ink); color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .08em; padding: 6px 12px; border-radius: 999px; }
.upd { margin-left: auto; color: var(--ink-2); font-size: 14px; }
.card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 1px 2px rgba(38,48,43,.05), 0 4px 14px rgba(38,48,43,.05); min-width: 0; }
.card h2 { margin: 0 0 12px; font: 700 20px 'Outfit', sans-serif; display: flex; align-items: center; gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile .n { font: 800 32px 'Outfit', sans-serif; }
.tile .l { font-weight: 700; } .tile .s { color: var(--muted); font-size: 13px; }
.row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.chart { display: flex; gap: 6px; align-items: flex-end; height: 160px; }
.bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
.bar i { display: block; width: 100%; background: var(--primary); opacity: .85; border-radius: 6px 6px 2px 2px; min-height: 2px; }
.bar b { font-size: 11px; color: var(--ink-2); } .bar span { font-size: 11px; color: var(--muted); height: 14px; white-space: nowrap; }
.where .r { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid #E6E4DD; white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid #F0EEE8; white-space: nowrap; }
.c { text-align: center; }
.live { color: var(--ok); font-size: 12px; font-weight: 700; margin-left: 6px; }
.pill { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-ink); }
.pill.trip { background: var(--trip-soft); color: var(--trip-ink); }
button, .btn { font: 700 14px 'Figtree', sans-serif; border: 0; cursor: pointer; border-radius: 999px; min-height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; }
.view { background: var(--primary-soft); color: var(--primary-ink); }
.empty { color: var(--muted); padding: 8px 0; }
.del { background: #FBE9E5; color: #B3402F; }
.acts { white-space: nowrap; display: flex; gap: 6px; }
.tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #EFEDE7; color: #8A948C; margin-left: 8px; white-space: nowrap; }
/* Help & ideas inbox */
.ib-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ib-new { font-size: 13px; color: #fff; background: #E5533D; border-radius: 999px; padding: 2px 9px; }
.ib-filters { margin-left: auto; display: flex; gap: 6px; }
.ib-filters button { background: #F0EEE8; color: var(--ink-2); min-height: 32px; font-size: 13px; }
.ib-filters button.on { background: var(--ink); color: #fff; }
.ib-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; margin-top: 12px; }
.ib-list { display: flex; flex-direction: column; max-height: 520px; overflow-y: auto; }
.ib-item { display: flex; gap: 10px; padding: 12px; border-radius: 14px; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; border-bottom: 1px solid #F0EEE8; min-height: 0; }
.ib-item:hover { background: #FAF9F6; }
.ib-item.sel { background: #F3F8F5; }
.ib-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
.ib-item.new .ib-dot { background: #E5533D; }
.ib-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ib-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ib-item.new .ib-name { font-weight: 800; }
.ib-name { font-weight: 600; }
.ib-app { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-ink); }
.ib-app.trip { background: var(--trip-soft); color: var(--trip-ink); }
.ib-place { color: var(--muted); font-size: 13px; }
.ib-when { margin-left: auto; color: var(--muted); font-size: 12px; }
.ib-prev { color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib-conv { border: 1px solid #EEECE6; border-radius: 16px; display: flex; flex-direction: column; min-height: 360px; max-height: 560px; }
.ib-conv-head { padding: 12px 14px; border-bottom: 1px solid #EEECE6; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ib-conv-head .acts { margin-left: auto; }
.ib-done { background: var(--ink); color: #fff; }
.ib-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ib-msg { display: flex; flex-direction: column; gap: 2px; max-width: 80%; }
.ib-msg.team { align-self: flex-end; align-items: flex-end; }
.ib-bubble { padding: 10px 14px; border-radius: 18px; background: #F4F3EE; white-space: pre-wrap; overflow-wrap: anywhere; }
.ib-msg.team .ib-bubble { background: var(--primary); color: #fff; }
.ib-msg.auto .ib-bubble { background: #EEF4F0; color: var(--ink-2); font-style: italic; }
.ib-msg img { max-width: 220px; border-radius: 12px; cursor: zoom-in; }
.ib-msg img.big { max-width: 100%; cursor: zoom-out; }
.ib-meta { font-size: 11px; color: var(--muted); }
.ib-reply { padding: 10px; border-top: 1px solid #EEECE6; display: flex; gap: 8px; align-items: flex-end; }
.ib-reply textarea { flex: 1; resize: none; min-height: 42px; max-height: 140px; border: 1px solid #DCDAD3; border-radius: 18px; padding: 10px 14px; font: inherit; }
.ib-send { background: var(--primary); color: #fff; min-height: 42px; }
.ib-pick { margin: auto; color: var(--muted); text-align: center; padding: 30px; }
.ib-welcome { margin-top: 14px; }
.ib-welcome summary { cursor: pointer; font-weight: 700; color: var(--ink-2); }
.ib-welcome .wrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.ib-welcome textarea { width: 100%; box-sizing: border-box; min-height: 120px; border: 1px solid #DCDAD3; border-radius: 12px; padding: 10px; font: inherit; }
.ib-welcome label { font-weight: 700; font-size: 13px; display: block; margin-bottom: 4px; }
@media (max-width: 860px) { .ib-grid, .ib-welcome .wrow { grid-template-columns: 1fr; } }
.modal-wrap { position: fixed; inset: 0; background: rgba(38,48,43,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { background: #fff; border-radius: 20px; padding: 22px; max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal h3 { margin: 0; font: 800 20px 'Outfit', 'Figtree', sans-serif; }
.modal p { margin: 0; color: var(--ink-2); }
.modal input { height: 46px; border: 1px solid #DCDAD3; border-radius: 12px; padding: 0 14px; font: inherit; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; }
.modal .cancel { background: #F0EEE8; color: var(--ink-2); }
.modal .gone { background: #B3402F; color: #fff; }
.modal .gone:disabled { opacity: .4; cursor: not-allowed; }
.login { max-width: 420px; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 12px; }
.login input { height: 48px; border: 1px solid #DCDAD3; border-radius: 12px; padding: 0 14px; font: inherit; }
.login .go { background: var(--primary); color: #fff; min-height: 48px; justify-content: center; font-size: 16px; }
.err { color: #B4442F; font-weight: 700; margin: 0; }
@media (max-width: 980px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .row2 { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .upd { margin-left: 0; width: 100%; } .tile .n { font-size: 28px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  const CAL = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14v13H5zM5 10h14M9 4v4M15 4v4"/></svg>';
  const EYE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const flag = (cc) => (cc && /^[A-Za-z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1F1E6 + c.charCodeAt(0) - 65)) + ' ' : '');
  const where = (x) => (x.city || x.country ? flag(x.cc) + esc([x.city, x.cc || x.country].filter(Boolean).join(', ')) : '<span style="color:var(--muted)">—</span>');
  const mb = (b) => !Number(b) ? '0 MB' : (Number(b) / 1048576 < 0.1 && Number(b) > 0 ? '<0.1' : (Number(b) / 1048576).toFixed(Number(b) >= 10485760 ? 0 : 1)) + ' MB';
  const day = (d) => new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  function ago(t) {
    if (!t) return '<span style="color:var(--muted)">never</span>';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 120) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    if (s < 172800) return 'yesterday';
    return Math.round(s / 86400) + ' days ago';
  }

  // The key comes once in the address (?key=...), then lives only in this tab.
  let key = '';
  try { key = sessionStorage.getItem('kal.ownerKey') || ''; } catch (e) {}
  const fromUrl = new URLSearchParams(location.search).get('key');
  if (fromUrl) { key = fromUrl; try { sessionStorage.setItem('kal.ownerKey', key); } catch (e) {} }
  if (location.search) history.replaceState(null, '', '/owner');

  function login(msg) {
    app.innerHTML = '<form class="card login" id="f"><div class="top"><span class="mark">' + CAL + '</span><h1>Kalendaryo</h1></div>' +
      '<label for="k"><b>Owner key</b></label><input id="k" type="password" autocomplete="current-password" placeholder="Your OWNER_KEY">' +
      (msg ? '<p class="err">' + esc(msg) + '</p>' : '') + '<button class="go" type="submit">Open owner view</button></form>';
    document.getElementById('f').onsubmit = (e) => { e.preventDefault(); key = document.getElementById('k').value.trim(); try { sessionStorage.setItem('kal.ownerKey', key); } catch (x) {} load(); };
  }

  async function api(method, url, body) {
    const r = await fetch(url, { method, cache: 'no-store', headers: Object.assign({ 'X-Owner-Key': key }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
    if (r.status === 404 && url.endsWith('/summary')) throw { wrongKey: true };
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || 'Something went wrong.');
    return j;
  }

  let timer = null, last = null;
  async function load() {
    clearTimeout(timer);
    if (!key) return login();
    try { last = await api('GET', '/api/owner/summary'); draw(last); }
    catch (e) {
      if (e && e.wrongKey) { try { sessionStorage.removeItem('kal.ownerKey'); } catch (x) {} key = ''; return login('That key is not right.'); }
      if (!last) app.innerHTML = '<div class="card">Could not load. Trying again…</div>';
    }
    timer = setTimeout(load, 30000);
  }

  function draw(d) {
    const t = d.tiles;
    const tile = (n, l, s, color) => '<div class="card tile"><div class="n"' + (color ? ' style="color:' + color + '"' : '') + '>' + n + '</div><div class="l">' + l + '</div><div class="s">' + s + '</div></div>';
    const mx = Math.max(1, ...d.days.map((x) => x.n));
    const bars = d.days.map((x, i) => '<div class="bar" title="' + esc(day(x.day + 'T12:00:00')) + ': ' + x.n + '"><b>' + (x.n || '') + '</b><i style="height:' + Math.round((x.n / mx) * 100) + '%"></i><span>' +
      (i === 0 || i === 6 || i === d.days.length - 1 ? esc(day(x.day + 'T12:00:00')) : '') + '</span></div>').join('');
    const countries = d.countries.length ? d.countries.map((c) => '<div class="r"><span>' + flag(c.cc) + esc(c.city ? c.city + ', ' + c.country : c.country) + '</span><b>' + c.n + '</b></div>').join('')
      : '<p class="empty">No places yet. They show up after the first visits.</p>';
    const PAGE = { start: 'Start page', home: 'A home', invite: 'An invite link', trip: 'Triply' };
    const recent = (d.recent || []).length ? '<div class="scroll"><table><tr><th>When</th><th>Where</th><th>Opened</th><th>Device</th></tr>' +
      d.recent.map((v) => '<tr><td>' + ago(v.at) + '</td><td>' + where(v) + '</td><td>' + esc(PAGE[v.page] || v.page) + '</td><td style="color:var(--muted)">#' + esc(v.who) + '</td></tr>').join('') + '</table></div>'
      : '<p class="empty">No visits yet. Real people show up here; bots and link previews are left out.</p>';
    const homes = d.homes.length ? '<div class="scroll"><table><tr><th>Home</th><th>Where</th><th class="c">People</th><th>Created</th><th>Last active</th><th class="c">Items</th><th class="c">Photos</th><th></th></tr>' +
      d.homes.map((h) => '<tr><td><b>' + esc(h.name) + '</b>' + (h.online ? '<span class="live">● online</span>' : '') + (h.never_back ? '<span class="tag" title="Made more than a day ago and not opened again after its first day">Never came back</span>' : '') + '</td><td>' + where(h) + '</td><td class="c">' + h.people + '</td><td>' + day(h.created_at) +
        '</td><td>' + ago(h.last_active) + '</td><td class="c">' + h.items + '</td><td class="c">' + mb(h.photo_bytes) + '</td><td><span class="acts"><button class="view" data-id="' + esc(h.id) + '">' + EYE + 'View</button><button class="del" data-kind="home" data-id="' + esc(h.id) + '" data-name="' + esc(h.name) + '">Delete</button></span></td></tr>').join('') + '</table></div>'
      : '<p class="empty">No homes yet.</p>';
    const trips = d.trips == null ? '' : '<section class="card"><h2><span class="pill trip">TRIPS</span>' + d.trips.length + (d.trips.length === 1 ? ' trip' : ' trips') + '</h2>' +
      (d.trips.length ? '<div class="scroll"><table><tr><th>Trip</th><th>Dates</th><th>Where</th><th class="c">People</th><th>Last active</th><th class="c">Plans</th><th class="c">Files</th><th></th></tr>' +
        d.trips.map((x) => '<tr><td><b>' + esc(x.name) + '</b>' + (x.never_back ? '<span class="tag" title="Made more than a day ago and not opened again after its first day">Never came back</span>' : '') + '</td><td>' + day(x.start_date + 'T12:00:00') + (x.end_date && x.end_date !== x.start_date ? ' – ' + day(x.end_date + 'T12:00:00') : '') + '</td><td>' + where(x) +
          '</td><td class="c">' + x.people + '</td><td>' + ago(x.last_active) + '</td><td class="c">' + x.plans + '</td><td class="c">' + mb(x.file_bytes) +
          '</td><td><span class="acts"><button class="view trip-view" data-id="' + esc(x.id) + '">' + EYE + 'View</button><button class="del" data-kind="trip" data-id="' + esc(x.id) + '" data-name="' + esc(x.name) + '">Delete</button></span></td></tr>').join('') + '</table></div>'
        : '<p class="empty">No trips yet.</p>') + '</section>';
    const asks = d.asks == null ? '' : '<section class="card"><h2><span class="pill trip">TRIPLY</span>Asks for more free trip plans' + (d.asks.length ? ' (' + d.asks.length + ')' : '') + '</h2>' +
      (d.asks.length ? '<div class="scroll"><table><tr><th>Who</th><th>Trip</th><th>Message</th><th>When</th><th class="c">Used</th><th></th></tr>' +
        d.asks.map((a) => '<tr><td><b>' + esc(a.name) + '</b></td><td>' + esc(a.trip || '') + '</td><td>' + esc(a.message || '—') + '</td><td>' + ago(new Date(a.created_at).getTime()) +
          '</td><td class="c">' + a.used + ' of ' + (2 + a.extra) + '</td><td style="white-space:nowrap"><button class="view ask" data-id="' + esc(a.id) + '" data-give="2">Give 2 more</button> <button class="view ask no" data-id="' + esc(a.id) + '" data-give="0">No thanks</button></td></tr>').join('') + '</table></div>'
        : '<p class="empty">No one is asking right now. Each person gets 2 free trip plans.</p>') +
      '<p class="note">Each “Plan my trip” costs about 15–45¢. The daily cap still applies.</p></section>';
    app.innerHTML =
      '<div class="top"><span class="mark">' + CAL + '</span><h1>Kalendaryo</h1><span class="badge">OWNER VIEW</span><span class="upd">Updated ' + new Date(d.now).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' · refreshes every 30 s</span></div>' +
      '<div class="tiles">' + tile(d.visitors_now, 'Visitors now', 'active in the last 2 min', 'var(--ok)') + tile(t.today, 'Visitors today', t.week + ' this week') +
        tile(t.homes, 'Homes', '+' + t.homes_week + ' this week') + (t.trips != null ? tile(t.trips, 'Trips', '+' + t.trips_week + ' this week') : '') +
        tile(t.people, 'People', 'in homes' + (t.trips != null ? ' and trips' : '')) + tile(t.ai_today, 'AI uses today', d.ai_on ? 'across all homes' : 'AI is off') +
          tile('$' + (t.ai_usd || 0).toFixed(2), 'AI spent today', 'homes, of $' + (t.ai_cap != null ? t.ai_cap : 1) + ' a day' + (t.trip_ai_usd != null ? ' · trips $' + t.trip_ai_usd.toFixed(2) : '')) + '</div>' +
      '<div id="inbox-slot"></div>' + (d.asks && d.asks.length ? asks : '') + '<div class="row2"><section class="card"><h2>Visitors, last 14 days</h2><div class="chart">' + bars + '</div><p class="note">Counted once per device per day. Addresses are never saved.</p></section>' +
        '<section class="card where"><h2>Where visitors are</h2>' + countries + '<p class="note">Last 30 days. City and country only.</p></section></div>' +
      '<section class="card"><h2>Recent visitors</h2>' + recent + '<p class="note">The last 20 visits by real people. Bots, search engines and link previews are not counted. “Device” is a short code, not a name.</p></section>' +
      (d.asks && d.asks.length ? '' : asks) + '<section class="card"><h2><span class="pill">HOMES</span>' + d.homes.length + (d.homes.length === 1 ? ' home' : ' homes') + '</h2>' + homes + '</section>' + trips +
      '<p class="note">Database: ' + mb(t.db_bytes) + ' used. “View” opens that home or trip read-only for 2 hours; your visit doesn’t count as theirs. “Delete” removes it for good, only when you click it.</p>';
    const slot = document.getElementById('inbox-slot'); if (slot) slot.replaceWith(inbox.el);
    inbox.load();
    app.querySelectorAll('.ask').forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      try { await api('POST', '/api/owner/ai-request', { id: b.dataset.id, give: Number(b.dataset.give) }); load(); } catch (e) { alert(e.message); b.disabled = false; }
    }));
    app.querySelectorAll('.view:not(.ask)').forEach((b) => (b.onclick = async () => {
      const w = window.open('about:blank', '_blank');
      const trip = b.classList.contains('trip-view');
      try { const r = await api('POST', trip ? '/api/owner/view-trip' : '/api/owner/view', trip ? { tripId: b.dataset.id } : { familyId: b.dataset.id }); if (w) w.location = r.link; else location.href = r.link; }
      catch (e) { if (w) w.close(); alert(e.message); }
    }));
    app.querySelectorAll('.del').forEach((b) => (b.onclick = () => askDelete(b.dataset.kind, b.dataset.id, b.dataset.name)));
  }

  /* ---------- Help & ideas inbox: messages from people in both apps; the team replies here ---------- */
  const inbox = (function () {
    const el = document.createElement('section');
    el.className = 'card';
    let filter = 'open', threads = [], unread = 0, sel = null, conv = null, welcome = null, draft = '', loading = false;
    const APP = { home: 'Kalendaryo', trip: 'Triply' };
    const TAG = { problem: '🐞', idea: '💡', question: '❓' };
    async function load() {
      if (loading) return; loading = true;
      try {
        const r = await api('GET', '/api/owner/help?filter=' + filter);
        threads = r.threads; unread = r.unread; if (!welcome) welcome = r.welcome;
        if (sel) { try { conv = await api('GET', '/api/owner/help/' + sel); } catch (e) { sel = null; conv = null; } }
      } catch (e) { /* keep what we have */ }
      loading = false;
      document.title = (unread ? '(' + unread + ') ' : '') + 'Kalendaryo · Owner view';
      paint();
    }
    function paint() {
      const box = el.querySelector('.ib-reply textarea'); if (box) draft = box.value;
      const msgsBox = el.querySelector('.ib-msgs'); const atBottom = !msgsBox || msgsBox.scrollHeight - msgsBox.scrollTop - msgsBox.clientHeight < 60;
      const list = threads.length ? threads.map((t) => '<button class="ib-item' + (t.owner_unread ? ' new' : '') + (t.id === sel ? ' sel' : '') + '" data-id="' + t.id + '"><span class="ib-dot"></span><span class="ib-main"><span class="ib-top"><span class="ib-name">' + esc(t.name || 'Someone') +
        '</span><span class="ib-app' + (t.app === 'trip' ? ' trip' : '') + '">' + APP[t.app] + '</span><span class="ib-place">' + esc(t.place_name) + '</span><span class="ib-when">' + ago(new Date(t.last_at).getTime()) + '</span></span><span class="ib-prev">' +
        (t.tag ? TAG[t.tag] + ' ' : '') + esc(t.last_body || (t.last_image ? '📎 Screenshot' : '')) + '</span></span></button>').join('')
        : '<p class="empty">' + (filter === 'open' ? 'No open messages. When people write from “Help & ideas”, they show up here.' : 'Nothing here.') + '</p>';
      let right = '<div class="ib-conv"><p class="ib-pick">Pick a message on the left to read and reply.</p></div>';
      if (conv) {
        const t = conv.thread;
        right = '<div class="ib-conv"><div class="ib-conv-head"><b>' + esc(t.name || 'Someone') + '</b><span class="ib-app' + (t.app === 'trip' ? ' trip' : '') + '">' + APP[t.app] + '</span><span class="ib-place">' + esc(t.place_name) + '</span>' +
          '<span class="acts"><button class="view ib-view">' + EYE + (t.app === 'trip' ? 'View trip' : 'View home') + '</button><button class="ib-done">' + (t.status === 'done' ? '↺ Reopen' : '✓ Mark done') + '</button></span></div><div class="ib-msgs">' +
          conv.messages.map((m) => '<div class="ib-msg' + (m.team ? ' team' : '') + (m.team && m.auto ? ' auto' : '') + '">' + (m.image ? '<img src="' + esc(m.image) + '" alt="Screenshot">' : '') + (m.body ? '<div class="ib-bubble">' + (m.tag ? TAG[m.tag] + ' ' : '') + esc(m.body) + '</div>' : '') +
            '<span class="ib-meta">' + (m.team ? esc(t.team) : esc(t.name)) + ' · ' + new Date(m.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '</span></div>').join('') +
          '</div><div class="ib-reply"><textarea rows="1" placeholder="Reply as ' + esc(t.team) + '…"></textarea><button class="ib-send">Send</button></div></div>';
      }
      el.innerHTML = '<div class="ib-head"><h2 style="margin:0"><span class="pill">INBOX</span> Help & ideas</h2>' + (unread ? '<span class="ib-new">' + unread + ' new</span>' : '') +
        '<span class="ib-filters">' + ['open', 'done', 'all'].map((f) => '<button data-f="' + f + '" class="' + (filter === f ? 'on' : '') + '">' + f[0].toUpperCase() + f.slice(1) + '</button>').join('') + '</span></div>' +
        '<div class="ib-grid"><div class="ib-list">' + list + '</div>' + right + '</div>' +
        '<details class="ib-welcome"' + (el.querySelector('.ib-welcome[open]') ? ' open' : '') + '><summary>Welcome message (sent once to each person)</summary>' +
        '<p class="note">Use {name} for the person’s first name. Changes are used for people who have not received it yet. Leave a box empty to go back to the original text.</p><div class="wrow">' +
        ['home', 'trip'].map((a) => '<div><label for="w-' + a + '">' + APP[a] + '</label><textarea id="w-' + a + '">' + esc(welcome ? welcome[a] : '') + '</textarea><button class="view w-save" data-app="' + a + '" style="margin-top:6px">Save</button></div>').join('') + '</div></details>';
      const ta = el.querySelector('.ib-reply textarea');
      if (ta) { ta.value = draft; ta.oninput = () => { draft = ta.value; ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; }; ta.onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send(); }; }
      const mb = el.querySelector('.ib-msgs'); if (mb && atBottom) mb.scrollTop = mb.scrollHeight;
      el.querySelectorAll('.ib-item').forEach((b) => (b.onclick = () => openThread(Number(b.dataset.id))));
      el.querySelectorAll('.ib-filters button').forEach((b) => (b.onclick = () => { filter = b.dataset.f; load(); }));
      el.querySelectorAll('.ib-msg img').forEach((i) => (i.onclick = () => i.classList.toggle('big')));
      const sb = el.querySelector('.ib-send'); if (sb) sb.onclick = send;
      const db = el.querySelector('.ib-done'); if (db) db.onclick = async () => { await api('POST', '/api/owner/help/' + sel + '/status', { status: conv.thread.status === 'done' ? 'open' : 'done' }); load(); };
      const vb = el.querySelector('.ib-view'); if (vb) vb.onclick = async () => {
        const w = window.open('about:blank', '_blank'), t = conv.thread;
        try { const r = await api('POST', t.app === 'trip' ? '/api/owner/view-trip' : '/api/owner/view', t.app === 'trip' ? { tripId: t.place_id } : { familyId: t.place_id }); if (w) w.location = r.link; }
        catch (e) { if (w) w.close(); alert(e.message); }
      };
      el.querySelectorAll('.w-save').forEach((b) => (b.onclick = async () => {
        b.disabled = true;
        try { welcome = await api('POST', '/api/owner/help-welcome', { app: b.dataset.app, text: el.querySelector('#w-' + b.dataset.app).value }); b.textContent = 'Saved ✓'; setTimeout(() => { b.textContent = 'Save'; }, 1500); }
        catch (e) { alert(e.message); }
        b.disabled = false;
      }));
    }
    async function openThread(id) {
      if (id !== sel) draft = '';
      sel = id;
      try { conv = await api('GET', '/api/owner/help/' + id); } catch (e) { alert(e.message); return; }
      const t = threads.find((x) => x.id === id); if (t && t.owner_unread) { unread = Math.max(0, unread - 1); t.owner_unread = 0; }
      document.title = (unread ? '(' + unread + ') ' : '') + 'Kalendaryo · Owner view';
      paint(); const ta = el.querySelector('.ib-reply textarea'); if (ta) ta.focus();
    }
    async function send() {
      const ta = el.querySelector('.ib-reply textarea'), text = ta ? ta.value.trim() : '';
      if (!text || !sel) return;
      const b = el.querySelector('.ib-send'); b.disabled = true;
      try { await api('POST', '/api/owner/help/' + sel + '/reply', { body: text }); draft = ''; await load(); }
      catch (e) { alert(e.message); b.disabled = false; }
    }
    return { el, load };
  })();

  // Delete one home or trip. You must type its name exactly. Nothing is ever deleted any other way.
  function askDelete(kind, id, name) {
    clearTimeout(timer); // no refresh while deciding
    const what = kind === 'home' ? 'home' : 'trip';
    const wrapEl = document.createElement('div');
    wrapEl.className = 'modal-wrap';
    wrapEl.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dh"><h3 id="dh">Delete “' + esc(name) + '”?</h3>' +
      '<p>This removes the ' + what + ' and everything in it' + (kind === 'home' ? ' (events, chores, lists, notes, photos and people’s links)' : ' (plans, bookings, chats, files, costs and people’s links)') + '. It cannot be undone.</p>' +
      '<label for="dn">Type the name to confirm:</label><input id="dn" autocomplete="off" placeholder="' + esc(name) + '"><p class="err" id="de" hidden></p>' +
      '<div class="row"><button class="cancel" type="button">Cancel</button><button class="gone" type="button" disabled>Delete for good</button></div></div>';
    document.body.append(wrapEl);
    const input = wrapEl.querySelector('input'), go = wrapEl.querySelector('.gone'), err = wrapEl.querySelector('#de');
    const close = () => { wrapEl.remove(); load(); };
    input.oninput = () => { go.disabled = input.value.trim() !== String(name).trim(); };
    wrapEl.querySelector('.cancel').onclick = close;
    wrapEl.onclick = (e) => { if (e.target === wrapEl) close(); };
    input.onkeydown = (e) => { if (e.key === 'Escape') close(); if (e.key === 'Enter' && !go.disabled) go.click(); };
    go.onclick = async () => {
      go.disabled = true; err.hidden = true;
      try { await api('POST', '/api/owner/delete', { kind, id, name: input.value.trim() }); close(); }
      catch (e) { err.textContent = e.message; err.hidden = false; go.disabled = false; }
    };
    input.focus();
  }

  load();
})();
</script>
</body>
</html>
