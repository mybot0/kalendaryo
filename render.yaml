# Render Blueprint: creates the web server and the Postgres database together.
# In Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: kalendaryo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kalendaryo-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false        # Render asks you for it. Leave empty to turn AI off.
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: INVITE_DAYS
        value: "7"

databases:
  - name: kalendaryo-db
    plan: free
    databaseName: kalendaryo
