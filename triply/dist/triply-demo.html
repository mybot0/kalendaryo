<title>Triply</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap">
<style>
/* theme.css — same tokens as Kalendaryo; the accent is terracotta instead of green. */
:root {
  color-scheme: light;
  --bg: #F4F3EE;
  --surface: #FFFFFF;
  --surface-2: #F8F7F3;
  --line: #E4E2DA;
  --ink: #26302B;
  --ink-2: #5C675F;
  --ink-3: #8A948C;
  --primary: #B8583A;
  --primary-ink: #FFFFFF;
  --primary-soft: #F8E7E0;
  --danger: #B3402F;
  --danger-soft: #FBE9E5;
  --focus: #2F6B8F;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(38,48,43,.06), 0 4px 14px rgba(38,48,43,.06);
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Outfit', 'Figtree', system-ui, sans-serif;
  --text-scale: 1;
  --tap: 48px;
}

/* base.css — reset and everyday text/layout helpers. */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: calc(100% * var(--text-scale)); -webkit-text-size-adjust: 100%; }
html.has-sheet body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.45 var(--font); min-height: 100vh; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; line-height: 1.2; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition: none !important; animation: none !important; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card-list { display: flex; flex-direction: column; gap: 8px; }
.sub { color: var(--ink-2); font-size: .9rem; }
.spacer { flex: 1; }
.pre { white-space: pre-wrap; }
.mini-h { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 8px 0 4px; font-family: var(--font); font-weight: 700; }
.link-btn { background: none; border: 0; color: var(--primary); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; min-height: 36px; padding: 0 6px; border-radius: 8px; }
.link-btn:hover { background: var(--primary-soft); }
.link-btn .ic { width: 18px; height: 18px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.plain-list { margin: 0; padding-left: 1.2em; color: var(--ink-2); }
.form-error { color: var(--danger); font-weight: 600; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* components.css — buttons, forms, avatars, sheets, toast, event cards. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; font-weight: 700; background: var(--primary-soft); color: var(--primary); transition: filter .15s, transform .1s; }
.btn:hover { filter: brightness(.96); } .btn:active { transform: scale(.98); }
.btn.big { min-height: var(--tap); padding: 0 22px; font-size: 1.02rem; }
.btn.block { width: 100%; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: rgba(0,0,0,.05); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--primary-soft); }

.avatar { width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); display: inline-grid; place-items: center; font-weight: 800; font-size: calc(var(--s) * .42); flex: none; color: rgba(38,48,43,.8); }
.avatar.emoji { font-size: calc(var(--s) * .55); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field-label { font-weight: 700; font-size: .9rem; }
.hint { color: var(--ink-3); font-size: .85rem; }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
  width: 100%; min-height: var(--tap); padding: 8px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.num { width: 5.5rem !important; }

.segmented { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; width: fit-content; max-width: 100%; }
.seg-btn { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; font-weight: 700; color: var(--ink-2); }
.seg-btn.on { background: var(--primary); color: #fff; }

.switch { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.switch-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 50px; height: 30px; border-radius: 999px; background: #CFCFC6; position: relative; transition: background .2s; flex: none; }
.thumb { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch-input:checked + .track { background: var(--primary); }
.switch-input:checked + .track .thumb { transform: translateX(20px); }
.switch-input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
.switch-label { font-weight: 600; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; background: var(--c); border: 3px solid transparent; }
.swatch.auto { width: auto; padding: 0 14px; border-radius: 999px; background: var(--surface-2); border: 1.5px solid var(--line); font-weight: 700; font-size: .85rem; color: var(--ink-2); }
.swatch.on { border-color: var(--ink); box-shadow: inset 0 0 0 2px #fff; }
.swatch.auto.on { background: var(--ink); color: #fff; }

.empty-state { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-2); }
.empty-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.empty-icon .ic { width: 28px; height: 28px; }
.empty-state h3 { color: var(--ink); }
.empty-state p { max-width: 34ch; }
.empty-state .btn { margin-top: 8px; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 85; background: rgba(38,48,43,.38); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.18); animation: rise .22s ease-out; outline: none; }
.sheet.wide { max-width: 720px; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 8px; }
.sheet-close { box-shadow: none; background: var(--surface-2); }
.sheet-body { padding: 8px 20px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet-text { color: var(--ink-2); margin-bottom: 8px; }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; } }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-height: var(--tap); }
.choice:hover { border-color: var(--primary); background: var(--primary-soft); }
.choice span { color: var(--ink-2); font-size: .9rem; }
.choice.danger strong { color: var(--danger); }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 95; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

/* event card */
.ev-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: var(--radius-sm); padding: 12px 14px 12px 16px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); min-height: var(--tap); }
.ev-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
.ev-card:hover { background: var(--surface-2); }
.ev-time { font-weight: 700; font-size: .85rem; color: var(--ink-2); min-width: 5.2em; }
.ev-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.ev-title { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.ev-title .ic { width: 18px; height: 18px; }
.ev-loc { color: var(--ink-2); font-size: .85rem; display: inline-flex; align-items: center; gap: 4px; }
.ev-loc .ic { width: 14px; height: 14px; }
.ev-people { display: inline-flex; margin-left: auto; }
.ev-people .avatar { margin-left: -6px; box-shadow: 0 0 0 2px #fff; }
.ev-rep { color: var(--ink-3); display: inline-flex; }
.ev-rep .ic { width: 16px; height: 16px; }
.ev-card.compact { flex-wrap: wrap; padding: 8px 10px 8px 14px; gap: 2px 8px; min-height: 0; }
.ev-card.compact .ev-time { min-width: 0; font-size: .78rem; }
.ev-card.compact .ev-main { flex-basis: 100%; }
.ev-card.compact .ev-people { display: none; }

/* detail sheet */
.detail { position: relative; display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.detail-band { height: 8px; border-radius: 999px; background: var(--c); }
.detail-row { display: flex; gap: 12px; align-items: flex-start; }
.detail-ic { color: var(--ink-3); padding-top: 2px; }
.detail-people { display: flex; flex-wrap: wrap; gap: 8px; }
.person-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; background: var(--surface-2); border-radius: 999px; font-weight: 600; }

/* event form */
.event-form { display: flex; flex-direction: column; gap: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.person-pick { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 14px 4px 6px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; }
.person-pick[aria-pressed=true] { border-color: var(--primary); background: var(--primary-soft); }
.repeat-block, .repeat-custom, .repeat-ends { display: flex; flex-direction: column; gap: 12px; }
.repeat-block { padding: 14px; background: var(--surface-2); border-radius: var(--radius-sm); }
.inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline select { width: auto; }
.wd-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.wd-pick button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
.wd-pick button[aria-pressed=true] { background: var(--primary); border-color: var(--primary); color: #fff; }
.avatar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.avatar-opt { height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 1.5rem; }
.avatar-opt.on { border-color: var(--primary); background: var(--primary-soft); }

/* shell.css — page frame: side rail on wide screens, bottom bar on phones. */
.app { display: flex; min-height: 100vh; }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main { flex: 1; padding: 24px max(16px, env(safe-area-inset-right)) 120px max(16px, env(safe-area-inset-left)); width: 100%; max-width: 1280px; margin: 0 auto; outline: none; }
.status-banner { background: #FFF3D6; color: #6B4E00; padding: 10px 16px; text-align: center; font-weight: 600; }
.rail { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.brand { display: none; }
.nav { display: flex; justify-content: space-around; padding: 4px 4px; }
.nav-btn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 8px 2px; min-height: 56px; border-radius: 14px; color: var(--ink-2); font-weight: 700; font-size: .7rem; }
.nav-btn.on { color: var(--primary); background: var(--primary-soft); }
.nav-btn.soon:not(.on) { color: var(--ink-3); }
.nav-label { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
@media (min-width: 900px) {
  .rail { position: sticky; top: 0; height: 100vh; width: 210px; flex: none; border-top: 0; border-right: 1px solid var(--line); padding: 22px 14px; align-self: flex-start; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--primary); padding: 0 8px 22px; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-name { font: 800 1.35rem var(--font-head); }
  .brand-tag { font: 600 .78rem var(--font); color: var(--ink-3); }
  .nav { flex-direction: column; justify-content: flex-start; gap: 4px; padding: 0; }
  .nav-btn { flex: none; flex-direction: row; gap: 14px; padding: 0 14px; min-height: 52px; font-size: 1.02rem; justify-content: flex-start; }
  .main { padding-bottom: 40px; }
}
@media (min-width: 1700px) { html { font-size: calc(112.5% * var(--text-scale)); } .main { max-width: 1700px; } }
@media (max-width: 520px) { .nav { padding: 4px 0; } .nav-btn { padding: 8px 0; font-size: .62rem; letter-spacing: -.01em; } .nav-btn .ic { width: 21px; height: 21px; } }

/* triply.css — screens that only Triply has: trips, itinerary, bookings, chat, people. Uses the shared tokens from theme.css. */

/* ---------- small shared pieces ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: .75rem; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.badge.owner { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.badge.alert { background: var(--primary); border-color: transparent; color: #fff; min-width: 22px; justify-content: center; }
.nav-btn { position: relative; }
.nav-badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--primary); color: #fff; border-radius: 999px; font-size: .62rem; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; font-weight: 800; }
@media (min-width: 900px) { .nav-badge { position: static; margin-left: auto; font-size: .72rem; } }
.rail-sub { display: none; }
@media (min-width: 900px) {
  .rail-sub { display: block; padding: 0 8px 14px; }
  .rail-sub b { display: block; font: 700 1rem var(--font-head); overflow-wrap: anywhere; }
  .rail-sub span { color: var(--ink-3); font-size: .82rem; }
  .rail-back { display: flex; margin: 0 0 8px; }
}
.rail-back { display: none; }
.rail-back .link-btn { width: 100%; justify-content: flex-start; }
.page-head h1 { overflow-wrap: anywhere; }
.copy-box { display: flex; gap: 8px; align-items: stretch; }
.copy-box input { flex: 1; min-width: 0; font-size: .9rem; }
.note-box { background: var(--primary-soft); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--ink); font-size: .92rem; }
.warn-box { background: #FFF3D6; color: #6B4E00; border-radius: var(--radius-sm); padding: 12px 14px; font-size: .92rem; }
.muted-card { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.center-page { max-width: 480px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 16px; }
.center-page .brand-mark { display: flex; align-items: center; gap: 10px; color: var(--primary); font: 800 1.5rem var(--font-head); }
.loading { color: var(--ink-3); text-align: center; padding: 40px 0; }
.big-emoji { font-size: 2.2rem; line-height: 1; }

/* ---------- My Trips ---------- */
.trip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.trip-card { display: flex; flex-direction: column; text-align: left; border: 0; padding: 0; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; width: 100%; }
.trip-card:hover { filter: brightness(.985); transform: translateY(-1px); }
.cover { background: var(--c, var(--primary-soft)) center / cover no-repeat; display: grid; place-items: center; height: 118px; font-size: 3rem; position: relative; }
.cover .badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.92); }
.cover .badge.alert { background: var(--primary); }
.tc-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
.tc-name { font: 700 1.1rem var(--font-head); overflow-wrap: anywhere; }
.tc-meta { color: var(--ink-2); font-size: .88rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.tc-meta .ic { width: 15px; height: 15px; vertical-align: -2px; }
.tc-when { color: var(--primary); font-weight: 700; font-size: .85rem; }
.add-card { border: 2px dashed var(--line); background: none; border-radius: var(--radius); min-height: 150px; display: grid; place-items: center; color: var(--ink-2); font-weight: 700; gap: 6px; }
.add-card:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.add-card span { display: flex; flex-direction: column; align-items: center; gap: 6px; }

/* ---------- Overview ---------- */
.hero { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--surface); }
.hero .cover { height: 150px; font-size: 4rem; }
.hero-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-weight: 600; color: var(--ink-2); }
.route .ic { width: 16px; height: 16px; color: var(--ink-3); }
.countdown { display: inline-flex; align-self: flex-start; background: var(--primary-soft); color: var(--primary); font-weight: 800; border-radius: 999px; padding: 4px 14px; }
.overview-grid { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 1000px) { .overview-grid { grid-template-columns: 3fr 2fr; } }
.next-card { border-left: 6px solid var(--c); }
.next-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; }
.traveler-row { display: flex; flex-wrap: wrap; gap: 6px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; text-align: center; display: flex; flex-direction: column; border: 0; }
.stat b { font: 700 1.5rem var(--font-head); }
.stat span { color: var(--ink-2); font-size: .8rem; font-weight: 600; }
button.stat:hover { background: var(--primary-soft); }

/* ---------- Itinerary ---------- */
.it-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
.it-bar .segmented { max-width: 100%; overflow-x: auto; flex-wrap: nowrap; }
.it-bar .seg-btn { white-space: nowrap; padding: 0 14px; }
.day-block { margin-bottom: 20px; max-width: 760px; }
.day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.day-head h3 { font-size: 1.05rem; }
.day-head .sub { font-weight: 600; }
.day-head.today h3 { color: var(--primary); }
.day-head .link-btn { margin-left: auto; }
.day-empty { color: var(--ink-3); border: 1.5px dashed var(--line); border-radius: var(--radius-sm); padding: 10px 14px; background: none; text-align: left; width: 100%; min-height: 44px; }
button.day-empty:hover { border-color: var(--primary); color: var(--primary); }
.tp-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--c); display: grid; place-items: center; color: rgba(38,48,43,.85); flex: none; }
.tp-ic .ic { width: 22px; height: 22px; }
.ev-card .tp-ic { width: 36px; height: 36px; }
.ev-sub { color: var(--ink-2); font-size: .85rem; overflow-wrap: anywhere; }
.ev-card.cont { background: var(--surface-2); opacity: .8; }
.ev-card.cont .ev-title { font-weight: 600; }
.ev-card.compact .tp-ic { display: none; }
.ev-conf { font-size: .75rem; font-weight: 700; color: var(--primary); }
.week-nav { display: flex; align-items: center; gap: 8px; }
.full-grid { display: flex; flex-direction: column; gap: 6px; max-width: 760px; }
.full-row { display: flex; align-items: center; gap: 12px; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius-sm); padding: 10px 14px; text-align: left; min-height: 56px; width: 100%; }
.full-row:hover { background: var(--surface-2); }
.full-row.today { box-shadow: inset 0 0 0 2px var(--primary); background: var(--primary-soft); }

    return { files: Object.values(db.blobs).filter((b) => b.trip_id === t.id && b.id !== t.cover_blob).sort((a, b) => b.created_at.localeCompare(a.created_at)).map((b) => ({ id: b.id, mime: b.mime, name: b.name, size: b.size, created_by: b.created_by, created_at: b.created_at })) };
  });
  R('DELETE', '/trips/:id/files/:fid', (c) => {
    const m = auth(c.token, c.p.id), f = db.blobs[c.p.fid];
    if (!f || f.trip_id !== m.trip_id) throw new Err(404, 'not_found', 'That file could not be found.');
    if (f.created_by !== m.id) need(m, 'trip.edit', 'Only the person who added a file, or an owner, can remove it.');
    db.messages = db.messages.filter((x) => !(x.blob && x.blob.id === f.id && !x.body)); db.messages.forEach((x) => { if (x.blob && x.blob.id === f.id) x.blob = null; });
    delete db.blobs[f.id]; return {};
  });
  const cleanExp = (b, tid, base) => {
    const g = (k, d) => (b[k] !== undefined ? b[k] : base ? base[k] : d);
    const title = txt(g('title', ''), 120); if (!title) throw bad('Please say what the cost was for.');
    const amount = Math.round(Number(g('amount', NaN)) * 100) / 100; if (!(amount > 0) || amount > 1e7) throw bad('Enter an amount above zero.');
    const ids = members(tid).map((x) => x.id);
    if (!ids.includes(g('paid_by', null))) throw bad('Pick who paid.');
    const split = [...new Set((g('split', []) || []).filter((x) => ids.includes(x)))]; if (!split.length) throw bad('Pick at least one person to share the cost.');
    const on = g('spent_on', null) || null; if (on && !isDate(on)) throw bad('That date does not look right.');
    const it = g('item_id', null); return { title, amount, currency: txt(g('currency', 'CAD'), 3).toUpperCase().replace(/[^A-Z]/g, '') || 'CAD', paid_by: g('paid_by', null), split, spent_on: on, item_id: it && db.items[it] && db.items[it].trip_id === tid ? it : null, note: txt(g('note', ''), 500) };
  };
  R('POST', '/trips/:id/expenses', (c) => {
    const m = auth(c.token, c.p.id); need(m, 'items.write', 'Viewers can look at the costs but not change them.');
    const e = Object.assign({ id: uid(), trip_id: m.trip_id, created_by: m.id, created_at: now() }, cleanExp(c.body, m.trip_id, null));
    db.expenses[e.id] = e; emit(m.trip_id, { kind: 'expenses' }); return { expense: expOut(e) };
  });
  R('PATCH', '/trips/:id/expenses/:eid', (c) => {
    const m = auth(c.token, c.p.id); need(m, 'items.write', 'Viewers can look at the costs but not change them.');
    const cur = db.expenses[c.p.eid]; if (!cur || cur.trip_id !== m.trip_id) throw new Err(404, 'not_found', 'That cost was removed.');
    Object.assign(cur, cleanExp(c.body, m.trip_id, cur)); emit(m.trip_id, { kind: 'expenses' }); return { expense: expOut(cur) };
  });
  R('DELETE', '/trips/:id/expenses/:eid', (c) => {
    const m = auth(c.token, c.p.id); need(m, 'items.write', 'Viewers can look at the costs but not change them.');
    if (!db.expenses[c.p.eid] || db.expenses[c.p.eid].trip_id !== m.trip_id) throw new Err(404, 'not_found', 'That cost was removed.');
    delete db.expenses[c.p.eid]; emit(m.trip_id, { kind: 'expenses' }); return {};
  });

  /* ---------- packing and search ---------- */
  const CATS = ['Documents', 'Clothes', 'Toiletries', 'Tech', 'Health', 'Other'];
  const packOut = (x) => Object.assign({}, x, { trip_id: undefined });
  const packWho = (tid, id) => { if (!id) return null; if (!db.members[id] || db.members[id].trip_id !== tid) throw bad('Pick someone who is on this trip.'); return id; };
  R('POST', '/trips/:id/packing', (c) => {
    const m = auth(c.token, c.p.id); need(m, 'items.write', 'Viewers can look at the packing list but not add to it.');
    const title = txt(c.body.title, 100); if (!title) throw bad('Type what to pack.');
    if (Object.values(db.packing).filter((x) => x.trip_id === m.trip_id).length >= 300) throw bad('The packing list can hold up to 300 things.');
    const x = { id: uid(), trip_id: m.trip_id, title, category: CATS.includes(c.body.category) ? c.body.category : '', assigned_to: packWho(m.trip_id, c.body.assigned_to), done: false, done_by: null, created_by: m.id, created_at: now() };
    db.packing[x.id] = x; emit(m.trip_id, { kind: 'packing' }); return { item: packOut(x) };
  });
  R('PATCH', '/trips/:id/packing/:pid', (c) => {
    const m = auth(c.token, c.p.id), x = db.packing[c.p.pid];
    if (!x || x.trip_id !== m.trip_id) throw new Err(404, 'not_found', 'That item was removed.');
    const b = c.body;
    if (['title', 'category', 'assigned_to'].some((k) => b[k] !== undefined)) need(m, 'items.write', 'Viewers can look at the packing list but not change it.');
    if (b.done !== undefined) need(m, 'chat.write', 'You cannot tick things off on this trip.');
    if (b.title !== undefined) { const t = txt(b.title, 100); if (!t) throw bad('Type what to pack.'); x.title = t; }
    if (b.category !== undefined) x.category = CATS.includes(b.category) ? b.category : '';
    if (b.assigned_to !== undefined) x.assigned_to = packWho(m.trip_id, b.assigned_to);
    if (b.done !== undefined) { x.done = !!b.done; x.done_by = x.done ? m.id : null; }
    emit(m.trip_id, { kind: 'packing' }); return { item: packOut(x) };
  });
  R('DELETE', '/trips/:id/packing/:pid', (c) => {
    const m = auth(c.token, c.p.id); need(m, 'items.write', 'Viewers can look at the packing list but not change it.');
    const x = db.packing[c.p.pid]; if (!x || x.trip_id !== m.trip_id) throw new Err(404, 'not_found', 'That item was removed.');
    delete db.packing[x.id]; emit(m.trip_id, { kind: 'packing' }); return {};
  });
  R('GET', '/trips/:id/search', (c) => {
    const m = auth(c.token, c.p.id), q = txt(c.q.get('q'), 60).toLowerCase();
    if (q.length < 2) return { messages: [] };
    const hits = db.messages.filter((x) => x.trip_id === m.trip_id && x.kind === 'text' && x.body.toLowerCase().includes(q) && (!x.to_member || x.to_member === m.id || x.sender_id === m.id));
    return { messages: hits.slice(-20).reverse().map((x) => Object.assign({}, x, { trip_id: undefined })) };
  });

  /* ---------- fetch takeover ---------- */
  const realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = new URL(typeof input === 'string' ? input : input.url, location.href), i = url.pathname.indexOf('/api/');
    if (i === -1) return realFetch(input, init);
    const path = url.pathname.slice(i + 4), o = init || {}, method = (o.method || 'GET').toUpperCase();
    const h = o.headers || {}, a = h.Authorization || h.authorization || '', token = a.replace(/^Bearer /, '');
    const json = (status, data) => new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
    return new Promise((resolve) => {
      const readBlob = (o.body && typeof o.body !== 'string' && o.body.size !== undefined)
        ? new Promise((done) => { const fr = new FileReader(); fr.onload = () => done(fr.result); fr.onerror = () => done(''); fr.readAsDataURL(o.body); })
        : Promise.resolve(null);
      readBlob.then((dataUrl) => setTimeout(() => {
        try {
          const sm = /^\/trips\/([^/]+)\/stream$/.exec(path);
          if (sm) { const m = auth(token, sm[1]); return resolve(openStream(sm[1], m.id, o.signal)); }
          for (const r of routes) {
            if (r.method !== method) continue;
            const mm = r.re.exec(path); if (!mm) continue;
            let body = {}; if (o.body && typeof o.body === 'string') { try { body = JSON.parse(o.body); } catch (e) { /* none */ } }
            let name = ''; try { name = decodeURIComponent(h['X-Filename'] || ''); } catch (e) { /* none */ }
            const out = r.fn({ p: mm.groups || {}, body, token, q: url.searchParams, blob: dataUrl ? o.body : null, dataUrl, mime: h['Content-Type'] || (o.body && o.body.type) || '', name });
            save(); return resolve(json(200, out));
          }
          resolve(json(404, { error: { code: 'not_found', message: 'That does not exist.' } }));
        } catch (e) {
          if (e instanceof Err) resolve(json(e.status, { error: Object.assign({ code: e.code, message: e.message }, e.extra || {}) }));
          else { console.error(e); resolve(json(500, { error: { code: 'error', message: 'Demo error: ' + e.message } })); }
        }
      }, 40));
    });
  };

  // Small banner so nobody mistakes this for the real thing, plus a reset.
  window.addEventListener('DOMContentLoaded', () => {
    window.TR.blobUrl = (id) => (db.blobs[id] && db.blobs[id].url) || '';
    const bar = document.createElement('div');
    bar.style.cssText = 'height:28px;background:#26302B;color:#fff;font:600 .78rem Figtree,system-ui,sans-serif;display:flex;gap:10px;align-items:center;justify-content:center';
    const t = document.createElement('span'); t.textContent = 'Demo with sample data, saved only in this browser';
    const b = document.createElement('button'); b.textContent = 'Reset'; b.style.cssText = 'border:0;border-radius:999px;background:#F8E7E0;color:#B8583A;font:700 .72rem Figtree,system-ui,sans-serif;padding:1px 10px;cursor:pointer';
    b.onclick = () => { try { localStorage.clear(); } catch (e) { /* ignore */ } memory[KEY] = null; location.hash = '#/'; location.reload(); };
    const st = document.createElement('style'); st.textContent = '.chat-wrap{height:calc(100dvh - 12px - 62px - 28px - env(safe-area-inset-bottom)) !important}@media (min-width:900px){.chat-wrap{height:calc(100vh - 36px - 28px) !important}}'; document.head.append(st);
    bar.append(t, b); document.body.prepend(bar);
  });
})();

 */
(function () {
  const TR = (window.TR = window.TR || {});

  /* ---------- DOM builder ---------- */
  // h('div', {class:'x', onclick:fn}, child, [children]) -> element
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    for (const c of kids.flat(3)) {
      if (c == null || c === false) continue;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  TR.h = h;

  const ICONS = {

    user: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 20c.7-3.5 3.5-5 7.5-5s6.8 1.5 7.5 5',
    settings: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6',

    pin: 'M12 21s6-5.4 6-10.5a6 6 0 10-12 0C6 15.6 12 21 12 21zM12 12.5a2 2 0 100-4 2 2 0 000 4z',

    image: 'M4 5h16v14H4zM4 16l4.5-4.5 4 4 3-3L20 16M9 9.5h.01',
    wifioff: 'M4 4l16 16M5 10.5a11 11 0 015.5-2.8M9 14.5a6 6 0 013.5-1.2M12 18.5h.01',

    bed: 'M3 18V7M3 14h18v4M21 14v-2a3 3 0 00-3-3h-7v5M7 11.5h.01',
    car: 'M5 16l1.5-5.5A2 2 0 018.4 9h7.2a2 2 0 011.9 1.5L19 16M4 16h16v3H4zM7.5 17.5h.01M16.5 17.5h.01',

  TR.icon = function icon(name, extraClass) {
    const NS = 'http://www.w3.org/2000/svg';

    svg.setAttribute('aria-hidden', 'true');

  const pad = (n) => String(n).padStart(2, '0');

  D.key = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  D.parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  D.today = () => D.key(new Date());
  D.addDays = (k, n) => { const d = D.parse(k); d.setDate(d.getDate() + n); return D.key(d); };
  // Whole days from key a to key b (b - a). Uses UTC so daylight-saving changes never skew it.
  D.diff = (a, b) => {
    const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number);
    return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
  };
  D.dow = (k) => D.parse(k).getDay();
  D.startOfWeek = (k, weekStart) => D.addDays(k, -((D.dow(k) - (weekStart || 0) + 7) % 7));
  D.minutes = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  D.fmtTime = (t) => {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  };
  D.fmt = (k, opts) => D.parse(k).toLocaleDateString(undefined, opts);
  D.short = (k) => D.fmt(k, { month: 'short', day: 'numeric' });
  D.long = (k) => D.fmt(k, { weekday: 'long', month: 'long', day: 'numeric' });
  D.withYear = (k) => D.fmt(k, { month: 'short', day: 'numeric', year: 'numeric' });
  D.nowTime = () => { const n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); };
  D.at = (k, t) => { const d = D.parse(k); const [h, m] = (t || '00:00').split(':').map(Number); d.setHours(h, m, 0, 0); return d; };
  // "Jul 23 – Aug 5, 2027" (or one day, or nothing)
  D.range = (a, b) => {
    if (!a) return 'Dates not set';
    if (!b || a === b) return D.withYear(a);
    const sameYear = a.slice(0, 4) === b.slice(0, 4);
    return D.short(a) + (sameYear ? '' : ', ' + a.slice(0, 4)) + ' – ' + D.short(b) + ', ' + b.slice(0, 4);

  /* ---------- Storage (this device only) ---------- */
  TR.storage = {
    get(key, fallback) {
      try { const v = localStorage.getItem('tr.' + key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem('tr.' + key, JSON.stringify(value)); return true; } catch (e) { return false; }
    }
  };

  /* ---------- Clipboard ---------- */
  TR.copy = async function (text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
    try {
      const ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0' });
      ta.value = text; document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  };

  // Plain-text helpers
  TR.plural = (n, one, many) => n + ' ' + (n === 1 ? one : many || one + 's');
  TR.initial = (name) => (String(name || '?').trim().charAt(0) || '?').toUpperCase();
  TR.mapsUrl = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
})();

<script>
/*
 * api.js — talks to the server. Every call can carry a person's token; errors become Error objects with
 * .status, .code and (for version conflicts) .item.
 */
(function () {
  const TR = window.TR;

  async function call(method, path, opts) {
    const o = opts || {};
    const headers = {};
    if (o.token) headers.Authorization = 'Bearer ' + o.token;
    let body;
    if (o.raw) { body = o.raw; Object.assign(headers, o.headers || {}); }
    else if (o.body !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(o.body); }
    let res;
    try { res = await fetch(TR.config.api + path, { method, headers, body, signal: o.signal }); }
    catch (e) {
      if (e.name === 'AbortError') throw e;
      const err = new Error('Cannot reach Triply. Check your connection and try again.');
      err.offline = true; err.status = 0; err.code = 'offline';
      throw err;
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      const e = (data && data.error) || {};
      const err = new Error(e.message || 'Something went wrong (' + res.status + ').');
      err.status = res.status; err.code = e.code || 'error'; err.item = e.item;
      throw err;
    }
    return data || {};
  }

  // Live updates. fetch() is used instead of EventSource because EventSource cannot send the token header.
  // Returns { close }. Reconnects on its own, and calls onOpen(again) each time the stream (re)starts.
  function stream(tripId, token, handlers) {
    let stopped = false, ctl = null, delay = 1000, timer = null;
    async function run() {
      ctl = new AbortController();
      try {
        const res = await fetch(TR.config.api + '/trips/' + tripId + '/stream', { headers: { Authorization: 'Bearer ' + token, Accept: 'text/event-stream' }, signal: ctl.signal });
        if (res.status === 401 || res.status === 404) { stopped = true; handlers.onDenied && handlers.onDenied(); return; }
        if (!res.ok || !res.body) throw new Error('stream ' + res.status);
        const reader = res.body.getReader(), dec = new TextDecoder();
        let buf = '', first = true;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf('\n\n')) !== -1) {
            const block = buf.slice(0, i); buf = buf.slice(i + 2);
            const ev = /^event: (.*)$/m.exec(block), data = /^data: (.*)$/m.exec(block);
            if (!ev) continue;
            if (ev[1] === 'hello') { delay = 1000; handlers.onOpen && handlers.onOpen(!first); first = false; }
            else if (ev[1] === 'change' && data) { try { handlers.onChange(JSON.parse(data[1])); } catch (e) { /* ignore bad event */ } }
          }
        }
      } catch (e) { if (e.name === 'AbortError') return; }
      if (stopped) return;
      handlers.onLost && handlers.onLost();
      timer = setTimeout(run, delay);
      delay = Math.min(delay * 2, 15000);
    }
    run();
    return { close() { stopped = true; clearTimeout(timer); if (ctl) ctl.abort(); } };
  }

  // Shrink big photos before sending (phones take 4–8 MB pictures). Other files go as they are.
  async function prepareFile(file) {
    const type = (file.type || '').toLowerCase();
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(type) || file.size < 400 * 1024) return { blob: file, mime: type || 'application/octet-stream', name: file.name };
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
      if (blob && blob.size < file.size) return { blob, mime: 'image/jpeg', name: file.name.replace(/\.\w+$/, '') + '.jpg' };
    } catch (e) { /* use the original */ }
    return { blob: file, mime: type, name: file.name };
  }

  async function upload(tripId, token, file) {
    const p = await prepareFile(file);
    const r = await call('POST', '/trips/' + tripId + '/blobs', { token, raw: p.blob, headers: { 'Content-Type': p.mime, 'X-Filename': encodeURIComponent(p.name || 'file') } });
    return r.blob;
  }

  TR.api = { call, stream, upload };
})();

</script>
<script>
/*
 * store.js — what this device remembers, and the open trip.
 *   TR.saved    the trips (secret links) saved on this device — this is what "My Trips" is built from
 *   TR.profile  the name/picture used the next time a form asks
 *   TR.openTrip(id) -> session: the trip's data, live updates, chat cache
 */
(function () {
  const TR = window.TR;

  /* ---------- tiny event helper ---------- */
  function emitter() {
    const fns = new Set();
    return { on(fn) { fns.add(fn); return () => fns.delete(fn); }, emit(...a) { fns.forEach((f) => { try { f(...a); } catch (e) { console.error(e); } }); } };
  }
  TR.emitter = emitter;

  /* ---------- trips saved on this device ---------- */
  const savedBus = emitter();
  TR.saved = {
    all() { return TR.storage.get('trips', []).filter((x) => x && typeof x.token === 'string' && x.tripId); },
    find(tripId) { return this.all().find((x) => x.tripId === tripId) || null; },
    add(tripId, token) {
      const list = this.all().filter((x) => x.tripId !== tripId);
      list.push({ tripId, token, added: Date.now() });
      TR.storage.set('trips', list); savedBus.emit();
    },
    remove(tripId) { TR.storage.set('trips', this.all().filter((x) => x.tripId !== tripId)); savedBus.emit(); },
    on: savedBus.on
  };

  TR.profile = {
    get() { return Object.assign({ name: '', avatar: TR.config.avatars[0] }, TR.storage.get('profile', {})); },
    set(p) { TR.storage.set('profile', { name: p.name || '', avatar: p.avatar || '' }); }
  };

  /* ---------- an open trip ---------- */
  let current = null;

  function openTrip(tripId) {
    if (current && current.id === tripId) return current;
    if (current) current.close();
    const saved = TR.saved.find(tripId);
    current = createSession(tripId, saved ? saved.token : null);
    return current;
  }
  function closeTrip() { if (current) { current.close(); current = null; } }

  function createSession(tripId, token) {
    const bus = emitter();
    const s = {
      id: tripId, token, state: null, status: token ? 'loading' : 'denied', error: '',
      threads: {},        // 'trip' | memberId -> { list: [], more: false, loaded: false }
      viewing: null,      // the chat thread on screen right now
      online: true
    };
    let streamH = null, refreshTimer = null, closed = false;

    s.on = bus.on;
    s.req = (method, path, body) => TR.api.call(method, '/trips/' + tripId + path, { token, body });
    s.can = (perm) => !!(s.state && s.state.perms && s.state.perms[perm]);
    s.me = () => (s.state ? s.state.me : null);
    s.member = (id) => (s.state ? s.state.members.find((m) => m.id === id) || null : null);
    s.trip = () => (s.state ? s.state.trip : null);
    s.items = () => (s.state ? s.state.items : []);
    s.packing = () => (s.state ? s.state.packing || [] : []);
    s.expenses = () => (s.state ? s.state.expenses || [] : []);
    s.item = (id) => s.items().find((i) => i.id === id) || null;
    s.link = () => TR.personalLink(token);
    s.unreadTotal = () => {
      const u = s.state && s.state.unread; if (!u) return 0;
      return (u.trip || 0) + Object.values(u.dm || {}).reduce((a, b) => a + b, 0);
    };

    /* ----- "what is new since I last looked" (built from what others changed; chat counts come from unread) ----- */
    const seenKey = 'seen.' + tripId;
    s.seenAt = () => TR.storage.get(seenKey, null) || (s.me() ? s.me().joined_at : '1970-01-01');
    s.markSeen = () => { TR.storage.set(seenKey, new Date().toISOString()); bus.emit('unread'); };
    s.updates = function () {
      if (!s.state) return [];
      const seen = s.seenAt(), me = s.me().id, out = [];
      const who = (id) => { const m = s.member(id); return m ? m.name : 'Someone'; };
      const label = (t) => (TR.config.types[t] ? TR.config.types[t].label.toLowerCase() : 'plan');
      s.items().forEach((i) => {
        if (i.created_at > seen && i.created_by !== me) out.push({ at: i.created_at, icon: TR.config.types[i.type].icon, text: [who(i.created_by), ' added a ' + label(i.type) + ': ', i.title], go: { item: i.id } });
        else if (i.updated_at > seen && i.updated_by && i.updated_by !== me && i.updated_at > i.created_at) out.push({ at: i.updated_at, icon: 'edit', text: [who(i.updated_by), ' changed ', i.title], go: { item: i.id } });
      });
      s.expenses().forEach((e) => { if (e.created_at > seen && e.created_by !== me) out.push({ at: e.created_at, icon: 'cart', text: [who(e.created_by), ' added a cost: ', e.title], go: { screen: 'expenses' } }); });
      s.packing().forEach((x) => { if (x.created_at > seen && x.created_by !== me) out.push({ at: x.created_at, icon: 'bag', text: [who(x.created_by), ' added to the packing list: ', x.title], go: { screen: 'packing' } }); });
      s.state.members.forEach((m) => { if (!m.you && m.joined_at > seen) out.push({ at: m.joined_at, icon: 'users', text: [m.name, ' joined the trip'], go: { screen: 'people' } }); });
      out.sort((a, b) => b.at.localeCompare(a.at));
      const u = s.state.unread, dm = Object.values(u.dm || {}).reduce((a, b) => a + b, 0);
      const chat = [];
      if (u.trip) chat.push({ at: '9999', icon: 'chat', text: [TR.plural(u.trip, 'unread message') + ' in the group chat' + (u.mentions ? ' (' + u.mentions + ' mention' + (u.mentions > 1 ? '' : '') + ' of you)' : '')], go: { screen: 'chat' } });
      if (dm) chat.push({ at: '9998', icon: 'chat', text: [TR.plural(dm, 'unread private message')], go: { screen: 'chat' } });
      return chat.concat(out);
    };

    function denied(reason) {
      s.status = 'denied'; s.error = reason || '';
      TR.saved.remove(tripId);
      bus.emit('status');
    }

    async function load() {
      if (!token) return denied('');
      try {
        s.state = await s.req('GET', '/state');
        s.status = 'ready'; s.online = true;
        // Keep the saved list's picture of the trip fresh (name for the device list)
        bus.emit('state');
      } catch (e) {
        if (e.status === 401 || e.status === 404) return denied(e.message);
        s.online = false; s.error = e.message;
        if (!s.state) s.status = 'error';
        bus.emit('status');
      }
    }
    // Several changes in a row become one reload.
    function refreshSoon() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => { if (!closed) load(); }, 150);
    }
    s.refresh = load;

    /* ----- chat cache ----- */
    const thread = (key) => s.threads[key] || (s.threads[key] = { list: [], more: false, loaded: false });
    s.thread = thread;
    // Which conversation does this message belong to, from my side?
    function threadOf(m) {
      if (!m.to_member) return 'trip';
      return m.sender_id === (s.me() && s.me().id) ? m.to_member : m.sender_id;
    }
    function addMessage(m) {
      const key = threadOf(m);
      const t = thread(key);
      if (t.list.some((x) => x.id === m.id)) return false;
      t.list.push(m);
      return true;
    }
    s.loadThread = async function (key, before) {
      const t = thread(key);
      const q = '?thread=' + encodeURIComponent(key) + '&limit=40' + (before ? '&before=' + before : '');
      const r = await s.req('GET', '/messages' + q);
      if (before) t.list = r.messages.concat(t.list);
      else if (!t.loaded) t.list = r.messages.concat(t.list.filter((x) => !r.messages.some((y) => y.id === x.id)));
      else t.list = mergeLists(t.list, r.messages);
      t.more = r.more; t.loaded = true;
      bus.emit('chat', key);
      return t;
    };
    function mergeLists(a, b) {
      const seen = new Map();
      a.concat(b).forEach((m) => seen.set(m.id, m));
      return [...seen.values()].sort((x, y) => (BigInt(x.id) < BigInt(y.id) ? -1 : 1));
    }
    s.send = async function (key, body, blobId) {
      const r = await s.req('POST', '/messages', { thread: key, body, blobId });
      if (addMessage(r.message)) bus.emit('chat', key);
      return r.message;
    };
    let readTimer = null;
    s.markRead = function (key) {
      const t = thread(key);
      const last = [...t.list].reverse().find((m) => m.kind === 'text');
      const u = s.state && s.state.unread;
      if (u) { if (key === 'trip') { u.trip = 0; u.mentions = 0; } else delete u.dm[key]; bus.emit('unread'); }
      if (!last) return;
      clearTimeout(readTimer);
      readTimer = setTimeout(() => { s.req('POST', '/reads', { thread: key, lastId: last.id }).catch(() => {}); }, 300);
    };

    function onChange(ev) {
      switch (ev.kind) {
        case 'chat': {
          const m = ev.message; if (!m) return;
          const key = threadOf(m);
          const isNew = addMessage(m);
          if (!isNew) return;
          const mine = s.me() && m.sender_id === s.me().id;
          if (m.kind === 'text' && !mine && s.state) {
            if (s.viewing === key && !document.hidden) s.markRead(key);
            else if (key === 'trip') { s.state.unread.trip++; if ((m.mentions || []).includes(s.me().id)) s.state.unread.mentions++; }
            else s.state.unread.dm[key] = (s.state.unread.dm[key] || 0) + 1;
          }
          bus.emit('chat', key);
          bus.emit('unread');
          break;
        }
        case 'kicked': denied('You were removed from this trip.'); break;
        case 'trip_deleted': denied('This trip was deleted.'); break;
        case 'items': case 'trip': case 'members': case 'invites': refreshSoon(); break;
        default: refreshSoon();
      }
    }

    s.start = function () {
      load().then(() => {
        if (closed || s.status !== 'ready') return;
        streamH = TR.api.stream(tripId, token, {
          onOpen(again) { s.online = true; if (again) { load(); Object.keys(s.threads).forEach((k) => { if (s.threads[k].loaded) s.loadThread(k).catch(() => {}); }); } bus.emit('status'); },
          onChange,
          onLost() { s.online = false; bus.emit('status'); },
          onDenied() { denied('You no longer have access to this trip.'); }
        });
      });
    };
    s.close = function () { closed = true; clearTimeout(refreshTimer); clearTimeout(readTimer); if (streamH) streamH.close(); };
    s.start();
    return s;
  }

  TR.openTrip = openTrip;
  TR.closeTrip = closeTrip;
  TR.currentTrip = () => current;
})();

</script>
<script>
/*
 * ui-kit.js — reusable interface pieces (buttons, sheets, dialogs, toggles, avatars).
 * Screens are built from these, so a change here changes the look everywhere.
 * The matching styles are in styles/components.css.
 */
(function () {
  const TR = (window.TR = window.TR || {});
  const h = TR.h, icon = TR.icon;
  let uid = 0;
  const nextId = (p) => p + '-' + ++uid;

  /* ---------- toast (short message at the bottom) ---------- */
  let toastTimer = null;
  function toast(message) {
    let el = document.getElementById('tr-toast');
    if (!el) {
      el = h('div', { id: 'tr-toast', role: 'status', 'aria-live': 'polite', class: 'toast' });
      document.body.append(el);
    }
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
  }

  /* ---------- avatar ---------- */
  function avatar(member, size) {
    const s = size || 40;
    const label = member ? member.name : 'Everyone';
    const content = member ? (member.avatar || (member.name || '?').trim().charAt(0).toUpperCase()) : '★';
    return h('span', {
      class: 'avatar' + (member && member.avatar ? ' emoji' : ''),
      style: '--c:' + (member ? member.color : TR.config.neutralColor) + ';--s:' + s + 'px',
      title: label, role: 'img', 'aria-label': label
    }, content);
  }

  /* ---------- buttons ---------- */
  // variant: 'primary' | 'soft' | 'ghost' | 'danger'
  function button(label, opts) {
    const o = opts || {};
    return h('button', {
      type: o.type || 'button',
      class: 'btn ' + (o.variant || 'soft') + (o.big ? ' big' : '') + (o.block ? ' block' : ''),
      onclick: o.onClick, disabled: o.disabled, 'aria-label': o.aria
    }, o.icon ? icon(o.icon) : null, label ? h('span', {}, label) : null);
  }
  function iconButton(name, label, onClick, cls) {
    return h('button', { type: 'button', class: 'icon-btn' + (cls ? ' ' + cls : ''), 'aria-label': label, title: label, onclick: onClick }, icon(name));
  }

  /* ---------- form pieces ---------- */
  function field(label, control, hint) {
    if (!control.id) control.id = nextId('f');
    return h('div', { class: 'field' },
      h('label', { for: control.id }, label),
      control,
      hint ? h('p', { class: 'hint' }, hint) : null);
  }

  // Row of choices, one selected. Returns { el, get, set }.
  function segmented(options, value, onChange, ariaLabel) {
    let current = value;
    const btns = options.map((o) => h('button', {
      type: 'button', role: 'radio', class: 'seg-btn', dataset: { v: String(o.value) },
      onclick: () => { set(o.value); onChange && onChange(o.value); }
    }, o.label));
    const el = h('div', { class: 'segmented', role: 'radiogroup', 'aria-label': ariaLabel || '' }, btns);
    function set(v) {
      current = v;
      btns.forEach((b, i) => {
        const on = String(options[i].value) === String(v);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        b.classList.toggle('on', on);
      });
    }
    set(value);
    return { el, get: () => current, set };
  }

  // On/off switch with a label. Returns { el, get, set }.
  function toggle(label, checked, onChange) {
    const input = h('input', { type: 'checkbox', class: 'switch-input' });
    input.checked = !!checked;
    input.addEventListener('change', () => onChange && onChange(input.checked));
    const el = h('label', { class: 'switch' }, input, h('span', { class: 'track', 'aria-hidden': 'true' }, h('span', { class: 'thumb' })), h('span', { class: 'switch-label' }, label));
    return { el, input, get: () => input.checked, set: (v) => { input.checked = !!v; } };
  }

  function select(options, value, onChange) {
    const el = h('select', { class: 'select' }, options.map((o) => h('option', { value: String(o.value) }, o.label)));
    el.value = String(value);
    if (onChange) el.addEventListener('change', () => onChange(el.value));
    return el;
  }

  function emptyState(o) {
    return h('div', { class: 'empty-state' },
      o.icon ? h('div', { class: 'empty-icon' }, icon(o.icon)) : null,
      h('h3', {}, o.title),
      o.text ? h('p', {}, o.text) : null,
      o.action ? o.action : null);
  }

  /* ---------- sheets (popup panels) ---------- */
  const stack = [];
  function sheet(opts) {
    const prevFocus = document.activeElement;
    const titleId = nextId('sheet-title');
    let pressedBackdrop = false;
    const api = {};
    const panel = h('div', { class: 'sheet' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId, tabindex: '-1' },
      h('div', { class: 'sheet-head' },
        h('h2', { id: titleId }, opts.title || ''),
        iconButton('x', 'Close', () => api.close(), 'sheet-close')),
      h('div', { class: 'sheet-body' }, opts.body),
      opts.footer ? h('div', { class: 'sheet-foot' }, opts.footer) : null);
    const wrap = h('div', { class: 'sheet-wrap',
      onpointerdown: (e) => { pressedBackdrop = e.target === wrap; },
      onclick: (e) => { if (e.target === wrap && pressedBackdrop) api.close(); } }, panel);

    api.el = wrap; api.panel = panel;
    api.close = function (result) {
      if (!wrap.isConnected) return;
      wrap.remove();
      const i = stack.indexOf(api); if (i > -1) stack.splice(i, 1);
      if (!stack.length) document.documentElement.classList.remove('has-sheet');
      if (prevFocus && prevFocus.isConnected && prevFocus.focus) prevFocus.focus();
      opts.onClose && opts.onClose(result);
    };
    stack.push(api);
    document.documentElement.classList.add('has-sheet');
    document.body.append(wrap);
    const first = panel.querySelector('[autofocus]') || panel.querySelector('input:not([type=hidden]),textarea,select');
    (first || panel).focus({ preventScroll: true });
    return api;
  }
  document.addEventListener('keydown', (e) => {
    const top = stack[stack.length - 1];
    if (!top) return;
    if (e.key === 'Escape') { e.preventDefault(); top.close(); return; }
    if (e.key === 'Tab') { // keep keyboard focus inside the open sheet
      const items = [...top.panel.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')].filter((x) => !x.disabled && x.offsetParent !== null);
      if (!items.length) return;
      const firstEl = items[0], lastEl = items[items.length - 1];
      if (e.shiftKey && document.activeElement === firstEl) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
    }
  });

  // Ask yes/no. Resolves true or false.
  function confirm(o) {
    return new Promise((resolve) => {
      let answer = false;
      const s = sheet({
        title: o.title, onClose: () => resolve(answer),
        body: o.message ? h('p', { class: 'sheet-text' }, o.message) : h('span'),
        footer: [
          button(o.cancelLabel || 'Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }),
          button(o.confirmLabel || 'OK', { variant: o.danger ? 'danger-solid' : 'primary', big: true, onClick: () => { answer = true; s.close(); } })
        ]
      });
    });
  }

  // Pick one of several actions. options: [{value,label,description,danger}]. Resolves value or null.
  function choose(o) {
    return new Promise((resolve) => {
      let picked = null;
      const s = sheet({
        title: o.title, onClose: () => resolve(picked),
        body: h('div', { class: 'choices' },
          o.message ? h('p', { class: 'sheet-text' }, o.message) : null,
          o.options.map((opt) => h('button', { type: 'button', class: 'choice' + (opt.danger ? ' danger' : ''), onclick: () => { picked = opt.value; s.close(); } },
            h('strong', {}, opt.label), opt.description ? h('span', {}, opt.description) : null)))
      });
    });
  }

  /* ---------- gestures ---------- */
  // Press-and-hold (touch) or double-click (mouse) on an element.
  function onHold(el, fn) {
    let timer = null, sx = 0, sy = 0;
    el.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse') return;
      sx = e.clientX; sy = e.clientY;
      timer = setTimeout(() => { timer = null; el.dataset.held = '1'; fn(e); }, 550);
    });
    const cancel = () => { clearTimeout(timer); timer = null; };
    el.addEventListener('pointermove', (e) => { if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) cancel(); });
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('contextmenu', (e) => { if (el.dataset.held) e.preventDefault(); });
    el.addEventListener('dblclick', (e) => { if (e.target.closest('button')) return; fn(e); });
    // The click that follows a long press should not also open the day.
    el.addEventListener('click', (e) => { if (el.dataset.held) { e.stopImmediatePropagation(); e.preventDefault(); delete el.dataset.held; } }, true);
  }

  // Swipe left/right on touch screens.
  function onSwipe(el, onLeft, onRight) {
    let sx = 0, sy = 0, active = false;
    el.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') return; active = true; sx = e.clientX; sy = e.clientY; });
    el.addEventListener('pointerup', (e) => {
      if (!active) return; active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) (dx < 0 ? onLeft : onRight)();
    });
    el.addEventListener('pointercancel', () => { active = false; });
  }

  /* ---------- Triply additions ---------- */
  // Read-only box with a copy button.
  function copyBox(value, label) {
    const input = h('input', { type: 'text', readonly: true, value, 'aria-label': label || 'Link', onfocus: (e) => e.target.select() });
    return h('div', { class: 'copy-box' }, input,
      button('Copy', { icon: 'copy', variant: 'primary', onClick: async () => { const ok = await TR.copy(value); if (!ok) input.select(); toast(ok ? 'Copied.' : 'Press Ctrl+C to copy.'); } }));
  }
  // Pick a picture (emoji) for a person. Returns { el, get, set }.
  function avatarPicker(value, onChange) {
    let current = value || TR.config.avatars[0];
    const btns = TR.config.avatars.map((a) => h('button', { type: 'button', class: 'avatar-opt', 'aria-label': a, onclick: () => { current = a; paint(); onChange && onChange(a); } }, a));
    const el = h('div', { class: 'avatar-grid', role: 'radiogroup', 'aria-label': 'Picture' }, btns);
    function paint() { btns.forEach((b) => { const on = b.textContent === current; b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); }); }
    paint();
    return { el, get: () => current, set: (v) => { current = v; paint(); } };
  }
  function lightbox(src) {
    const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    const wrap = h('div', { class: 'lightbox', role: 'dialog', 'aria-label': 'Photo', onclick: close }, h('img', { src, alt: '' }));
    document.addEventListener('keydown', onKey);
    document.body.append(wrap);
  }
  // Disable a button while an async job runs; shows the error as a toast.
  async function busy(btn, job) {
    btn.disabled = true;
    try { return await job(); } catch (e) { toast(e.message || 'Something went wrong.'); throw e; } finally { btn.disabled = false; }
  }

  TR.ui = { copyBox, avatarPicker, lightbox, busy, toast, avatar, button, iconButton, field, segmented, toggle, select, emptyState, sheet, confirm, choose, onHold, onSwipe };
})();

<script>
/*
 * forms.js — the sheets for making and changing things: a trip, a plan, a person's profile.
 * Shared by several screens, so they live here instead of in one screen.
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, cfg = TR.config;

  const input = (type, value, extra) => h('input', Object.assign({ type, value: value == null ? '' : value }, extra || {}));

  function emojiPicker(value, onChange) {
    let current = value;
    const btns = cfg.coverEmojis.map((e) => h('button', { type: 'button', class: 'emoji-opt', 'aria-label': e, onclick: () => { current = e; paint(); onChange && onChange(e); } }, e));
    function paint() { btns.forEach((b) => { const on = b.textContent === current; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); }
    paint();
    return { el: h('div', { class: 'cover-pick' }, btns), get: () => current };
  }
  function swatches(value, onChange) {
    let current = value;
    const btns = cfg.coverColors.map((c) => h('button', { type: 'button', class: 'swatch', style: '--c:' + c, 'aria-label': 'Color ' + c, onclick: () => { current = c; paint(); onChange && onChange(c); } }));
    function paint() { btns.forEach((b, i) => { const on = cfg.coverColors[i] === current; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); }
    paint();
    return { el: h('div', { class: 'swatches' }, btns), get: () => current };
  }

  /* ---------- trip: create / edit ---------- */
  // opts: { session }  -> edit that trip;  none -> make a new one
  function tripSheet(opts) {
    const o = opts || {}, session = o.session, trip = session ? session.trip() : null;
    const name = input('text', trip ? trip.name : '', { maxlength: 80, placeholder: 'Spain & Mediterranean Cruise', autofocus: true });
    const dest = input('text', trip ? trip.destination : '', { maxlength: 120, placeholder: 'Spain' });
    const route = input('text', trip ? trip.route.join(' → ') : '', { placeholder: 'Vancouver → Madrid → Barcelona' });
    const start = input('date', trip ? trip.start_date : '');
    const end = input('date', trip ? trip.end_date : '');
    const desc = h('textarea', { rows: 3, maxlength: 600, placeholder: 'What is this trip about?' }); desc.value = trip ? trip.description || '' : '';
    let coverBlob = trip ? trip.cover_blob : null, newPhoto = null, removePhoto = false;
    const emoji = emojiPicker(trip ? trip.cover_emoji : '✈️');
    const color = swatches(trip ? trip.cover_color : cfg.coverColors[1]);
    const prev = h('div', { class: 'photo-prev' });
    function paintPrev() {
      const photo = newPhoto ? URL.createObjectURL(newPhoto) : !removePhoto && coverBlob ? TR.blobUrl(coverBlob) : '';
      prev.style.setProperty('--c', color.get()); prev.style.backgroundImage = photo ? 'url("' + photo + '")' : '';
      prev.textContent = photo ? '' : emoji.get();
    }
    const fileIn = h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: (e) => { newPhoto = e.target.files[0] || null; removePhoto = false; paintPrev(); } });
    const origEmoji = emoji.el, origColor = color.el;
    [origEmoji, origColor].forEach((el) => el.addEventListener('click', () => { setTimeout(paintPrev, 0); }));
    const viewers = ui.toggle('Viewers can chat and share photos', trip ? trip.viewers_chat : true);
    const me = TR.profile.get();
    const ownName = input('text', me.name, { maxlength: 40, placeholder: 'Your name' });
    const ownAv = ui.avatarPicker(me.avatar);
    const err = h('p', { class: 'form-error', role: 'alert' });

    const body = h('form', { class: 'event-form', novalidate: true, onsubmit: (e) => { e.preventDefault(); save(); } },
      ui.field('Trip name', name),
      ui.field('Destination', dest),
      ui.field('Route', route, 'Optional. Separate stops with → or commas.'),
      h('div', { class: 'row2' }, ui.field('Starts', start), ui.field('Ends', end)),
      trip ? ui.field('About', desc) : null,
      h('div', { class: 'sect' }, h('h4', {}, 'Cover'), prev,
        h('div', { class: 'btn-row' },
          ui.button('Use a photo', { icon: 'image', onClick: () => fileIn.click() }),
          trip && (coverBlob || newPhoto) ? ui.button('Remove photo', { variant: 'ghost', onClick: () => { newPhoto = null; removePhoto = true; paintPrev(); } }) : null, fileIn),
        emoji.el, color.el),
      trip ? h('div', { class: 'sect' }, h('h4', {}, 'People'), viewers.el) : null,
      trip ? null : h('div', { class: 'sect' }, h('h4', {}, 'About you'), ui.field('Your name', ownName), h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Your picture'), ownAv.el)),
      err, h('button', { type: 'submit', hidden: true }));

    const saveBtn = ui.button(trip ? 'Save' : 'Create trip', { variant: 'primary', big: true, onClick: () => save() });
    const sheet = ui.sheet({
      title: trip ? 'Trip details' : 'New trip', body,
      footer: [
        trip && session.can('trip.delete') ? ui.button('Delete trip', { variant: 'danger', icon: 'trash', onClick: () => removeTrip() }) : null,
        h('span', { class: 'spacer' }),
        ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => sheet.close() }), saveBtn]
    });
    paintPrev();

    async function removeTrip() {
      const ok = await ui.confirm({ title: 'Delete this trip?', message: 'The plans, chat and files are deleted for everyone. This cannot be undone.', confirmLabel: 'Delete trip', danger: true });
      if (!ok) return;
      try { await TR.api.call('DELETE', '/trips/' + trip.id, { token: session.token }); } catch (e) { return ui.toast(e.message); }
      TR.saved.remove(trip.id); sheet.close(); TR.go('/'); ui.toast('Trip deleted.');
    }
    async function save() {
      err.textContent = '';
      if (!name.value.trim()) { err.textContent = 'Please give the trip a name.'; name.focus(); return; }
      if (!trip && !ownName.value.trim()) { err.textContent = 'Please add your name.'; ownName.focus(); return; }
      const payload = { name: name.value, destination: dest.value, route: route.value, start_date: start.value || null, end_date: end.value || null, cover_emoji: emoji.get(), cover_color: color.get() };
      saveBtn.disabled = true;
      try {
        if (trip) {
          payload.description = desc.value; payload.viewers_chat = viewers.get();
          if (newPhoto) { const b = await TR.api.upload(trip.id, session.token, newPhoto); payload.cover_blob = b.id; }
          else if (removePhoto) payload.cover_blob = null;
          await session.req('PATCH', '', payload);
          await session.refresh();
          sheet.close(); ui.toast('Saved.');
        } else {
          payload.owner = { name: ownName.value, avatar: ownAv.get() };
          const r = await TR.api.call('POST', '/trips', { body: payload });
          TR.saved.add(r.trip.id, r.token);
          TR.profile.set({ name: ownName.value, avatar: ownAv.get() });
          if (newPhoto) { try { const b = await TR.api.upload(r.trip.id, r.token, newPhoto); await TR.api.call('PATCH', '/trips/' + r.trip.id, { token: r.token, body: { cover_blob: b.id } }); } catch (e) { /* the cover can be added later */ } }
          sheet.close();
          TR.go('/trip/' + r.trip.id + '/overview');
          linkSheet(r.token, 'Your trip is ready');
        }
      } catch (e) { err.textContent = e.message; saveBtn.disabled = false; }
    }
    return sheet;
  }

  // "This link is your key" — shown once after making or joining a trip.
  function linkSheet(token, title) {
    const link = TR.personalLink(token);
    const s = ui.sheet({
      title: title || 'Your personal link',
      body: h('div', { class: 'stack' },
        h('p', { class: 'sheet-text' }, 'Triply has no passwords. This link is how you get back in from another phone or computer, so save it somewhere safe (your notes, or e-mail it to yourself).'),
        ui.copyBox(link, 'Your personal link'),
        h('p', { class: 'warn-box' }, 'Keep it private: anyone with this link can act as you in this trip. To add other people, invite them from the People tab.')),
      footer: [ui.button('Got it', { variant: 'primary', big: true, onClick: () => s.close() })]
    });
    return s;
  }

  /* ---------- plan: choose a type, then fill it in ---------- */
  function typePicker(session, date) {
    const s = ui.sheet({
      title: 'What are you adding?',
      body: h('div', { class: 'type-grid' }, cfg.typeOrder.map((t) => {
        const T = cfg.types[t];
        return h('button', { type: 'button', class: 'type-opt', onclick: () => { s.close(); itemSheet({ session, type: t, date }); } },
          h('span', { class: 'tp-ic', style: '--c:' + T.color }, TR.icon(T.icon)), T.label);
      }))
    });
  }

  // opts: { session, type, item?, date? }
  function itemSheet(opts) {
    const session = opts.session, item = opts.item || null, src = item || opts.template || null, type = src ? src.type : opts.type;
    const T = cfg.types[type];
    const trip = session.trip();
    const today = D.today();
    const defDate = opts.date || (trip.start_date && trip.start_date > today ? trip.start_date : trip.end_date && trip.end_date < today ? trip.start_date : trip.start_date ? (today >= trip.start_date ? today : trip.start_date) : '');
    const title = input('text', src ? src.title : '', { maxlength: 120, placeholder: T.titlePlaceholder, autofocus: true });
    const dataIn = {};
    const dataFields = T.fields.map((f) => {
      const el = input(f[3] === 'number' ? 'number' : 'text', src && src.data[f[0]] !== undefined ? src.data[f[0]] : '', { placeholder: f[2] || '', inputmode: f[3] === 'number' ? 'decimal' : undefined, step: f[3] === 'number' ? 'any' : undefined });
      dataIn[f[0]] = el;
      return ui.field(f[1], el);
    });
    const sd = input('date', src ? src.start_date || '' : T.needsStart ? defDate : opts.date || '');
    const st = input('time', src ? src.start_time || '' : '');
    const ed = input('date', src ? src.end_date || '' : '');
    const et = input('time', src ? src.end_time || '' : '');
    const loc = input('text', src ? src.location : '', { maxlength: 200, placeholder: '' });
    const conf = input('text', src ? src.confirmation : '', { maxlength: 60, placeholder: 'Booking or confirmation number', autocapitalize: 'characters' });
    const notes = h('textarea', { rows: 3, maxlength: 4000, placeholder: 'Anything to remember' }); notes.value = src ? src.notes || '' : '';
    const err = h('p', { class: 'form-error', role: 'alert' });
    if (type === 'note') { title.placeholder = 'Note title (optional)'; }

    const body = h('form', { class: 'event-form', novalidate: true, onsubmit: (e) => { e.preventDefault(); save(); } },
      h('div', { class: 'detail-title' }, h('span', { class: 'tp-ic', style: '--c:' + T.color }, TR.icon(T.icon)), h('h3', {}, (item ? 'Edit ' : 'New ') + T.label.toLowerCase())),
      ui.field(type === 'flight' || type === 'car' || type === 'cruise' ? 'Name (optional)' : 'Name', title),
      dataFields.length ? h('div', { class: 'sect' }, h('h4', {}, T.label + ' details'), h('div', { class: 'field-inline' }, dataFields)) : null,
      h('div', { class: 'sect' }, h('h4', {}, 'When' + (T.needsStart ? '' : ' (optional)')),
        h('div', { class: 'row2' }, ui.field(T.startLabel + ' – day', sd), ui.field('Time', st)),
        h('div', { class: 'row2' }, ui.field(T.endLabel + ' – day', ed), ui.field('Time', et))),
      h('div', { class: 'sect' }, h('h4', {}, 'More'),
        ui.field(T.locationLabel, loc), ui.field('Confirmation number', conf), ui.field('Notes', notes)),
      err, h('button', { type: 'submit', hidden: true }));

    const saveBtn = ui.button(item ? 'Save' : 'Add to trip', { variant: 'primary', big: true, onClick: () => save() });
    const sheet = ui.sheet({
      title: '', wide: true, body,
      footer: [item ? ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: () => remove() }) : null, h('span', { class: 'spacer' }),
        ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => sheet.close() }), saveBtn]
    });

    function payload() {
      const data = {};
      Object.keys(dataIn).forEach((k) => { data[k] = dataIn[k].value; });
      return { title: title.value, data, start_date: sd.value || null, start_time: sd.value ? st.value || null : null, end_date: ed.value || null, end_time: ed.value || sd.value ? et.value || null : null, location: loc.value, confirmation: conf.value, notes: notes.value };
    }
    async function save() {
      err.textContent = '';
      saveBtn.disabled = true;
      const p = payload();
      try {
        if (item) { p.version = item.version; await session.req('PATCH', '/items/' + item.id, p); }
        else { p.type = type; await session.req('POST', '/items', p); }
        await session.refresh();
        sheet.close(); ui.toast(item ? 'Saved.' : 'Added to the trip.');
        opts.onDone && opts.onDone();
      } catch (e) {
        saveBtn.disabled = false;
        if (e.code === 'version_conflict' && e.item) return conflict(e.item, p);
        err.textContent = e.message;
      }
    }
    async function conflict(theirs, mine) {
      const pick = await ui.choose({ title: 'Someone changed this plan', message: 'Another person saved changes while you were editing.',
        options: [{ value: 'mine', label: 'Keep my changes', description: 'Replace their version with what you typed.' }, { value: 'theirs', label: 'Use their version', description: 'Throw away what you typed.' }] });
      try {
        if (pick === 'mine') { mine.version = theirs.version; await session.req('PATCH', '/items/' + item.id, mine); }
        await session.refresh(); sheet.close();
      } catch (e) { err.textContent = e.message; }
    }
    async function remove() {
      const ok = await ui.confirm({ title: 'Delete this ' + T.label.toLowerCase() + '?', message: '“' + item.title + '” will be removed for everyone.', confirmLabel: 'Delete', danger: true });
      if (!ok) return;
      try { await session.req('DELETE', '/items/' + item.id); await session.refresh(); sheet.close(); ui.toast('Deleted.'); opts.onDone && opts.onDone(); } catch (e) { ui.toast(e.message); }
    }
    return sheet;
  }

  /* ---------- me: name + picture ---------- */
  function profileSheet(session) {
    const me = session.me();
    const name = input('text', me.name, { maxlength: 40, autofocus: true });
    const av = ui.avatarPicker(me.avatar);
    const err = h('p', { class: 'form-error', role: 'alert' });
    const save = ui.button('Save', { variant: 'primary', big: true, onClick: async () => {
      if (!name.value.trim()) { err.textContent = 'Please add your name.'; return; }
      try { await session.req('PATCH', '/members/me', { name: name.value, avatar: av.get() }); TR.profile.set({ name: name.value, avatar: av.get() }); await session.refresh(); s.close(); ui.toast('Saved.'); } catch (e) { err.textContent = e.message; }
    } });
    const s = ui.sheet({ title: 'Your name and picture', body: h('div', { class: 'event-form' }, ui.field('Name', name), h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Picture'), av.el), err),
      footer: [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), save] });
  }

  TR.forms = { tripSheet, linkSheet, typePicker, itemSheet, profileSheet, input };
})();
