<script>
/*
 * forms.js — the sheets for making and changing things: a trip, a plan, a person's profile.
 * Shared by several screens, so they live here instead of in one screen.
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, cfg = TR.config;

  const input = (type, value, extra) => h('input', Object.assign({ type, value: value == null ? '' : value }, extra || {}));

  function emojiPicker(value, onChange) {
    let current = value;
    const btns = cfg.coverEmojis.map((e) => h('button', { type: 'button', class: 'emoji-opt', 'aria-label': e, onclick: () => { current = e; paint(); onChange && onChange(e); } }, e));
    function paint() { btns.forEach((b) => { const on = b.textContent === current; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); }
    paint();
    return { el: h('div', { class: 'cover-pick' }, btns), get: () => current };
  }
  function swatches(value, onChange) {
    let current = value;
    const btns = cfg.coverColors.map((c) => h('button', { type: 'button', class: 'swatch', style: '--c:' + c, 'aria-label': 'Color ' + c, onclick: () => { current = c; paint(); onChange && onChange(c); } }));
    function paint() { btns.forEach((b, i) => { const on = cfg.coverColors[i] === current; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); }
    paint();
    return { el: h('div', { class: 'swatches' }, btns), get: () => current };
  }

  // The drawn cover scenes. '' = Auto (matches the trip's words, worked out live by guess()).
  function scenePicker(value, guess, onChange) {
    let current = value || '';
    const thumb = (key, label) => h('button', { type: 'button', class: 'scene-opt', 'aria-label': label, title: label, onclick: () => { current = key; paint(); onChange && onChange(); } },
      TR.covers.el(key || guess(), 'scene-thumb'), h('span', {}, label));
    let autoBtn = thumb('', 'Auto');
    const btns = TR.covers.list.map((s) => thumb(s.key, s.name));
    const row = h('div', { class: 'scene-pick' }, autoBtn, btns);
    function paint() {
      [autoBtn].concat(btns).forEach((b, i) => { const on = (i === 0 ? '' : TR.covers.list[i - 1].key) === current; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    }
    paint();
    return { el: row, get: () => current,
      refresh() { const n = thumb('', 'Auto'); row.replaceChild(n, autoBtn); autoBtn = n; paint(); } };
  }

  /* ---------- trip: create / edit ---------- */
  // opts: { session }  -> edit that trip;  none -> make a new one
  function tripSheet(opts) {
    const o = opts || {}, session = o.session, trip = session ? session.trip() : null;
    const name = input('text', trip ? trip.name : '', { maxlength: 80, placeholder: 'Spain & Mediterranean Cruise', autofocus: true });
    const dest = input('text', trip ? trip.destination : '', { maxlength: 120, placeholder: 'Spain' });
    const route = input('text', trip ? trip.route.join(' → ') : '', { placeholder: 'Vancouver → Madrid → Barcelona' });
    const start = input('date', trip ? trip.start_date : '');
    const end = input('date', trip ? trip.end_date : '');
    const desc = h('textarea', { rows: 3, maxlength: 600, placeholder: 'What is this trip about?' }); desc.value = trip ? trip.description || '' : '';
    let coverBlob = trip ? trip.cover_blob : null, newPhoto = null, removePhoto = false;
    const guessNow = () => TR.covers.guess({ name: name.value, destination: dest.value, route: ['', ...route.value.split(/\s*(?:→|->|,)\s*/)] });
    const scene = scenePicker(trip ? trip.cover_scene : '', guessNow, () => paintPrev());
    const prev = h('div', { class: 'photo-prev' });
    function paintPrev() {
      const photo = newPhoto ? URL.createObjectURL(newPhoto) : !removePhoto && coverBlob ? TR.blobUrl(coverBlob) : '';
      prev.style.backgroundImage = photo ? 'url("' + photo + '")' : '';
      prev.replaceChildren(...(photo ? [] : [TR.covers.el(scene.get() || guessNow(), 'scene-fill')]));
    }
    let typing = null;
    [name, dest, route].forEach((x) => x.addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(() => { scene.refresh(); paintPrev(); }, 250); }));
    const fileIn = h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: (e) => { newPhoto = e.target.files[0] || null; removePhoto = false; paintPrev(); } });
    const viewers = ui.toggle('Viewers can chat and share photos', trip ? trip.viewers_chat : true);
    const me = TR.profile.get();
    const ownName = input('text', me.name, { maxlength: 40, placeholder: 'Your name' });
    const ownAv = ui.avatarPicker(me.avatar);
    const err = h('p', { class: 'form-error', role: 'alert' });

    const body = h('form', { class: 'event-form', novalidate: true, onsubmit: (e) => { e.preventDefault(); save(); } },
      ui.field('Trip name', name),
      ui.field('Destination', dest),
      ui.field('Route', route, 'Optional. Separate stops with → or commas.'),
      h('div', { class: 'row2' }, ui.field('Starts', start), ui.field('Ends', end)),
      trip ? ui.field('About', desc) : null,
      h('div', { class: 'sect' }, h('h4', {}, 'Cover'), prev,
        h('div', { class: 'btn-row' },
          ui.button('Use a photo', { icon: 'image', onClick: () => fileIn.click() }),
          trip && (coverBlob || newPhoto) ? ui.button('Remove photo', { variant: 'ghost', onClick: () => { newPhoto = null; removePhoto = true; paintPrev(); } }) : null, fileIn),
        h('p', { class: 'hint', style: 'margin:4px 0 0' }, 'Or pick a picture. Auto matches where you are going.'), scene.el),
      trip ? h('div', { class: 'sect' }, h('h4', {}, 'People'), viewers.el) : null,
      trip ? null : h('div', { class: 'sect' }, h('h4', {}, 'About you'), ui.field('Your name', ownName), h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Your picture'), ownAv.el)),
      err, h('button', { type: 'submit', hidden: true }));

    const saveBtn = ui.button(trip ? 'Save' : o.thenPlan ? 'Next' : 'Create trip', { variant: 'primary', big: true, onClick: () => save() });
    const sheet = ui.sheet({
      title: trip ? 'Trip details' : o.thenPlan ? '✨ Build a trip for me' : 'New trip', body,
      footer: [
        trip && session.can('trip.delete') ? ui.button('Delete trip', { variant: 'danger', icon: 'trash', onClick: () => removeTrip() }) : null,
        h('span', { class: 'spacer' }),
        ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => sheet.close() }), saveBtn]
    });
    paintPrev();

    async function removeTrip() {
      const ok = await ui.confirm({ title: 'Delete this trip?', message: 'The plans, chat and files are deleted for everyone. This cannot be undone.', confirmLabel: 'Delete trip', danger: true });
      if (!ok) return;
      try { await TR.api.call('DELETE', '/trips/' + trip.id, { token: session.token }); } catch (e) { return ui.toast(e.message); }
      TR.saved.remove(trip.id); sheet.close(); TR.go('/'); ui.toast('Trip deleted.');
    }
    async function save() {
      err.textContent = '';
      if (!name.value.trim()) { err.textContent = 'Please give the trip a name.'; name.focus(); return; }
      if (!trip && !ownName.value.trim()) { err.textContent = 'Please add your name.'; ownName.focus(); return; }
      if (o.thenPlan && (!start.value || !end.value)) { err.textContent = 'Please pick the dates so we can plan each day.'; (start.value ? end : start).focus(); return; }
      const payload = { name: name.value, destination: dest.value, route: route.value, start_date: start.value || null, end_date: end.value || null, cover_scene: scene.get() };
      saveBtn.disabled = true;
      try {
        if (trip) {
          payload.description = desc.value; payload.viewers_chat = viewers.get();
          if (newPhoto) { const b = await TR.api.upload(trip.id, session.token, newPhoto); payload.cover_blob = b.id; }
          else if (removePhoto) payload.cover_blob = null;
          await session.req('PATCH', '', payload);
          await session.refresh();
          sheet.close(); ui.toast('Saved.');
        } else {
          payload.owner = { name: ownName.value, avatar: ownAv.get() };
          const r = await TR.api.call('POST', '/trips', { body: payload });
          TR.saved.add(r.trip.id, r.token);
          TR.profile.set({ name: ownName.value, avatar: ownAv.get() });
          if (newPhoto) { try { const b = await TR.api.upload(r.trip.id, r.token, newPhoto); await TR.api.call('PATCH', '/trips/' + r.trip.id, { token: r.token, body: { cover_blob: b.id } }); } catch (e) { /* the cover can be added later */ } }
          sheet.close();
          if (o.thenPlan) { TR.planNext = r.trip.id; TR.go('/trip/' + r.trip.id + '/itinerary'); return; }
          TR.go('/trip/' + r.trip.id + '/overview');
          linkSheet(r.token, 'Your trip is ready');
        }
      } catch (e) { err.textContent = e.message; saveBtn.disabled = false; }
    }
    return sheet;
  }

  // "This link is your key" — shown once after making or joining a trip.
  function linkSheet(token, title) {
    const link = TR.personalLink(token);
    const s = ui.sheet({
      title: title || 'Your personal link',
      body: h('div', { class: 'stack' },
        h('p', { class: 'sheet-text' }, 'Triply has no passwords. This link is how you get back in from another phone or computer, so save it somewhere safe (your notes, or e-mail it to yourself).'),
        ui.copyBox(link, 'Your personal link'),
        h('p', { class: 'warn-box' }, 'Keep it private: anyone with this link can act as you in this trip. To add other people, invite them from the People tab.')),
      footer: [ui.button('Got it', { variant: 'primary', big: true, onClick: () => s.close() })]
    });
    return s;
  }

  /* ---------- plan: choose a type, then fill it in ---------- */
  function typePicker(session, date) {
    const s = ui.sheet({
      title: 'What are you adding?',
      body: h('div', { class: 'stack' }, TR.ai ? h('button', { type: 'button', class: 'ai-pick-banner', onclick: () => { s.close(); TR.ai.bookings(session); } },
        h('span', { class: 'ai-drop-ic' }, TR.icon('sparkle')), h('span', {}, h('b', {}, 'Have a booking email or a flight number?'), h('span', { class: 'sub' }, 'Upload it or type the flight, and we fill everything in.'))) : null,
        h('div', { class: 'type-grid' }, cfg.typeOrder.map((t) => {
        const T = cfg.types[t];
        return h('button', { type: 'button', class: 'type-opt', onclick: () => { s.close(); itemSheet({ session, type: t, date }); } },
          h('span', { class: 'tp-ic', style: '--c:' + T.color }, TR.icon(T.icon)), T.label);
      })))
    });
  }

  // opts: { session, type, item?, date? }
  function itemSheet(opts) {
    const session = opts.session, item = opts.item || null, src = item || opts.template || null, type = src ? src.type : opts.type;
    const T = cfg.types[type];
    const trip = session.trip();
    const today = D.today();
    const defDate = opts.date || (trip.start_date && trip.start_date > today ? trip.start_date : trip.end_date && trip.end_date < today ? trip.start_date : trip.start_date ? (today >= trip.start_date ? today : trip.start_date) : '');
    const title = input('text', src ? src.title : '', { maxlength: 120, placeholder: T.titlePlaceholder, autofocus: true });
    const dataIn = {};
    const dataFields = T.fields.map((f) => {
      const el = input(f[3] === 'number' ? 'number' : 'text', src && src.data[f[0]] !== undefined ? src.data[f[0]] : '', { placeholder: f[2] || '', inputmode: f[3] === 'number' ? 'decimal' : undefined, step: f[3] === 'number' ? 'any' : undefined });
      dataIn[f[0]] = el;
      return ui.field(f[1], el);
    });
    const sd = input('date', src ? src.start_date || '' : T.needsStart ? defDate : opts.date || '');
    const st = input('time', src ? src.start_time || '' : '');
    const ed = input('date', src ? src.end_date || '' : '');
    const et = input('time', src ? src.end_time || '' : '');
    const loc = input('text', src ? src.location : '', { maxlength: 200, placeholder: '' });
    const conf = input('text', src ? src.confirmation : '', { maxlength: 60, placeholder: 'Booking or confirmation number', autocapitalize: 'characters' });
    const notes = h('textarea', { rows: 3, maxlength: 4000, placeholder: 'Anything to remember' }); notes.value = src ? src.notes || '' : '';
    const err = h('p', { class: 'form-error', role: 'alert' });
    if (type === 'note') { title.placeholder = 'Note title (optional)'; }

    const body = h('form', { class: 'event-form', novalidate: true, onsubmit: (e) => { e.preventDefault(); save(); } },
      h('div', { class: 'detail-title' }, h('span', { class: 'tp-ic', style: '--c:' + T.color }, TR.icon(T.icon)), h('h3', {}, (item ? 'Edit ' : 'New ') + T.label.toLowerCase())),
      ui.field(type === 'flight' || type === 'car' || type === 'cruise' ? 'Name (optional)' : 'Name', title),
      dataFields.length ? h('div', { class: 'sect' }, h('h4', {}, T.label + ' details'), h('div', { class: 'field-inline' }, dataFields)) : null,
      h('div', { class: 'sect' }, h('h4', {}, 'When' + (T.needsStart ? '' : ' (optional)')),
        h('div', { class: 'row2' }, ui.field(T.startLabel + ' – day', sd), ui.field('Time', st)),
        h('div', { class: 'row2' }, ui.field(T.endLabel + ' – day', ed), ui.field('Time', et))),
      h('div', { class: 'sect' }, h('h4', {}, 'More'),
        ui.field(T.locationLabel, loc), ui.field('Confirmation number', conf), ui.field('Notes', notes)),
      err, h('button', { type: 'submit', hidden: true }));

    const saveBtn = ui.button(item ? 'Save' : 'Add to trip', { variant: 'primary', big: true, onClick: () => save() });
    const sheet = ui.sheet({
      title: '', wide: true, body,
      footer: [item ? ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: () => remove() }) : null, h('span', { class: 'spacer' }),
        ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => sheet.close() }), saveBtn]
    });

    function payload() {
      const data = {};
      Object.keys(dataIn).forEach((k) => { data[k] = dataIn[k].value; });
      return { title: title.value, data, start_date: sd.value || null, start_time: sd.value ? st.value || null : null, end_date: ed.value || null, end_time: ed.value || sd.value ? et.value || null : null, location: loc.value, confirmation: conf.value, notes: notes.value };
    }
    async function save() {
      err.textContent = '';
      saveBtn.disabled = true;
      const p = payload();
      try {
        if (item) { p.version = item.version; await session.req('PATCH', '/items/' + item.id, p); }
        else { p.type = type; await session.req('POST', '/items', p); }
        await session.refresh();
        sheet.close(); ui.toast(item ? 'Saved.' : 'Added to the trip.');
        opts.onDone && opts.onDone();
      } catch (e) {
        saveBtn.disabled = false;
        if (e.code === 'version_conflict' && e.item) return conflict(e.item, p);
        err.textContent = e.message;
      }
    }
    async function conflict(theirs, mine) {
      const pick = await ui.choose({ title: 'Someone changed this plan', message: 'Another person saved changes while you were editing.',
        options: [{ value: 'mine', label: 'Keep my changes', description: 'Replace their version with what you typed.' }, { value: 'theirs', label: 'Use their version', description: 'Throw away what you typed.' }] });
      try {
        if (pick === 'mine') { mine.version = theirs.version; await session.req('PATCH', '/items/' + item.id, mine); }
        await session.refresh(); sheet.close();
      } catch (e) { err.textContent = e.message; }
    }
    async function remove() {
      const ok = await ui.confirm({ title: 'Delete this ' + T.label.toLowerCase() + '?', message: '“' + item.title + '” will be removed for everyone.', confirmLabel: 'Delete', danger: true });
      if (!ok) return;
      try { await session.req('DELETE', '/items/' + item.id); await session.refresh(); sheet.close(); ui.toast('Deleted.'); opts.onDone && opts.onDone(); } catch (e) { ui.toast(e.message); }
    }
    return sheet;
  }

  /* ---------- me: name + picture ---------- */
  function profileSheet(session) {
    const me = session.me();
    const name = input('text', me.name, { maxlength: 40, autofocus: true });
    const av = ui.avatarPicker(me.avatar);
    const err = h('p', { class: 'form-error', role: 'alert' });
    const save = ui.button('Save', { variant: 'primary', big: true, onClick: async () => {
      if (!name.value.trim()) { err.textContent = 'Please add your name.'; return; }
      try { await session.req('PATCH', '/members/me', { name: name.value, avatar: av.get() }); TR.profile.set({ name: name.value, avatar: av.get() }); await session.refresh(); s.close(); ui.toast('Saved.'); } catch (e) { err.textContent = e.message; }
    } });
    const s = ui.sheet({ title: 'Your name and picture', body: h('div', { class: 'event-form' }, ui.field('Name', name), h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Picture'), av.el), err),
      footer: [ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), save] });
  }

  TR.forms = { tripSheet, linkSheet, typePicker, itemSheet, profileSheet, input };
})();

</script>
<script>
/*
 * trips.js — "My Trips": every trip whose secret link is saved on this device.
 * The page sends the saved tokens to the server and gets back a summary of each one that still works.
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, icon = TR.icon;

  function phase(t, today) {
    if (t.start_date && t.end_date) {
      if (t.end_date < today) return 'past';
      if (t.start_date <= today) return 'current';
      return 'upcoming';
    }
    if (t.start_date) return t.start_date < today ? 'past' : t.start_date === today ? 'current' : 'upcoming';
    return 'upcoming';
  }
  function whenText(t, ph, today) {
    if (ph === 'current') { const n = D.diff(t.start_date, today) + 1, total = t.end_date ? D.diff(t.start_date, t.end_date) + 1 : null; return 'Happening now' + (total ? ' · day ' + n + ' of ' + total : ''); }
    if (ph === 'upcoming' && t.start_date) { const n = D.diff(today, t.start_date); return n === 1 ? 'Starts tomorrow' : 'Starts in ' + TR.plural(n, 'day'); }
    if (ph === 'past') return 'Finished';
    return 'Dates not set';
  }

  TR.tripCover = function (t, cls) {
    // Your own photo if you added one; otherwise a drawn scene that matches the trip.
    if (!t.cover_blob) return TR.covers.el(TR.covers.pick(t), cls || 'cover');
    const el = h('div', { class: cls || 'cover' });
    el.style.backgroundImage = 'url("' + TR.blobUrl(t.cover_blob) + '")';
    return el;
  };

  function mount(root) {
    let trips = null, error = '', tab = null, dead = false;

    async function load() {
      const saved = TR.saved.all();
      if (!saved.length) { trips = []; return render(); }
      try {
        const r = await TR.api.call('POST', '/my-trips', { body: { tokens: saved.map((s) => s.token) } });
        if (dead) return;
        // Links the server no longer knows (trip deleted, person removed) are forgotten on this device.
        r.gone.forEach((i) => TR.saved.remove(saved[i].tripId));
        trips = r.trips; error = '';
      } catch (e) {
        if (dead) return;
        error = e.message; if (!trips) trips = [];
      }
      render();
    }

    function card(t, today) {
      const ph = phase(t, today);
      const cover = TR.tripCover(t);
      if (t.unread) cover.append(h('span', { class: 'badge alert', title: t.unread + ' unread' }, t.unread > 99 ? '99+' : String(t.unread)));
      return h('button', { type: 'button', class: 'trip-card', onclick: () => TR.go('/trip/' + t.id + '/overview') },
        cover,
        h('div', { class: 'tc-body' },
          h('span', { class: 'tc-name' }, t.name),
          h('span', { class: 'tc-when' }, whenText(t, ph, today)),
          h('div', { class: 'tc-meta' },
            h('span', {}, D.range(t.start_date, t.end_date)),
            t.destination ? h('span', {}, icon('pin'), ' ' + t.destination) : null),

        svg('<defs><linearGradient id="aiSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22374A"/><stop offset=".55" stop-color="#C98A5E"/><stop offset="1" stop-color="#F0C48A"/></linearGradient></defs>' +

<script>
/*
 * join.js — the two doors into a trip: an invitation (#/join/<code>) and a personal link (#/t/<token>).
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, icon = TR.icon;

  const frame = (...kids) => h('div', { class: 'center-page' }, h('div', { class: 'brand-mark' }, icon('send'), 'Triply'), ...kids);

  function problem(root, title, text) {
    root.replaceChildren(frame(h('div', { class: 'card stack' }, h('h2', {}, title), h('p', { class: 'sub' }, text),
      ui.button('Go to My Trips', { variant: 'primary', big: true, onClick: () => TR.go('/') }))));
  }

  /* ----- invitation ----- */
  function mountJoin(root, ctx) {
    const code = ctx.code;
    root.replaceChildren(frame(h('p', { class: 'loading' }, 'Checking your invitation…')));
    let dead = false;
    TR.api.call('GET', '/invites/peek/' + encodeURIComponent(code)).then((inv) => {
      if (dead) return;
      const existing = TR.saved.find(inv.trip.id);
      const me = TR.profile.get();
      const name = TR.forms.input('text', me.name, { maxlength: 40, placeholder: 'Your name', autofocus: true });
      const av = ui.avatarPicker(me.avatar);
      const err = h('p', { class: 'form-error', role: 'alert' });
      const join = ui.button('Join the trip', { variant: 'primary', big: true, block: true, onClick: async () => {
        err.textContent = '';
        if (!name.value.trim()) { err.textContent = 'Please add your name.'; name.focus(); return; }
        join.disabled = true;
        try {
          const r = await TR.api.call('POST', '/join', { body: { code, name: name.value, avatar: av.get() } });
          TR.saved.add(r.tripId, r.token);
          TR.profile.set({ name: name.value, avatar: av.get() });
          TR.go('/trip/' + r.tripId + '/overview');
          TR.forms.linkSheet(r.token, 'Welcome aboard');
        } catch (e) { err.textContent = e.message; join.disabled = false; }
      } });
      const t = inv.trip;
      root.replaceChildren(frame(
        h('div', { class: 'card stack' },
          TR.tripCover(t, 'photo-prev'),
          h('div', {}, h('p', { class: 'sub' }, (inv.inviter ? inv.inviter + ' invited you to' : 'You are invited to')), h('h1', {}, t.name),
            h('p', { class: 'sub' }, [D.range(t.start_date, t.end_date), t.destination].filter(Boolean).join(' · '))),
          h('p', { class: 'note-box' }, h('b', {}, 'You will join as ' + (inv.role_label || inv.role).toLowerCase() + '. '), TR.config.roleHelp[inv.role] || ''),
          existing ? h('div', { class: 'warn-box' }, 'This device already has a link to this trip. ', h('button', { type: 'button', class: 'link-btn', onclick: () => TR.go('/trip/' + t.id + '/overview') }, 'Open it instead')) : null,
          ui.field('Your name', name),
          h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Your picture'), av.el),
          err, join)));
    }, (e) => { if (!dead) problem(root, e.status === 410 ? 'This invitation cannot be used' : 'Invitation not found', e.message); });
    return { destroy() { dead = true; } };
  }

  /* ----- personal link ----- */
  function mountToken(root, ctx) {
    root.replaceChildren(frame(h('p', { class: 'loading' }, 'Opening your trip…')));
    let dead = false;
    TR.api.call('GET', '/me', { token: ctx.token }).then((r) => {
      if (dead) return;
      TR.saved.add(r.trip.id, ctx.token);
      TR.go('/trip/' + r.trip.id + '/overview', true);
    }, (e) => { if (!dead) problem(root, 'This link does not work', e.status === 401 ? 'The link is wrong, or you were removed from the trip. Ask the trip owner for a new invitation.' : e.message); });
    return { destroy() { dead = true; } };
  }

  TR.screens = TR.screens || {};
  TR.screens.join = { mount: mountJoin };
  TR.screens.token = { mount: mountToken };
})();

(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, cfg = TR.config, icon = TR.icon;

  function countdown(t) {
    const today = D.today();
    if (!t.start_date) return '';
    if (t.end_date && t.end_date < today) return 'Trip finished';
    if (t.start_date > today) { const n = D.diff(today, t.start_date); return n === 1 ? 'Starts tomorrow' : 'Starts in ' + TR.plural(n, 'day'); }
    const n = D.diff(t.start_date, today) + 1, total = t.end_date ? D.diff(t.start_date, t.end_date) + 1 : 0;
    return 'Day ' + n + (total ? ' of ' + total : '');
  }

  function mount(root, ctx) {
    const session = ctx.session;

    function render() {
      const t = session.trip(), items = session.items(), today = D.today(), plan = TR.plan;
      const members = session.state.members;
      const next = plan.next(items);
      const now = new Date();
      const upcoming = items.filter((i) => i.start_date && i !== next && D.at(i.start_date, i.start_time || '00:00') >= now)
        .sort((a, b) => (a.start_date + (a.start_time || '')).localeCompare(b.start_date + (b.start_time || ''))).slice(0, 4);
      const todayRows = plan.on(items, today);
      const inTrip = t.start_date && t.end_date && today >= t.start_date && today <= t.end_date;
      const bookings = items.filter((i) => cfg.bookingTypes.includes(i.type)).length;

            h('div', { class: 'btn-row', style: 'flex-wrap:nowrap' },

              session.can('trip.edit') ? ui.button('Edit', { icon: 'edit', onClick: () => TR.forms.tripSheet({ session }) }) : null)),
          cd ? h('span', { class: 'countdown' }, cd) : null,
          h('div', { class: 'sub' }, [D.range(t.start_date, t.end_date), t.destination].filter(Boolean).join(' · ')),
          t.route.length > 1 ? h('div', { class: 'route', 'aria-label': 'Route' }, t.route.map((r, i) => [i ? icon('right') : null, h('span', {}, r)])) : null,
          t.description ? h('p', { class: 'pre' }, t.description) : null));

      const nextCard = h('section', { class: 'card stack next-card', style: '--c:' + (next ? cfg.types[next.type].color : cfg.neutralColor) },
        h('span', { class: 'next-label' }, inTrip ? 'Today' : 'What is next?'),
        inTrip && todayRows.length ? h('div', { class: 'card-list' }, todayRows.map((r) => plan.card(session, r.item, { role: r.role })))
          : next ? [h('div', { class: 'sub' }, plan.when(next, true)), plan.card(session, next, { role: 'start' })]
          : ui.emptyState({ icon: 'calendar', title: items.length ? 'Nothing coming up' : 'No plans yet', text: items.length ? 'All the plans on this trip are in the past.' : 'Add a flight, a hotel or a restaurant to get started.',
              action: session.can('items.write') ? ui.button('Add a plan', { icon: 'plus', variant: 'primary', onClick: () => TR.forms.typePicker(session) }) : null }),
        inTrip && todayRows.length && next && !todayRows.some((r) => r.item.id === next.id) ? [h('span', { class: 'next-label' }, 'After that'), plan.card(session, next, { role: 'start' })] : null);

      const comingUp = upcoming.length ? h('section', { class: 'card stack' }, h('h2', {}, 'Coming up'),
        h('div', { class: 'card-list' }, upcoming.map((i) => plan.card(session, i, { role: 'start', showDate: true }))),
        h('button', { type: 'button', class: 'link-btn', onclick: () => TR.go('/trip/' + session.id + '/itinerary') }, 'Full itinerary', icon('right'))) : null;

      const crew = h('section', { class: 'card stack' }, h('h2', {}, 'Travelers'),
        h('div', { class: 'traveler-row' }, members.map((m) => h('span', { class: 'person-chip' }, ui.avatar(m, 28), m.name))),
        h('div', { class: 'btn-row' }, session.can('invites.manage') ? ui.button('Invite people', { icon: 'plus', onClick: () => TR.go('/trip/' + session.id + '/people') }) : ui.button('See everyone', { onClick: () => TR.go('/trip/' + session.id + '/people') })));

      const unread = session.unreadTotal();
      const stats = h('div', { class: 'stat-row' },
        h('button', { type: 'button', class: 'stat', onclick: () => TR.go('/trip/' + session.id + '/itinerary') }, h('b', {}, items.length), h('span', {}, 'Plans')),
        h('button', { type: 'button', class: 'stat', onclick: () => TR.go('/trip/' + session.id + '/bookings') }, h('b', {}, bookings), h('span', {}, 'Bookings')),
        h('button', { type: 'button', class: 'stat', onclick: () => TR.go('/trip/' + session.id + '/chat') }, h('b', {}, unread), h('span', {}, 'Unread')));

      root.replaceChildren(h('div', { class: 'stack' }, hero,

<script>
/*
 * itinerary.js — the plan: Timeline, Day, Week and Full trip views, plus the cards and the detail sheet
 * that other screens (Overview, Bookings, Chat) reuse through TR.plan.
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, cfg = TR.config, icon = TR.icon;

  /* ---------- helpers shared with other screens ---------- */
  const plan = (TR.plan = {});

  plan.endDay = (i) => (i.end_date && i.end_date > i.start_date ? i.end_date : i.start_date);

  // The plans that touch one day. role: 'start' (the main card), 'cont' (still going), 'end' (finishes today).
  plan.on = function (items, day) {
    const rows = [];
    items.forEach((i) => {
      if (!i.start_date) return;
      const last = plan.endDay(i);
      if (day === i.start_date) rows.push({ item: i, role: 'start' });
      else if (day > i.start_date && day < last) rows.push({ item: i, role: 'cont' });
      else if (day === last && last !== i.start_date) rows.push({ item: i, role: 'end' });
    });
    const rank = (r) => (r.role === 'cont' ? -2 : r.role === 'end' ? (r.item.end_time ? D.minutes(r.item.end_time) : -1) : r.item.start_time ? D.minutes(r.item.start_time) : -1);
    return rows.sort((a, b) => rank(a) - rank(b) || String(a.item.created_at).localeCompare(String(b.item.created_at)));
  };
  plan.unscheduled = (items) => items.filter((i) => !i.start_date);

  plan.when = function (i, long) {
    const f = long ? D.long : D.short;
    if (!i.start_date) return 'No day yet';
    const a = f(i.start_date) + (i.start_time ? ' · ' + D.fmtTime(i.start_time) : '');
    const endDay = plan.endDay(i);
    if (!i.end_date && !i.end_time) return a;
    const b = (endDay !== i.start_date ? f(endDay) : '') + (i.end_time ? (endDay !== i.start_date ? ' · ' : '') + D.fmtTime(i.end_time) : '');
    return b ? a + ' → ' + b : a;
  };

  function timeText(item, role) {
    const T = cfg.types[item.type];
    if (role === 'cont') return 'Ongoing';
    if (role === 'end') return item.end_time ? D.fmtTime(item.end_time) : T.endLabel;
    return item.start_time ? D.fmtTime(item.start_time) : 'All day';
  }

  // One plan as a card. opts: { role, compact, showDate }
  plan.card = function (session, item, opts) {
    const o = opts || {}, T = cfg.types[item.type], role = o.role || 'start';
    const sub = role === 'start' ? T.sub(item) : role === 'end' ? T.endLabel : 'Until ' + D.short(plan.endDay(item));
    return h('button', { type: 'button', class: 'ev-card' + (o.compact ? ' compact' : '') + (role !== 'start' ? ' cont' : ''), style: '--c:' + T.color, onclick: () => plan.detail(session, item.id) },
      o.compact ? null : h('span', { class: 'tp-ic', style: '--c:' + T.color }, icon(T.icon)),
      h('span', { class: 'ev-time' }, o.showDate && item.start_date ? D.short(item.start_date) : timeText(item, role)),
      h('span', { class: 'ev-main' },
        h('span', { class: 'ev-title' }, (role === 'end' ? T.endLabel + ': ' : '') + item.title),
        sub ? h('span', { class: 'ev-sub' }, sub) : null,
        item.confirmation && role === 'start' && !o.compact ? h('span', { class: 'ev-conf' }, 'Conf. ' + item.confirmation) : null));
  };

  // What is next? The first plan that has not started yet (or is running right now).
  plan.next = function (items) {
    const now = new Date(), today = D.today();
    let best = null, bestAt = null;
    items.forEach((i) => {
      if (!i.start_date) return;
      const startAt = D.at(i.start_date, i.start_time || '00:00');
      const endAt = i.end_date ? D.at(i.end_date, i.end_time || '23:59') : D.at(i.start_date, i.start_time ? i.start_time : '23:59');
      const upcoming = startAt >= now || (i.start_date === today && !i.start_time);
      const running = startAt < now && endAt >= now && i.end_date && i.end_date > i.start_date;
      if (!upcoming || running) return;
      if (!bestAt || startAt < bestAt) { best = i; bestAt = startAt; }
    });
    return best;
  };

  // The whole plan as plain text, to paste into a message or e-mail.
  plan.asText = function (session) {
    const t = session.trip(), items = session.items(), lines = [t.name, [D.range(t.start_date, t.end_date), t.destination].filter(Boolean).join(' · ')];
    if (t.route.length > 1) lines.push(t.route.join(' → '));
    const days = [...new Set(items.filter((i) => i.start_date).flatMap((i) => { const o = []; for (let d = i.start_date, n = 0; d <= plan.endDay(i) && n < 400; d = D.addDays(d, 1), n++) o.push(d); return o; }))].sort();
    days.forEach((d) => {
      const n = t.start_date ? D.diff(t.start_date, d) + 1 : 0;
      lines.push('', D.long(d) + (n > 0 && t.end_date && d <= t.end_date ? ' (day ' + n + ')' : ''));
      plan.on(items, d).forEach((r) => {
        const i = r.item, T = cfg.types[i.type];
        const time = r.role === 'cont' ? '' : r.role === 'end' ? (i.end_time ? D.fmtTime(i.end_time) : '') : (i.start_time ? D.fmtTime(i.start_time) : '');
        const what = r.role === 'cont' ? 'Staying: ' + i.title : r.role === 'end' ? T.endLabel + ': ' + i.title : T.label + ': ' + i.title;
        const extra = r.role === 'start' ? [T.sub(i), i.confirmation ? 'conf. ' + i.confirmation : ''].filter(Boolean).join(' · ') : '';
        lines.push('  ' + (time ? time + '  ' : '') + what + (extra ? ' (' + extra + ')' : ''));
      });
    });
    const ideas = plan.unscheduled(items);
    if (ideas.length) { lines.push('', 'Ideas and notes'); ideas.forEach((i) => lines.push('  - ' + i.title)); }
    return lines.join('\n');
  };

  function shareSheet(session) {
    const text = plan.asText(session);
    const box = h('textarea', { rows: 14, readonly: true, 'aria-label': 'Itinerary as text', onfocus: (e) => e.target.select(), style: 'font-family:ui-monospace,Menlo,monospace;font-size:.82rem' }); box.value = text;
    const s = ui.sheet({ title: 'Share the itinerary', wide: true, body: h('div', { class: 'stack' }, h('p', { class: 'sheet-text' }, 'Plain text you can paste into a message or e-mail, for people who are not on the trip.'), box),
      footer: [h('span', { class: 'spacer' }), navigator.share ? ui.button('Share…', { icon: 'share', onClick: () => navigator.share({ title: session.trip().name, text }).catch(() => {}) }) : null,
        ui.button('Copy text', { icon: 'copy', variant: 'primary', big: true, onClick: async () => { const ok = await TR.copy(text); if (!ok) box.select(); ui.toast(ok ? 'Copied.' : 'Select the text and copy it.'); } })] });
  }

  plan.detail = function (session, itemId) {
    const item = session.item(itemId);

<script>
/*
 * expenses.js — Costs: who paid, who shares, and who owes whom.
 * All money maths is done in whole cents. Each currency is settled on its own (no exchange rates).
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, icon = TR.icon;

  const money = (cents, cur) => { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }).format(cents / 100); } catch (e) { return cur + ' ' + (cents / 100).toFixed(2); } };
  const toCents = (n) => Math.round(Number(n) * 100);

  // Split one cost in cents among people so the shares add up exactly (the extra cents go to the first people in a fixed order).
  function shares(cents, ids) {
    const sorted = ids.slice().sort(), base = Math.floor(cents / sorted.length); let extra = cents - base * sorted.length;
    const out = {}; sorted.forEach((id) => { out[id] = base + (extra-- > 0 ? 1 : 0); });
    return out;
  }

  // -> { [currency]: { total, paid:{id:cents}, share:{id:cents}, balance:{id:cents}, transfers:[{from,to,cents}] } }
  TR.money = {
    format: money,
    compute(expenses, members) {
      const alive = new Set(members.map((m) => m.id)), by = {};
      expenses.forEach((e) => {
        const ids = (e.split || []).filter((id) => alive.has(id)); if (!ids.length) return;
        const c = by[e.currency] || (by[e.currency] = { total: 0, paid: {}, share: {}, balance: {}, transfers: [] });
        const cents = toCents(e.amount), payer = e.paid_by && alive.has(e.paid_by) ? e.paid_by : '_gone';
        c.total += cents; c.paid[payer] = (c.paid[payer] || 0) + cents; c.balance[payer] = (c.balance[payer] || 0) + cents;
        const sh = shares(cents, ids);
        Object.keys(sh).forEach((id) => { c.share[id] = (c.share[id] || 0) + sh[id]; c.balance[id] = (c.balance[id] || 0) - sh[id]; });
      });
      Object.values(by).forEach((c) => {
        const debt = Object.entries(c.balance).filter((x) => x[1] < 0).map((x) => ({ id: x[0], v: -x[1] })).sort((a, b) => b.v - a.v);
        const cred = Object.entries(c.balance).filter((x) => x[1] > 0).map((x) => ({ id: x[0], v: x[1] })).sort((a, b) => b.v - a.v);
        let i = 0, j = 0;
        while (i < debt.length && j < cred.length) {
          const t = Math.min(debt[i].v, cred[j].v);
          if (t > 0) c.transfers.push({ from: debt[i].id, to: cred[j].id, cents: t });
          debt[i].v -= t; cred[j].v -= t;
          if (!debt[i].v) i++; if (!cred[j].v) j++;
        }
      });
      return by;
    }
  };

  function expenseSheet(session, exp) {
    const members = session.state.members, me = session.me(), items = session.items();
    const title = TR.forms.input('text', exp ? exp.title : '', { maxlength: 120, placeholder: 'Dinner at Casa Lucio', autofocus: true });
    const amount = TR.forms.input('number', exp ? exp.amount : '', { inputmode: 'decimal', step: '0.01', min: '0', placeholder: '0.00' });
    const last = session.expenses().length ? session.expenses()[0].currency : 'CAD';
    const cur = TR.forms.input('text', exp ? exp.currency : last, { maxlength: 3, autocapitalize: 'characters' });
    const paid = ui.select(members.map((m) => ({ value: m.id, label: m.name + (m.you ? ' (you)' : '') })), exp && exp.paid_by ? exp.paid_by : me.id);
    const date = TR.forms.input('date', exp ? exp.spent_on || '' : D.today());
    const sel = new Set(exp ? exp.split : members.map((m) => m.id));
    const picks = members.map((m) => {
      const b = h('button', { type: 'button', class: 'person-pick', 'aria-pressed': sel.has(m.id) ? 'true' : 'false', onclick: () => { if (sel.has(m.id)) sel.delete(m.id); else sel.add(m.id); b.setAttribute('aria-pressed', sel.has(m.id) ? 'true' : 'false'); preview(); } }, ui.avatar(m, 30), m.name);
      return b;
    });
    const linkSel = ui.select([{ value: '', label: 'Not linked to a plan' }].concat(items.map((i) => ({ value: i.id, label: i.title }))), exp && exp.item_id ? exp.item_id : '');
    const note = h('textarea', { rows: 2, maxlength: 500, placeholder: 'Optional' }); note.value = exp ? exp.note || '' : '';
    const each = h('p', { class: 'hint' });
    const err = h('p', { class: 'form-error', role: 'alert' });
    function preview() {
      const n = sel.size, v = Number(amount.value);
      each.textContent = n && v > 0 ? 'Each person pays ' + money(Math.round(toCents(v) / n), (cur.value || 'CAD').toUpperCase().slice(0, 3)) + (n > 1 ? ' (about)' : '') : '';
    }
    [amount, cur].forEach((el) => el.addEventListener('input', preview)); preview();
    const body = h('form', { class: 'event-form', novalidate: true, onsubmit: (e) => { e.preventDefault(); save(); } },
      ui.field('What was it for?', title),
      h('div', { class: 'row2' }, ui.field('Amount', amount), ui.field('Currency', cur)),
      h('div', { class: 'row2' }, ui.field('Paid by', paid), ui.field('Date', date)),
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Shared between'), h('div', { class: 'chip-row' }, picks), each),
      ui.field('Plan', linkSel), ui.field('Note', note), err, h('button', { type: 'submit', hidden: true }));
    const saveBtn = ui.button(exp ? 'Save' : 'Add cost', { variant: 'primary', big: true, onClick: () => save() });
    const s = ui.sheet({ title: exp ? 'Change cost' : 'Add a cost', body, footer: [exp ? ui.button('Delete', { variant: 'danger', icon: 'trash', onClick: remove }) : null, h('span', { class: 'spacer' }), ui.button('Cancel', { variant: 'ghost', big: true, onClick: () => s.close() }), saveBtn] });
    async function save() {
      err.textContent = ''; saveBtn.disabled = true;
      const p = { title: title.value, amount: amount.value, currency: cur.value, paid_by: paid.value, split: [...sel], spent_on: date.value || null, item_id: linkSel.value || null, note: note.value };

      } catch (e) { err.textContent = e.message; saveBtn.disabled = false; }
    }
    async function remove() {
      if (!(await ui.confirm({ title: 'Delete this cost?', message: '“' + exp.title + '” will be removed for everyone.', confirmLabel: 'Delete', danger: true }))) return;
      try { await session.req('DELETE', '/expenses/' + exp.id); await session.refresh(); s.close(); ui.toast('Deleted.'); } catch (e) { ui.toast(e.message); }
    }
  }

  // The trip budget: one amount in one currency. Owners set it; everyone sees how much is spent.
  function budgetSheet(session) {
    const trip = session.state.trip;
    const amount = TR.forms.input('number', trip.budget || '', { inputmode: 'decimal', step: '1', min: '0', placeholder: 'For example: 20000', autofocus: true });
    const cur = TR.forms.input('text', trip.budget_currency || (session.expenses()[0] ? session.expenses()[0].currency : 'CAD'), { maxlength: 3, autocapitalize: 'characters' });
    const err = h('p', { class: 'form-error', role: 'alert' });
    async function save(budget) {
      err.textContent = '';
      try { await session.req('PATCH', '', { budget, budget_currency: cur.value }); await session.refresh(); s.close(); ui.toast(budget ? 'Budget saved.' : 'Budget removed.'); }
      catch (e) { err.textContent = e.message; }
    }
    const s = ui.sheet({ title: trip.budget ? 'Change the budget' : 'Set a budget',
      body: h('form', { class: 'event-form', novalidate: true, onsubmit: (e) => { e.preventDefault(); save(amount.value || null); } },
        h('p', { class: 'sub' }, 'How much the whole trip should cost. Costs in this currency count toward it.'),

<script>
/*
 * search.js — one box for plans, costs, packing, people, files and chat messages.
 * Everything except chat is searched in the page; chat is searched by the server (it only returns what you may read).
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, cfg = TR.config, icon = TR.icon;

  function mount(root, ctx) {
    const session = ctx.session;
    let q = '', chat = [], seq = 0, files = null, timer = null;
    const input = h('input', { type: 'search', placeholder: 'Search plans, costs, people, chat…', 'aria-label': 'Search this trip', autofocus: true, oninput: () => { q = input.value; renderResults(); remote(); } });
    const results = h('div', { class: 'stack', style: 'margin-top:14px;max-width:760px' });
    root.replaceChildren(h('div', { class: 'page-head' }, h('h1', {}, 'Search')), h('div', { style: 'max-width:760px' }, input), results);
    setTimeout(() => input.focus(), 0);
    session.req('GET', '/files').then((r) => { files = r.files; renderResults(); }, () => { files = []; });

    const norm = (s) => String(s == null ? '' : s).toLowerCase();
    const hit = (needle, ...fields) => fields.some((f) => norm(f).includes(needle));
    const mark = (text, needle) => {

    };

      const mine = ++seq;
      timer = setTimeout(async () => {
        try { const r = await session.req('GET', '/search?q=' + encodeURIComponent(needle)); if (mine === seq) { chat = r.messages; renderResults(); } } catch (e) { /* the rest still works */ }
      }, 250);
    }

    const row = (ic, color, title, sub, onclick) => h('button', { type: 'button', class: 'book-card', onclick },
      h('span', { class: 'tp-ic', style: '--c:' + color }, icon(ic)), h('span', { class: 'book-main' }, h('b', {}, title), sub ? h('span', { class: 'sub' }, sub) : null));

    const off = session.on((k) => { if (k === 'state' || k === 'unread') render(); });
    return { destroy: off };
  }

  TR.screens = TR.screens || {};
  TR.screens.updates = { mount };
})();

<script>
/*
 * chat.js — group chat and private messages for a trip.
 * Messages arrive live through the session (see store.js); this file only draws them and sends new ones.
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, cfg = TR.config, icon = TR.icon;

  const URL_RE = /(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g;
  const EMOJI_ONLY = /^(?:\p{Extended_Pictographic}|️|‍|\s){1,14}$/u;
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // Turn message text into text, links and highlighted @mentions.
  function rich(body, names) {
    const out = [];
    const alt = names.map(esc).join('|');
    const re = names.length ? new RegExp('(@(?:' + alt + '))(?![\\p{L}\\p{N}])', 'u') : null;
    const mentionSplit = (chunk) => (re ? chunk.split(re).map((p, i) => (i % 2 ? h('span', { class: 'mention' }, p) : p)) : [chunk]);
    let last = 0, m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(body))) {
      if (m.index > last) out.push(...mentionSplit(body.slice(last, m.index)));
      out.push(h('a', { href: m[1], target: '_blank', rel: 'noopener noreferrer nofollow' }, m[1]));
      last = m.index + m[1].length;
    }
    if (last < body.length) out.push(...mentionSplit(body.slice(last)));
    return out;
  }

  const clock = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  function dayLabel(iso) {
    const k = D.key(new Date(iso)), today = D.today();
    if (k === today) return 'Today';
    if (k === D.addDays(today, -1)) return 'Yesterday';
    return D.fmt(k, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mount(root, ctx) {
    const session = ctx.session;
    let cur = session.openWith || 'trip';
    session.openWith = null;
    const drafts = {};
    let pending = null;   // { blob, uploading }
    let sending = false;
    root.classList.add('chat-mode');

    const wrap = h('div', { class: 'chat-wrap' });
    const threadsEl = h('div', { class: 'threads', role: 'tablist', 'aria-label': 'Conversations' });
    const msgsEl = h('div', { class: 'msgs', role: 'log', 'aria-live': 'polite', 'aria-label': 'Messages' });
    const composerEl = h('div', {});
    wrap.append(threadsEl, msgsEl, composerEl);
    root.replaceChildren(wrap);

    const canWrite = () => session.can('chat.write');
    const name = (id) => { const m = session.member(id); return m ? m.name : 'Someone'; };

    /* ----- thread buttons ----- */
    function renderThreads() {
      const u = session.state.unread, others = session.state.members.filter((m) => !m.you);
      if (cur !== 'trip' && !session.member(cur)) cur = 'trip';
      threadsEl.replaceChildren(
        h('button', { type: 'button', role: 'tab', 'aria-selected': cur === 'trip' ? 'true' : 'false', class: 'thread-btn group' + (cur === 'trip' ? ' on' : ''), onclick: () => pick('trip') },
          icon('users'), 'Group chat', u.trip ? h('span', { class: 'badge alert' }, u.trip > 99 ? '99+' : String(u.trip)) : null),
        ...others.map((m) => h('button', { type: 'button', role: 'tab', 'aria-selected': cur === m.id ? 'true' : 'false', class: 'thread-btn' + (cur === m.id ? ' on' : ''), onclick: () => pick(m.id) },
          ui.avatar(m, 32), m.name, u.dm[m.id] ? h('span', { class: 'badge alert' }, String(u.dm[m.id])) : null)));
    }

    /* ----- message list ----- */
    function activityText(m) {
      const who = m.sender_id ? name(m.sender_id) : 'Someone', meta = m.meta || {};
      const T = cfg.types[meta.type];
      const kind = T ? T.label.toLowerCase() : 'plan';
      const when = meta.date ? ' · ' + D.short(meta.date) + (meta.time ? ' ' + D.fmtTime(meta.time) : '') : '';
      switch (meta.event) {
        case 'joined': return [h('b', {}, who), ' joined the trip'];
        case 'left': return [h('b', {}, who), ' left the trip'];
        case 'added': return [h('b', {}, who), ' added ' + (/^[aeiou]/.test(kind) ? 'an ' : 'a ') + kind + ': ', h('b', {}, meta.title || ''), when];
        case 'removed': return [h('b', {}, who), ' removed ', h('b', {}, meta.title || kind)];
        case 'bulk': return [h('b', {}, who), ' added ' + (meta.count || 'some') + ' plans' + (meta.title ? ': ' : ''), meta.title ? h('b', {}, meta.title) : ''];
        default: return [h('b', {}, who), ' updated ', h('b', {}, meta.title || kind), when];
      }
    }
    function messageNode(m, prev) {
      if (m.kind === 'activity') {
        const T = cfg.types[(m.meta || {}).type];
        const it = m.item_id ? session.item(m.item_id) : null;
        const kids = [icon(m.meta && m.meta.event === 'joined' ? 'users' : T ? T.icon : 'calendar'), h('span', {}, activityText(m))];
        return it ? h('button', { type: 'button', class: 'act-pill', onclick: () => TR.plan.detail(session, it.id) }, kids) : h('div', { class: 'act-pill' }, kids);
      }
      const mine = m.sender_id === session.me().id, sender = session.member(m.sender_id);
      const same = prev && prev.kind === 'text' && prev.sender_id === m.sender_id && D.key(new Date(prev.created_at)) === D.key(new Date(m.created_at));
      const names = (m.mentions || []).map((id) => name(id));
      const col = h('div', { class: 'msg-col' });
      if (!mine && !same && cur === 'trip') col.append(h('span', { class: 'msg-name' }, sender ? sender.name : 'Former traveler'));
      if (m.blob) {
        const url = TR.blobUrl(m.blob.id);
        col.append(/^image\//.test(m.blob.mime) && m.blob.mime !== 'image/heic'
          ? h('img', { class: 'msg-img', src: url, alt: m.blob.name || 'Photo', loading: 'lazy', onclick: () => ui.lightbox(url) })
          : h('a', { class: 'msg-file', href: url, download: m.blob.name || 'file', target: '_blank', rel: 'noopener' }, icon('file'), m.blob.name || 'File'));
      }
      if (m.body) col.append(h('div', { class: 'bubble' + (EMOJI_ONLY.test(m.body) ? ' emoji-only' : '') }, rich(m.body, names)));
      col.append(h('span', { class: 'msg-time' }, clock(m.created_at)));
      return h('div', { class: 'msg' + (mine ? ' mine' : '') + (same ? ' same' : '') }, mine ? null : ui.avatar(sender, 32), col);
    }
    function renderMsgs(stick) {
      const t = session.thread(cur);
      const nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 120;
      const oldH = msgsEl.scrollHeight, oldTop = msgsEl.scrollTop;
      const nodes = [];
      if (t.more) nodes.push(h('button', { type: 'button', class: 'btn ghost more', onclick: loadOlder }, 'Load earlier messages'));
      let prev = null, prevDay = '';
      t.list.forEach((m) => {
        const day = D.key(new Date(m.created_at));
        if (day !== prevDay) { nodes.push(h('div', { class: 'day-sep' }, dayLabel(m.created_at))); prevDay = day; prev = null; }
        nodes.push(messageNode(m, prev)); prev = m;
      });
      if (!t.list.length) nodes.push(t.loaded ? ui.emptyState({ icon: 'chat', title: cur === 'trip' ? 'No messages yet' : 'Say hello to ' + name(cur), text: cur === 'trip' ? 'Everyone on the trip can read this chat.' : 'Only the two of you can see this conversation.' }) : h('p', { class: 'loading' }, 'Loading…'));
      msgsEl.replaceChildren(...nodes);
      if (stick || nearBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
      else if (msgsEl.scrollHeight !== oldH) msgsEl.scrollTop = oldTop;
    }
    async function loadOlder() {
      const t = session.thread(cur); if (!t.list.length) return;
      const oldH = msgsEl.scrollHeight;
      try { await session.loadThread(cur, t.list[0].id); } catch (e) { return ui.toast(e.message); }
      renderMsgs(false); msgsEl.scrollTop = msgsEl.scrollHeight - oldH;
    }

    /* ----- composer ----- */
    let input, sendBtn, chipEl, barEl, suggestEl;
    function renderComposer() {
      if (!canWrite()) { composerEl.replaceChildren(h('p', { class: 'composer-note' }, 'The trip owner has turned off chat for viewers. You can still read messages.')); return; }
      input = h('textarea', { rows: 1, placeholder: cur === 'trip' ? 'Message the group…' : 'Message ' + name(cur) + '…', maxlength: 2000, 'aria-label': 'Message',
        oninput: () => { grow(); suggest(); updateSend(); drafts[cur] = input.value; }, onkeydown: onKey });
      input.value = drafts[cur] || '';
      if (session.draft) { input.value = session.draft; session.draft = ''; drafts[cur] = input.value; }
      const file = h('input', { type: 'file', hidden: true, accept: 'image/*,.pdf,.txt,.csv,.docx,.xlsx,.pptx,.zip', onchange: onFile });
      sendBtn = h('button', { type: 'button', class: 'icon-btn send-btn', 'aria-label': 'Send message', title: 'Send', onclick: send }, icon('send'));
      chipEl = h('div', {}); barEl = h('div', { hidden: true }); suggestEl = h('div', { hidden: true });
      composerEl.replaceChildren(chipEl, h('div', { class: 'composer' },
        ui.iconButton('clip', 'Attach a photo or file', () => file.click()), file,
        ui.iconButton('smile', 'Add an emoji', () => { barEl.hidden = !barEl.hidden; }),
        input, sendBtn, barEl, suggestEl));
      barEl.className = 'emoji-bar';
      cfg.reactions.forEach((e) => barEl.append(h('button', { type: 'button', 'aria-label': e, onclick: () => { insert(e); barEl.hidden = true; input.focus(); } }, e)));
      grow(); updateSend(); paintChip();
    }
    const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(140, input.scrollHeight) + 'px'; };
    function updateSend() { sendBtn.disabled = sending || !!(pending && pending.uploading) || (!input.value.trim() && !(pending && pending.blob)); }
    function insert(text) {
      const a = input.selectionStart == null ? input.value.length : input.selectionStart, b = input.selectionEnd == null ? a : input.selectionEnd;
      input.value = input.value.slice(0, a) + text + input.value.slice(b);
      input.selectionStart = input.selectionEnd = a + text.length; drafts[cur] = input.value; grow(); updateSend();
    }
    function onKey(e) {
      if (!suggestEl.hidden) {
        const btns = [...suggestEl.querySelectorAll('button')]; let i = btns.findIndex((b) => b.classList.contains('on'));
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); btns[i] && btns[i].classList.remove('on'); i = (i + (e.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length; btns[i].classList.add('on'); return; }
        if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); (btns[i] || btns[0]).click(); return; }
        if (e.key === 'Escape') { suggestEl.hidden = true; return; }
      }
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches) { e.preventDefault(); send(); }
    }
    function suggest() {
      const before = input.value.slice(0, input.selectionStart == null ? input.value.length : input.selectionStart);
      const m = /(^|\s)@([^\s@]*)$/.exec(before);
      const list = m && cur === 'trip' ? session.state.members.filter((x) => !x.you && x.name.toLowerCase().startsWith(m[2].toLowerCase())).slice(0, 5) : [];
      suggestEl.hidden = !list.length; suggestEl.className = list.length ? 'suggest' : '';
      suggestEl.replaceChildren(...list.map((x, i) => h('button', { type: 'button', class: i ? '' : 'on', onclick: () => {
        const at = before.length - m[2].length - 1;
        input.value = input.value.slice(0, at) + '@' + x.name + ' ' + input.value.slice(before.length);
        const pos = at + x.name.length + 2; input.focus(); input.selectionStart = input.selectionEnd = pos;
        suggestEl.hidden = true; drafts[cur] = input.value; updateSend();
      } }, ui.avatar(x, 30), x.name)));
    }
    function paintChip() {
      chipEl.replaceChildren();
      if (!pending) return;
      chipEl.append(h('div', { class: 'composer-note', style: 'padding:6px 0;display:flex;gap:8px;justify-content:center;align-items:center' },
        icon(pending.blob && /^image\//.test(pending.blob.mime) ? 'image' : 'file'),
        h('span', {}, pending.uploading ? 'Uploading ' + pending.name + '…' : pending.name),
        pending.uploading ? null : h('button', { type: 'button', class: 'link-btn', onclick: () => { pending = null; paintChip(); updateSend(); } }, 'Remove')));
    }
    async function onFile(e) {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      pending = { name: f.name, uploading: true }; paintChip(); updateSend();
      try { pending.blob = await TR.api.upload(session.id, session.token, f); pending.uploading = false; }
      catch (err) { pending = null; ui.toast(err.message); }
      paintChip(); updateSend();
    }
    async function send() {
      if (sending) return;
      const body = input.value.trim();
      if (!body && !(pending && pending.blob)) return;
      sending = true; updateSend();
      try {
        await session.send(cur, body, pending && pending.blob ? pending.blob.id : undefined);
        input.value = ''; drafts[cur] = ''; pending = null; paintChip(); grow(); suggestEl.hidden = true;
        session.markRead(cur);
      } catch (e) { ui.toast(e.message); }
      sending = false; updateSend(); input.focus();
      renderMsgs(true);
    }

    /* ----- switching and loading ----- */
    async function pick(key) {
      if (key === cur && session.thread(key).loaded) return;
      drafts[cur] = input ? input.value : '';
      cur = key; session.viewing = key;
      renderThreads(); renderComposer(); renderMsgs(true);
      try { await session.loadThread(key); } catch (e) { ui.toast(e.message); }
      if (cur === key) { renderMsgs(true); if (!document.hidden) session.markRead(key); renderThreads(); }
    }
    session.viewing = cur;
    renderThreads(); renderComposer(); renderMsgs(true);
    session.loadThread(cur).then(() => { renderMsgs(true); if (!document.hidden) session.markRead(cur); renderThreads(); }, (e) => ui.toast(e.message));

    const off = session.on((k, key) => {
      if (k === 'chat' && key === cur) { renderMsgs(false); if (!document.hidden) session.markRead(cur); }
      if (k === 'unread' || k === 'chat') renderThreads();
      if (k === 'state') { renderThreads(); renderMsgs(false); if (!!(input) !== canWrite()) renderComposer(); }
    });
    const onVis = () => { if (!document.hidden) session.markRead(cur); };
    document.addEventListener('visibilitychange', onVis);
    return { destroy() { off(); document.removeEventListener('visibilitychange', onVis); session.viewing = null; root.classList.remove('chat-mode'); } };
  }

  TR.screens = TR.screens || {};
  TR.screens.chat = { mount };
})();

<script>
/*
 * people.js — who is on the trip, what they may do, invitations, and my own link.
 */
(function () {
  const TR = window.TR;
  const h = TR.h, ui = TR.ui, D = TR.D, cfg = TR.config, icon = TR.icon;

  function mount(root, ctx) {
    const session = ctx.session;
    let inviteRole = 'editor', fresh = null; // fresh: the invitation just made (its link is only known right now)

    const roleLabel = (id) => { const r = session.state.roles.find((x) => x.id === id); return r ? r.label : id; };

    function memberRow(m) {
      const me = session.me(), owner = session.can('members.manage');
      const sub = m.you ? 'You' : 'Joined ' + D.withYear(m.joined_at.slice(0, 10));
      let control;
      if (owner && !m.you) {
        const sel = ui.select(session.state.roles.map((r) => ({ value: r.id, label: r.label })), m.role, async (v) => {
          try { await session.req('PATCH', '/members/' + m.id, { role: v }); await session.refresh(); ui.toast(m.name + ' is now ' + roleLabel(v).toLowerCase() + '.'); } catch (e) { ui.toast(e.message); sel.value = m.role; }
        });
        sel.setAttribute('aria-label', 'Role of ' + m.name);
        control = [sel, ui.iconButton('trash', 'Remove ' + m.name, async () => {
          const ok = await ui.confirm({ title: 'Remove ' + m.name + '?', message: 'They lose access to this trip right away, and their private messages are deleted.', confirmLabel: 'Remove', danger: true });
          if (!ok) return;
          try { await session.req('DELETE', '/members/' + m.id); await session.refresh(); ui.toast('Removed.'); } catch (e) { ui.toast(e.message); }
        })];
      } else control = h('span', { class: 'badge' + (m.role === 'owner' ? ' owner' : '') }, roleLabel(m.role));
      return h('div', { class: 'person-row' }, ui.avatar(m, 44), h('div', { class: 'person-main' }, h('b', {}, m.name), h('span', { class: 'sub' }, sub)), control,
        !m.you ? ui.iconButton('chat', 'Message ' + m.name, () => { session.openWith = m.id; TR.go('/trip/' + session.id + '/chat'); }) : null);
    }

    async function makeInvite(label) {
      try {
        const r = await session.req('POST', '/invites', { role: inviteRole, label });
        fresh = { id: r.invite.id, link: r.link };
        await session.refresh();
      } catch (e) { ui.toast(e.message); }
    }

    function inviteCard() {
      const label = TR.forms.input('text', '', { maxlength: 60, placeholder: 'Who is it for? (optional)' });
      const seg = ui.segmented(session.state.roles.map((r) => ({ value: r.id, label: r.label })), inviteRole, (v) => { inviteRole = v; help.textContent = cfg.roleHelp[v]; }, 'Role');
      const help = h('p', { class: 'sub' }, cfg.roleHelp[inviteRole]);
      const pending = session.state.invites;
      return h('section', { class: 'card stack' }, h('h2', {}, 'Invite someone'),
        h('p', { class: 'sub' }, 'Make a link and send it by message or e-mail. Each link works once and expires in two weeks.'),
        seg.el, help, ui.field('Note to yourself', label),
        ui.button('Create invitation link', { icon: 'link', variant: 'primary', big: true, onClick: () => makeInvite(label.value) }),
        fresh ? h('div', { class: 'stack' }, h('p', { class: 'note-box' }, 'Link ready. Copy it now — for safety it is not shown again after you leave this page.'), ui.copyBox(fresh.link, 'Invitation link'),
          navigator.share ? ui.button('Share…', { icon: 'share', onClick: () => navigator.share({ title: 'Join ' + session.trip().name + ' on Triply', url: fresh.link }).catch(() => {}) }) : null) : null,
        pending.length ? h('div', {}, h('h3', { class: 'mini-h' }, 'Open invitations'), pending.map((v) => h('div', { class: 'invite-row' },
          h('div', { class: 'inline' }, h('b', {}, v.label || 'Invitation'), h('span', { class: 'badge' }, roleLabel(v.role)), h('span', { class: 'sub' }, 'expires ' + D.short(v.expires_at.slice(0, 10))), h('span', { class: 'spacer' }),
            ui.button('Cancel', { variant: 'danger', onClick: async () => { try { await session.req('DELETE', '/invites/' + v.id); if (fresh && fresh.id === v.id) fresh = null; await session.refresh(); } catch (e) { ui.toast(e.message); } } }))))) : null);
    }

    function mineCard() {
      const me = session.me();
      return h('section', { class: 'card stack' }, h('h2', {}, 'You'),
        h('div', { class: 'person-row' }, ui.avatar(me, 44), h('div', { class: 'person-main' }, h('b', {}, me.name), h('span', { class: 'sub' }, roleLabel(me.role))), ui.button('Change', { icon: 'edit', onClick: () => TR.forms.profileSheet(session) })),
        h('div', { class: 'stack' }, h('h3', { class: 'mini-h' }, 'Your personal link'), ui.copyBox(session.link(), 'Your personal link'),
          h('p', { class: 'hint' }, 'Open this on another phone or computer to be you in this trip. Do not share it — send an invitation instead.')),
        ui.button('Leave this trip', { icon: 'logout', variant: 'danger', onClick: async () => {
          const ok = await ui.confirm({ title: 'Leave this trip?', message: 'Your link stops working. Someone from the trip would have to invite you again.', confirmLabel: 'Leave trip', danger: true });
          if (!ok) return;
          try { await session.req('DELETE', '/members/me'); TR.saved.remove(session.id); TR.go('/'); ui.toast('You left the trip.'); } catch (e) { ui.toast(e.code === 'last_owner' ? 'You are the only owner. Make someone else an owner first.' : e.message); }
        } }));
    }

    function render() {
      const members = session.state.members;
      root.replaceChildren(
        h('div', { class: 'page-head' }, h('h1', {}, 'People'), h('span', { class: 'sub' }, TR.plural(members.length, 'traveler'))),
        h('div', { class: 'people-grid' },
          h('div', { class: 'stack' },
            h('section', { class: 'card' }, members.map(memberRow)),
            h('section', { class: 'card role-help' }, h('h3', {}, 'What each role can do'), session.state.roles.map((r) => h('p', {}, h('b', {}, r.label + ': '), cfg.roleHelp[r.id] || r.blurb)))),
          h('div', { class: 'stack' }, session.can('invites.manage') ? inviteCard() : null, mineCard())));
    }
    render();
    const off = session.on((k) => { if (k === 'state') render(); });
    return { destroy: off };
  }

  TR.screens = TR.screens || {};
  TR.screens.people = { mount };
})();

 * device.js — settings for this device: default name/picture, and the saved trip links

  const TR = window.TR;
  const h = TR.h, ui = TR.ui, icon = TR.icon;

  function mount(root) {
