# Render Blueprint: one web service + one Postgres. Triply creates its own tables in its own schema ("triply").
services:
  - type: web
    name: triply
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: triply-db, property: connectionString }
      - key: PGSSL
        value: "1"
      - key: PUBLIC_URL
        sync: false   # e.g. https://triply.onrender.com  (used in invite links; leave empty to detect)
databases:
  - name: triply-db
    plan: basic-256mb
